<!doctype html>
<!--
  ═══════════════════════════════════════════════════════════════════════════
  CARRERA DE TORTUGAS · OVERLAY PARA TIKTOK LIVE
  ═══════════════════════════════════════════════════════════════════════════

  DINÁMICA DEL JUEGO (cómo funciona hoy)
    • 3 tortugas, cada una con SU PROPIO CARRIL: Brasil, Paraguay y Argentina en orden cambiante.
      NO HAY CHOQUES: cada tortuga pasea al azar de arriba a abajo SOLO dentro de su carril.
    • La TORTUBOT marca el tope de la carrera: va de 0 a 100 a velocidad constante en CFG.botSec (120 s = 2 minutos).
      Si nadie la supera, llega ella. Las tortugas de los espectadores caminan a BASE_V (40 % de la velocidad de la bot).
    • Cada interacción acelera la tortuga de su usuario mientras dura el efecto (EV_BOOST, addBoost):
      like / entrar ×2 · comentario ×5 · compartir / seguir ×10 · regalo ×20. Gana quien llega primero a CFG.win (100).
    • Ningún avatar queda ANCLADO en la pista: el avatar del usuario solo se ve sobre su tortuga (avatarPop está desactivado).
    • Al final de cada carril hay una copa 🏆 (.prize) que la tortuga persigue; la ganadora se la lleva.
    • Guía visual SIN TEXTO abajo (#howto): acciones con rayos ⚡ (de la mano 👋 a la copa) → eventos que hacen avanzar a la tortuga hasta llevarse la copa (?howto=0 la oculta).
    • Mientras haya bots activos (🤖), cada carril se delimita con líneas sólidas (html.hasbots, #laneLines; ?lines=1 las muestra siempre).
    • Un espectador elige país escribiendo su nombre, sigla o bandera en el chat (S.pick); claimSlot le asigna carril.
    • La primera tortuga en pasar el 25 %, 50 % y 75 % recibe un efecto de lechuga (S.cp); foto finish si llegan casi empatadas.
    • Tras CFG.restartMs (7 s) empieza otra ronda con nuevos países. La música cambia de tema en cada ronda (THEMES).

  PARÁMETROS DE URL: ?target=40  ?win=100  ?panel=1 (panel de pruebas, también tecla P)  ?sound=0
                     ?music=0  ?theme=1-5  ?vol=0.9  ?join=0.5  ?ws=URL (WebSocket en lugar de SSE)  ?safe=1  ?autobots=0 (sin bots automáticos)  ?escena=1-4 (fuerza un escenario)  ?lang=en|es (idioma)  ?top=30 (dónde empieza la pista, en % desde arriba; más alto = más cielo)
  ESCENARIOS DEL FONDO: cada ronda usa uno, en orden: 1 madrugada (va amaneciendo) · 2 mañana (hacia el mediodía) ·
    3 mediodía (hacia la tarde) · 4 tarde (va oscureciendo). El cielo avanza con el progreso del líder de la carrera.
  BACKEND: SSE en /api/events. Un solo archivo, sin dependencias de build.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07262B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Country Race</title><!-- el título cambia con el idioma (applyLang) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      if ("serviceWorker" in navigator)
        window.addEventListener("load", () =>
          navigator.serviceWorker
            .register("/sw.js")
            .catch((error) =>
              console.error(
                "No se pudo registrar tortu como aplicación:",
                error,
              ),
            ),
        );
    </script>
    <style>
      :root{
        --ink: #07262b;
        --ink2: #0d3a41;
        --flag-size: 2.3rem;
        --sun: #ffc93c;
        --pink: #ff3d7f;
        --cream: #fff6e0;
        --mint: #5cf2c0;
        --sand: #f3dfa2;
        --sand2: #e8ce8c;
        --grass: #5fb35a;
        --grass2: #4a9a4c;
        --padr: 3%;
        --stats-size: min(1.8vh, 3vw);
      }
      *{
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html{
        font-size: min(3.8vw, 2.1vh);
      }
      html, body{
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        color: var(--cream);
        font-family: "Nunito", system-ui, sans-serif;
        font-weight: 800;
      }
      .disp{
        font-family: "Bowlby One", "Arial Black", sans-serif;
        font-weight: 400;
      }
      #fx{
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9;
      }

      /* Todo fluye en una sola columna: nada se encima, en cualquier pantalla */
      #app{
        position: absolute;
        top: var(--top, 30%);
        bottom: var(--bot, 14%);
        left: 3%;
        right: var(--padr);
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      /* Cabecera */

      /* Pista: 3 carriles fijos (uno por tortuga). Etiqueta izquierda = solo el puesto; el nombre va en .tag sobre la tortuga.
   Los anchos de .tur / .mk / .sl / .pl usan el mismo desplazamiento (.8rem de margen + pista de 100% - 7rem) para que
   la nariz de la tortuga coincida con las líneas de 25/50/75 % y con la meta. Si cambias el tamaño de .tur, ajusta los cuatro. */
      #lanes{
        flex: 1.5 1 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        --tw: min(13rem, 16vh);
        --n: 9;
        --lane-step: calc((100% - var(--th)) / var(--n));
        --fan-size: var(--flag-size);
        --g: 0rem;
      }
      .lane{
        flex: 1 1 0;
        min-height: 4.4rem;
        max-height: 5.8rem;
        display: flex;
        align-items: stretch;
        border-radius: 0.9rem;
        overflow: hidden;
        box-shadow: 0 0.25rem 0 rgba(0, 0, 0, 0.28);
      }
      .lane:nth-child(odd){
        background: rgba(243, 223, 162, 0.95);
      }
      .lane:nth-child(even){
        background: rgba(232, 206, 140, 0.95);
      }
      .lab{
        position: relative;
        z-index: 3;
        width: 2.8rem;
        justify-content: center;
        flex: none;
        background: var(--ink);
        display: flex;
        align-items: center;
        gap: 0.3rem;
        padding: 0 0.4rem;
      }
      .rk{
        flex: none;
        width: 1.6rem;
        height: 1.6rem;
        border-radius: 50%;
        background: var(--ink2);
        color: var(--cream);
        font-size: 0.95rem;
        display: grid;
        place-items: center;
      }
      .rk.r1{
        background: var(--sun);
        color: var(--ink);
      }
      .rk.r2{
        background: #d9e2e5;
        color: var(--ink);
      }
      .rk.r3{
        background: #e3a46b;
        color: var(--ink);
      }
      
      .nm{
        display: flex;
        flex-direction: column;
        line-height: 1.05;
        min-width: 0;
      }
      
      .nm b{
        font-family: "Bowlby One", sans-serif;
        font-weight: 400;
        color: var(--sun);
        font-size: 0.8rem;
        max-width: 5.6rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .nm small{
        font-size: 0.75rem;
        opacity: 0.85;
      }
      .lab em{
        margin-left: auto;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        line-height: 1.05;
        font-style: normal;
        color: var(--mint);
      }
      .lab em span{
        font-size: 1.05rem;
      }
      .lab em small{
        font-size: 0.75rem;
        color: var(--sun);
      }
      .lane.lead .lab{
        box-shadow: inset 0.25rem 0 0 var(--sun);
      }
      .trk{
        position: relative;
        flex: 1;
        border-top: 0.2rem solid var(--grass);
        border-bottom: 0.2rem solid var(--grass2);
        background-image:
          radial-gradient(rgba(120, 85, 30, 0.25) 0.07rem, transparent 0.1rem),
          radial-gradient(
            rgba(255, 255, 255, 0.28) 0.06rem,
            transparent 0.09rem
          );
        background-size:
          1.1rem 1rem,
          1.7rem 1.3rem;
        background-position:
          0 0,
          0.5rem 0.4rem;
      }
      .mk{
        position: absolute;
        top: 0;
        bottom: 0;
        width: 0;
        border-left: 0.12rem dashed rgba(7, 38, 43, 0.18);
      }
      .sl{
        position: absolute;
        top: 0;
        bottom: 0;
        left: 6.2rem;
        width: 0.18rem;
        background: rgba(255, 255, 255, 0.75);
      }
      .fin{
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: 0.8rem;
        background: repeating-conic-gradient(var(--ink) 0 25%, #fff 0 50%) 0
          0/0.4rem 0.4rem;
      }
      .tur{
        position: absolute;
        top: 62%;
        width: 5.4rem;
        height: 3.5rem;
        margin-top: -1.75rem;
        left: calc(0.8rem + (100% - 7rem) * var(--p, 0) / 100);
        z-index: 2;
      }
      .tur svg{
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .tur.turbo{
        filter: drop-shadow(0 0 0.5rem var(--pink))
          drop-shadow(0 0 0.9rem var(--sun));
      }
      .tur.turbo::before{
        content: "";
        position: absolute;
        right: 100%;
        top: 30%;
        width: 2.5rem;
        height: 40%;
        background: linear-gradient(90deg, transparent, var(--sun));
        border-radius: 999px;
      }
      
      .dust{
        position: absolute;
        top: calc(50% + 0.6rem);
        width: 0.6rem;
        height: 0.6rem;
        margin-left: -0.2rem;
        border-radius: 50%;
        background: rgba(255, 246, 224, 0.8);
        z-index: 1;
        pointer-events: none;
        animation: dust 0.8s ease-out forwards;
      }
      @keyframes dust{
        to {
          transform: translate(-1.8rem, -0.6rem) scale(2.4);
          opacity: 0;
        }
      }

      @keyframes pop{
        from {
          transform: scale(0.4);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }

      .empty{
        font-size: 0.62rem;
        opacity: 0.85;
      }

      #snd{
        position: fixed;
        left: 1.8rem;
        bottom: 0.3rem;
        z-index: 30;
        font-size: 0.8rem;
        background: rgba(0, 0, 0, 0.65);
        padding: 0.1rem 0.6rem;
        border-radius: 999px;
        display: none;
      }
      @media (orientation: portrait){
        html{
          font-size: clamp(12px, min(3.2vw, 1.8vh), 32px);
          --padr: 12%;
        }
        #app{
          top: 3%;
          bottom: 3%;
          left: 3%;
          right: var(--padr);
          gap: 0.2rem;
        }
        .lab{
          width: 2.6rem;
          gap: 0.2rem;
          padding: 0 0.25rem;
        }

        #snd{
          display: none;
        }
        
      }
      /* Panel de pruebas */

      #bots{
        position: fixed;
        right: 8px;
        top: 8px;
        z-index: 40;
        width: 176px;
        background: rgba(0, 0, 0, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 10px;
        padding: 8px;
        font:
          12px/1.2 system-ui,
          sans-serif;
        display: none;
        gap: 4px;
        flex-wrap: wrap;
      }
      #bots.on{
        display: flex;
      }
      #bots b{
        width: 100%;
        font-size: 11px;
        opacity: 0.8;
      }
      #bots button{
        flex: 1 1 45%;
        padding: 5px 3px;
        border: 0;
        border-radius: 6px;
        background: #1d4f57;
        color: #fff;
        font: inherit;
        font-size: 0.9em;
        line-height: 1.1;
        cursor: pointer;
      }
      #bots button.act{
        background: var(--pink);
      }
      #bots label{
        width: 100%;
        font-size: 11px;
        margin-top: 4px;
      }
      #bots input{
        width: 100%;
      }
      /* Avatar redondo, carril vacío atenuado, ganador resaltado,
   animación al cambiar de dueño (.swap) y etiqueta .tag con @usuario + puntos que viaja con la tortuga. */
      .av{
        flex: none;
        width: 1.9rem;
        height: 1.9rem;
        border-radius: 50%;
        display: grid;
        place-items: center;
        overflow: hidden;
        border: 0.12rem solid var(--sun);
        background: var(--ink2);
        color: #fff;
        font-size: 0.9rem;
      }
      .av img{
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .lane.empty .tur{
        opacity: 0.45;
        filter: grayscale(0.7);
      }
      .lane.win{
        outline: 0.2rem solid var(--sun);
        box-shadow: 0 0 1rem var(--sun);
      }
      .tur.swap svg{
        animation: pop 0.6s cubic-bezier(0.2, 1.6, 0.4, 1) both;
      }
      .tur.join-pop .av{
        transform-box: fill-box;
        transform-origin: center;
        animation: shellAvatarJoin 0.75s cubic-bezier(0.2, 1.6, 0.4, 1) both;
      }
      @keyframes shellAvatarJoin{
        0%, 100%{ transform: scale(1); }
        40%{ transform: scale(2); }
      }
      /* FIJA: esquina superior izquierda de la pista (al inicio); */
      .tag{
        position: absolute;
        left: 0.6rem;
        top: 0.15rem;
        margin: 0;
        max-width: min(calc(100% - 1.4rem), 36vw);
        display: flex;
        align-items: baseline;
        gap: clamp(3px, 0.4vw, 6px);
        padding: 0;
        height: clamp(18px, 3.8vw, 26px);
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        z-index: 5;
        pointer-events: none;
      }
      .tag b{
        flex: 0 1 auto;
        min-width: 0;
        max-width: min(30vw, 10rem);
        overflow: hidden;
        text-overflow: ellipsis;
        font-family: "Bowlby One", "Arial Black", sans-serif;
        font-weight: 400;
        font-size: clamp(10px, 1.4vw, 16px);
        letter-spacing: 0.02em;
        color: #07262b;
        -webkit-text-stroke: 0.08em #fff6e0;
        paint-order: stroke fill;
        text-shadow: none;
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }
      .tag small{
        flex: none;
        font-size: clamp(8px, 1vw, 12px);
        color: #0d3a41;
        font-weight: 800;
        -webkit-text-stroke: 0.08em #fff6e0;
        paint-order: stroke fill;
      }
      .lane.empty .tag{
        display: none;
      }
      /* Pantalla horizontal: se reduce el rem para que quepan los 3 carriles grandes sin tapar el panel inferior */
      @media (orientation: landscape){
        html{
          font-size: min(3.8vw, 1.45vh);
        }
      }
      /* Diseño: arriba la carrera + barra de mensajes */
              /* La carrera tiene PRIORIDAD de altura: cada carril mide fijo 4.4rem y la tabla de abajo cede (flex) si falta espacio.
   Así los carriles nunca se desbordan por debajo de la barra de mensajes ni la tapan. */
      #lanes{
        flex: 0 0 auto;
      }
      .lane{
        flex: 0 0 4.4rem;
        min-height: 4.4rem;
        max-height: none;
      }

       /* barra de mensajes SIEMPRE visible */

      /* ===== GAMIFICACIÓN: efectos ===== */
      .emo{
        position: absolute;
        top: 30%;
        font-size: 1.5rem;
        line-height: 1;
        z-index: 6;
        pointer-events: none;
        left: calc(0.8rem + (100% - 7rem) * var(--p, 0) / 100 + 2.2rem);
        animation: emo 1.6s ease-out forwards;
      }
      @keyframes emo{
        0% {
          transform: translate(0, 0.6rem) scale(0.4);
          opacity: 0;
        }
        15% {
          opacity: 1;
          transform: translate(0, 0) scale(1.2);
        }
        100% {
          transform: translate(var(--dx, 0), -2.6rem) scale(0.9)
            rotate(var(--rt, 0deg));
          opacity: 0;
        }
      }
      .ring{
        position: absolute;
        left: 1.6rem;
        top: 30%;
        width: 2.6rem;
        height: 2.6rem;
        margin: -1.3rem 0 0 -1.3rem;
        border-radius: 50%;
        border: 0.28rem solid var(--sun);
        box-shadow: 0 0 1rem var(--sun);
        pointer-events: none;
        animation: ring 0.9s ease-out forwards;
        z-index: 4;
      }
      .ring.mega{
        border-color: var(--pink);
        box-shadow:
          0 0 1.4rem var(--pink),
          0 0 2.4rem var(--sun);
      }
      @keyframes ring{
        to {
          transform: scale(4.2);
          opacity: 0;
        }
      }
      .lane.lead{
        box-shadow:
          0 0 0.9rem rgba(255, 201, 60, 0.9),
          0 0.25rem 0 rgba(0, 0, 0, 0.28);
      }
      .lane.lead::after{
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          100deg,
          transparent 35%,
          rgba(255, 255, 255, 0.55) 50%,
          transparent 65%
        );
        transform: translateX(-120%);
        animation: shine 3.2s ease-in-out infinite;
        pointer-events: none;
        z-index: 4;
      }
      @keyframes shine{
        60%,
        100% {
          transform: translateX(120%);
        }
      }
      .lane{
        position: relative;
      }
      .lane.flash{
        animation: flash 0.9s ease-out;
      }
      @keyframes flash{
        0% {
          outline: 0.25rem solid var(--pink);
          filter: brightness(1.5);
        }
        100% {
          outline: 0.25rem solid transparent;
          filter: none;
        }
      }

      #app.shake{
        animation: shake 0.9s ease-out;
      }
      @keyframes shake{
        20% {
          transform: translate(-0.12rem, 0.07rem);
        }
        45% {
          transform: translate(0.1rem, -0.06rem);
        }
        70% {
          transform: translate(-0.05rem, 0.03rem);
        }
      }
      #vig{
        position: fixed;
        inset: 0;
        z-index: 8;
        pointer-events: none;
        opacity: 0;
        box-shadow: inset 0 0 6rem 1.5rem var(--sun);
      }
      #vig.on{
        animation: vig 1s ease-out;
      }
      @keyframes vig{
        0% {
          opacity: 0.9;
        }
        100% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce){
        .lane.lead::after{
          animation: none;
        }
      }

      /* La carrera queda arriba; la mitad inferior aparece solo durante los festejos. */
      #app{
        top: 0;
        bottom: 50%;
        left: 3%;
        right: var(--padr);
        gap: 0.2rem;
      }
      #lanes{
        flex: 1 1 0;
        min-height: 0;
      }
      .lane{
        flex: 1 1 0;
        min-height: 0;
        height: auto;
      }
      .tur{
        top: 50%;
        width: auto;
        height: 100%;
        aspect-ratio: 66 / 46;
        margin-top: 0;
        transform: translateY(-50%);
      }


      /* ===== ANUNCIO EMERGENTE DEL GANADOR (3 s) sobre las rutas ===== */
      #fx{
        z-index: 45;
      }

      #app.finished .lane:not(.win){
        filter: saturate(0.4);
        transition:
          opacity 0.4s,
          filter 0.4s;
        opacity: 0.5;
      }
      
      /* ===== PARTICIPACIÓN CLARA Y MEDIBLE ===== */

      /* ===== pista libre: sin bandera a la izquierda, sin nombre de país (solo copas) ===== */
      .lab{
        display: none !important;
      }
      .tag b{
        display: inline-block;
      }
      .tag b:empty{
        display: none;
      }
      .lane.empty .tag{
        display: flex !important;
      }
      .tag b{
        font-size: clamp(14px, 2.2vw, 24px) !important;
        max-width: none !important;
      }
      /* ===== cabecera mínima + banderas ===== */

      .lab{
        width: 3.3rem;
      }
      .rk{
        position: relative;
        width: var(--flag-size);
        height: var(--flag-size);
        padding: 0;
        overflow: hidden;
        border: 0.16rem solid var(--cream);
        box-shadow: 0 0.12rem 0.35rem rgba(0, 0, 0, 0.55);
      }
      .rk img{
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .rk::after{
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        pointer-events: none;
        background:
          radial-gradient(
            circle at 30% 24%,
            rgba(255, 255, 255, 0.6),
            transparent 42%
          ),
          radial-gradient(
            circle at 50% 55%,
            transparent 55%,
            rgba(0, 0, 0, 0.3) 100%
          );
      }
      .rk.r1{
        border-color: var(--sun);
        box-shadow:
          0 0 0.55rem var(--sun),
          0 0.12rem 0.35rem rgba(0, 0, 0, 0.55);
      }
      .rk.r2{
        border-color: #d9e2e5;
      }
      .rk.r3{
        border-color: #e3a46b;
      }
      @media (orientation: portrait){

        .lab{
          width: 2.9rem;
        }
        :root{
          --flag-size: 2rem;
        }
      }
      /* ===== llamadas de acción grandes y vistosas ===== */

            /* ===== UNA SOLA PISTA para todas las tortugas (grandes), copas mini, mensajes en el pie ===== */
      #lanes{
        --tw: min(11rem, 28vh);
        --th: calc(var(--tw) * 46/66);
        --g: 3rem;
        position: relative;
        display: block;
        background-color: var(--sand);
        background-image:
          radial-gradient(rgba(120, 85, 30, 0.25) 0.07rem, transparent 0.1rem),
          radial-gradient(
            rgba(255, 255, 255, 0.28) 0.06rem,
            transparent 0.09rem
          );
        background-size:
          1.1rem 1rem,
          1.7rem 1.3rem;
        border-top: 0.25rem solid var(--grass);
        border-bottom: 0.25rem solid var(--grass2);
        border-radius: 0.9rem;
        box-shadow: 0 0.25rem 0 rgba(0, 0, 0, 0.28);
      }
      #lanes .lane{
        position: absolute !important;
        inset: 0;
        flex: none;
        height: auto;
        min-height: 0;
        max-height: none;
        overflow: visible;
        border-radius: 0;
        background: none !important;
        box-shadow: none !important;
        outline: none !important;
        animation: none !important;
        pointer-events: none;
      }
      #lanes .lane::after{
        display: none !important;
      }
      #lanes .trk{
        position: absolute;
        inset: 0;
        border: 0;
        background: none;
        z-index: 1;
        --rt: calc((100% - var(--th)) * var(--i)/var(--n));
        clip-path: inset(-100vh -100vw -100vh 0);
      }
      #lanes::after{
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        background-image: radial-gradient(
          circle,
          rgba(7, 38, 43, 0.58) 1px,
          transparent 1.5px
        );
        background-size: 7px var(--lane-step);
        background-position: 0 calc(var(--lane-step) - 1px);
        pointer-events: none;
      }
      #lanes .trk .tur{
        top: var(--rt);
        width: var(--tw);
        height: var(--th);
        aspect-ratio: auto;
        margin: 0;
        transform: none;
        left: calc(
          var(--tw) * 0 + (100% - var(--tw) * 1 - 0.8rem) * var(--p, 0) / 100
        );
      }
      #lanes .sl{
        left: calc(var(--g) + var(--tw));
      }
      
      #lanes .emo{
        top: calc(var(--rt) + var(--th) * 0.2);
        left: calc(
          var(--tw) * 0 + (100% - var(--tw) * 1 - 0.8rem) * var(--p, 0) / 100 + var(--tw) * 0.45
        );
      }
      #lanes .dust{
        top: calc(var(--rt) + var(--th) - 0.9rem);
      }
      #lanes .tag{
        left: 0.3rem;
        top: calc(var(--rt) + var(--th) / 2 - 11px);
        max-width: calc(var(--g) - 0.3rem);
      }
      #lanes .tag b{
        font-size: clamp(7px, 1.1vw, 12px) !important;
      }
      #lanes .lane.empty .tag{
        display: flex !important;
      }
      
      /* mensajes: pie de pantalla, texto que va pasando */

      /* ===== pantalla completa, 10 países, sin versión ===== */

      #app{
        top: var(--top, 30%); /* pista bajada para dejar más cielo (antes 17 %); ?top=17 vuelve al valor anterior */
        bottom: var(--bot, 7%);
      }

      /* ===== etiqueta de 2 líneas: iniciales + copas / hinchas ===== */
      
      #lanes .tag{
        height: auto;
        overflow: visible;
        top: calc(var(--rt) + var(--th) / 2 - 1.1em);
        max-width: calc(var(--g) - 0.2rem);
      }
      #lanes .tag b{
        display: block;
        white-space: pre;
        line-height: 1.2;
        max-width: none;
      }
      /* ===== hinchas grandes y vivos, líder con resplandor ===== */
      
      #lanes .tag b i{
        font-style: normal;
      }
      
      #lanes .tag{
        top: calc(var(--rt) + var(--th) / 2 - 1.6em);
      }
      #lanes .lane.lead .trk .tur{
        filter: drop-shadow(0 0 0.45rem #ffc93c) drop-shadow(0 0 1.1rem #ffc93c);
      }
      #lanes .lane.lead .trk .tur.turbo{
        filter: drop-shadow(0 0 0.5rem var(--pink))
          drop-shadow(0 0 1.1rem #ffc93c);
      }

      /* ===== eventos sobre la tortuga ===== */
      #lanes .evb{
        position: absolute;
        z-index: 12;
        display: grid;
        width: 1.8em;
        height: 1.8em;
        place-items: center;
        pointer-events: none;
        padding: 0;
        border-radius: 999px;
        border: 0.16rem solid #fff;
        color: #fff;
        font-size: calc(var(--th) * 0.24);
        line-height: 1;
        text-shadow: 0 0.08em 0 rgba(7, 38, 43, 0.7);
        box-shadow: 0 0.2rem 0.5rem rgba(0, 0, 0, 0.6);
        top: calc(var(--rt) - var(--th) * 0.15 - var(--o, 0) * var(--th) * 0.12);
        left: clamp(30%, calc(
          var(--tw) * 0 + (100% - var(--tw) * 1 - 0.8rem) * var(--p, 0) / 100 + var(--tw) * 0.5
        ), 70%);
        animation: evup 2.2s ease-out forwards;
      }
      @keyframes evup{
        0% {
          transform: translate(-50%, 0.8rem) scale(0.4);
          opacity: 0;
        }
        14% {
          transform: translate(-50%, 0) scale(1.15);
          opacity: 1;
        }
        28% {
          transform: translate(-50%, 0) scale(1);
        }
        80% {
          opacity: 1;
        }
        100% {
          transform: translate(-50%, -1.8rem) scale(1);
          opacity: 0;
        }
      }
      #lanes .evb.e-lk{
        background: #ff3d7f;
      }
      #lanes .evb.e-ch{
        background: #1fb58a;
      }
      #lanes .evb.e-gf{
        background: linear-gradient(90deg, #ff9f1c, #ffc93c);
        color: #07262b;
        text-shadow: none;
      }
      #lanes .evb.e-sh{
        background: #2e7bff;
      }
      #lanes .evb.e-fo{
        background: #e5254b;
      }
      #lanes .evb.e-jn{
        background: #7b4dff;
      }
      #lanes .evb.e-ch{
        background: #fff;
        color: #07262b;
        text-shadow: none;
      }
      #lanes .gift-bait{
        position: absolute;
        z-index: 4;
        top: calc(var(--rt) + var(--th) * 0.13);
        left: calc(
          var(--tw) * 0 + (100% - var(--tw) * 1 - 0.8rem) * var(--p, 0) / 100 + var(--tw) * 0.5
        );
        display: grid;
        width: calc(var(--th) * 0.42);
        height: calc(var(--th) * 0.42);
        place-items: center;
        border: 0.12rem solid #fff;
        border-radius: 0.9rem;
        background: linear-gradient(145deg, #fff4bd, #ffae21);
        box-shadow: 0 0 0.6rem rgba(255, 201, 60, 0.9), 0 0.15rem 0.3rem rgba(0, 0, 0, 0.45);
        font-size: calc(var(--th) * 0.3);
        line-height: 1;
        transform: translateX(-50%);
        animation: giftbait 0.55s ease-in-out infinite alternate;
        pointer-events: none;
      }
      #lanes .gift-bait.caught{
        animation: giftcaught 0.24s ease-out forwards;
      }
      @keyframes giftbait{
        from { margin-top: 0; filter: drop-shadow(0 0 0.15rem #fff); }
        to { margin-top: -0.5rem; filter: drop-shadow(0 0 0.4rem #ffec98); }
      }
      @keyframes giftcaught{
        to { opacity: 0; transform: translateX(-50%) scale(1.8) rotate(12deg); }
      }
      /* ===== ajustes ===== */
      .lane.empty .tur{
        opacity: 1;
        filter: none;
      }

      /* ===== fondo de estadio pixel-art (canvas #bg) y pista transparente ===== */
      #bg{
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        pointer-events: none;
        image-rendering: crisp-edges;
        image-rendering: pixelated;
      }
      html:not(.pbg) #bg{
        display: none;
      }
      html.pbg #lanes{
        background: none !important;
        border: 0 !important;
        box-shadow: none !important;
        border-radius: 0 !important;
      }
      html.pbg #lanes::after,
      html.pbg #lanes .sl,
      html.pbg #lanes .fin{
        display: none !important;
      }
    
      /* ===== tortugas al 100 % de opacidad (también tras terminar la carrera) ===== */
      #lanes .tur,
      #lanes .lane.empty .tur,
      #app.finished .lane:not(.win),
      #app.finished .lane:not(.win) .tur{
        opacity: 1 !important;
      }
      #app.finished .lane:not(.win){
        filter: none !important;
      }
      #lanes .lane.empty .tur{
        filter: none !important;
      }
    
      /* ===== sin hinchas ni copas · la tortuga sale del borde izquierdo · caras ===== */

      #lanes .lane .tag,
      #lanes .lane.empty .tag {
        display: none !important;
      }
      .tur .fgf{
        display: none;
      }
      .tur.owned .fgf{
        display: inline;
      }
      /* CAMBIO DE EXPRESIÓN GRADUAL: las caras no saltan; se funden unas en otras (FACE_FADE) */
      .tur .mo{
        display: inline;
        opacity: 0;
        transition: opacity 1.1s ease-in-out;
      }
      .tur .eyes{
        transition: opacity 1.1s ease-in-out;
      }
      /* parpadeo natural cada ~4 s */
      .tur .eyes .blk{
        transform-box: fill-box;
        transform-origin: center;
        animation: blink 4.2s infinite;
      }
      @keyframes blink{
        0%, 94%, 100%{ transform: scaleY(1); }
        97%{ transform: scaleY(0.1); }
      }
      .tur.mood-sad .mo-sad,
      .tur.mood-happy .mo-happy,
      .tur.mood-turbo .mo-turbo,
      .tur.mood-tired .mo-tired{
        opacity: 1;
      }
      .tur.mood-turbo .eyes,
      .tur.mood-tired .eyes{
        opacity: 0;
      }
      /* cara de AGOTADO: las gotas de sudor resbalan despacio */
      .tur .mo-tired .sw{
        animation: tiredDrip 1.8s ease-in infinite;
      }
      .tur .mo-tired .sw2{
        animation-delay: 0.9s;
      }
      @keyframes tiredDrip{
        0%{ transform: translateY(-1px); opacity: 0; }
        25%{ opacity: 1; }
        100%{ transform: translateY(4px); opacity: 0; }
      }
    
      /* ===== física de marcha: la tortuga gira sobre sus patas y los choques muestran 💥 ===== */
      #lanes .trk .tur{
        transform-origin: 35% 90%;
        will-change: transform;
      }
      #lanes::after{
        display: none !important;
      }

      /* cartel "recibió regalo" sobre la tortuga mientras dura la protección */
      #lanes .pbadge{
        position: absolute;
        z-index: 13;
        white-space: nowrap;
        pointer-events: none;
        padding: 0.12em 0.7em 0.16em;
        border-radius: 999px;
        border: 0.16rem solid #fff;
        background: linear-gradient(90deg, #1ea7ff, #38d6ff);
        color: #fff;
        font-size: calc(var(--th) * 0.22);
        line-height: 1.15;
        text-shadow: 0 0.08em 0 rgba(7, 38, 43, 0.7);
        box-shadow: 0 0.2rem 0.5rem rgba(0, 0, 0, 0.6);
        top: calc(var(--rt) - var(--th) * 0.42);
        left: calc((100% - var(--tw) - 0.8rem) * var(--p, 0) / 100 + var(--tw) * 0.5);
        transform: translateX(-50%);
      }
      /* PROTECCIÓN POR REGALO: aura celeste mientras dura el anti-choque */
      #lanes .trk .tur.shield svg{
        filter: drop-shadow(0 0 0.35rem #7fe3ff) drop-shadow(0 0 0.9rem #38b6ff);
      }
      /* SÚPER ENERGÍA: brillo rojo-dorado mientras la agresora corre a atacar */
      #lanes .trk .tur.charge svg{
        filter: drop-shadow(0 0 0.5rem #ff3d2e) drop-shadow(0 0 1.1rem #ffc93c);
      }

      /* ===== el primero lleva corona y cara de líder ===== */
      .tur .crw{
        display: none;
      }
      .tur.first .crw{
        display: inline;
      }
      .tur.mood-lead .mo-lead{
        opacity: 1;
      }
      .tur.mood-lead .eyes{
        opacity: 0;
      }
      /* CABEZA ROJA HIRVIENDO: se pone más roja a medida que se acerca el choque (--rg 0.3 → 1) y late como si hirviera */
      .tur .rage{
        opacity: 0;
        transition: opacity 1s ease-in-out;
        pointer-events: none;
      }
      .tur.angry .rage{
        opacity: var(--rg, 0.4);
      }
      .tur .rage .rg2{
        animation: boilPulse 0.55s ease-in-out infinite;
      }
      @keyframes boilPulse{
        0%, 100%{ opacity: 0.72; }
        50%{ opacity: 1; }
      }
      .tur .rage .stm{
        opacity: 0;
        animation: steamUp 0.9s ease-out infinite;
      }
      .tur .rage .stm2{
        animation-delay: 0.45s;
      }
      @keyframes steamUp{
        0%{ transform: translateY(2px); opacity: 0; }
        30%{ opacity: 0.9; }
        100%{ transform: translateY(-5px); opacity: 0; }
      }
      /* cara de LLORANDO: los últimos 3 puestos cuando la líder está a 15 % de la meta */
      .tur.cry .mo,
      .tur.cry .eyes{
        opacity: 0 !important;
        transition-duration: 0.8s;
      }
      .tur.cry .mo-cry{
        opacity: 1 !important;
      }
      .tur .mo-cry .tear{
        animation: tearFall 1.1s ease-in infinite;
      }
      .tur .mo-cry .tear2{
        animation-delay: 0.35s;
      }
      .tur .mo-cry .tear3{
        animation-delay: 0.7s;
      }
      .tur .mo-cry .tear4{
        animation-delay: 0.15s;
      }
      @keyframes tearFall{
        0%{ transform: translateY(-1px); opacity: 0; }
        20%{ opacity: 1; }
        100%{ transform: translateY(9px); opacity: 0; }
      }
      .tur .mo-cry .wail{
        transform-box: fill-box;
        transform-origin: center;
        animation: wail 0.45s ease-in-out infinite;
      }
      @keyframes wail{
        0%, 100%{ transform: scaleY(1); }
        50%{ transform: scaleY(1.35); }
      }
      /* cara de ENOJADO: la tortuga ya decidió chocar y va a embestir; se funde en ~0,5 s */
      .tur.angry .mo,
      .tur.angry .eyes{
        opacity: 0 !important;
        transition-duration: 0.5s;
      }
      .tur.angry .mo-angry{
        opacity: 1 !important;
      }
      /* cara de GOLPE: ojos > <, boca abierta, chichón y estrellas durante todo el retroceso (~12 s) y 1 s más tras cada choque */
      .tur.ouch .mo,
      .tur.ouch .eyes{
        opacity: 0 !important;
        transition-duration: 0.35s; /* el golpe sí entra rápido; al salir de él vuelve a fundirse despacio */
      }
      .tur.ouch .mo-ouch{
        opacity: 1 !important;
      }

      /* ===== cuenta regresiva emergente 3 · 2 · 1 · ¡YA! ===== */
      #cd{
        position: fixed;
        inset: 0;
        z-index: 65;
        display: none;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      #cd.show{
        display: flex;
      }
      #cd .cdn{
        font: min(34vw, 40vh)/1 "Bowlby One", "Arial Black", sans-serif;
        color: var(--sun, #ffc93c);
        -webkit-text-stroke: 0.05em #07262b;
        paint-order: stroke fill;
        text-shadow: 0 0.06em 0 #07262b, 0 0 0.35em rgba(255, 61, 127, 0.85), 0 0 0.7em rgba(255, 201, 60, 0.7);
        animation: cdpop 0.9s cubic-bezier(0.2, 1.5, 0.4, 1) both;
      }
      #cd .cdn.go{
        font-size: min(26vw, 30vh);
        color: var(--mint, #5cf2c0);
        text-shadow: 0 0.06em 0 #07262b, 0 0 0.35em rgba(92, 242, 192, 0.9), 0 0 0.8em rgba(255, 201, 60, 0.7);
      }
      @keyframes cdpop{
        0%{ transform: scale(2.6); opacity: 0; }
        25%{ transform: scale(1); opacity: 1; }
        75%{ transform: scale(1); opacity: 1; }
        100%{ transform: scale(0.6); opacity: 0; }
      }

      /* ===== BARRA INFERIOR: contador de eventos por tipo (comentario, like, unión, compartir, regalo) ===== */
      #stats{
        position: fixed;
        left: 0;
        right: 0;
        bottom: 1.2%;
        z-index: 44;
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        align-items: center;
        gap: clamp(2px, 0.35em, 8px);
        padding: 0 0.6em;
        font-size: var(--stats-size);
        line-height: 1;
        pointer-events: none;
      }
      @media (max-width: 520px){
        #stats .st-label{ display: none; }
      }
      #connectorStatus{
        position: fixed;
        right: 0.75rem;
        bottom: calc(1.2% + var(--stats-size) + var(--stats-size) + 0.75rem);
        z-index: 9999;
        width: max-content;
        max-width: min(70vw, 18rem);
        min-width: 0;
        min-height: 1.7rem;
        padding: 0.35rem 0.65rem;
        overflow: hidden;
        border: 0.12rem solid rgba(255,255,255,0.8);
        border-radius: 999px;
        color: #fff;
        font: 800 0.65rem/1.2 system-ui, sans-serif;
        text-overflow: ellipsis;
        white-space: nowrap;
        box-shadow: 0 0.15rem 0.5rem rgba(0,0,0,0.5);
        cursor: pointer;
        pointer-events: auto;
      }
      #connectorStatus.connected{ background: #168a50; }
      #connectorStatus.disconnected{ background: #c6283d; }
      #stats .st2{
        display: flex;
        min-width: 0;
        align-items: center;
        justify-content: center;
        gap: 0.2em;
        padding: 0.16em 0.25em;
        overflow: hidden;
        white-space: nowrap;
        border-radius: 999px;
        border: 0.14em solid #fff;
        background: rgba(7, 38, 43, 0.88);
        box-shadow: 0 0.15em 0.4em rgba(0, 0, 0, 0.55);
        color: #fff;
      }
      #stats .st2 i{
        font-style: normal;
        font-size: 1.1em;
      }
      #stats .st2 b{
        font: 1.05em/1 "Bowlby One", "Arial Black", sans-serif;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: left;
      }
      #stats .st-label{
        min-width: 0;
        overflow: hidden;
        font: 700 0.65em/1 system-ui, sans-serif;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #stats .st2.k-ch{ border-color: #1fb58a; }
      #stats .st2.k-lk{ border-color: #ff3d7f; }
      #stats .st2.k-jn{ border-color: #7b4dff; }
      #stats .st2.k-sh{ border-color: #2e7bff; }
      #stats .st2.k-gf{ border-color: #ffc93c; }
      #stats .st2.bump{
        animation: statbump 0.35s ease-out;
      }
      @keyframes statbump{
        0%{ transform: scale(1); }
        40%{ transform: scale(1.22); }
        100%{ transform: scale(1); }
      }

      /* ===== al llegar a la meta se muestra el avatar del ganador durante 5 s ===== */
      #winner{
        position: fixed;
        inset: 0;
        z-index: 60;
        display: none;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      #winner.show{
        display: flex;
      }
      #winner .wbox{
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.6rem;
        padding: 1.1rem 1.8rem 1.2rem;
        border: 0.22rem solid var(--sun, #ffc93c);
        border-radius: 1.4rem;
        background: linear-gradient(160deg, rgba(13, 58, 65, 0.96), rgba(20, 91, 80, 0.96));
        box-shadow: 0 0 2.6rem rgba(255, 201, 60, 0.55), 0 0.5rem 1.4rem rgba(0, 0, 0, 0.55);
        text-align: center;
        max-width: 88vw;
        animation: winpop 0.5s cubic-bezier(0.2, 1.4, 0.4, 1) both;
      }
      #winner.out .wbox{
        animation: winout 0.35s ease-in forwards;
      }
      #winner .wttl{
        font: 1.7rem/1.1 "Bowlby One", "Arial Black", sans-serif;
        color: var(--sun, #ffc93c);
        text-shadow: 0 0.14rem 0 var(--ink, #07262b);
      }
      #winner .wav{
        position: relative;
        width: min(34vmin, 19rem);
        height: min(34vmin, 19rem);
        border-radius: 50%;
        border: 0.4rem solid var(--sun, #ffc93c);
        background: #0d3a41;
        box-shadow: 0 0 1.6rem rgba(255, 201, 60, 0.8);
        overflow: hidden;
      }
      #winner .wav img{
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      #winner .wav b{
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        font: 6rem/1 "Bowlby One", "Arial Black", sans-serif;
        color: #fff;
      }
      #winner .wav.noimg img{
        display: none;
      }
      #winner .wav.noimg b{
        display: flex;
      }
      #winner .wnm{
        font: 1.5rem/1.15 "Bowlby One", "Arial Black", sans-serif;
        color: #fff;
        text-shadow: 0 0.12rem 0 var(--ink, #07262b);
        max-width: 80vw;
        overflow-wrap: anywhere;
      }
      #winner .wfl{
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 1.05rem;
        color: #fff;
      }
      #winner .wfl img{
        display: none; /* la bandera ya es la foto grande */
        height: 1.5rem;
        border-radius: 0.2rem;
        border: 0.08rem solid var(--ink, #07262b);
      }
      #winner .helpers{
        display: flex;
        justify-content: center;
        gap: 1rem;
        width: min(78vw, 28rem);
      }
      #winner .helper{
        display: flex;
        flex: 1;
        min-width: 0;
        flex-direction: column;
        align-items: center;
        gap: 0.25rem;
        color: #fff;
      }
      #winner .helper strong{
        color: var(--sun, #ffc93c);
        font-size: 0.72rem;
        text-transform: uppercase;
      }
      #winner .helper-avatar{
        position: relative;
        width: min(15vmin, 5rem);
        height: min(15vmin, 5rem);
        overflow: hidden;
        border: 0.15rem solid #fff;
        border-radius: 50%;
        background: #0d3a41;
      }
      #winner .helper-avatar img{
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #winner .helper-avatar b{
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        font-size: 1.8rem;
      }
      #winner .helper-avatar.noimg img{ display: none; }
      #winner .helper-avatar.noimg b{ display: flex; }
      #winner .helper-name{
        max-width: 35vw;
        overflow: hidden;
        font-size: 0.78rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      @keyframes winpop{
        from{ transform: scale(0.4); opacity: 0; }
        to{ transform: scale(1); opacity: 1; }
      }
      @keyframes winout{
        to{ transform: scale(0.85); opacity: 0; }
      }

      /* ===== MODO VERTICAL (TikTok Live 9:16) =====
         Zonas que TikTok tapa con su propia interfaz (aprox.): arriba ~12 % (perfil, espectadores), abajo ~25 % (chat, comentar, regalos),
         derecha ~12 % (botones). La pista queda en el centro y el resto se rellena con césped; ?top=NN y ?bottom=NN ajustan los márgenes. */
      @media (orientation: portrait){
        #app{
          top: var(--top, 31%); /* un poco más de cielo para el 1.er puesto grande */
          bottom: var(--bot, 27%);
        }
      }

      /* ===== 3 carriles propios, avatares anclados y pista sin cartel de podio ===== */
      #lanes{
        --lane-step: calc(100% / (var(--n) + 1));
      }
      html body #app{
        top: var(--top, 24%);
        bottom: var(--bot, 7%);
      }
      @media (orientation: portrait){
        html body #app{
          top: var(--top, 22%);
          bottom: var(--bot, 27%);
        }
      }
      #lanes .anchav{
        position: absolute;
        z-index: 13;
        pointer-events: none;
        left: calc((100% - var(--tw) - 0.8rem) * var(--ap, 0) / 100 + var(--tw) * 0.41);
        width: calc(var(--th) * 0.42 * var(--sz, 1));
        height: calc(var(--th) * 0.42 * var(--sz, 1));
        transform: translate(-50%, -50%);
        animation: anchIn 0.7s cubic-bezier(0.2, 1.5, 0.4, 1) both;
      }
      #lanes .anchav .ai{
        position: absolute;
        inset: 0;
        border-radius: 50%;
        overflow: hidden;
        background: var(--nc, #0d3a41);
        border: 0.14rem solid #fff;
        color: #fff;
        display: grid;
        place-items: center;
        font: calc(var(--th) * 0.22 * var(--sz, 1)) / 1 "Bowlby One", "Arial Black", sans-serif;
        box-shadow: 0 0 0.6rem rgba(255, 201, 60, 0.9), 0 0.2rem 0.45rem rgba(0, 0, 0, 0.55);
      }
      #lanes .anchav .ai img{
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #lanes .anchav small{
        position: absolute;
        left: 50%;
        bottom: -0.55em;
        transform: translateX(-50%);
        padding: 0.05em 0.4em;
        border-radius: 999px;
        background: #ffc93c;
        color: #07262b;
        border: 0.08rem solid #07262b;
        font: 800 calc(var(--th) * 0.14) / 1.1 system-ui, sans-serif;
        white-space: nowrap;
      }
      /* PREMIO EN LA META: una copa 🏆 al final de cada carril, a la altura de la tortuga, para que la persiga. */
      #lanes .prize{
        position: absolute;
        z-index: 3;
        pointer-events: none;
        right: calc(var(--th) * 0.04);
        top: calc(var(--rt) + var(--th) * 0.5);
        width: calc(var(--th) * 0.62);
        height: calc(var(--th) * 0.62);
        margin-top: calc(var(--th) * -0.31);
        display: grid;
        place-items: center;
        font-size: calc(var(--th) * 0.5);
        line-height: 1;
        filter: drop-shadow(0 0 0.5rem rgba(255, 201, 60, 0.95)) drop-shadow(0 0.15rem 0.2rem rgba(0, 0, 0, 0.5));
        animation: prizeBob 1.1s ease-in-out infinite;
      }
      @keyframes prizeBob{
        0%, 100%{ transform: translateY(-6%) scale(1) rotate(-6deg); }
        50%{ transform: translateY(6%) scale(1.12) rotate(6deg); }
      }
      /* la tortuga ganadora se lleva la copa: crece y rebota */
      #lanes .lane.win .prize{
        animation: prizeWin 0.9s cubic-bezier(0.2, 1.6, 0.4, 1) forwards;
      }
      @keyframes prizeWin{
        0%{ transform: scale(1) rotate(0deg); }
        60%{ transform: scale(1.9) rotate(-12deg); }
        100%{ transform: scale(1.6) rotate(0deg); }
      }
      /* ===== GUÍA VISUAL SIN TEXTO (#howto): cómo se juega, en 3 pasos animados con íconos ===== */
      #howto{
        position: fixed;
        left: 0;
        right: 0;
        top: var(--how-top, 17%);
        height: var(--how-h, 4rem);
        font-size: min(calc(var(--how-h, 4rem) / 3.1), 3.7vw);
        z-index: 45;
        display: flex;
        align-items: center;
        justify-content: space-evenly;
        gap: 0.4em;
        padding: 0 0.6em;
        box-sizing: border-box;
        background: linear-gradient(180deg, #0a2a33, #0d1838);
        border-top: 0.12em solid #ff5fae;
        border-bottom: 0.12em solid #3ff3ff;
        pointer-events: none;
        line-height: 1;
        overflow: hidden;
      }
      #howto .st{
        display: flex;
        align-items: center;
        gap: 0.3em;
        height: 2.7em;
        position: relative;
      }
      #howto .ar{
        color: var(--sun);
        font-size: 1em;
        animation: htArrow 1.2s ease-in-out infinite;
      }
      @keyframes htArrow{
        0%, 100%{ transform: translateX(-0.12em); opacity: 0.6; }
        50%{ transform: translateX(0.12em); opacity: 1; }
      }
      #howto .em{
        font-size: 1.35em;
      }
      /* paso 1: persona -> mensaje -> bandera de su país (rota por todas las banderas de la carrera) */
      #howto .fl{
        position: relative;
        width: 2.1em;
        height: 2.1em;
        border-radius: 50%;
        border: 0.12em solid #fff;
        overflow: hidden;
        background: #0d3a41;
      }
      #howto .fl img{
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        animation: htFlag 4s steps(1, end) infinite;
      }
      @keyframes htFlag{
        0%{ opacity: 1; }
        20%, 100%{ opacity: 0; }
      }
      /* paso 2: cada acción da más rayos = más velocidad */
      #howto .bz{
        display: flex;
        gap: 0.45em;
      }
      #howto .bt{
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.15em;
        animation: htPulse 3.2s ease-in-out infinite;
      }
      #howto .bt .em{
        font-size: 1.2em;
      }
      #howto .bt .bo{
        font-size: 0.62em;
        letter-spacing: -0.1em;
        filter: drop-shadow(0 0 0.2em rgba(255, 201, 60, 0.9));
        min-height: 0.7em;
      }
      @keyframes htPulse{
        0%, 22%, 100%{ transform: scale(1); filter: none; }
        8%, 14%{ transform: scale(1.28); filter: drop-shadow(0 0 0.35em #ffc93c); }
      }
      /* paso 3 (ciclo de 6 s): cada EVENTO (❤️ 💬 ➕ 🎁 con sus rayos ⚡) hace saltar a la tortuga hacia adelante;
         al llegar a la meta se lleva la copa 🏆 (rebota con destellos) y se repite */
      #howto .rc{
        position: relative;
        width: 10em;
        height: 2.7em;
      }
      #howto .rc .ln{
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0.45em;
        border-top: 0.16em dashed rgba(255, 246, 214, 0.8);
      }
      #howto .rc .tu{
        position: absolute;
        left: 0;
        bottom: 0.5em;
        font-size: 1.25em;
        transform: scaleX(-1);
        opacity: 0;
        animation: htRun 6s ease-in-out infinite;
      }
      @keyframes htRun{
        0%{ left: 0; opacity: 0; }
        3%, 6%{ left: 0; opacity: 1; }
        18%, 26%{ left: calc((100% - 3.1em) * 0.25); opacity: 1; }
        40%, 48%{ left: calc((100% - 3.1em) * 0.5); opacity: 1; }
        62%, 70%{ left: calc((100% - 3.1em) * 0.75); opacity: 1; }
        84%, 95%{ left: calc(100% - 3.1em); opacity: 1; }
        100%{ left: calc(100% - 3.1em); opacity: 0; }
      }
      /* evento: aparece sobre la tortuga justo antes de cada salto */
      #howto .rc .ev{
        position: absolute;
        bottom: 1.85em;
        font-size: 0.8em;
        white-space: nowrap;
        letter-spacing: -0.12em;
        opacity: 0;
        transform: translate(-50%, 0.4em) scale(0.5);
        filter: drop-shadow(0 0 0.25em rgba(255, 201, 60, 0.9));
        animation: htEv 6s ease-out infinite;
      }
      @keyframes htEv{
        0%{ opacity: 0; transform: translate(-50%, 0.4em) scale(0.5); }
        2%{ opacity: 1; transform: translate(-50%, 0) scale(1.35); }
        5%, 9%{ opacity: 1; transform: translate(-50%, 0) scale(1); }
        13%{ opacity: 0; transform: translate(-50%, -0.4em) scale(1); }
        100%{ opacity: 0; transform: translate(-50%, -0.4em) scale(1); }
      }
      /* la copa de la meta: se agita cuando llega la tortuga y pasa a ser suya */
      #howto .rc .tr{
        position: absolute;
        right: 0;
        bottom: 0.3em;
        font-size: 1.75em;
        filter: drop-shadow(0 0 0.3em rgba(255, 201, 60, 0.95));
        animation: htTrophy 6s ease-out infinite;
      }
      @keyframes htTrophy{
        0%, 78%{ opacity: 1; transform: scale(1) rotate(0deg); }
        82%{ opacity: 1; transform: scale(1.5) rotate(-10deg); }
        85%, 97%{ opacity: 0; transform: scale(0.6); }
        100%{ opacity: 1; transform: scale(1) rotate(0deg); }
      }
      /* la copa ya en poder de la tortuga ganadora */
      #howto .rc .tw{
        position: absolute;
        left: calc(100% - 3.1em);
        bottom: 1.25em;
        font-size: 1.05em;
        opacity: 0;
        filter: drop-shadow(0 0 0.3em rgba(255, 201, 60, 0.95));
        animation: htWin 6s ease-out infinite;
      }
      @keyframes htWin{
        0%, 83%{ opacity: 0; transform: translateY(0.6em) scale(0.4); }
        87%{ opacity: 1; transform: translateY(-0.15em) scale(1.5) rotate(-8deg); }
        91%{ opacity: 1; transform: translateY(0) scale(1.15) rotate(6deg); }
        95%{ opacity: 1; transform: translateY(0) scale(1.3) rotate(-4deg); }
        98%, 100%{ opacity: 0; transform: translateY(0) scale(1.3); }
      }
      #howto .rc .sp{
        position: absolute;
        bottom: 1.6em;
        font-size: 0.7em;
        opacity: 0;
        animation: htSpark 6s ease-out infinite;
      }
      @keyframes htSpark{
        0%, 84%{ opacity: 0; transform: scale(0); }
        88%{ opacity: 1; transform: scale(1.3); }
        93%{ opacity: 1; transform: scale(0.8); }
        97%, 100%{ opacity: 0; transform: scale(0); }
      }
      /* ===== LLAMAR LA ATENCIÓN: borde de neón que late, destello que cruza la guía, íconos que saltan y flechas brillantes ===== */
      #howto{
        background: linear-gradient(180deg, #0f3a47, #1a1250);
        border-top-width: 0.16em;
        border-bottom-width: 0.16em;
        animation: htGlow 2.4s ease-in-out infinite;
      }
      @keyframes htGlow{
        0%, 100%{
          box-shadow: 0 0 0.6em rgba(255, 95, 174, 0.55), inset 0 0 0.8em rgba(63, 243, 255, 0.18);
          border-top-color: #ff5fae;
          border-bottom-color: #3ff3ff;
        }
        50%{
          box-shadow: 0 0 1.6em rgba(63, 243, 255, 0.95), inset 0 0 1.4em rgba(255, 95, 174, 0.35);
          border-top-color: #3ff3ff;
          border-bottom-color: #ff5fae;
        }
      }
      #howto::after{
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: -35%;
        width: 25%;
        background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.32), transparent);
        transform: skewX(-18deg);
        animation: htShine 3.6s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes htShine{
        0%{ left: -35%; }
        60%, 100%{ left: 120%; }
      }
      #howto .ar{
        font-size: 1.6em;
        color: #ffd84a;
        text-shadow: 0 0 0.45em #ffc93c;
        animation: htArrow 0.8s ease-in-out infinite;
      }
      @keyframes htPulse{
        0%, 24%, 100%{ transform: scale(1) rotate(0deg); filter: none; }
        6%{ transform: scale(1.4) rotate(-8deg); filter: drop-shadow(0 0 0.45em #ffc93c) drop-shadow(0 0 0.2em #fff); }
        12%{ transform: scale(1.3) rotate(7deg); filter: drop-shadow(0 0 0.45em #ffc93c) drop-shadow(0 0 0.2em #fff); }
        18%{ transform: scale(1.15) rotate(0deg); filter: drop-shadow(0 0 0.3em #ffc93c); }
      }
      #howto .rc .tu{
        filter: drop-shadow(0 0 0.3em #7dff7d);
        animation: htRun 6s ease-in-out infinite, htHop 0.45s ease-in-out infinite;
      }
      @keyframes htHop{
        0%, 100%{ bottom: 0.5em; }
        50%{ bottom: 0.72em; }
      }
      #howto .rc .tr{
        filter: drop-shadow(0 0 0.4em #ffc93c) drop-shadow(0 0 0.8em rgba(255, 201, 60, 0.8));
      }
      /* Líneas que delimitan cada carril: SOLO visibles mientras hay bots activos (html.hasbots). */
      #laneLines{
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        display: none;
      }
      html.hasbots #laneLines,
      html.forcelines #laneLines{
        display: block;
      }
      #laneLines i{
        position: absolute;
        left: 0;
        right: 0;
        height: 0.3rem;
        margin-top: -0.15rem;
        /* líneas de carril como en una pista de atletismo de arcilla: rayas blancas/crema de bloques duros, bien visibles */
        background: repeating-linear-gradient(90deg, #fff6d6 0 1.2rem, transparent 1.2rem 2rem);
        opacity: 0.95;
        top: calc((100% - var(--th)) * (var(--k) - 0.5) / var(--n) + var(--th) / 2);
      }
      @keyframes anchIn{
        0%{ transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
        45%{ transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
        100%{ transform: translate(-50%, -50%) scale(1); opacity: 1; }
      }

      /* Mitad superior: pista y guía; mitad inferior: césped y controles. */
      :root{
        --guide-height: clamp(2.5rem, 7vh, 5rem);
      }
      html body #app{
        top: var(--top, 12%);
        bottom: calc(50% + var(--guide-height));
      }
      #howto{
        top: auto;
        bottom: 50%;
        height: var(--guide-height);
      }
    </style>
  </head>
  <body>
    <canvas id="bg"></canvas>
    <canvas id="fx"></canvas>

    <div id="app">
      <div id="lanes"></div>
    </div>
    <div id="vig"></div>
    <button id="connectorStatus" class="disconnected" type="button" aria-live="polite">
      Conectando…
    </button>
    <div id="stats" aria-hidden="true">
      <div class="st2 k-ch" data-k="ch"><i>💬</i><b>0</b></div>
      <div class="st2 k-lk" data-k="lk" title="Me gusta"><i>👍</i><span class="st-label" id="likesLabel">Me gusta</span><b>0</b></div>
      <div class="st2 k-jn" data-k="jn"><i>👋</i><b>0</b></div>
      <div class="st2 k-sh" data-k="sh"><i>🔁</i><b>0</b></div>
      <div class="st2 k-gf" data-k="gf"><i>🎁</i><b>0</b></div>
    </div>
    <div id="cd" aria-live="assertive"><div class="cdn" id="cdn"></div></div>
    <div id="winner"aria-live="polite">
      <div class="wbox">
        <div class="wttl">🏆 1.º PUESTO</div>
        <div class="wav"><img id="wImg" alt="" referrerpolicy="no-referrer" /><b id="wIni"></b></div>
        <div class="wnm" id="wNm"></div>
        <div class="wfl"><img id="wFl" alt="" /><span id="wCt"></span></div>
        <div class="helpers" aria-label="Usuarios que más aportaron">
          <div class="helper">
            <strong id="helper2Title">2.º · más apoyo</strong>
            <div class="helper-avatar noimg" id="helper2Avatar">
              <img id="helper2Img" alt="" referrerpolicy="no-referrer" />
              <b id="helper2Initial">—</b>
            </div>
            <span class="helper-name" id="helper2Name">Sin participante</span>
          </div>
          <div class="helper">
            <strong id="helper3Title">3.º · más apoyo</strong>
            <div class="helper-avatar noimg" id="helper3Avatar">
              <img id="helper3Img" alt="" referrerpolicy="no-referrer" />
              <b id="helper3Initial">—</b>
            </div>
            <span class="helper-name" id="helper3Name">Sin participante</span>
          </div>
        </div>
      </div>
    </div>
    <div id="snd">🔇 Toca la pantalla para activar el sonido</div>
    <div id="howto" aria-hidden="true"></div>
    <div id="bots">
      <b id="botsTitle">Pruebas de interacción (P)</b>
      <button data-a="rose">1 Rosa</button
      ><button data-a="donut">2 Dona</button>
      <button data-a="galaxy">3 Galaxia</button
      ><button data-a="join">J Se une</button>
      <button data-a="like">L Likes</button
      ><button data-a="flood">F Avalancha</button>
      <button data-a="follow">Seguidor</button
      ><button data-a="auto">A Auto</button>
      <button data-a="boost">B Doble</button
      ><button data-a="sound">M Sonido</button>
      <button data-a="music">N Música</button>
      <button data-a="reset">R Reiniciar</button>
      <label
        >Ritmo del auto
        <input id="rate" type="range" min="0.5" max="4" step="0.5" value="1"
      /></label>
    </div>

    <script>
      /*
       * CONTRATO DE EVENTOS
       * TikTok LIVE -> tiktok-live-connector -> server.js -> SSE /api/events -> overlay.
       * El backend normaliza username, avatar, contadores y etiquetas.
       *
       * chat: el texto selecciona un país y suma puntos, con límite por usuario.
       * gift: suma diamondCount x activityCount; groupId evita contar dos veces un combo.
       * like, follow y share: apoyan el país que el usuario ya seleccionó.
       * join: participante automático; ?join=0 lo desactiva.
       *
       * Contrato: type, username, content, avatar, activityCount, diamondCount.
       * Tipos admitidos: chat, gift, like, follow, share y join. No enviar roomUser:
       * los cambios de audiencia no son eventos de juego.
       *
       * El overlay consume SSE por defecto. Un WebSocket externo es opcional con ?ws=URL.
       * ?target=40 define la meta individual.
       * Las tortugas avanzan lentamente si ningún espectador elige un país.
       * No se generan eventos de audiencia ni interacciones automáticas.
       * El panel de pruebas manual se abre con P o ?panel=1.
       */

      const Q = new URLSearchParams(location.search);
      /* ===== IDIOMA: inglés por defecto. Ya no hay botón de idioma: se elige con ?lang=es o ?lang=en.
         ?lang=es lo abre en español. tr(es, en) devuelve el texto del idioma activo. ===== */
      let LANG = "en";
      try {
        const sv = Q.get("lang"); /* siempre inicia en inglés; solo ?lang=es lo abre en español (no se recuerda el idioma anterior) */
        if (sv === "en" || sv === "es") LANG = sv;
      } catch {}
      const tr = (es, en) => (LANG === "en" ? en : es);
      const shownName = (u) => (String(u || "").trim().toLowerCase() === "alguien" ? tr("Alguien", "Someone") : u);
      /* Parámetros del juego y configuración de la pista. */
      /* DURACIÓN DEL JUEGO: TIME_X = 2 → la carrera dura el DOBLE. Todas las velocidades se dividen por TIME_X y cada evento
         avanza TIME_X veces menos pista (hacen falta el doble de eventos). ?time=1 vuelve a la duración anterior; ?time=3 la triplica. */
      const TIME_X = Math.max(0.5, +Q.get("time") || 2);
      const CFG = {
        ws: Q.get("ws") || "ws://localhost:8080",
        win: +Q.get("win") || 100,
        target: +Q.get("target") || 40,
        crawl: 0.15 / TIME_X,
        restartMs: 7000,
        botSec: Math.max(20, +Q.get("bot") || 120) /* la TORTUBOT va de 0 a win en estos segundos (2 min): es el tope de la carrera */,
        join: Q.has("join") ? +Q.get("join") : 0.5,
        countries: [0, 1, 2].map((i) => ({
          c: "s" + i,
          n: "",
          f: "",
          b: [],
        })),
      };
      /* VELOCIDADES (unidades de pista por segundo). La TORTUBOT avanza a BOT_V constante: 0 → 100 en CFG.botSec.
         Las demás caminan a BASE_V (40 % de la bot; ?base=0.4) y cada interacción las multiplica ×2 / ×5 / ×10 / ×20 un rato
         (EV_BOOST = [multiplicador, segundos]). Gana quien llega primero a CFG.win. */
      const BOT_V = CFG.win / CFG.botSec,
        BASE_V = BOT_V * (Q.has("base") ? +Q.get("base") : 0.4);
      const EV_BOOST = {
        join: [2, 3],
        like: [2, 3],
        support: [2, 2],
        chat: [5, 4],
        share: [10, 5],
        follow: [10, 5],
        gift: [20, 6],
      };
      const $ = (id) => document.getElementById(id);
      const rnd = (a) => a[(Math.random() * a.length) | 0];
      /* Helpers compartidos: tamaño del rem en px y reinicio de una animación CSS */
      const remPx = () => parseFloat(getComputedStyle(document.documentElement).fontSize);
      const restartAnim = (el, cls) => {
        el.classList.remove(cls);
        void el.offsetWidth;
        el.classList.add(cls);
      };
      const C = CFG.countries,
        byCode = Object.fromEntries(C.map((c) => [c.c, c]));
      const HUMAN_N = C.length;
      const contestants = new Map();
      let contestantSequence = 0;
      /* ===== PAÍSES en lugar de usuarios =====
   Brasil, Paraguay y Argentina compiten en orden aleatorio en cada ronda. */
      const NATIONS = (() => {
        const sv = (b) =>
          "data:image/svg+xml;utf8," +
          encodeURIComponent(

        const result = [...items];

      function ac() {
        if (AC) return AC;
        try {
          AC = new (window.AudioContext || window.webkitAudioContext)();
          MG = AC.createGain();
          MG.gain.value = Math.min(1, +Q.get("vol") || 0.9);
          const LIM = AC.createDynamicsCompressor(); /* evita saturación al subir el volumen */
          LIM.connect(AC.destination);

          const n = 24,
            re = new Float32Array(n + 1),

              n + 1,
            ); /* onda de pulso al 25 %, el sonido típico de NES */
          for (let k = 1; k <= n; k++) {
            re[k] = Math.sin(2 * Math.PI * k * 0.25) / (k * Math.PI);
            im[k] = (1 - Math.cos(2 * Math.PI * k * 0.25)) / (k * Math.PI);

          W25 = AC.createPeriodicWave(re, im);
          NB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
          const d = NB.getChannelData(0);

      function tone(f, d = 0.1, type = "square", v = 0.08, t0, bus, slide) {

        o.start(t);
        o.stop(t + d + 0.02);

<g class="bd"><ellipse cx="27" cy="37.4" rx="22" ry="2.7" fill="#D9C48A" ${K}/><g clip-path="url(#cp${i})"><path d="M3.5 36 C3.5 17 13 5 27 5 C41 5 50.5 17 50.5 36 Z" fill="url(#sh${i})"/><path d="M13 9.5 C9 16 7 23 6.5 30.5 M20.5 6 C16.5 15 13.5 24 12 31.5 M27 5 C27 14 27 23 27 31 M33.5 6 C37.5 15 40.5 24 42 31.5 M41 9.5 C45 16 47 23 47.5 30.5" fill="none" stroke="#1F1608" stroke-opacity=".55" stroke-width="1.2"/><path d="M15 28 Q17 21 21.4 15.6 M31 27 Q31 19 31.5 12 M39 28 Q38 22 34.8 15.6 M10.5 28 Q11.5 22 14.5 17 M43.5 28 Q42.5 22 39.5 17" fill="none" stroke="#F0D08A" stroke-opacity=".28" stroke-width=".7"/><path d="M3.5 30.5 Q27 25.5 50.5 30.5 M9 29.6 L8.2 36 M15.5 28.4 L15 36 M21.5 27.6 L21.3 36 M27 27.3 V36 M32.5 27.6 L32.7 36 M38.5 28.4 L39 36 M45 29.6 L45.8 36" fill="none" stroke="#1F1608" stroke-opacity=".6" stroke-width="1"/><ellipse cx="19" cy="11.5" rx="8" ry="2.8" fill="#fff" opacity=".16" transform="rotate(-24 19 11.5)"/></g><path d="M3.5 36 C3.5 17 13 5 27 5 C41 5 50.5 17 50.5 36 Z" fill="none" stroke="#07262B" stroke-width="2.2"/>
<g class="av"><circle class="avbg" cx="27" cy="20.5" r="11" fill="#0D3A41"/><text class="avtx" x="27" y="26" text-anchor="middle" font-size="15" font-family="Bowlby One,Arial Black,sans-serif" fill="#fff"></text><image class="avim" x="16.5" y="10" width="21" height="21" preserveAspectRatio="xMidYMid slice" clip-path="url(#ca${i})"/><circle cx="27" cy="20.5" r="11" fill="none" stroke="#FFC93C" stroke-width="1.8"/></g><g class="crew"></g><g class="fgf"><rect x="18" y="-8" width="18" height="12" rx="1.5" fill="#fff" stroke="#07262B" stroke-width="1.2"/><image class="fgi" x="18.8" y="-7.2" width="16.4" height="10.4" preserveAspectRatio="xMidYMid slice"/></g></g></svg>`;
      }
      const lanes = $("lanes");
      lanes.style.setProperty("--n", C.length - 1);
      C.forEach((c, li) => {
        const l = document.createElement("div");
        l.className = "lane empty";
        l.id = "ln-" + c.c;
        l.innerHTML = `<div class="lab"><div class="rk disp" id="rk-${c.c}"><img alt="${NATIONS[li].n}" src="${NATIONS[li].u}"></div></div>
  <div class="trk" id="tk-${c.c}" style="--i:${li}">${[25, 50, 75].map((m) => `<i class="mk" style="left:calc(var(--tw) * 1 + (100% - var(--tw) * 1 - .8rem)*${m / 100})"></i>`).join("")}<i class="sl"></i><div class="fin"></div><div class="prize">🏆</div><div class="tag"><b id="nm-${c.c}"></b><small id="tt-${c.c}"></small></div><div class="tur mood-sad" id="tu-${c.c}" style="--p:0">${turtle(c)}</div></div>`;
        lanes.append(l);
      });

      /* Líneas divisorias entre carriles (n-1 líneas para n carriles); solo se muestran con bots activos. */
      {
        const ll = document.createElement("div");
        ll.id = "laneLines";
        for (let k = 1; k < C.length; k++) {
          const i = document.createElement("i");
          i.style.setProperty("--k", k);
          ll.append(i);
        }
        lanes.append(ll);
        if (Q.get("lines") === "1") document.documentElement.classList.add("forcelines"); /* ?lines=1: siempre visibles, sin bots */
      }

      /* ===== GUÍA VISUAL SIN TEXTO: 1) acciones con rayos (más rayos = más velocidad)
         → 2) cada evento hace saltar a la tortuga y llega a la copa 🏆. Solo íconos y animación; ?howto=0 la oculta. ===== */
      {
        const ht = $("howto");
        if (Q.get("howto") === "0") ht.remove();
        else {
          const bolts = (n) => "⚡".repeat(n);
          ht.innerHTML =
            `<div class="st bz">${[["👋", 1], ["❤️", 1], ["💬", 2], ["➕", 3], ["↪️", 3], ["🎁", 4]].map(([e, n], i, arr) => `<span class="bt" style="animation-delay:${(i * 3.2) / arr.length}s"><span class="em">${e}</span><span class="bo">${bolts(n)}</span></span>`).join("")}</div>` +
            `<span class="ar">▶</span>` +
            `<div class="st rc"><i class="ln"></i><span class="tu">🐢</span>${[[0, "❤️", 1, 0.02], [0.25, "💬", 2, 0.22], [0.5, "➕", 3, 0.44], [0.75, "🎁", 4, 0.66]].map(([u, e, n, t]) => `<span class="ev" style="left:calc((100% - 3.1em) * ${u} + 0.9em);animation-delay:${(t * 6).toFixed(2)}s">${e}${bolts(n)}</span>`).join("")}<span class="tr">🏆</span><span class="tw">🏆</span><span class="sp" style="left:calc(100% - 3.5em)">✨</span><span class="sp" style="left:calc(100% - 1.2em)">✨</span></div>`;
        }
      }

      /* Tamaño de las tortugas: cada una tiene su carril (alto de pista / nº de carriles) y ocupa un poco más que el carril
         (1.1×), sin chocar con nadie. Más grandes que antes; nunca más del 34 % del ancho. */
      function fitTurtles() {
        const H = lanes.clientHeight,
          W = lanes.clientWidth;
        if (!H || !W) return;
        const bh = H / C.length,
          th = bh * 1.1,
          tw = Math.min((th * 66) / 46, W * 0.34, 24 * remPx());
        lanes.style.setProperty("--tw", tw.toFixed(1) + "px");
      }
      addEventListener("resize", fitTurtles);
      if (window.ResizeObserver) new ResizeObserver(fitTurtles).observe(lanes);
      fitTurtles();
      setTimeout(fitTurtles, 300);
      setTimeout(fitTurtles, 1500);

      /* ===== Confeti ===== */
      const cv = $("fx"),
        cx = cv.getContext("2d");
      let ps = [],
        run = false;
      function size() {
        cv.width = innerWidth;
        cv.height = innerHeight;
      }
      addEventListener("resize", size);
      size();
      /* Generador común de confeti. o = {x, y (funciones), vx, vy, vy0, r, r0}: dispersión y tamaño de las partículas */
      function spawnConfetti(n, gold, o) {
        const cols = gold
          ? ["#FFC93C", "#FFE27A", "#FFF6E0"]
          : ["#FF3D7F", "#5CF2C0", "#FFC93C", "#FFF6E0"];
        for (let i = 0; i < n; i++)
          ps.push({
            x: o.x(),
            y: o.y(),
            vx: (Math.random() - 0.5) * o.vx,
            vy: -Math.random() * o.vy - o.vy0,
            r: Math.random() * o.r + o.r0,
            c: cols[i % cols.length],
            a: Math.random() * 6,
            va: (Math.random() - 0.5) * 0.4,
            l: 1,
          });
        if (!run) {
          run = true;
          requestAnimationFrame(tick);
        }
      }
      /* Confeti de pantalla completa (festejo) */
      function burst(n, gold) {
        spawnConfetti(Math.min(n, 300), gold, {
          x: () => innerWidth * (0.2 + Math.random() * 0.6),
          y: () => innerHeight * 0.72,
          vx: 16, vy: 16, vy0: 4, r: 7, r0: 5,
        });
      }
      function tick() {
        cx.clearRect(0, 0, cv.width, cv.height);
        ps = ps.filter((p) => p.l > 0 && p.y < innerHeight + 30);
        for (const p of ps) {
          p.vy += 0.4;
          p.x += p.vx;
          p.y += p.vy;
          p.a += p.va;
          p.l -= 0.004;
          cx.save();
          cx.globalAlpha = Math.min(1, p.l * 2);
          cx.translate(p.x, p.y);
          cx.rotate(p.a);
          cx.fillStyle = p.c;
          cx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
          cx.restore();
        }
        if (ps.length) requestAnimationFrame(tick);
        else {
          run = false;
          cx.clearRect(0, 0, cv.width, cv.height);
        }
      }

      /* ===== Pantalla ===== */
      /* Jugador dueño de una tortuga (slot 's0'..'s2'), o null si el carril está libre */
      function slotPlayer(code) {
        const k = S.slotUser[code];
        return k ? contestants.get(k) : null;
      }
      /* Redibuja puesto, nombre, puntos, corona y estados (libre / ganador) de los 3 carriles. Se llama ~4 veces/seg. */
      /* El espectador elige un país (nombre, sigla o bandera en el chat); sin carril propio, su energía va a esa tortuga. */
      function registerPick(user, code) {
        S.pick.set(user, code);
      }
      function render() {
        const ord = [...C].sort((a, b) => S.pos[b.c] - S.pos[a.c]);
        ord.forEach((c, i) => {
          const r = $("rk-" + c.c);
          r.className = "rk disp r" + (i + 1);
        });
        C.forEach((c) => {
          const p = slotPlayer(c.c);
          $("nm-" + c.c).textContent = "";
          const tg = T[c.c].tag || (T[c.c].tag = $("nm-" + c.c).parentNode);
          $("tt-" + c.c).textContent = "";
          T[c.c].tw = p
            ? tg.offsetWidth
            : 0; /* ancho de la etiqueta, para centrarla sin salirse de la pista */
          const l = $("ln-" + c.c);
          l.classList.toggle(
            "lead",
            !!p && S.pos[ord[0].c] > 1 && c.c === ord[0].c,
          );
          l.classList.toggle("empty", !p);
          l.classList.toggle("win", c.c === S.winner);
        });
        if (S.go && !S.over) {
          highlightOvertakes(ord);
          checkNearEnd();
        }
      }
      /* Adelantamientos: el carril que sube de puesto parpadea; si pasa al 1.º lugar suena el aviso y estalla confeti. */
      let lastRank = {};
      function highlightOvertakes(ord) {
        ord.forEach((c, i) => {
          const prev = lastRank[c.c];
          lastRank[c.c] = i;
          if (
            prev !== undefined &&
            i < prev &&
            slotPlayer(c.c) &&
            S.pos[c.c] > 3 &&
            Math.abs(S.pos[c.c] - S.pos[ord[i + 1] ? ord[i + 1].c : c.c]) > 0.3
          ) {
            const l = $("ln-" + c.c);
            restartAnim(l, "flash");
            emojiFx(c.c, "follow", 3);
            if (i === 0) {
              burstAt(...turPos(c.c), 45, true);
              SFX.cp();
            }
          }
        });
      }
      /* Tensión final: la primera vez por ronda que el líder pasa el 88 % suena un aviso y destella la pantalla. */
      function checkNearEnd() {
        if (S.nearEnd) return;
        let m = -1,
          lc = null;
        for (const c of C)
          if (S.slotUser[c.c] && S.pos[c.c] > m) {
            m = S.pos[c.c];
            lc = c.c;
          }
        if (lc && m >= 88) {
          S.nearEnd = true;
          SFX.cp();
          screenFx(false);
        }
      }
      /* Pone (o quita) el avatar del dueño en el caparazón y en la etiqueta del carril. Sin foto: inicial con color propio. */
      function setSlotAvatar(code, p) {
        const t = T[code],
          a = t.av,
          key = p ? p.key + "|" + (p.avatar || "") + "|" + code + "|" + !!p.isBot : "-" + code;
        if (t.avKey === key) return;
        t.avKey = key;
        const nn = NATIONS[C.findIndex((x) => x.c === code)],
          initial = p ? (p.isBot || p.tortubot ? "🤖" : (p.username || "?").trim().charAt(0).toUpperCase() || "?") : "";
        t.tur.classList.toggle("owned", !!p);
        a.bg.setAttribute("fill", nn.c);
        a.im.removeAttribute("href");
        a.tx.textContent = "";
        if (p && p.avatar) {
          a.im.onerror = () => {
            a.im.removeAttribute("href");
            a.tx.textContent = initial;
          };
          a.im.setAttribute("referrerpolicy", "no-referrer");
          a.im.setAttribute("href", p.avatar);
        } else if (p) a.tx.textContent = initial;
        else a.im.setAttribute("href", nn.u);
        t.fg.setAttribute("href", nn.u);
      }
      /* ===== Avatares sobre el caparazón =====
         El avatar principal (círculo grande del caparazón) es el del usuario que generó el ÚLTIMO evento de esa tortuga.
         Cuando otro usuario genera un evento, el principal anterior pasa a un círculo pequeño alrededor del caparazón
         (máx. CREW_MAX, los más recientes primero). La bandera queda fija arriba. */
      const CREW_MAX = 5,
        CREW_ANG = [162, 142, 122, 58, 38] /* grados sobre el borde del caparazón; el hueco de arriba es de la bandera */,
        SVGNS = "http://www.w3.org/2000/svg";
      function renderCrew(code) {
        const t = T[code],
          g = t.ring,
          nn = NATIONS[C.findIndex((x) => x.c === code)];
        if (!g) return;
        g.textContent = "";
        const mk = (tag, at) => {
          const el = document.createElementNS(SVGNS, tag);
          for (const k in at) el.setAttribute(k, at[k]);
          return el;
        };
        t.crew.slice(0, CREW_MAX).forEach((p, k) => {
          const a = (CREW_ANG[k] * Math.PI) / 180,
            x = 27 + 25.5 * Math.cos(a),
            y = 34 - 29 * Math.sin(a),
            r = 5.2,
            item = mk("g", { transform: `translate(${x.toFixed(2)} ${y.toFixed(2)})` });
          item.append(mk("circle", { r, fill: nn ? nn.c : "#0D3A41" }));
          const tx = mk("text", { y: p.isBot ? 2.4 : 3, "text-anchor": "middle", "font-size": p.isBot ? 6.5 : 8.5, fill: "#fff", "font-family": "Bowlby One,Arial Black,sans-serif" });
          tx.textContent = p.isBot ? "🤖" : (p.username || "?").trim().charAt(0).toUpperCase() || "?";
          item.append(tx);
          if (p.avatar) {
            const im = mk("image", { x: -r, y: -r, width: r * 2, height: r * 2, preserveAspectRatio: "xMidYMid slice", "clip-path": `url(#cb${code})`, referrerpolicy: "no-referrer" });
            im.onerror = () => im.remove();
            im.setAttribute("href", p.avatar);
            item.append(im);
          }
          item.append(mk("circle", { r, fill: "none", stroke: "#fff", "stroke-width": 1.1 }));
          g.append(item);
        });
      }
      /* Pone al usuario del último evento como avatar principal y manda al anterior a los círculos del caparazón. */
      function setMain(code, p) {
        const t = T[code];
        if (!t || !p) return;
        if (t.mainP && t.mainKey !== p.key) {
          t.crew = t.crew.filter((x) => x.key !== t.mainP.key);
          t.crew.unshift(t.mainP);
        }
        t.crew = t.crew.filter((x) => x.key !== p.key).slice(0, CREW_MAX);
        t.mainKey = p.key;
        t.mainP = p;
        setSlotAvatar(code, p);
        renderCrew(code);
      }
      function clearCrew(code) {
        const t = T[code];
        t.crew = [];
        t.mainKey = null;
        t.mainP = null;
        renderCrew(code);
      }
      /* Sin carriles libres, el participante nuevo reemplaza al dueño con mayor puntaje. */
      function claimSlot(p) {
        let code,
          lo = null;
        const preferred = S.pick.get(p.key),
          free =
            C.find((c) => c.c === preferred && !S.slotUser[c.c]) ||

      /* Burbuja de evento SOBRE la tortuga (sigue a la tortuga mientras sube y se desvanece). Los likes se agrupan cada 0.45 s. */

      /* Al llegar un regalo aparece un 🎁 delante de la tortuga y ella corre a recogerlo. */
      function putGiftAhead(code, entry) {

          Math.min(9, Math.max(3, t.pend * 0.6)),

      const LEVELS = [10, 25, 50, 100, 200, 400];
      /* AVATAR ANCLADO: cada interacción crea un círculo con el avatar del usuario en el CENTRO del caparazón, pero NO viaja con

      const ANCHOR_MAX = 120; /* tope de seguridad por carril: los avatares NO se borran hasta que termina la ronda */

      /* Cada interacción acelera la tortuga de su usuario: ×2, ×5, ×10 o ×20 durante unos segundos (gana el mayor multiplicador activo). */
      function addBoost(code, ty, entry, p) {

          m = b[0];

        if (ty === "gift")

      function raceAdd(p, entry, points) {

      /* PUNTUACIÓN: único punto de entrada de TODOS los eventos (reales, de espera y de prueba).
