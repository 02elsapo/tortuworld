<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Backend básico</title>
  <style>
    :root { color-scheme: light; font: 16px system-ui, sans-serif; }
    body { max-width: 760px; margin: 40px auto; padding: 0 16px; color: #202124; }
    form { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0; }
    input, button { padding: 10px 12px; font: inherit; }
    input { flex: 1; min-width: 220px; }
    #message { min-height: 1.5em; }
    #stats-panel { margin-top: 24px; }
    #stats-table { width: 100%; border-collapse: collapse; text-align: left; }
    #stats-table th, #stats-table td { padding: 8px; border-bottom: 1px solid #dadce0; }
    #stats-table td:last-child, #stats-table th:last-child { text-align: right; }
    #stats-message { min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>Backend básico</h1>
    <p>Conector TikTok: <strong id="status">Cargando…</strong></p>
    <form id="account-form">
      <label for="username">Usuario de TikTok</label>
      <input id="username" name="username" autocomplete="off" placeholder="@usuario" required>
      <button type="submit">Conectar</button>
    </form>
    <p id="message" role="status"></p>
    <button id="stats-toggle" type="button" aria-expanded="false" aria-controls="stats-panel">
      Estadísticas de comentarios y copas
    </button>
    <section id="stats-panel" hidden aria-labelledby="stats-heading">
      <h2 id="stats-heading">Comentarios por país</h2>
      <p id="stats-summary"></p>
      <p id="stats-message" role="status"></p>
      <h3>Comentarios</h3>
      <table id="stats-table">
        <thead><tr><th>País</th><th>Código</th><th>Comentarios</th></tr></thead>
        <tbody id="comment-rows"></tbody>
      </table>
      <h3>Copas ganadas</h3>
      <table id="cup-table">
        <thead><tr><th>País</th><th>Código</th><th>Copas</th></tr></thead>
        <tbody id="cup-rows"></tbody>
      </table>
    </section>
    <p><a href="/">Abrir overlay</a></p>
  </main>
  <script>
    const form = document.querySelector('#account-form');
    const usernameInput = document.querySelector('#username');
    const status = document.querySelector('#status');
    const message = document.querySelector('#message');
    const statsToggle = document.querySelector('#stats-toggle');
    const statsPanel = document.querySelector('#stats-panel');
    const statsSummary = document.querySelector('#stats-summary');
    const statsMessage = document.querySelector('#stats-message');
    const commentRows = document.querySelector('#comment-rows');
    const cupRows = document.querySelector('#cup-rows');
    function showStatus(state) {
      status.textContent = `${state.status || 'desconectado'}${state.username ? ` (@${state.username})` : ''}`;
    }

    async function loadConfiguration() {
      const [configurationResponse, statusResponse] = await Promise.all([
        fetch('/api/config'),
        fetch('/api/status'),
      ]);
      if (!configurationResponse.ok || !statusResponse.ok) {
        throw new Error('No se pudo cargar el estado del conector.');
      }
      const configuration = await configurationResponse.json();
      usernameInput.value = configuration.username || '';
      showStatus(await statusResponse.json());
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = '';
      try {
        const response = await fetch('/api/config', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: usernameInput.value }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || 'No se pudo guardar la cuenta.');
        message.textContent = `Conectando con @${result.username}…`;
      } catch (error) {
        message.textContent = error.message;
      }
    });

    function renderRows(target, countries, valueName) {
      target.replaceChildren();
      for (const country of countries) {
        const row = document.createElement('tr');
        for (const value of [country.name, country.code, country[valueName]]) {
          const cell = document.createElement('td');
          cell.textContent = String(value);
          row.append(cell);
        }
        target.append(row);
      }
    }

    function renderCommentStats(stats) {
      statsSummary.textContent =
        `Total: ${stats.total} · Sin país: ${stats.unassigned}` +
        (stats.updatedAt ? ` · Actualizado: ${new Date(stats.updatedAt).toLocaleString()}` : '');
      renderRows(commentRows, stats.teams, 'comments');
      statsMessage.textContent = '';
    }

    async function loadCommentStats() {
      const [commentsResponse, cupsResponse] = await Promise.all([
        fetch('/api/comment-stats'),
        fetch('/api/cup-stats'),
      ]);
      if (!commentsResponse.ok || !cupsResponse.ok) {
        throw new Error('No se pudieron cargar las estadísticas.');
      }
      const [comments, cups] = await Promise.all([
        commentsResponse.json(),
        cupsResponse.json(),
      ]);
      renderCommentStats(comments);
      renderRows(cupRows, cups.countries, 'cups');
    }

    statsToggle.addEventListener('click', () => {
      const isOpening = statsPanel.hidden;
      statsPanel.hidden = !isOpening;
      statsToggle.setAttribute('aria-expanded', String(isOpening));
      if (isOpening) {
        statsMessage.textContent = '';
        loadCommentStats().catch((error) => { statsMessage.textContent = error.message; });
      }
    });

    const source = new EventSource('/api/events');
    source.addEventListener('status', (event) => showStatus(JSON.parse(event.data)));
    source.addEventListener('comment-stats', (event) => renderCommentStats(JSON.parse(event.data)));
    source.addEventListener('cup-stats', (event) => {
      const stats = JSON.parse(event.data);
      renderRows(cupRows, stats.countries, 'cups');
    });
    loadConfiguration().catch((error) => { message.textContent = error.message; });
  </script>
</body>
</html>
