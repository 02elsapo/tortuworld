<!doctype html>
<!--
CLUSS (antes Tortu Live): duelo unico OLIMPIA vs CERRO.
 - Para participar hay que nombrar el club en el chat (olimpia/oli/decano · cerro/cp/ciclon/azulgrana). Sin club no se mueve la carrera.
 - Rotacion de clubes: el ganador sigue y enfrenta al siguiente rival disponible, en orden; no repite al rival inmediatamente anterior. Cada duelo es primero a 3 copas.
 - Botones de comentar, seguir y compartir eliminados (quedan APOYAR y ROSITA). El bot se detiene en el 80% (BOT_CAP).
 - APOYO DEL BOT: si hay mas de 3 usuarios reales de un solo lado, el bot empuja al otro lado, incluso por delante, hasta el 80% (APOYO_TOPE) y se queda ahi; nunca pasa de 80, asi que nunca gana. Ver botApoyo / APOYO_*.
 - Duelo equilibrado y 4 veces mas dificil (doble de puntos que antes), pista 20% mas larga a lo visual (overlay 416x746): todos los clubes comparten el mismo ESFUERZO. Se puede dar ventaja subiendo el valor del club contrario (HANDICAP, junto a DUELO).
 - Podio de copas: 1er club grande y 2do chico, con conteo de copas (P.cp). Las demas reglas de abajo siguen vigentes.
REGLAS DEL PROYECTO. LEER ANTES DE TOCAR EL CODIGO (backend y frontend)
Las reglas marcadas (propuesto) aun no estan confirmadas por el autor.


2. FORMATO DEL TORNEO (especificacion, aun no implementado)
 - Duelos de 2 paises en 2 carriles, con eliminacion directa: el que pierde queda eliminado.
 - Torneo de 3 rondas. Al terminar, reinicio automatico con todos los paises de nuevo en juego. El ultimo en pie se lleva la copa.
 - Nadie queda rey para siempre (propuesto): un pais gana como maximo 2 duelos seguidos y descansa una ronda.
 - Pendiente de definir: Paraguay juega siempre la ronda 1 o entra al sorteo como los demas.

3. VOTACION Y SIGUIENTE RIVAL
 - La gente escribe su pais en el chat. Deteccion flexible: "brasil", "br", "bandera de Brasil", "argentina", "arg", etc. Todo lo demas se ignora.
 - Cada usuario suma como maximo 1 mencion por ronda.
 - Ventana de votacion de 20 a 30 segundos (propuesto).
 - El top 10 de mas comentados se reinicia al terminar cada duelo. El pais que esta peleando no entra al ranking durante su duelo.
 - Siguiente rival (propuesto): sorteo ponderado entre los 3 a 5 primeros del top 10, no siempre el numero 1. El sorteo se muestra en pantalla. Si nadie comenta, se sortea entre los paises disponibles.

4. TABLAS (especificacion, aun no implementado)
 - Top 3 ganadores: banderas grandes, corona al primero y conteo de copas. Desempate: mas duelos ganados. Pendiente: guardar acumulado entre lives (JSON) o arrancar de cero.
 - Top 10 mas comentados: banderas chicas con contador de menciones.

5. INTERFAZ
 - Sin titulo del live (eliminado).
 - Sin indicador de nivel (Nv) en el pie: no corresponde a un overlay.
 - Franja de estadisticas bajo el tablero (unidos, comentarios, regalos, me gusta, seguidores, compartidos) con eventos REALES del live. Los bots (bot:true) y los toques manuales no cuentan. El contador de regalos es solo informativo, nunca para pedir regalos.
 - Tabla de copas en la columna derecha, ordenada por copas, con banderas del 1er al 7mo puesto y corona al primero. El acumulado vive en P.cp (por id de club, se guarda en localStorage).
 - Duelo con solo 2 carriles, mas grandes, y tortugas mas grandes. Los 2 paises activos se definen en DUELO (ids de POOL).
 - Cada pais se muestra con su bandera grande y su nombre debajo, con el mismo ancho que la bandera. Sin luz ni barra de color bajo el encabezado: es un overlay de TikTok, no un juego.

6. REGALO REAL Y ROSITA MANUAL
 - Eventos reales ponderados en el contador: miembro 1, comentario 10, like 1 por me gusta, seguir 3 y compartir 5. Los regalos son independientes del contador.
 - Al completar el limite dinamico se activa el turbo durante 10 s. Los eventos reales no avanzan la pista ni activan el turbo directamente.
 - Cada regalo real avanza 10% inmediatamente y activa además 20 s de turbo a 5% por segundo; cada unidad de un combo aplica ambas cosas. La victoria espera a que termine el turbo.
 - Al completar el limite dinamico se avanza 3% y se activa el turbo. APOYAR y ROSITA locales quedan deshabilitados; solo puntuan eventos reales.

7. DIFICULTAD (v12)
 - Ganar cuesta: cada evento vale HARD (0.5) de lo que valia, y el avance pasivo se detiene en PASSIVE_CAP (%). El resto de la pista solo se recorre con interaccion.

8. RITMO AUTOMATICO / BOT ADAPTABLE (v12)
 - Objetivo: sostener TARGET_EPM eventos por minuto. bot = TARGET_EPM - eventos reales/min (nunca menos de 0, maximo BOT_MAX_EPM). Si entran mas usuarios reales el bot baja solo; si no hay nadie, sube. No genera regalos, seguidores ni compartidos.
 - TURBO GRATIS DEL BOT: ELIMINADO (BOT_TURBO_GIFT_ON=false). El turbo se activa al completar el limite dinamico o con un regalo real.
 - El bot GENERA EVENTOS visibles (chat y likes) con nombres tortubot_N: suman puntos, suenan y muestran su burbuja sobre la tortuga. NO cuentan en estadisticas, MVP, XP, avatares, avisos ni logs, y nunca dan el golpe final (BOT_CAP).
9. ESTADISTICAS INTEGRADAS (v14, un solo archivo)
 - Ya no hay backend aparte: el modulo "ESTADISTICAS INTEGRADAS" guarda todo en el navegador (localStorage) y el panel vive en este mismo HTML.
 - Registra chats y regalos REALES (nunca el ritmo automatico) y el inicio/fin de cada ronda. Botones 📊 (torneos) y 🌎 (paises) abren el panel.
 - Solo OBSERVA: no pide ni promete nada a los espectadores (regla 1). Cerrar el panel antes de mostrar pantalla: contiene nombres de usuarios.

10. AJUSTES POR PARTIDA (v15)
 - Al abrir el overlay y al empezar CADA ronda se fuerza: ritmo automatico ON, voz en off ON, efectos de sonido ON, musica de fondo OFF (ver ajustesDePartida). Los botones 🤖 🗣️ 🔊 🎵 siguen sirviendo, pero valen solo hasta la proxima ronda.

11. RESET DE COPAS (v17)
 - Boton ↺ de la barra de herramientas (o "Reiniciar copas" dentro del panel 📊), ambos con doble toque: pone en cero el top 3, las copas y el torneo en curso, y empieza una carrera nueva. El historial guardado de estadisticas NO se borra.

12. NIDO DE HINCHAS (v20)
 - PODIO BAJO LA BANDERA: en vez del nombre del club, los 3 usuarios reales con mas puntos del equipo (1ro con corona, 2do y 3ro con numero); se reinicia cada ronda (renderPod).
 - Abajo de cada carril: SIN huevos grandes (quitados, FRONT_EGGS=0). Solo 12 huevos (2 filas de 6) ARRIBA con los usuarios anteriores.
 - Sin gente real, los huevos son avatares de BOT (🤖 tortubot_N, claramente bots) y el frente sale del JSON de hinchas (HINCHAS_JSON editable + /api/recent-users); sin JSON, la bandera.
 - Los eventos del bot nunca entran al nido ni se hacen pasar por personas. Al empezar cada ronda el nido vuelve a bots.
13. CONTRATO CON EL BACKEND (v38) - LEER SI TOCAS EL SERVIDOR
 El frontend es UN SOLO HTML. Habla con el backend solo por estas rutas:
  GET  /api/events          Server-Sent Events (SSE) con DOS tipos de mensaje:
       event: status  data: {"connected":true|false,"status":"connecting|reconnecting|failed|..."}   (tambien acepta "isConnected")
       event: update  data: {"entry":{...}}  -> UN evento REAL del live. Campos de entry:
          type            OBLIGATORIO: 'member' | 'chat' | 'gift' | 'like' | 'follow' | 'share' (otro valor se ignora)
          username        id del usuario de TikTok (sin @). Sin username el evento no se asigna a nadie.
          content         texto del comentario (solo chat). El frontend detecta el pais en el texto.
          activityCount   cantidad de likes o de regalos de ese evento (entero >= 1)
          giftName        nombre del regalo (tambien se leen gift_name / gift / giftId)
          profilePictureUrl  foto https del usuario (tambien se leen profilePicture / avatarUrl / avatar / userImage / imageUrl)
          bot             NUNCA lo envia el backend. Solo lo usa el frontend para sus eventos automaticos.
  POST /api/reconnect       inicia/reintenta la conexion con TikTok. 200 = ok, 409 = ya conectado (tambien ok). Otro error: JSON {"message":"..."}.
  GET  /api/recent-users    {"users":[{"username":"...","avatar":"https://..."}]}  SOLO personas reales (alimenta los huevos grandes mientras no hay eventos).
  GET  /manifest.webmanifest y /sw.js   para instalar como app.
 LO QUE EL BACKEND DEBE RESPETAR (reglas 1 y 12; TikTok ya sanciono al autor):
  - Enviar SOLO eventos reales de TikTok. PROHIBIDO inventar, duplicar o simular usuarios, comentarios, likes, regalos, seguidores o compartidos.
  - PROHIBIDO que el backend (o el JSON de usuarios) se haga pasar por personas con nombres inventados. Los bots viven solo en el frontend y se llaman tortubot_N.
  - El backend no decide puntajes ni ganadores: eso lo hace el frontend. Comentarios, likes, seguidores y compartidos solo cargan el contador; los regalos reales avanzan 10% y activan su turbo.
  - /api/recent-users solo debe devolver usuarios que de verdad participaron en el live.
 NOVEDADES v38 (reglas de juego):
  - Bot: un evento suyo vale 1/4 (BOT_W) y, si hay gente real activa, nunca pasa a una tortuga por delante de la otra.
  - Puntos para el contador: comentar = 10 taps, compartir = 5, seguir = 3, like = 1 por me gusta y miembro = 1; al completar 500 taps se avanza 7% y activa turbo.
  - Los eventos sin equipo asignado van al carril seleccionado; los regalos se asignan al equipo mencionado por el usuario en el ultimo minuto.
  - Nido: huevos en blanco al iniciar; los 3 huevos grandes = los 3 usuarios REALES de mayor puntaje; el resto del nido = los demas recientes; huevos de bot (🐢) solo se van cargando con eventos del bot.
  - Alerta de evento = avatar grande del usuario sobre los huevos, que luego baja al nido. Puntaje por usuario: unirse 1, comentar 5, like 1 c/u, seguir 3, compartir 3; cada regalo da +10% y 20 s de turbo a 5% por segundo.
  - Estadisticas: panel 📊 con pestaña Usuarios (historial completo por usuario, guardado en localStorage 'cluss.users').
  - Contador tap tap: miembro 1, comentario 10, like 1 por me gusta, seguir 3 y compartir 5. Al completar 500 taps se avanza 7% y se activa el turbo durante 8 s.
  - Regalo real independiente del contador: +10% inmediato y 20 s de turbo a 5% por segundo por cada unidad.
  - CTAs: destello inicial UNA vez por sesion (nada de pedidos en bucle, regla 1.a).
 14. RETOQUES FINALES (v2.1) - capa independiente al final del archivo (confeti, efectos, banners, pips de copas, sonidos propios)
  - Los pedidos de interaccion se escalonan en los hitos 25%, 50% y 75%; la explicacion de la rosita para activar turbo se dice una vez por sesion.
  - Los eventos del bot NO disparan chispas ni emojis de usuario; solo los eventos reales. Los banners (hitos, remontada, carrera pareja, foto finish) son del estado de la pista.
  - Los controles locales APOYAR y ROSITA estan deshabilitados; la rosa solo aparece al llegar un regalo REAL.
  - Respeta prefers-reduced-motion (menos particulas, sin anillos) y el boton 🔊. La musica de fondo sigue la regla 10 (OFF por partida).
15. VOCES (v1.0.7: alerta con avatar del usuario y botones 🗣️ Don Tortu y 🎙️B lector de chat, independientes; sin botones de musica ni de clubes)
  - Don Tortu: voz en off alegre de Google en espanol (pickV/speak). Lector de chat: segunda voz de sexo opuesto, SOLO lee comentarios reales (enqueueChat, CHAT_LEE_TODOS).
  - Cola del lector (chatQueue): espera a que Don Tortu termine (nunca lo pisa), 2,5 s de aire entre comentarios, maximo CHAT_Q_MAX. Se VACIA al iniciar cada partida (voReset).
-->

.cta.apoyar-cta{height:58px;flex-direction:column;gap:1px;background:linear-gradient(#ffe17a,#d99018);border-color:#805000;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 3px 0 #805000,0 0 10px rgba(255,213,102,.8);animation:ctaGlow 1.4s ease-in-out infinite}

.cta.rosita-cta .em{font-size:27px;line-height:29px}

.hb{height:26px;gap:4px;padding:0 3px;background:rgba(0,0,0,.35);border-radius:9px}
.hb .hi{font-size:17px}
.hb i{height:15px;border-width:2px;border-radius:8px}
.hb em{font-size:11px;min-width:44px;color:#ffd566}
.hb.bump .hi{animation:hbb .22s ease-out}
.hb.bump i{box-shadow:0 0 8px 2px rgba(255,45,85,.9)}
@keyframes hbb{50%{transform:scale(1.55)}}
@media (prefers-reduced-motion:reduce){.hb.bump .hi{animation:none}}
/* contador de me gusta v2: pildora limpia con el numero DENTRO de la barra y el corazon montado a la izquierda */
.hb{position:relative;height:22px;gap:0;padding:0;background:none;border-radius:0}
.hb .hi{position:absolute;left:-2px;top:50%;margin-top:-11px;z-index:2;font-size:20px;line-height:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.8))}
.hb i{position:relative;flex:1;margin-left:10px;height:18px;border:2px solid rgba(255,255,255,.85);border-radius:9px;background:rgba(20,10,4,.55);box-shadow:0 1px 3px rgba(0,0,0,.5)}
.hb i b{position:absolute;left:0;top:0;z-index:1}
.hb{cursor:default}
.hb em{position:absolute;left:16px;right:2px;top:0;bottom:0;display:flex;align-items:center;justify-content:center;min-width:0;font-size:10px;color:#fff;text-shadow:0 1px 2px #000;pointer-events:none;z-index:1}
.hb.bump i{box-shadow:0 0 6px 1px rgba(255,90,130,.9)}

.ev .eb{position:absolute;top:-8px;right:-6px;font-size:18px;line-height:1.2;background:#fff;border:2px solid var(--c,#3f2713);border-radius:12px;padding:0 4px;box-shadow:0 2px 4px rgba(0,0,0,.25)}

.hb i b{transition:width .1s ease-out}
.hb i:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 1px),rgba(0,0,0,.5) calc(10% - 1px),rgba(0,0,0,.5) 10%)}

/* Texto del relator: el cuadro de dialogo esta oculto por CSS; el texto alimenta la voz y la accesibilidad */
function say(m){$('#bub').textContent=m}
/* Redibuja tortugas y barras segun S[i].p (tope visual 100), marca al lider y devuelve su indice */
function update(){
 let best=-1,mx=0;
 S.forEach((s,i)=>{const p=Math.min(100,s.p),h=p*4.7;
  $('#tt'+i).style.transform=`translateY(${54-p*4.8}px)`; /* +34: arranca mas abajo, cubriendo los huevos chicos · 4.8: al 100% la CABEZA toca la linea de META */
  $('#clubName'+i).setAttribute('y',p<=50?456+54-p*4.8-16:528+54-p*4.8+14);
  $('#gf'+i).setAttribute('y',536-h);$('#gf'+i).setAttribute('height',h);$('#gk'+i).setAttribute('cy',536-h);
  if(s.p>mx){mx=s.p;best=i}
 });
 if(typeof window.syncHeartLimit==='function')window.syncHeartLimit();
 T.forEach((t,i)=>{$('#ln'+i).classList.toggle('lead',i===best);const b=document.querySelector(`.hd[data-i="${i}"]`);b.classList.toggle('sel',i===sel);b.setAttribute('aria-pressed',i===sel)});
 return best;
}

/* Anima las patas de la tortuga i durante 1 s */
function walk(i){const l=$('#ln'+i);l.classList.add('walk');clearTimeout(wt[i]);wt[i]=setTimeout(()=>l.classList.remove('walk'),1000)}
/* Salto corto de la tortuga i al recibir un evento */
function hop(i){const g=$('#in'+i);g.classList.remove('hop');void g.getBBox();g.classList.add('hop')}
/* Avance directo para eventos automaticos y acciones del motor; los eventos reales usan solo el contador tap tap. */
function push(i,type,n=1,mult=1){
 if(over||i<0||!S[i])return;
 const pts=type==='gift'?GIFT_PROGRESS*n:PTS[type]*n*mult*HANDICAP[i],s=S[i];
 s.p+=pts;if(type==='like')s.l+=n;if(type==='gift')s.g+=n;
 const prev=lead;lead=update();if(pts>0)float(i,'+'+(+pts.toFixed(1)));hop(i);walk(i);
 if(s.p>=100){return win(i)}
 if(type==='gift')say('¡Gracias por el regalo!'); /* sin pedir regalos ni prometer una victoria */
 else if(lead!==prev&&lead>=0)say(`¡${T[lead].n} toma la delantera!`);
 else if(!auto||Math.random()<.08)say(['¡Todo se decide en la recta!','¡Vamos, tortugas!','¡Qué carrera, gente!'][Math.floor(Math.random()*3)]);
}
/* Fin de carrera: bloquea botones, muestra al ganador y programa la siguiente carrera (9 s) */
function win(i){
 over=true;update();$('#cw'+i).setAttribute('display','');
 document.querySelectorAll('.act,.cta').forEach(b=>b.disabled=true);
 say(`¡${T[i].n} GANA LA CARRERA!`);
 const w=$('#win'),cols=['#ffd34d','#e11d48','#3ddc5a','#5ec3f2','#fff'];
 w.innerHTML=`<svg width="64" height="44" viewBox="0 0 20 14" aria-hidden="true" style="border:2px solid #fff;border-radius:3px">${flag(T[i].id,0,0,20,14)}</svg><h2>🏆<br>${T[i].n}</h2><button class="act" style="flex:none;width:180px" id="again" aria-label="Nueva carrera">🔄</button>`+
 Array.from({length:28},()=>`<span class="cf" style="left:${Math.random()*100}%;background:${cols[Math.floor(Math.random()*5)]};animation-delay:${Math.random()*1.2}s"></span>`).join('');
 w.classList.add('show');$('#again').onclick=reset;$('#again').focus();
 rs=setTimeout(reset,2800);
}
/* Nueva carrera: vuelve todo a 0 y sortea velocidades pasivas nuevas */

 const active=poolForMode(),matches=item=>(item.aliases||[item.n]).some(alias=>new RegExp(`(^|[^A-Z0-9])${alias.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}($|[^A-Z0-9])`).test(normalized));

/* ===== AUDIO (WebAudio sintetizado, sin archivos externos) ===== */
const A=(()=>{
 let c,mg,sg,nb,tm=null,nx=0,st=0,inten=0;
 const N=m=>440*Math.pow(2,(m-69)/12),run=()=>c&&c.state==='running';
 /* Audio: aplica el volumen de musica y efectos segun los botones 🎵 y 🔊. */

 function init(){

  const lim=c.createDynamicsCompressor();mg=c.createGain();sg=c.createGain();
  mg.connect(lim);sg.connect(lim);lim.connect(c.destination);vol();
  nb=c.createBuffer(1,c.sampleRate,c.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  c.onstatechange=sync;sync();return c;
 }
 /* Audio: sincroniza musica y efectos con el estado de los botones. */
 function sync(){
  if(run()){if(!tm){nx=c.currentTime+.1;tm=setInterval(sched,100)}}
  else if(tm){clearInterval(tm);tm=null}
  ui();
 }
 /* Audio: actualiza el aspecto de los botones de sonido. */
 function ui(){

 function o(f,t,d,ty,v,dst,sl){const x=c.createOscillator(),g=c.createGain();x.type=ty||'sine';x.frequency.setValueAtTime(f,t);if(sl)x.frequency.exponentialRampToValueAtTime(sl,t+d);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);x.connect(g);g.connect(dst||sg);x.start(t);x.stop(t+d+.05)}

 function nz(t,d,v,hp,dst){const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=nb;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(dst||sg);s.start(t);s.stop(t+d+.05)}

 function play(s,t){
  const [r,iv]=CH[(s>>3)&3],k=s&7;
  if(k%4===0)o(150,t,.18,'sine',.9,mg,45);
  if(k%2)nz(t,.05,inten>.5?.22:.12,6000,mg);
  if(inten>.75&&(k===2||k===6))nz(t,.12,.25,1500,mg);
  if([0,3,4,7].includes(k))o(N(r-12+(k===3?12:0)),t,.22,'triangle',.55,mg);
  o(N(r+12+iv[(k*2)%3]+(k>3?12:0)),t,.18,'square',.06+.05*inten,mg);
  if(inten>.4&&k%2===0)o(N(r+24+iv[k%3]),t,.14,'sine',.16,mg);
 }

 function sched(){while(nx<c.currentTime+.3){play(st,nx);nx+=60/(112+inten*30)/2;st++}}
 const F={
  tap:(t,n)=>o(N(72+[0,2,4,7,9][n%5]+12*Math.min(2,Math.floor(n/5))),t,.12,'triangle',.45),
  like:t=>o(660,t,.1,'triangle',.35,sg,990),
  follow:t=>{o(660,t,.12,'sine',.4);o(990,t+.1,.22,'sine',.4)},
  gift:t=>[523,659,784,1047,1319].forEach((f,i)=>o(f,t+i*.06,.3,'triangle',.3)),
  chat:t=>o(900,t,.05,'sine',.12),
  sel:t=>{o(400,t,.05,'square',.15);o(600,t+.05,.07,'square',.15)},
  cool:t=>o(1300,t,.04,'square',.08),
  combo:(t,m)=>[0,4,7,12].slice(0,m+1).forEach((s,i)=>o(N(72+s),t+i*.06,.2,'square',.2)),

  win:t=>{[523,523,523,659,784,1047].forEach((f,i)=>o(f,t+i*.14+(i>2?.1:0),.3,'square',.25));nz(t+.9,.6,.2,3000)},

function heartLimitStep(){

 const clubStep=active.some(id=>['ol','cp','lib-oli','lib-cer'].includes(id))?100:active.some(id=>['gu','lib-gua'].includes(id))?50:0;

/* Suma taps ponderados al contador; al completar el limite actual activa el turbo. */
function heartAdd(t,n){
 if(over||!T[t])return;

 heart[t]+=n;
 let full=0;while(heart[t]>=HEART_N){heart[t]-=HEART_N;full++}
 renderHeart(t);
 if(full){
  S[t].p=Math.min(100,S[t].p+HEART_TURBO_PROGRESS*full);
  lead=update();turboOn(t,TURBO_PROLONGED_MS);
 }
 const h=$('#hb'+t);
 h.classList.remove('bump');void h.offsetWidth;h.classList.add('bump'); /* cada me gusta / tap hace latir el contador */
 tapPop(h,n);
 if(full){
  const g=h.querySelector('.gl');g.classList.remove('got');void g.offsetWidth;g.classList.add('got');
  h.classList.remove('full');void h.offsetWidth;h.classList.add('full');A.sfx('lead');
  float(t,'❤️ +'+(HEART_TURBO_PROGRESS*full)+'% · TURBO');
  hype('❤️',T[t].n,' · ¡TURBO! +'+(HEART_TURBO_PROGRESS*full)+'%',T[t].c);
 }
}

 T.forEach((_,i)=>{if(heart[i]>=HEART_N&&!over){heart[i]=HEART_N-1;heartAdd(i,1)}else renderHeart(i)});

function trimNest(t){const l=recent[t],max=NEST_EGGS+FRONT_EGGS;

const _hleSt=handleLiveEntry;
handleLiveEntry=function(e){
 try{if(e&&!e.bot&&['member','chat','gift','like','follow','share'].includes(e.type))stUser(e)}catch(x){console.error(x)}
 try{if(e&&!e.bot&&e.type!=='member'&&e.type in ST)realEv.push(Date.now()); /* alimenta el calculo de eventos/min reales */
  if(e&&!e.bot&&e.type in ST){
  const n=(e.type==='like'||e.type==='gift')?Math.max(1,+e.activityCount||1):1;

 }}catch(x){console.error(x)}
 const r=_hleSt(e);
 if(e&&!e.bot)saveTournamentProgress();
 /* registra en las estadisticas solo chats y regalos REALES (los bots no existen como evento). 'gift' depende de los nombres de campo de tu backend de TikTok */
 try{if(e&&!e.bot&&(e.type==='chat'||e.type==='gift')){const k=String(e.username||'').trim().toLowerCase(),t=picks.get(k);
  logStat({type:e.type,username:e.username,content:e.content,gift:e.giftName||e.gift_name||e.gift||e.giftId||'',count:Math.max(1,+e.activityCount||1),team:t!=null&&T[t]?T[t].id:null,duel:DUELO})}}catch(x){}
 return r;
};
/* ===== RITMO AUTOMATICO (bot adaptable) =====
 Sostiene TARGET_EPM eventos/min en total. Cuenta los eventos REALES de los ultimos 60 s y el bot solo aporta lo que falta:
   eventos del bot por minuto = clamp(TARGET_EPM - reales, 0, BOT_MAX_EPM)
 Mas usuarios reales -> el bot baja hasta 0. Sin usuarios -> sube hasta BOT_MAX_EPM.
 REGLA TIKTOK: no inventa usuarios ni likes/regalos/seguidores falsos (infraccion a). Solo mueve las tortugas. */
const realEv=[];                       /* marcas de tiempo de eventos reales (ultimos 60 s) */
function realEpm(){const n=Date.now();while(realEv.length&&n-realEv[0]>60000)realEv.shift();return realEv.length}
let paceOn=false,botCarry=0,botEpm=0;  /* paceOn: ritmo activo · botCarry: eventos fraccionarios acumulados */
const BOT_NAMES=['tortubot_1','tortubot_2','tortubot_3','tortubot_4','tortubot_5','tortubot_6','tortubot_7','tortubot_8']; /* nombres claramente de bot: nunca se hacen pasar por personas */
const BOT_CHAT=['VAMOS {n}','{n} campeón','dale {n}','{n} {n}','arriba {n}'];
/* Un paso del bot: genera un evento automatico (bot:true) para sostener el ritmo objetivo. */
function botStep(){
 /* genera UN evento (chat o like) para una tortuga: la que va mas atras tiene el doble de chance, y ninguna pasa de BOT_CAP.
    Entra por handleLiveEntry igual que un evento real (suma puntos, sonido, burbuja sobre la tortuga) pero con bot:true,
    asi que NO cuenta en estadisticas, MVP, XP, avatares, avisos, logs ni paises. NUNCA genera regalos, seguidores ni compartidos. */
 const mx=Math.max(...S.map(x=>x.p)),real=realEpm()>0,w=S.map((x,i)=>x.p>=BOT_CAP||(real&&x.p>=Math.max(...S.filter((_,j)=>j!==i).map(y=>y.p)))?0:x.p===mx?1:2) /* con gente real el bot solo empuja a la que va detras */,tot=w.reduce((a,b)=>a+b,0);if(!tot)return;
 let r=Math.random()*tot,i=0;while(r>=w[i]){r-=w[i];i++}
 const u=BOT_NAMES[Math.random()*BOT_NAMES.length|0];
 if(Math.random()<.6||picks.get(u)!==i)handleLiveEntry({type:'chat',username:u,content:BOT_CHAT[Math.random()*BOT_CHAT.length|0].replace(/\{n\}/g,T[i].n),bot:true});
 else handleLiveEntry({type:'like',username:u,activityCount:1+(Math.random()*2|0),bot:true});
}
/* Turbo gratuito del bot: se programa cada 30–40 segundos y favorece al equipo que va perdiendo. */
const BOT_TURBO_GIFT_MIN_MS=30000,BOT_TURBO_GIFT_MAX_MS=40000;
let botTurboGiftTimer=null,botTurboGiftCount=0;
/* Devuelve el carril que va perdiendo (-1 si van empatados). */
function losingLane(progress){return progress[0]===progress[1]?-1:progress[0]<progress[1]?0:1}
const BOT_TURBO_GIFT_ON=false; /* Los regalos automaticos estan desactivados; el turbo viene del contador o de regalos reales */
function canBotTurboGift(){return BOT_TURBO_GIFT_ON&&botTurboGiftCount<BOT_TURBO_GIFT_MAX&&Math.max(...S.map(s=>s.p))<BOT_TURBO_GIFT_STOP_AT}
/* Regalo turbo del bot (desactivado: BOT_TURBO_GIFT_ON=false). */
function giveBotTurboGift(){
 if(over||!paceOn||activeBotTurboGift||botTurboGiftQueue.length||!canBotTurboGift())return;
 const i=losingLane(S.map(x=>x.p));
 if(i>=0)queueBotTurboGift(i,BOT_TURBO_GIFT_MS,BOT_TURBO_PPS,BOT_TURBO_GIFT_TAPS);
}
/* Programa el proximo regalo turbo del bot. */
function scheduleBotTurboGift(){
 clearTimeout(botTurboGiftTimer);
 if(over||!paceOn||!canBotTurboGift())return;
 const delay=BOT_TURBO_GIFT_MIN_MS+Math.random()*(BOT_TURBO_GIFT_MAX_MS-BOT_TURBO_GIFT_MIN_MS);
 botTurboGiftTimer=setTimeout(()=>{botTurboGiftTimer=null;giveBotTurboGift();scheduleBotTurboGift()},delay);
}
/* ===== APOYO DEL BOT AL LADO SIN INTERACCION (CLUSS) =====
 Si en los ultimos 60 s hay MAS DE 3 USUARIOS REALES distintos de un solo lado (el otro casi sin gente), el bot empuja al carril SIN gente, incluso por delante del otro,
 hasta APOYO_TOPE (80%) y ahi se detiene: asi el lado con gente tiene un rival a quien alcanzar y se apuran las interacciones.
 Tope fijo: el bot JAMAS pasa del 80%, por eso nunca llega a la meta ni gana (la meta es solo de la gente real). No retrocede: se queda en su lugar.
 Se ve como evento de bot (burbuja + 🤖 en el numero flotante) y no cuenta en estadisticas, MVP ni XP. Solo funciona con el ritmo automatico (🤖) encendido. */
const APOYO_USERS=4,APOYO_RATIO=.25,APOYO_TOPE=BOT_CAP,APOYO_RATE=1; /* usuarios REALES distintos del lado activo (mas de 3 = 4+) · el otro lado debe tener <= 25% de esa cantidad · tope 80% · puntos por segundo */
function laneUsers(i){const n=Date.now(),l=realLane[i];while(l.length&&n-l[0].t>60000)l.shift();return new Set(l.map(x=>x.u)).size} /* usuarios distintos en los ultimos 60 s */
function botApoyo(){
 if(over||S.length<2)return;
 const c=T.map((_,i)=>laneUsers(i)),hi=c[0]>=c[1]?0:1,lo=1-hi;
 if(c[hi]<APOYO_USERS||c[lo]>c[hi]*APOYO_RATIO)return;           /* mas de 3 usuarios de un solo lado y casi nadie del otro */
 const room=APOYO_TOPE-S[lo].p;                                    /* solo hasta el 80% */
 if(room<=.05)return;                                              /* ya esta en su tope: el bot se detiene ahi */
 const amt=Math.min(APOYO_RATE,room),u=BOT_NAMES[Math.random()*BOT_NAMES.length|0];
 handleLiveEntry({type:'chat',username:u,content:BOT_CHAT[Math.random()*BOT_CHAT.length|0].replace(/\{n\}/g,T[lo].n),bot:true});
 S[lo].p=Math.min(S[lo].p+amt,APOYO_TOPE);update();float(lo,'🤖 +'+(+amt.toFixed(1)));
}
const _rstBR=reset;reset=function(){
 clearTimeout(botTurboGiftTimer);botTurboGiftTimer=null;botTurboGiftCount=0;realLane.forEach(l=>l.length=0);
 const result=_rstBR.apply(this,arguments);scheduleBotTurboGift();return result;
};
setInterval(()=>{                      /* cada segundo recalcula cuanto debe aportar el bot */
 if(over||!paceOn){botEpm=0;return}
 botEpm=Math.min(BOT_MAX_EPM,Math.max(0,TARGET_EPM-realEpm()));
 botCarry+=botEpm/60;
 while(botCarry>=1){botCarry--;botStep()}
 botApoyo();
 update();
},1000);

(function(){const rail=document.querySelector('.rail');if(!rail)return;
const ap=rail.querySelector('.apoyar-cta'),ro=rail.querySelector('.rosita-cta'),pi=rail.querySelector('.pistola-cta');
const txt=(b,t1,t2)=>{if(!b||b.querySelector('.cx'))return;b.querySelectorAll('.ar,.rs,.tx').forEach(n=>n.remove());const c=document.createElement('span');c.className='cx';c.setAttribute('aria-hidden','true');c.innerHTML='<b>'+t1+'</b><i>'+t2+'</i>';b.appendChild(c)};
txt(ap,'APOYAR','cada toque suma +1');txt(ro,'ROSITA','activa el TURBO 🚀');txt(pi,'PISTOLA','GANA LA CARRERA');
const hit=b=>{if(!b)return;b.classList.remove('hit');void b.offsetWidth;b.classList.add('hit');setTimeout(()=>b.classList.remove('hit'),700)};
const _h=handleLiveEntry;
handleLiveEntry=function(e){
 const r=_h.apply(this,arguments);
 try{if(e&&!e.bot){const t=e.type;
  if(t==='gift'){const gn=String(e.giftName||e.gift_name||e.gift||'');hit(/money\s*gun|pistola/i.test(gn)?pi:ro)}
  else if(t==='like'||t==='chat'||t==='follow'||t==='share')hit(ap)}}catch(x){}
 return r};
})();
</script>
<!-- ===== CTA v3: los 3 botones (ROSITA, APOYAR/me gusta, PISTOLA) llaman la atencion POR TURNOS: reposo = brillo suave de su color; en su turno = pulso grande, aro, destello, etiqueta "¡AHORA!" y frase de accion. Un evento real sigue haciendo "hit" encima ===== -->
<style id="cta-turnos">
/* reposo: los tres se ven vivos pero tranquilos (el unico que se mueve es el que tiene el turno) */
.rail .rosita-cta:not(.spot):not(.hit),.rail .rosita-cta:not(.spot):not(.hit):after,.rail .rosita-cta:not(.spot):not(.hit) .em{animation:none}
.rail .rosita-cta:not(.spot):after{opacity:0}
.rail .rosita-cta:not(.spot):not(.hit){box-shadow:0 3px 0 #5c0816,0 0 12px 2px rgba(255,60,110,.85)}
.rail .apoyar-cta:not(.spot):not(.hit){box-shadow:0 3px 0 #052a63,0 0 12px 2px rgba(70,150,255,.85)}
.rail .pistola-cta:not(.spot):not(.hit){box-shadow:0 3px 0 #053d1c,0 0 12px 2px rgba(60,220,120,.8)}
/* en turno */
.rail .cta.spot:not(.hit){z-index:5;border-color:#ffe14d;animation:spotPop .6s ease-in-out infinite,spotGlow .6s ease-in-out infinite}
.rail .cta.spot .em{display:inline-block;animation:rositaWob .45s ease-in-out infinite alternate}
.rail .cta.spot:after{content:"";position:absolute;inset:-3px;border-radius:15px;border:3px solid #ffe14d;opacity:0;pointer-events:none;animation:rositaRing 1s ease-out infinite}
.rail .cta.spot:before{content:"¡AHORA!";position:absolute;top:-10px;left:8px;z-index:6;padding:2px 6px;border-radius:8px;border:2px solid #000;background:#ffe14d;color:#1a1000;font:900 9px/1 Inter,sans-serif;letter-spacing:.5px;text-shadow:none;animation:spotTag .6s ease-in-out infinite alternate}
.rail .cta.spot .cx i{color:#ffe14d;font-weight:900}
@keyframes spotPop{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes spotGlow{0%,100%{box-shadow:0 3px 0 rgba(0,0,0,.55),0 0 10px 2px #ffe14d}50%{box-shadow:0 3px 0 rgba(0,0,0,.55),0 0 24px 8px #fff}}
@keyframes spotTag{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-3px) rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.rail .cta.spot,.rail .cta.spot .em,.rail .cta.spot:after,.rail .cta.spot:before{animation:none}.rail .cta.spot{transform:scale(1.05)}}
</style>
<script>
(function(){const rail=document.querySelector('.rail');if(!rail)return;
const ro=rail.querySelector('.rosita-cta'),ap=rail.querySelector('.apoyar-cta'),pi=rail.querySelector('.pistola-cta');
/* orden de los turnos y frase de accion de cada boton mientras tiene el turno */
/* APOYAR rota su identidad en cada turno: APOYAR (me gusta) -> COMPARTIR -> SEGUIR (taps del contador: 1 / 5 / 3) */
const ID=[['❤️','APOYAR','cada toque suma +1','¡toca el live! ❤️','APOYAR: cada toque en el live suma 1 tap'],['↗️','COMPARTIR','comparte y suma +5','¡comparte el live! ↗️','COMPARTIR: compartir el live suma 5 taps'],['➕','SEGUIR','sigue y suma +3','¡sigue la cuenta! ➕','SEGUIR: seguir la cuenta suma 3 taps']];let idn=-1,idCur=0;
function nuevaId(){if(!ap)return;idCur=++idn%ID.length;const d=ID[idCur],em=ap.querySelector('.em'),bb=ap.querySelector('.cx b'),ii=ap.querySelector('.cx i');if(em)em.textContent=d[0];if(bb)bb.textContent=d[1];if(ii)ii.textContent=d[2];ap.setAttribute('aria-label',d[4]);ap.title=d[4]}
const turnos=[[ro,()=>'¡manda una rosita! 🚀'],[ap,()=>ID[idCur][3]],[pi,()=>'🏆 ¡gana al instante!']].filter(x=>x[0]);
if(!turnos.length)return;
const SPOT_MS=2600,PERIOD_MS=3000;let k=0,prev=null;
function frase(b,t){const i=b&&b.querySelector('.cx i');if(!i)return;if(t!==undefined){if(i.dataset.o===undefined)i.dataset.o=i.textContent;i.textContent=t}else if(i.dataset.o!==undefined){i.textContent=i.dataset.o;delete i.dataset.o}}
function quita(b){if(!b)return;b.classList.remove('spot');frase(b)}
function turno(){
 let fin=false;try{fin=!!over}catch(e){}
 if(prev){quita(prev);prev=null}
 if(fin||document.hidden)return;
 const [b,f]=turnos[k++%turnos.length];
 if(b===ap)nuevaId();   /* APOYAR cambia a COMPARTIR / SEGUIR antes de su turno */
 b.classList.add('spot');frase(b,f());prev=b;
 setTimeout(()=>{if(prev===b){quita(b);prev=null}},SPOT_MS)}
setTimeout(()=>{turno();setInterval(turno,PERIOD_MS)},1500);
})();
</script>
</body>
</html>
