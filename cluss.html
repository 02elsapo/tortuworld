<!doctype html>
<!--
CLUSS (antes Tortu Live): duelo unico OLIMPIA vs CERRO.
 - Para participar hay que nombrar el club en el chat (olimpia/oli/decano · cerro/cp/ciclon/azulgrana). Sin club no se mueve la carrera.
 - Rotacion de clubes: el ganador sigue y enfrenta al siguiente rival disponible, en orden; no repite al rival inmediatamente anterior. Cada duelo es primero a 3 copas.
 - Botones de comentar, seguir y compartir eliminados (quedan APOYAR y ROSITA). El bot se detiene en el 80% (BOT_CAP).
 - APOYO DEL BOT: si hay mas de 3 usuarios reales de un solo lado, el bot empuja al otro lado, incluso por delante, hasta el 80% (APOYO_TOPE) y se queda ahi; nunca pasa de 80, asi que nunca gana. Ver botApoyo / APOYO_*.
 - Duelo equilibrado y 4 veces mas dificil: todos los clubes comparten el mismo ESFUERZO. Se puede dar ventaja subiendo el valor del club contrario (HANDICAP, junto a DUELO).
 - Podio de copas: 1er club grande y 2do chico, con conteo de copas (P.cp). Las demas reglas de abajo siguen vigentes.
REGLAS DEL PROYECTO. LEER ANTES DE TOCAR EL CODIGO (backend y frontend)
Las reglas marcadas (propuesto) aun no estan confirmadas por el autor.


2. FORMATO DEL TORNEO (especificacion, aun no implementado)
 - Duelos de 2 paises en 2 carriles, con eliminacion directa: el que pierde queda eliminado.
 - Torneo de 3 rondas. Al terminar, reinicio automatico con todos los paises de nuevo en juego. El ultimo en pie se lleva la copa.
 - Nadie queda rey para siempre (propuesto): un pais gana como maximo 2 duelos seguidos y descansa una ronda.
 - Pendiente de definir: Paraguay juega siempre la ronda 1 o entra al sorteo como los demas.

3. VOTACION Y SIGUIENTE RIVAL
 - La gente escribe su pais en el chat. Deteccion flexible: "brasil", "br", "bandera de Brasil", "argentina", "arg", etc. Todo lo demas se ignora.
 - Cada usuario suma como maximo 1 mencion por ronda.
 - Ventana de votacion de 20 a 30 segundos (propuesto).
 - El top 10 de mas comentados se reinicia al terminar cada duelo. El pais que esta peleando no entra al ranking durante su duelo.
 - Siguiente rival (propuesto): sorteo ponderado entre los 3 a 5 primeros del top 10, no siempre el numero 1. El sorteo se muestra en pantalla. Si nadie comenta, se sortea entre los paises disponibles.

4. TABLAS (especificacion, aun no implementado)
 - Top 3 ganadores: banderas grandes, corona al primero y conteo de copas. Desempate: mas duelos ganados. Pendiente: guardar acumulado entre lives (JSON) o arrancar de cero.
 - Top 10 mas comentados: banderas chicas con contador de menciones.

5. INTERFAZ
 - Sin titulo del live (eliminado).
 - Sin indicador de nivel (Nv) en el pie: no corresponde a un overlay.
 - Franja de estadisticas bajo el tablero (unidos, comentarios, regalos, me gusta, seguidores, compartidos) con eventos REALES del live. Los bots (bot:true) y los toques manuales no cuentan. El contador de regalos es solo informativo, nunca para pedir regalos.
 - Tabla de copas en la columna derecha, ordenada por copas, con banderas del 1er al 7mo puesto y corona al primero. El acumulado vive en P.cp (por id de club, se guarda en localStorage).
 - Duelo con solo 2 carriles, mas grandes, y tortugas mas grandes. Los 2 paises activos se definen en DUELO (ids de POOL).
 - Cada pais se muestra con su bandera grande y su nombre debajo, con el mismo ancho que la bandera. Sin luz ni barra de color bajo el encabezado: es un overlay de TikTok, no un juego.

6. REGALO REAL Y ROSITA MANUAL
 - Un regalo real da 15% de avance por regalo y activa turbo de 8 s para el equipo que el usuario menciono en el chat durante el ultimo minuto. No garantiza una victoria.
 - El boton ROSITA es una accion manual local; activa el turbo del juego, pero no finge un evento de TikTok.

7. DIFICULTAD (v12)
 - Ganar cuesta: cada evento vale HARD (0.5) de lo que valia, y el avance pasivo se detiene en PASSIVE_CAP (%). El resto de la pista solo se recorre con interaccion.

8. RITMO AUTOMATICO / BOT ADAPTABLE (v12)
 - Objetivo: sostener TARGET_EPM eventos por minuto. bot = TARGET_EPM - eventos reales/min (nunca menos de 0, maximo BOT_MAX_EPM). Si entran mas usuarios reales el bot baja solo; si no hay nadie, sube. No genera regalos, seguidores ni compartidos.
 - TURBO GRATIS DEL BOT: cada 30–40 s, elige al equipo que va perdiendo. Muestra una ventana grande con su bandera; al cerrarla, TortuLive anuncia el regalo, suma 10% de avance y activa el turbo. La voz no dice porcentajes.
 - El bot GENERA EVENTOS visibles (chat y likes) con nombres tortubot_N: suman puntos, suenan y muestran su burbuja sobre la tortuga. NO cuentan en estadisticas, MVP, XP, avatares, avisos ni logs, y nunca dan el golpe final (BOT_CAP).
9. ESTADISTICAS INTEGRADAS (v14, un solo archivo)
 - Ya no hay backend aparte: el modulo "ESTADISTICAS INTEGRADAS" guarda todo en el navegador (localStorage) y el panel vive en este mismo HTML.
 - Registra chats y regalos REALES (nunca el ritmo automatico) y el inicio/fin de cada ronda. Botones 📊 (torneos) y 🌎 (paises) abren el panel.
 - Solo OBSERVA: no pide ni promete nada a los espectadores (regla 1). Cerrar el panel antes de mostrar pantalla: contiene nombres de usuarios.

10. AJUSTES POR PARTIDA (v15)
 - Al abrir el overlay y al empezar CADA ronda se fuerza: ritmo automatico ON, voz en off ON, efectos de sonido ON, musica de fondo OFF (ver ajustesDePartida). Los botones 🤖 🗣️ 🔊 🎵 siguen sirviendo, pero valen solo hasta la proxima ronda.

11. RESET DE COPAS (v17)
 - Boton ↺ de la barra de herramientas (o "Reiniciar copas" dentro del panel 📊), ambos con doble toque: pone en cero el top 3, las copas y el torneo en curso, y empieza una carrera nueva. El historial guardado de estadisticas NO se borra.

12. NIDO DE HINCHAS (v20)
 - Abajo de cada carril: 3 huevos grandes ABAJO del nido = usuarios de los 3 ULTIMOS eventos reales del equipo, y 12 huevos (2 filas de 6) ARRIBA con los usuarios anteriores.
 - Sin gente real, los huevos son avatares de BOT (🤖 tortubot_N, claramente bots) y el frente sale del JSON de hinchas (HINCHAS_JSON editable + /api/recent-users); sin JSON, la bandera.
 - Los eventos del bot nunca entran al nido ni se hacen pasar por personas. Al empezar cada ronda el nido vuelve a bots.
13. CONTRATO CON EL BACKEND (v38) - LEER SI TOCAS EL SERVIDOR
 El frontend es UN SOLO HTML. Habla con el backend solo por estas rutas:
  GET  /api/events          Server-Sent Events (SSE) con DOS tipos de mensaje:
       event: status  data: {"connected":true|false,"status":"connecting|reconnecting|failed|..."}   (tambien acepta "isConnected")
       event: update  data: {"entry":{...}}  -> UN evento REAL del live. Campos de entry:
          type            OBLIGATORIO: 'member' | 'chat' | 'gift' | 'like' | 'follow' | 'share' (otro valor se ignora)
          username        id del usuario de TikTok (sin @). Sin username el evento no se asigna a nadie.
          content         texto del comentario (solo chat). El frontend detecta el pais en el texto.
          activityCount   cantidad de likes o de regalos de ese evento (entero >= 1)
          giftName        nombre del regalo (tambien se leen gift_name / gift / giftId)
          profilePictureUrl  foto https del usuario (tambien se leen profilePicture / avatarUrl / avatar / userImage / imageUrl)
          bot             NUNCA lo envia el backend. Solo lo usa el frontend para sus eventos automaticos.
  POST /api/reconnect       inicia/reintenta la conexion con TikTok. 200 = ok, 409 = ya conectado (tambien ok). Otro error: JSON {"message":"..."}.
  GET  /api/recent-users    {"users":[{"username":"...","avatar":"https://..."}]}  SOLO personas reales (alimenta los huevos grandes mientras no hay eventos).
  GET  /manifest.webmanifest y /sw.js   para instalar como app.
 LO QUE EL BACKEND DEBE RESPETAR (reglas 1 y 12; TikTok ya sanciono al autor):
  - Enviar SOLO eventos reales de TikTok. PROHIBIDO inventar, duplicar o simular usuarios, comentarios, likes, regalos, seguidores o compartidos.
  - PROHIBIDO que el backend (o el JSON de usuarios) se haga pasar por personas con nombres inventados. Los bots viven solo en el frontend y se llaman tortubot_N.
  - El backend no decide puntajes ni ganadores: eso lo hace el frontend. Un regalo real da 15% de avance y turbo al equipo apoyado recientemente en el chat, sin garantizar la victoria.
  - /api/recent-users solo debe devolver usuarios que de verdad participaron en el live.
 NOVEDADES v38 (reglas de juego):
  - Bot: un evento suyo vale 1/4 (BOT_W) y, si hay gente real activa, nunca pasa a una tortuga por delante de la otra.
  - Puntos manuales/reales: comentar = 10 rayos, compartir = 5, seguir = 3, apoyar = 1 (likes llenan el corazon: cada 100 = +10). Todo x HARD.
  - Un usuario mueve la carrera si nombro un pais del duelo (o ya lo habia elegido); los likes sin equipo van al carril seleccionado. Pais fuera del duelo = solo estadistica.
  - Nido: huevos en blanco al iniciar; los 3 huevos grandes = los 3 usuarios REALES de mayor puntaje; el resto del nido = los demas recientes; huevos de bot (🐢) solo se van cargando con eventos del bot.
  - Alerta de evento = avatar grande del usuario sobre los huevos, que luego baja al nido. Puntaje por usuario: unirse 1, comentar 5, like 1 c/u, seguir 3, compartir 3; los regalos afectan el avance del equipo.
  - Estadisticas: panel 📊 con pestaña Usuarios (historial completo por usuario, guardado en localStorage 'cluss.users').
  - Turbo: por boton ROSITA manual, regalo real (8 s), compartido real, 'rafaga' de 5 comentarios reales en 10 s, y regalo gratuito del bot al equipo que va perdiendo cada 30–40 s.
  - CTAs: destello inicial UNA vez por sesion (nada de pedidos en bucle, regla 1.a).
 14. RETOQUES FINALES (v2.1) - capa independiente al final del archivo (confeti, efectos, banners, pips de copas, sonidos propios)
  - Solo REACCIONA a lo que pasa en la carrera. No pide likes/comentarios/regalos/seguir/compartir, no promete nada, no inventa eventos (reglas 1a, 1b, 1c).
  - Los eventos del bot NO disparan chispas ni emojis de usuario; solo los toques manuales y los eventos reales. Los banners (hitos, remontada, carrera pareja, foto finish) son del estado de la pista.
  - ROSITA manual se muestra como fuego (nunca como rosa/regalo). La rosa solo aparece al llegar un regalo REAL.
  - Respeta prefers-reduced-motion (menos particulas, sin anillos) y el boton 🔊. La musica de fondo sigue la regla 10 (OFF por partida).
-->

<script>
/* SCRIPT 1 = MOTOR DEL JUEGO: datos, carriles, puntos, combo, conexion SSE con el backend y estadisticas. Las capas de sonido/nido/bot/voz estan en el SCRIPT 2 y envuelven estas funciones. */
/* ===== DATOS: paises disponibles (POOL), duelo activo (DUELO), progreso por carril (S, 0-100) y velocidades pasivas (sp) ===== */
const POOL={ol:{id:'ol',n:'OLIMPIA',s:'OLI',c:'#f1f1f1'},cp:{id:'cp',n:'CERRO',s:'CER',c:'#3b82f6'},li:{id:'li',n:'LIBERTAD',s:'LIB',c:'#e5e5e5'},gu:{id:'gu',n:'GUARANÍ',s:'GUA',c:'#f5c400'},lu:{id:'lu',n:'LUQUEÑO',s:'LUQ',c:'#2563eb'},na:{id:'na',n:'NACIONAL',s:'NAC',c:'#c8102e'},sa:{id:'sa',n:'SOL DE AMÉRICA',s:'SOL',c:'#f5c400'}}; /* CLUSS: clubes de Paraguay */
/* El ganador permanece y su rival rota entre los otros clubes, sin repetir el duelo anterior. */
const START_DUELO=['ol','cp'];
const LEGACY_FIXTURES=[['ol','cp'],['li','ol'],['li','cp'],['gu','ol'],['gu','cp']];
let FX=0,savedDuel=null;
let savedNextRival=null;
try{
 const saved=JSON.parse(localStorage.getItem('cluss.v1')||'{}');
 FX=(+saved.fx||0)%LEGACY_FIXTURES.length;
 if(Array.isArray(saved.duel)&&saved.duel.length===2&&saved.duel.every(k=>POOL[k])&&saved.duel[0]!==saved.duel[1])savedDuel=saved.duel;
 else savedDuel=LEGACY_FIXTURES[FX];
 if(typeof saved.nextRival==='string'&&POOL[saved.nextRival])savedNextRival=saved.nextRival;
}catch(e){}
const DUELO=(savedDuel||START_DUELO).slice();/* duelo actual, persistido para continuar el torneo */
function drawNextRival(duel=DUELO){
 const available=Object.keys(POOL).filter(id=>!duel.includes(id));
 if(!available.length)throw new Error('No hay clubes disponibles para sortear el próximo rival.');
 return available[Math.floor(Math.random()*available.length)];
}
let nextRival=savedNextRival&&!DUELO.includes(savedNextRival)?savedNextRival:drawNextRival(DUELO);
function nextFixture(winnerId,rival=nextRival,duel=DUELO){
 if(!POOL[winnerId])throw new Error('El ganador no pertenece al torneo.');
 if(!POOL[rival]||duel.includes(rival))throw new Error('El próximo rival debe ser un club que no esté jugando.');
 return[winnerId,rival];
}
/* CLUSS · VENTAJA: cuantas veces MAS interacciones necesita cada club para llegar a la meta. Hoy esta en 4 para todos (equilibrado, 4 veces mas dificil); un valor 4 significa que ese club necesita 4 veces mas.
   Afecta TODO lo que viene de interaccion (chat, likes, seguir, compartir, corazon, turbo, bonus). El avance pasivo es igual para los dos. */
const ESFUERZO={ol:4,cp:4,li:4,gu:4,lu:4,na:4,sa:4}; /* llegar a la meta cuesta 4 veces mas interacciones, IGUAL para todos los clubes (equilibrado). 1 = facil. Para dar ventaja a un club sube el numero del otro (ej. cp:4 = Cerro necesita 4 veces mas) */
const HANDICAP=DUELO.map(k=>1/ESFUERZO[k]);
const T=DUELO.map(k=>({...POOL[k]})); /* copias: al cambiar de clasico se editan los carriles, no la lista de clubes */
const S=T.map(()=>({p:0,g:0,l:0}));
let sel=0,over=false,auto=false,tmr=null,lead=-1,viewers=1450,rs=null;
const picks=new Map(),lastChat=new Map(),recentChatPicks=new Map();
let streak=0,cmbT=null;
const wt=[];
/* ===== CONFIG DE DIFICULTAD Y RITMO (editar solo aqui) ===== */
const RACE_SECONDS=600;  /* segundos que tardaria una tortuga en llegar SOLA por avance pasivo (antes 240) */
const PASSIVE_CAP=55;    /* el avance pasivo se detiene en este % de pista: el resto exige interaccion */
const HARD=0.5;          /* multiplicador de puntos de cada evento (1 = facil, menor = mas dificil) */
const TURBO_PPS=4,BOT_TURBO_PPS=1,TURBO_PROLONGED_MS=8000; /* turbo real/manual: 4 puntos/s; ROSITA manual dura hasta 8 s */
function turboGain(rate,ms,handicap){return rate*ms/1000*handicap}
const GIFT_PROGRESS=15,GIFT_TEAM_WINDOW_MS=60000; /* cada regalo real avanza 15%; el equipo debe haberse mencionado en el ultimo minuto */
const BOT_TURBO_GIFT_PROGRESS=10;
function recentChatTeam(key,now=Date.now()){
 const pick=recentChatPicks.get(key);
 return pick&&now>=pick.t&&now-pick.t<=GIFT_TEAM_WINDOW_MS?pick.team:-1;
}
const TARGET_EPM=30;     /* eventos por minuto que el ritmo automatico intenta sostener entre reales + bot */
const BOT_MAX_EPM=40;    /* tope de eventos por minuto que puede aportar el bot */
const BOT_W=0.25;        /* peso de un evento del bot: 1/4 del valor de uno real */
const BOT_CAP=80;        /* el bot NUNCA empuja una tortuga mas alla de este % (80): ahi se detiene. La meta es de la gente real */
const BOT_TURBO_GIFT_MS=4000,BOT_TURBO_GIFT_TAPS=25; /* turbo automatico y carga parcial del corazon al aceptarlo */
/* ===== ESTADISTICAS INTEGRADAS (todo en este mismo archivo; se guardan en el navegador con localStorage) =====
 Registra: torneos y rondas · paises nombrados en el chat (+1 por comentario) · si la ronda tuvo regalos, el log completo del chat.
 REGLA TIKTOK: solo OBSERVA eventos reales. No inventa eventos ni pide ni promete nada a nadie (regla 1). */
const ST_KEY='cluss.stats',ST_LOG='cluss.log.',MAX_LOGS=15,MAX_CHAT=1500; /* se conservan los logs de las ultimas 15 rondas con regalos */
const LS={get:(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},
 set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},
 del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const US_KEY='cluss.users'; /* historial completo por usuario: clave aparte para no inflar el guardado principal */
const DB=Object.assign({tournaments:[],countries:{},gifts:[],users:{}},LS.get(ST_KEY,{}));DB.users=LS.get(US_KEY,DB.users||{}); /* tournaments · countries{codigo:{name,flag,mentions,users[]}} · gifts[indice de logs] */
const dbSave=()=>{const{users,...rest}=DB;return LS.set(ST_KEY,rest)};
function usSave(){ /* si el navegador se queda sin espacio, descarta los usuarios mas viejos y reintenta */
 let ks;while(!LS.set(US_KEY,DB.users)&&(ks=Object.keys(DB.users)).length>20)ks.sort((a,b)=>DB.users[a].last-DB.users[b].last).slice(0,Math.ceil(ks.length*.1)).forEach(x=>delete DB.users[x]);
}
let stTour=DB.tournaments.find(t=>!t.end)||null,stCur=null,stT=null; /* torneo en curso · ronda en curso · temporizador de guardado */
const stStamp=()=>new Date().toISOString().replace(/[:.]/g,'-').toLowerCase();
const stHash=s=>{let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return h.toString(36)}; /* usuarios unicos sin guardar su nombre */
const stNorm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
const stFlag=c=>String.fromCodePoint(...[...c.toUpperCase()].map(x=>127397+x.charCodeAt()));
/* Paises reconocidos en el chat: [codigo, nombre, alias separados por coma]. La bandera se agrega sola */
const ST_COUNTRIES=[['ol','Olimpia','OLIMPIA,OLI,DECANO','⚪⚫'],['cp','Cerro Porteño','CERRO,CERRO PORTENO,CP,CICLON,AZULGRANA','🔵🔴'],['li','Libertad','LIBERTAD,GUMARELO','⚪⚫'],['gu','Guaraní','GUARANI,ABORIGEN','🟡⚫']].map(([code,name,al,flag])=>({code,name,flag,
 re:new RegExp('(^|[^A-Z0-9])('+al.split(',').map(a=>a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')([^A-Z0-9]|$)')}));
const stDetect=text=>{const n=stNorm(text);return ST_COUNTRIES.filter(c=>c.re.test(n))}; /* paises nombrados en un comentario */
function stCountry(c,user){ /* +1 mencion por comentario; "users" cuenta personas distintas */
 const k=DB.countries[c.code]||(DB.countries[c.code]={name:c.name,flag:c.flag,mentions:0,users:[]});
 k.mentions++;const h=stHash(user);if(!k.users.includes(h))k.users.push(h);dbSave();
}
/* ULTIMOS EVENTOS POR USUARIO (solo reales): guarda los ultimos MAX_UEV de cada usuario (tipo + texto si comento). Solo OBSERVA. */
const MAX_USERS=500,MAX_UEV=2000;let usT=0; /* historial completo; los topes solo evitan llenar el navegador */
function stUser(e){
 const name=String(e.username||'').trim();if(!name)return;
 const k=name.toLowerCase(),now=Date.now(),u=DB.users[k]||(DB.users[k]={name,last:0,ev:[]});
 u.name=name;u.last=now;
 const n=(e.type==='like'||e.type==='gift')?Math.max(1,+e.activityCount||1):1,row={t:now,type:e.type,n};
 if(e.type==='chat')row.text=String(e.content||'').slice(0,200);
 if(e.type==='gift')row.gift=String(e.giftName||e.gift_name||e.gift||'').slice(0,40);
 const l=u.ev,p=l[l.length-1];
 if(p&&p.type==='like'&&row.type==='like'&&now-p.t<5000){p.n+=n;p.t=now}else l.push(row); /* los likes en rafaga se juntan en una fila */
 while(l.length>MAX_UEV)l.shift();
 const ks=Object.keys(DB.users);if(ks.length>MAX_USERS)ks.sort((a,b)=>DB.users[a].last-DB.users[b].last).slice(0,ks.length-MAX_USERS).forEach(x=>delete DB.users[x]);
 if(!usT)usT=setTimeout(()=>{usT=0;usSave()},3000);
}
const stNew=duel=>{stCur={id:stStamp(),start:Date.now(),duel:duel||[],chat:[],gifts:[]}};
function stFlush(winner){ /* escribe el log completo de la ronda (solo si hubo regalos) y actualiza el indice */
 if(!stCur||!stCur.gifts.length)return;
 const c=stCur,row={id:c.id,start:c.start,duel:c.duel,winner:winner||null,gifts:c.gifts.reduce((a,g)=>a+g.count,0),users:new Set(c.gifts.map(g=>g.user)).size};
 LS.set(ST_LOG+c.id,{id:c.id,start:c.start,end:Date.now(),duel:c.duel,winner:winner||null,gifts:c.gifts,chat:c.chat});
 const i=DB.gifts.findIndex(x=>x.id===c.id);if(i<0)DB.gifts.push(row);else DB.gifts[i]=Object.assign(DB.gifts[i],row);
 for(let o;DB.gifts.filter(g=>g.hasLog!==false).length>MAX_LOGS;){o=DB.gifts.find(g=>g.hasLog!==false);LS.del(ST_LOG+o.id);o.hasLog=false} /* borra los logs mas viejos */
 dbSave();
}
function stEvent(e){ /* chat o regalo REAL */
 if(!stCur)stNew(e.duel);
 const user=String(e.username||'anonimo').slice(0,40),now=Date.now(),c=stCur;
 if(e.type==='chat'){
  const text=String(e.content||'').slice(0,300);
  c.chat.push({t:now,user,text,team:e.team||null});if(c.chat.length>MAX_CHAT)c.chat.shift();
  stDetect(text).forEach(k=>stCountry(k,user));
 }else{
  /* TikTok no informa el "motivo" de un regalo: se guarda el CONTEXTO real (que se comentaba y a que equipo apoyaba) */
  const own=[...c.chat].reverse().find(m=>m.user===user);
  c.gifts.push({t:now,user,gift:String(e.gift||'regalo').slice(0,60),count:Math.max(1,+e.count||1),supports:e.team||null,duel:c.duel,
   userLastComment:own?{text:own.text,secondsBefore:Math.round((now-own.t)/1000)}:null,contextBefore:c.chat.filter(m=>now-m.t<60000).slice(-10)});
 }
 if(c.gifts.length){clearTimeout(stT);stT=setTimeout(()=>stFlush(),2000)}
}
function stEnd(e){ /* fin de ronda: guarda la ronda en su torneo; con campeon cierra el torneo */
 if(!stCur)stNew(e.duel);

/* Detecta el pais en un comentario (nombre, sigla de 2 letras o bandera). Devuelve el indice del carril o -1 */
function findTeam(text){
 const raw=String(text||'');
 const normalized=raw.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
 const AL={ol:['OLIMPIA','OLI','DECANO'],cp:['CERRO','CERRO PORTENO','CP','CICLON','AZULGRANA'],li:['LIBERTAD','GUMARELO'],gu:['GUARANI','ABORIGEN'],lu:['LUQUENO','LUQUE','SPORTIVO LUQUENO','CHANCHON'],na:['NACIONAL','TRICOLOR','ACADEMIA'],sa:['SOL DE AMERICA','DANZARIN']}; /* CLUSS: palabras que cuentan como nombrar al club */
 return T.findIndex(t=>(AL[t.id]||[]).some(alias=>/[^\x00-\x7F]/.test(alias)
  ?raw.includes(alias)
  :new RegExp(`(^|[^A-Z0-9])${alias}($|[^A-Z0-9])`).test(normalized)
 ));
}
/* Entrada de TODOS los eventos del live. Los chats del mismo usuario se limitan a 1 cada 8 s (anti-repeticion) */
function handleLiveEntry(entry){
 if(!entry||!['member','chat','gift','like','follow','share'].includes(entry.type))return;
 const user=String(entry.username||'').trim().toLowerCase();
 const key=user||`anonymous-${Math.random()}`;
 let team=entry.type==='chat'?findTeam(entry.content): -1;
 if(team>=0&&user){picks.set(key,team);recentChatPicks.set(key,{team,t:Date.now()})}
 if(entry.type==='gift')team=recentChatTeam(key);
 /* Sin pais del duelo (ni comentado ahora ni elegido antes): NO mueve la carrera, solo queda en las estadisticas */
 if(team<0&&entry.type!=='gift')team=picks.has(key)?picks.get(key):-1;
 if(entry.type==='member')return;
 /* CLUSS: sin nombrar un club en el chat NO se participa (ni siquiera con likes) */
 if(team<0)return;
 if(entry.type==='chat'){
  const now=Date.now();
  if(now-(lastChat.get(key)||0)<8000)return;
  lastChat.set(key,now);
 }
 const type=entry.type; /* share tiene su propio valor (5 rayos) */
 const rawCount=Number(entry.activityCount);
 const count=type==='gift'||type==='like'
  ?Number.isFinite(rawCount)&&rawCount>0?Math.floor(rawCount):1
  :1;
 push(team,type,count);
}
/* Pinta el estado de conexion (verde conectado, naranja conectando, rojo sin conexion). Lo llaman los mensajes SSE "status" */
function setConnection(status){
 const el=$('#connection'),connected=Boolean(status.connected||status.isConnected);
 el.classList.toggle('connected',connected);
 el.classList.toggle('connecting',!connected&&['connecting','reconnecting'].includes(status.status));
 el.setAttribute('aria-label',`${USER}: ${connected?'en vivo':status.status==='failed'?'sin conexión':'conectando'}`);
}

source.onerror=()=>setConnection({connected:false,status:'reconnecting'});

 if(!response.ok&&response.status!==409){
  const result=await response.json();
  throw new Error(result.message||'No se pudo iniciar la conexión de TikTok.');
 }
}).catch(error=>{
 setConnection({connected:false,status:'failed'});
 console.error(error);

 S.forEach((s,i)=>{if(s.p<PASSIVE_CAP){s.p=Math.min(PASSIVE_CAP,s.p+100/RACE_SECONDS*sp[i]*dt);walk(i)}}); /* avance pasivo con tope */
 lead=update();

 if(w>=0)win(w);
},250);

window.tortugas={push:(team,type,n)=>push(typeof team==='number'?team:T.findIndex(t=>t.id===team),type,n),reset};
update();

/* ===== AUDIO (WebAudio sintetizado, sin archivos externos) ===== */
const A=(()=>{
 let c,mg,sg,nb,tm=null,nx=0,st=0,inten=0;
 const N=m=>440*Math.pow(2,(m-69)/12),run=()=>c&&c.state==='running';
 function vol(){const t=c.currentTime;[mg.gain,sg.gain].forEach(g=>g.cancelScheduledValues(t));mg.gain.setValueAtTime(P.mus?.2:0,t);sg.gain.setValueAtTime(P.sfx?.6:0,t)}
 function init(){

  try{c=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}
  const lim=c.createDynamicsCompressor();mg=c.createGain();sg=c.createGain();
  mg.connect(lim);sg.connect(lim);lim.connect(c.destination);vol();
  nb=c.createBuffer(1,c.sampleRate,c.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  c.onstatechange=sync;sync();return c;
 }
 function sync(){
  if(run()){if(!tm){nx=c.currentTime+.1;tm=setInterval(sched,100)}}
  else if(tm){clearInterval(tm);tm=null}

 }
 function ui(){
  const b1=$('#bMus'),b2=$('#bSfx');

  const need=(P.mus||P.sfx)&&!run();b1.classList.toggle('hint',need);b1.title=need?'Toca para activar el sonido':'Música';

 function o(f,t,d,ty,v,dst,sl){const x=c.createOscillator(),g=c.createGain();x.type=ty||'sine';x.frequency.setValueAtTime(f,t);if(sl)x.frequency.exponentialRampToValueAtTime(sl,t+d);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);x.connect(g);g.connect(dst||sg);x.start(t);x.stop(t+d+.05)}
 function nz(t,d,v,hp,dst){const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=nb;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(dst||sg);s.start(t);s.stop(t+d+.05)}
 const CH=[[48,[0,4,7]],[55,[0,4,7]],[57,[0,3,7]],[53,[0,4,7]]];
 function play(s,t){
  const [r,iv]=CH[(s>>3)&3],k=s&7;
  if(k%4===0)o(150,t,.18,'sine',.9,mg,45);
  if(k%2)nz(t,.05,inten>.5?.22:.12,6000,mg);
  if(inten>.75&&(k===2||k===6))nz(t,.12,.25,1500,mg);
  if([0,3,4,7].includes(k))o(N(r-12+(k===3?12:0)),t,.22,'triangle',.55,mg);
  o(N(r+12+iv[(k*2)%3]+(k>3?12:0)),t,.18,'square',.06+.05*inten,mg);
  if(inten>.4&&k%2===0)o(N(r+24+iv[k%3]),t,.14,'sine',.16,mg);
 }
 function sched(){while(nx<c.currentTime+.3){play(st,nx);nx+=60/(112+inten*30)/2;st++}}
 const F={
  tap:(t,n)=>o(N(72+[0,2,4,7,9][n%5]+12*Math.min(2,Math.floor(n/5))),t,.12,'triangle',.45),
  like:t=>o(660,t,.1,'triangle',.35,sg,990),
  follow:t=>{o(660,t,.12,'sine',.4);o(990,t+.1,.22,'sine',.4)},
  gift:t=>[523,659,784,1047,1319].forEach((f,i)=>o(f,t+i*.06,.3,'triangle',.3)),
  chat:t=>o(900,t,.05,'sine',.12),
  sel:t=>{o(400,t,.05,'square',.15);o(600,t+.05,.07,'square',.15)},
  cool:t=>o(1300,t,.04,'square',.08),
  combo:(t,m)=>[0,4,7,12].slice(0,m+1).forEach((s,i)=>o(N(72+s),t+i*.06,.2,'square',.2)),
  break:t=>o(330,t,.4,'sawtooth',.18,sg,70),
  lead:t=>{o(250,t,.3,'sawtooth',.1,sg,1100);o(784,t+.2,.15,'triangle',.3);o(1047,t+.3,.25,'triangle',.3)},
  beep:(t,n)=>o(n%2?880:1175,t,.12,'square',.14),
  win:t=>{[523,523,523,659,784,1047].forEach((f,i)=>o(f,t+i*.14+(i>2?.1:0),.3,'square',.25));nz(t+.9,.6,.2,3000)},
  lvl:t=>[392,523,659,784,1047].forEach((f,i)=>o(f,t+i*.08,.25,'triangle',.3)),
  ach:t=>{o(1568,t,.5,'sine',.3);o(2093,t+.1,.6,'sine',.25)},
  on:t=>{o(523,t,.1,'sine',.3);o(784,t+.1,.2,'sine',.3)},
  off:t=>{o(400,t,.15,'sine',.3);o(260,t+.15,.3,'sine',.3)},
  start:t=>{for(let i=0;i<3;i++)o(440,t+i*.25,.12,'square',.2);o(880,t+.75,.35,'square',.22)}

  unlock(){const x=init();if(x&&x.state==='suspended')x.resume().catch(()=>{})},

<script>

function P(o){return Object.assign({x:208,y:320,vx:0,vy:0,g:520,drag:.6,life:1.6,age:0,s:7,rot:0,vr:0,col:'#fff',shape:'r',flut:0,fp:rnd(0,6.28),fade:.35,ch:''},o)}

 const dt=Math.min(.05,(t-lastT)/1000);lastT=t;
 cx.clearRect(0,0,416,640);
 for(let i=PS.length-1;i>=0;i--){
  const p=PS[i];p.age+=dt;
  if(p.age>=p.life||p.y>700){PS.splice(i,1);continue}
  const d=Math.max(0,1-p.drag*dt);p.vx*=d;p.vy=p.vy*d+p.g*dt;
  p.x+=p.vx*dt+(p.flut?Math.sin(p.age*6+p.fp)*p.flut*dt:0);p.y+=p.vy*dt;p.rot+=p.vr*dt;
  const left=p.life-p.age,al=left<p.fade?Math.max(0,left/p.fade):1;
  cx.globalAlpha=al;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);

}

}

 for(let i=0;i<q(n);i++)setTimeout(()=>add(P({x:rnd(0,416),y:-12,vx:rnd(-25,25),vy:rnd(40,120),g:rnd(70,150),drag:.2,life:rnd(3,5),s:rnd(6,11),rot:rnd(0,6),vr:rnd(-8,8),col:pick(cols||COLS),shape:pick(['r','r','s','c']),flut:rnd(30,70),fade:.5})),rnd(0,dur||1200));
}

  add(P({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:240,drag:1.6,life:rnd(.6,1.1),s:rnd(3,6),col:col||'#ffd34d',shape:pick(['c','s','l']),rot:rnd(0,6),vr:rnd(-8,8)}))}
}
function emojis(x,y,ch,n,spread){
 for(let i=0;i<q(n);i++)add(P({x:x+rnd(-(spread||10),spread||10),y,vx:rnd(-40,40),vy:rnd(-150,-80),g:-30,drag:.8,life:rnd(1,1.7),s:rnd(14,22),shape:'e',ch,flut:rnd(15,35),fade:.5}));
}

  add(P({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:140,drag:1.9,life:rnd(.9,1.5),s:rnd(3,5),col:pick(cs),shape:'c'}))}

/* ---------- Sonido propio (WebAudio sintetizado). Respeta el boton 🔊 ---------- */
const FA=(()=>{
 let c,mg,nb;
 const sfxOn=()=>{const b=document.getElementById('bSfx');return !b||b.getAttribute('aria-pressed')!=='false'};
 const run=()=>c&&c.state==='running'&&sfxOn();

  try{c=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}
  const lim=c.createDynamicsCompressor();mg=c.createGain();mg.gain.value=.55;mg.connect(lim);lim.connect(c.destination);
  nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;

  const x=c.createOscillator(),g=c.createGain();x.type=ty||'sine';x.frequency.setValueAtTime(f,t);if(sl)x.frequency.exponentialRampToValueAtTime(sl,t+d);

  let out=g;if(fl){const f1=c.createBiquadFilter();f1.type='lowpass';f1.frequency.setValueAtTime(fl,t);f1.frequency.exponentialRampToValueAtTime(Math.max(200,fl*.3),t+d);x.connect(f1);f1.connect(g)}else x.connect(g);
  g.connect(mg);x.start(t);x.stop(t+d+.05);

 function nz(t,d,v,ty,f,f2,atk){
  const s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();s.buffer=nb;s.loop=true;
  fl.type=ty;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);fl.Q.value=ty==='bandpass'?1.2:.7;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+(atk||.005));g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(fl);fl.connect(g);g.connect(mg);s.start(t,Math.random());s.stop(t+d+.05);
 }
 const N=m=>440*Math.pow(2,(m-69)/12);
 /* trompeta: sierra con filtro que abre y cierra */
 const brass=(m,t,d,v)=>{o(N(m),t,d,'sawtooth',v,0,2600);o(N(m)*1.005,t,d,'square',v*.4,0,1800)};
 const S={
  pop:t=>{nz(t,.09,.35,'bandpass',2400,900);o(300,t,.08,'sine',.3,90)},
  whoosh:t=>nz(t,.45,.22,'bandpass',500,4200,.18),
  tick:t=>{o(1200,t,.05,'square',.12);nz(t,.03,.1,'highpass',5000)},
  go:t=>{o(660,t,.28,'square',.2,0,3000);o(990,t,.3,'triangle',.22);nz(t,.5,.18,'bandpass',900,5000,.1)},
  mile:t=>{o(N(76),t,.12,'triangle',.28);o(N(83),t+.09,.2,'triangle',.28)},
  lead:t=>{nz(t,.35,.18,'bandpass',600,3500,.12);o(N(72),t+.05,.1,'triangle',.25);o(N(79),t+.13,.18,'triangle',.25)},
  comeback:t=>{o(220,t,.5,'sawtooth',.14,880,2200);[67,71,74,79].forEach((m,i)=>o(N(m),t+.3+i*.07,.3,'triangle',.28))},
  close:t=>{[0,.16,.32].forEach(d=>o(N(60),t+d,.1,'square',.12));o(N(72),t+.5,.3,'square',.16)},
  heart:t=>{[84,88,91,96].forEach((m,i)=>o(N(m),t+i*.05,.28,'sine',.3))},
  turbo:t=>{o(120,t,.6,'sawtooth',.2,700,1500);nz(t,.6,.2,'bandpass',300,3000,.3)},
  /* cohete: ignicion, motor que sube de tono, estela de ruido y chispas al final */
  rocket:t=>{
   nz(t,.12,.4,'highpass',2500,6000);o(70,t,.15,'square',.3,40);
   o(80,t+.08,1.3,'sawtooth',.3,900,1800);o(160,t+.08,1.3,'square',.16,1400,2200);
   nz(t+.05,1.4,.38,'lowpass',400,4200,.15);nz(t+.15,1.2,.22,'bandpass',900,6000,.3);
   [0,.07,.14,.21].forEach((d,i)=>o(N(84+i*4),t+1+d,.3,'sine',.16));
  },
  star:t=>{[96,100,103,108].forEach((m,i)=>o(N(m),t+i*.04,.35,'sine',.16))},
  boom:t=>{o(130,t,.5,'sine',.5,35);nz(t,.35,.28,'lowpass',900,150)},
  crack:t=>{nz(t,.25,.2,'highpass',3000,9000);[0,.04,.09].forEach(d=>o(rnd(1800,3200),t+d,.06,'sine',.08))},
  cheer:(t,v)=>{nz(t,2.2,(v||.22),'bandpass',1400,900,.5);nz(t,2.2,(v||.22)*.7,'bandpass',2600,1800,.7)},
  /* fanfarria de victoria: sol-do-mi-sol con acorde final y aplausos */
  win:t=>{
   [[67,0,.13],[72,.14,.13],[76,.28,.13],[79,.42,.55]].forEach(([m,d,l])=>brass(m,t+d,l,.2));
   [[79,.42],[76,.42],[72,.42],[84,.8]].forEach(([m,d])=>brass(m,t+d,.9,.17));
   o(N(48),t+.42,1.1,'triangle',.4);nz(t+.4,.5,.2,'highpass',5000,9000);
   for(let i=0;i<14;i++)nz(t+1+i*.09+rnd(0,.05),.05,.18,'bandpass',rnd(1200,3500));
   S.cheer(t+.5,.2);
  },
  /* campeon del torneo: fanfarria larga, cascada brillante y fuegos artificiales */
  champ:t=>{
   const m=[[60,0],[64,.12],[67,.24],[72,.36],[76,.5],[79,.64],[84,.8]];
   m.forEach(([n,d],i)=>brass(n,t+d,i===6?1.3:.16,.2));

   o(N(36),t+.8,1.6,'triangle',.45);S.cheer(t+.6,.26);
   for(let i=0;i<10;i++)o(N(84+[0,4,7,12][i%4]+(i>3?12:0)),t+1.5+i*.08,.45,'sine',.14);
   [1.2,1.9,2.6,3.3].forEach(d=>{S.boom(t+d);S.crack(t+d+.15)});
  }

 return{init,unlock(){const x=init();if(x&&x.state==='suspended')x.resume().catch(()=>{})},
  p(n,delay){if(!c||!sfxOn())return;const go=()=>{try{S[n](c.currentTime+(delay||0.001))}catch(e){}};

  vis(v){if(c)(v?c.resume():c.suspend()).catch(()=>{})}};
})();

function wins(){try{return JSON.parse(localStorage.getItem('cluss.v1')||'{}').wins||[]}catch(e){return[]}}
const pips=[],pipN=[];
T.forEach((t,i)=>{const l=document.getElementById('ln'+i);if(!l)return;const e=document.createElement('span');e.className='fxp';e.setAttribute('aria-hidden','true');e.innerHTML='<i></i><i></i><i></i>';l.appendChild(e);pips[i]=e;pipN[i]=0});
function pipsSync(animate){
 const w=wins();T.forEach((t,i)=>{if(!pips[i])return;const n=Math.min(3,w[i]||0),els=pips[i].children;
  for(let k=0;k<3;k++){const f=k<n;els[k].classList.toggle('f',f);els[k].classList.remove('n');if(animate&&f&&k===n-1&&n>pipN[i]){void els[k].offsetWidth;els[k].classList.add('n')}}
  pipN[i]=n})}
pipsSync(false);

/* ---------- Estado de la ronda para los banners ---------- */
const mil=new Set();let maxDef=T.map(()=>0),closeShown=false,fxBot=false,lastSpark=0,lastM=1,prevLead=-1;
function roundReset(){mil.clear();maxDef=T.map(()=>0);closeShown=false;prevLead=-1}

/* ---------- ENGANCHES ---------- */
const _hle=handleLiveEntry;
handleLiveEntry=function(e){fxBot=!!(e&&e.bot);try{_hle(e)}finally{fxBot=false}};

const _push=push;
push=function(i,type,n,m){
 const was=over,l0=lead;
 _push.apply(this,arguments);
 if(was||over||i<0||!S[i])return; /* si esta jugada gano, win() ya hizo sus efectos */
 const lp=S.map(s=>s.p),mx=Math.max(...lp);
 /* chispas: toques manuales y eventos REALES (nunca del bot) */
 const now=performance.now();
 if(!fxBot&&now-lastSpark>110){
  lastSpark=now;const c=T[i].c,p=laneP(i,Math.max(.12,.84-S[i].p/100*.72));
  if(type==='like')emojis(p.x,p.y,'❤️',2,12);
  else if(type==='gift'){emojis(p.x,p.y,'🌹',6,16);burst(p.x,p.y,'#ff4d6d',14,150)} /* reaccion a regalo real; ROSITA manual no pasa por aqui */
  else if(type==='share'){burst(p.x,p.y,'#5ee08a',14,150);emojis(p.x,p.y,'↗️',2,10)}
  else if(type==='follow'){burst(p.x,p.y,'#5ec3f2',14,150);emojis(p.x,p.y,'⭐',3,12)}
  else if(type==='chat'){burst(p.x,p.y,c,8,110)}
 }
 /* remontada y cambio de lider */
 S.forEach((s,j)=>{const d=Math.max(...lp.filter((_,k)=>k!==j))-s.p;if(d>maxDef[j])maxDef[j]=d});
 if(lead!==l0&&lead>=0&&l0>=0){
  if(maxDef[lead]>=18&&mx>=30){banner('¡REMONTADA DE '+T[lead].n+'!',T[lead].c);FA.p('comeback');const p=laneP(lead,.4);burst(p.x,p.y,T[lead].c,30,220);ring(p.x,p.y,T[lead].c);maxDef[lead]=0}
  else if(mx>=15){FA.p('lead');const p=laneP(lead,.4);ring(p.x,p.y,T[lead].c)}
 }
 /* hitos de la pista */
 [[25,'¡UN CUARTO DE PISTA!'],[50,'¡MITAD DE PISTA!'],[75,'¡TRES CUARTOS!']].forEach(([v,t])=>{if(mx>=v&&!mil.has(v)){mil.add(v);banner(t,T[lead>=0?lead:i].c);FA.p('mile');const p=laneP(i,.3);burst(p.x,p.y,T[i].c,20,170)}});
 /* carrera pareja en la parte alta */
 if(!closeShown&&mx>=60&&mx<95){const s=[...lp].sort((a,b)=>b-a);if(s.length>1&&s[0]-s[1]<=4){closeShown=true;banner('¡CARRERA PAREJA!','#e11d48');FA.p('close')}}
};

const _win=win;
win=function(i){
 const first=!over,ps=S.map(s=>s.p);_win(i);
 if(!first)return;
 clearTimeout(bt);bs.forEach(x=>x.classList.remove('on')); /* el banner de hito no tapa la pantalla de ganador */
 const rest=Math.max(...ps.filter((_,j)=>j!==i)),photo=Math.min(100,ps[i])-rest<=3;
 const c=T[i].c,p=laneP(i,.35);
 pipsSync(true);
 const h=document.querySelector('#win h2'),champ=!!(h&&/CAMPE/i.test(h.textContent));
 flash(champ?'#ffe9a8':'#fff');ring(p.x,p.y,c);setTimeout(()=>ring(p.x,p.y,'#fff'),180);
 burst(p.x,p.y,c,40,260);
 cannon(0,640,-62,champ?60:36,820,16);cannon(416,640,-118,champ?60:36,820,16);rain(champ?80:46,null,1500);
 if(photo&&!champ){setTimeout(()=>banner('¡FOTO FINISH!','#e11d48'),400)}
 if(champ){
  FA.p('champ');
  [[.5,.3],[.2,.42],[.8,.38],[.35,.2],[.7,.24],[.5,.5]].forEach(([fx,fy],k)=>setTimeout(()=>{firework(fx*416,fy*640,k%2?c:null)},700+k*620));
  setTimeout(()=>rain(60,['#ffd34d','#fff','#ff8a1f'],2500),1800);
 }else{
  FA.p('win');[.35,.9,1.4].forEach(d=>setTimeout(()=>{cannon(rnd(60,356),rnd(300,420),-90,12,420,40)},d*1000));
 }
 FA.p('star',.9);
};

const _reset=reset;
reset=function(){
 const had=!!document.querySelector('#win.show');
 _reset.apply(this,arguments);
 roundReset();lastM=1;PS.length=0;
 pipsSync(false);
 /* cuenta regresiva visual de 1.6 s (no bloquea el juego ni pide nada) */
 if(had&&!RM){[['3',0],['2',.4],['1',.8]].forEach(([t,d])=>setTimeout(()=>{if(!over){num(t);FA.p('tick')}},d*1000));setTimeout(()=>{if(!over){num('¡YA!',1);FA.p('go');flash('#ffd34d');T.forEach((_,k)=>{const p=laneP(k,.8);burst(p.x,p.y,T[k].c,16,160)})}},1200)}
 else if(had){banner('¡YA!','#3ddc5a')}
};

/* Combo: estallido al subir de nivel */
const _sc=showCombo;
showCombo=function(){
 _sc.apply(this,arguments);
 const m=mult();
 if(m>lastM&&!over){const p=pos(document.getElementById('combo'),.5,.5);burst(p.x,p.y,m===3?'#ff8a1f':'#ffd34d',m===3?34:20,200);if(m===3){flash('#ffb347');FA.p('star')}}
 lastM=m;
};

/* ROSITA manual (fuego, no regalo) y toques manuales */
document.querySelectorAll('.cta').forEach(b=>b.addEventListener('click',()=>{
 if(over||b.classList.contains('cool'))return;
 if(b.dataset.t==='gift'){const p=laneP(sel,.7);emojis(p.x,p.y,'🔥',8,16);emojis(p.x,p.y,'🚀',3,10);burst(p.x,p.y,'#ff8a1f',24,220);ring(p.x,p.y,'#5b8cff');FA.p('rocket')}
},true));

/* Observador de clases: corazon lleno, turbo activado, tortuga lider */
if(window.MutationObserver){
 new MutationObserver(ms=>ms.forEach(m=>{
  const el=m.target,was=(m.oldValue||'').split(/\s+/),has=el.classList;
  if(el.classList.contains('hb')&&has.contains('full')&&!was.includes('full')){
   const p=pos(el,.5,.5);burst(p.x,p.y,'#ff5a7a',26,200);emojis(p.x,p.y,'❤️',6,14);FA.p('heart')}
  if(el.classList.contains('lane')&&has.contains('turbo')&&!was.includes('turbo')){
   const k=T.findIndex((_,j)=>el.id==='ln'+j);if(k>=0){const p=laneP(k,.7);burst(p.x,p.y,'#ff8a1f',22,230);ring(p.x,p.y,'#ff8a1f')}}
 })).observe(document.getElementById('lanes'),{attributes:true,attributeFilter:['class'],attributeOldValue:true,subtree:true});
}

/* Recta final: rugido de la hinchada una sola vez por ronda */
let sprintHeard=false;
setInterval(()=>{
 const sp=app.classList.contains('sprint');
 if(sp&&!sprintHeard){sprintHeard=true;FA.p('cheer');FA.p('whoosh')}
 if(!sp&&!over)sprintHeard=false;
},400);

/* API para pruebas por consola: fx.confetti(), fx.champion(), fx.banner('texto') */
window.fx={confetti(){cannon(0,640,-62,40,820,16);cannon(416,640,-118,40,820,16);rain(40);FA.p('win')},
 champion(){[[.5,.3],[.2,.42],[.8,.38]].forEach(([x,y],k)=>setTimeout(()=>firework(x*416,y*640),k*500));FA.p('champ')},
 banner};
})();
</script>
</body>
</html>
