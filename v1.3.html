        /* Franja de estado: versión + conexión, a la izquierda, sobre el chat de TikTok pero fuera de él */
        html body #versionBadge,
        html body #connectorStatus{
          bottom: calc(var(--bot) + var(--safe-b) + 0.15rem);
          min-height: 1.6rem;
          display: flex;
          align-items: center;
        }
        html body #versionBadge{ left: var(--padl); padding: 0.2rem 0.5rem; font-size: 0.55rem; opacity: 0.8; }
        html body #connectorStatus{
          left: calc(var(--padl) + 3rem);
          right: auto;
          padding: 0.2rem 0.8rem;
          font-size: 0.72rem;
          max-width: calc(100vw - var(--padl) - 3rem - var(--padr) - 0.8rem);
        }
      }
      @media (prefers-reduced-motion: reduce){
        #lanes .fl .cloth, #metaBanner, #hype u::before{ animation: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="fx"></canvas>

    <div id="app">
      <div id="lanes"><div id="metaBanner" aria-hidden="true"><span>¡META!</span></div></div>
    </div>
    <div id="vig"></div>
    <span id="versionBadge" aria-label="Versión 1.6">v1.6</span>
    <button id="connectorStatus" class="disconnected" type="button" aria-live="polite">
      Conectando…
    </button>
    <div id="cd" aria-live="assertive"><div class="cdn" id="cdn"></div></div>
    <div id="winner"aria-live="polite">
      <div class="wbox">
        <div class="wttl">🏆 PODIO DE INTERACCIONES</div>
        <div class="wav"><img id="wImg" alt="" referrerpolicy="no-referrer" /><b id="wIni"></b></div>
        <div class="wnm" id="wNm"></div>
        <div class="wfl"><img id="wFl" alt="" /><span id="wCt"></span></div>
        <div class="wxtra" id="wXtra"></div>
        <div class="wtop" id="wTop" hidden>
          <div class="wtop-title">🏅 MÁS INTERACCIONES</div>
          <div class="wtop-first" id="wTopFirst"></div>
          <div class="wtop-pair" id="wTopPair"></div>
        </div>
      </div>
    </div>
    <div id="snd">🔇 Toca la pantalla para activar el sonido</div>
    <div id="cta" aria-hidden="true"></div>
    <div id="cast" aria-live="polite" data-mood="idle">
      <div class="cav">
        <div class="cvid" id="cvid"></div>
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <linearGradient id="castBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b6f78"/><stop offset="1" stop-color="#0d3a41"/></linearGradient>
            <radialGradient id="castFur" cx=".4" cy=".3" r=".85"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eadfd2"/></radialGradient>
          </defs>
          <rect width="100" height="100" fill="url(#castBg)"/>
          <!-- orejas largas (detrás de la cabeza) -->
          <g transform="rotate(-9 38 44)"><ellipse cx="37" cy="25" rx="9" ry="21" fill="url(#castFur)" stroke="#c9b9a6" stroke-width="1"/><ellipse cx="37" cy="27" rx="4.4" ry="15.5" fill="#ffb3c7"/></g>
          <g transform="rotate(9 62 44)"><ellipse cx="63" cy="25" rx="9" ry="21" fill="url(#castFur)" stroke="#c9b9a6" stroke-width="1"/><ellipse cx="63" cy="27" rx="4.4" ry="15.5" fill="#ffb3c7"/></g>
          <!-- cuerpo: suéter rosa con cuello crema -->
          <path d="M14 100 Q18 78 50 75 Q82 78 86 100 Z" fill="#ff3d7f"/>
          <path d="M42 74 L50 88 L58 74 Z" fill="#fff6e0"/>
          <!-- cabeza y hocico -->
          <ellipse cx="50" cy="54" rx="26" ry="23.5" fill="url(#castFur)" stroke="#c9b9a6" stroke-width="1"/>
          <ellipse cx="50" cy="64" rx="13.5" ry="10" fill="#fff"/>
          <!-- bigotes -->
          <g stroke="#b9a99a" stroke-width="1" stroke-linecap="round" fill="none"><path d="M36 61 L18 57"/><path d="M36 64 L17 65"/><path d="M36 67 L20 72"/><path d="M64 61 L82 57"/><path d="M64 64 L83 65"/><path d="M64 67 L80 72"/></g>
          <!-- mejillas -->
          <circle class="blush" cx="33" cy="58" r="4.2" fill="#ff8aa8"/>
          <circle class="blush" cx="67" cy="58" r="4.2" fill="#ff8aa8"/>
          <!-- cejas -->
          <path class="brow bl" d="M34 41 Q41 37.5 47 41" fill="none" stroke="#9a8672" stroke-width="2.2" stroke-linecap="round"/>
          <path class="brow br" d="M53 41 Q59 37.5 66 41" fill="none" stroke="#9a8672" stroke-width="2.2" stroke-linecap="round"/>
          <!-- ojos -->
          <g class="e-norm">
            <ellipse class="eye" cx="41" cy="50" rx="2.9" ry="3.8" fill="#1b1b1b"/>
            <ellipse class="eye" cx="59" cy="50" rx="2.9" ry="3.8" fill="#1b1b1b"/>
            <circle cx="42" cy="48.5" r="1" fill="#fff"/><circle cx="60" cy="48.5" r="1" fill="#fff"/>
          </g>
          <g class="e-happy" fill="none" stroke="#1b1b1b" stroke-width="2.8" stroke-linecap="round">
            <path d="M35.5 52 Q41 44.5 46.5 52"/>
            <path d="M53.5 52 Q59 44.5 64.5 52"/>
          </g>

    <script>
      /*
       * CONTRATO DE EVENTOS
       * TikTok LIVE -> tiktok-live-connector -> server.js -> SSE /api/events -> overlay.
       * El backend normaliza username, avatar, contadores y etiquetas.
       *
       * chat: el texto selecciona un país y suma puntos, con límite por usuario.
       * gift: suma diamondCount x activityCount; groupId evita contar dos veces un combo.
       * like, follow y share: apoyan el país que el usuario ya seleccionó.
       * join: participante automático; ?join=0 lo desactiva.
       *
       * Contrato: type, username, content, avatar, activityCount, diamondCount.
       * Tipos admitidos: chat, gift, like, follow, share y join. No enviar roomUser:
       * los cambios de audiencia no son eventos de juego.
       *
       * El overlay consume SSE por defecto. Un WebSocket externo es opcional con ?ws=URL.
       * ?target=40 define la meta individual.
       * Las tortugas avanzan lentamente si ningún espectador elige un país.
       * No se generan eventos de audiencia ni interacciones automáticas.
       * El panel de pruebas manual se abre con P o ?panel=1.
       */

      const Q = new URLSearchParams(location.search);
      /* ===== IDIOMA: inglés por defecto. Ya no hay botón de idioma: se elige con ?lang=es o ?lang=en.
         ?lang=es lo abre en español. tr(es, en) devuelve el texto del idioma activo. ===== */
      let LANG = "en";
      try {
        const sv = Q.get("lang"); /* siempre inicia en inglés; solo ?lang=es lo abre en español (no se recuerda el idioma anterior) */
        if (sv === "en" || sv === "es") LANG = sv;
      } catch {}
      const tr = (es, en) => (LANG === "en" ? en : es);
      const shownName = (u) => (String(u || "").trim().toLowerCase() === "alguien" ? tr("Alguien", "Someone") : u);
      /* Parámetros del juego y configuración de la pista. */
      /* DURACIÓN DEL JUEGO: TIME_X = 2 → la carrera dura el DOBLE. Todas las velocidades se dividen por TIME_X y cada evento
         avanza TIME_X veces menos pista (hacen falta el doble de eventos). ?time=1 vuelve a la duración anterior; ?time=3 la triplica. */
      const TIME_X = Math.max(0.5, +Q.get("time") || 2);
      const CFG = {
        ws: Q.get("ws") || "ws://localhost:8080",
        win: +Q.get("win") || 100,
        target: +Q.get("target") || 40,
        crawl: 0.15 / TIME_X,
        restartMs: 0,
        botSec: Math.max(20, +Q.get("bot") || 120) /* ritmo constante del bot de prueba (2 min por defecto) */,
        join: Q.has("join") ? +Q.get("join") : 0.5,
        countries: [0, 1, 2, 3, 4].map((i) => ({
          c: "s" + i,
          n: "",
          f: "",
          b: [],
        })),
      };
      /* VELOCIDADES (unidades de pista por segundo). El bot de prueba va a BOT_V constante y solo ocupa el último país.
         Las demás caminan a BASE_V y cada interacción las multiplica ×2 / ×5 / ×10 / ×20+ un rato (EV_BOOST = [multiplicador, segundos]). */
      const BOT_V = CFG.win / CFG.botSec,
        BASE_V = BOT_V * (Q.has("base") ? +Q.get("base") : 0.4);
      const EV_BOOST = {
        join: [2, 3],
        like: [5, 3],
        support: [2, 2],
        chat: [5, 4],
        share: [10, 5],
        follow: [10, 5],
        gift: [20, 6],
      };
      /* Los regalos escalan con su valor en diamantes (por unidad): 🌹 rosa ×20 · 💗 ×22 (≥5) · 🍩 dona ×25 (≥30) · 🌌 galaxia ×30 (≥500). */
      const GIFT_TIERS = [[500, 30], [30, 25], [5, 22], [0, 20]];
      const giftMult = (diamonds) => {
        const d = Number(diamonds) || 0;
        for (const [min, m] of GIFT_TIERS) if (d >= min) return m;

      })();
      const EN_NAMES = { BR: "Brazil", PY: "Paraguay", AR: "Argentina", DE: "Germany", FR: "France", IT: "Italy", UY: "Uruguay", ES: "Spain", ENG: "England", PT: "Portugal", MX: "Mexico", CO: "Colombia", CL: "Chile", JP: "Japan", KR: "South Korea", US: "United States", MA: "Morocco", HR: "Croatia", NG: "Nigeria", SN: "Senegal", BE: "Belgium" };
      NATIONS.forEach((team) => {
        const es = team.n, en = EN_NAMES[team.code] || es;
        team.es = es;
        team.en = en;
        Object.defineProperty(team, "n", { get: () => (LANG === "en" ? en : es), enumerable: true, configurable: true });
      });
      const FIXED_TEAMS = NATIONS.filter((team) =>
        ["BR", "PY", "AR"].includes(team.code),
      );
      const FIXED_CODES = FIXED_TEAMS.map((team) => team.code);
      const WORLD_CUP_WINNERS = NATIONS.filter((team) =>
        ["BR", "AR", "DE", "FR", "IT", "UY", "ES", "ENG"].includes(team.code),
      );
      const POPULAR_COUNTRIES = [
        "PT",
        "MX",
        "CO",
        "CL",
        "JP",
        "KR",
        "US",
        "MA",
        "HR",
        "NG",
        "SN",
        "BE",
      ];
      const ROUND_POOL = [
        ...WORLD_CUP_WINNERS,
        ...NATIONS.filter((team) => POPULAR_COUNTRIES.includes(team.code)),
      ];
      function shuffled(items) {
        const result = [...items];
        for (let i = result.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [result[i], result[j]] = [result[j], result[i]];
        }
        return result;
      }
      /* 5 tortugas: BR, PY y AR son fijos (en orden aleatorio) y 2 países más se sortean. */
      function chooseRoundTeams() {
        const fixed = shuffled(FIXED_TEAMS);
        const candidates = ROUND_POOL.filter(
          (team) => !FIXED_CODES.includes(team.code),
        );
        return [...fixed, ...shuffled(candidates).slice(0, 2)];
      }
      NATIONS.splice(0, NATIONS.length, ...chooseRoundTeams());
      let CODES = NATIONS.map((team) => team.code);
      function setRoundTeams() {
        const teams = chooseRoundTeams();
        NATIONS.splice(0, NATIONS.length, ...teams);

          const image = $("rk-" + lane.c).querySelector("img");
          image.alt = teams[index].n;
          image.src = teams[index].u;
          const flagImg = $("fl-" + lane.c) && $("fl-" + lane.c).querySelector("img");
          if (flagImg) {
            flagImg.alt = teams[index].n;
            flagImg.src = teams[index].u;
          }
        });
      }
      function nat(p) {
        const c = S.slotOf.get(p.key);
        if (c) {
          const i = C.findIndex((x) => x.c === c);
          if (i >= 0) return NATIONS[i];
        }
        return (p.nation ||= ROUND_POOL[(p.sequence || 0) % ROUND_POOL.length]);
      }
      /* ESTADO GLOBAL de la partida (todo en memoria; solo "wins" se guarda en localStorage)

     boost    timestamp (ms) hasta el que dura el empuje doble (0 = sin empuje doble)
     pos      posición de cada país 0..win      teamActions acciones válidas que recibió cada país en la ronda
     wins     victorias acumuladas              fans     cuántos usuarios eligieron cada país
     pick     Map usuario -> código de país     donors   Map usuario -> {name,code,pts,best} (ranking de la ronda)
     combo    Map usuario -> {n,t} (racha de regalos)
     cp       quién tomó cada lechuga (25/50/75)   pf  foto finish ya anunciado
     streak/lastWin  racha de victorias del mismo país    dirty  hay que redibujar el ranking */
      const S = {

        round: 0,
        over: false,
        go: false,

      };

      const LS = "tortugas.wins2",
        winsBy = new Map();

        for (const [k, v] of Object.entries(
          JSON.parse(localStorage.getItem(LS) || "{}"),

      } catch {}
      const saveWins = () => {
        try {
          localStorage.setItem(LS, JSON.stringify(Object.fromEntries([...winsBy].filter(([k]) => !(window.SIMK && window.SIMK.has(k))))));  /* las victorias de bots simulados no se guardan */

      };
      if (Q.get("top"))
        document.documentElement.style.setProperty(
          "--top",

        );
      if (Q.get("bottom"))
        document.documentElement.style.setProperty(
          "--bot",
          +Q.get("bottom") + "%",
        );

      /* ===== Sonido retro (chiptune 8-bit) =====
   Todo se genera con WebAudio: no hay archivos de audio. Ondas cuadradas y de pulso, bajo triangular y percusión de ruido.
   La música solo suena durante la carrera y se acelera cuando la punta se acerca a la meta. */
      let SND = Q.get("sound") !== "0",
        MUSIC = Q.get("music") !== "0",
        AC = null,
        MG = null,
        SG = null,
        GG = null,
        W25 = null,
        NB = null;
      function ac() {
        if (AC) return AC;
        try {
          AC = new (window.AudioContext || window.webkitAudioContext)();
          MG = AC.createGain();
          MG.gain.value = Math.min(1, +Q.get("vol") || 0.9);
          const LIM = AC.createDynamicsCompressor(); /* evita saturación al subir el volumen */
          LIM.connect(AC.destination);
          MG.connect(LIM);
          SG = AC.createGain();

      /* La tortuga ocupa aproximadamente el alto de su carril y nunca más del 34 % del ancho. */
      function fitTurtles() {

      /* ===== Confeti ===== */
      const cv = $("fx"),
        cx = cv.getContext("2d");
      let ps = [],
        run = false;
      function size() {
        cv.width = innerWidth;
        cv.height = innerHeight;
      }
      addEventListener("resize", size);
      size();
      /* Generador común de confeti. o = {x, y (funciones), vx, vy, vy0, r, r0}: dispersión y tamaño de las partículas */
      function spawnConfetti(n, gold, o) {
        const cols = gold
          ? ["#FFC93C", "#FFE27A", "#FFF6E0"]
          : ["#FF3D7F", "#5CF2C0", "#FFC93C", "#FFF6E0"];
        for (let i = 0; i < n; i++)
          ps.push({
            x: o.x(),
            y: o.y(),
            vx: (Math.random() - 0.5) * o.vx,
            vy: -Math.random() * o.vy - o.vy0,
            r: Math.random() * o.r + o.r0,
            c: cols[i % cols.length],
            a: Math.random() * 6,
            va: (Math.random() - 0.5) * 0.4,
            l: 1,
          });
        if (!run) {
          run = true;
          requestAnimationFrame(tick);
        }
      }
      /* Confeti de pantalla completa (festejo) */
      function burst(n, gold) {
        spawnConfetti(Math.min(n, 300), gold, {
          x: () => innerWidth * (0.2 + Math.random() * 0.6),
          y: () => innerHeight * 0.72,
          vx: 16, vy: 16, vy0: 4, r: 7, r0: 5,
        });
      }
      function tick() {
        cx.clearRect(0, 0, cv.width, cv.height);
        ps = ps.filter((p) => p.l > 0 && p.y < innerHeight + 30);
        for (const p of ps) {
          p.vy += 0.4;
          p.x += p.vx;
          p.y += p.vy;
          p.a += p.va;
          p.l -= 0.004;
          cx.save();
          cx.globalAlpha = Math.min(1, p.l * 2);
          cx.translate(p.x, p.y);
          cx.rotate(p.a);
          cx.fillStyle = p.c;
          cx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
          cx.restore();
        }
        if (ps.length) requestAnimationFrame(tick);
        else {
          run = false;
          cx.clearRect(0, 0, cv.width, cv.height);
        }
      }

      /* ===== Pantalla ===== */
      /* Jugador dueño de una tortuga (slot 's0'..'s4'), o null si el carril está libre */
      function slotPlayer(code) {
        const k = S.slotUser[code];
        return k ? contestants.get(k) : null;
      }
      /* Redibuja puesto, nombre, puntos, corona y estados (libre / ganador) de los 5 carriles. Se llama ~4 veces/seg. */
      /* El espectador elige un país (nombre, sigla o bandera en el chat); sin carril propio, su energía va a esa tortuga. */
      function registerPick(user, code) {
        S.pick.set(user, code);
      }
      function switchPlayerCountry(user, code) {
        const previous = S.slotOf.get(user);
        if (previous === code) return;
        const player = contestants.get(user);
        if (previous && S.slotUser[previous] === user) {
          delete S.slotUser[previous];

          setSlotAvatar(previous, null);
        }
        if (!S.slotUser[code] || S.slotUser[code] === user) {

          restartAnim(T[code].tur, "swap");

      }
      function render() {

          T[c.c].tw = p

      /* Adelantamientos: el carril que sube de puesto parpadea; si pasa al 1.º lugar suena el aviso y estalla confeti. */
      let lastRank = {};
      function highlightOvertakes(ord) {
        ord.forEach((c, i) => {
          const prev = lastRank[c.c];
          lastRank[c.c] = i;
          if (
            prev !== undefined &&
            i < prev &&
            slotPlayer(c.c) &&
            S.pos[c.c] > 3 &&
            Math.abs(S.pos[c.c] - S.pos[ord[i + 1] ? ord[i + 1].c : c.c]) > 0.3
          ) {

            restartAnim(l, "flash");

      /* Con el líder al 80 % o más (y carrera en curso) el botón de Rosita late. */
      setInterval(() => {
        const ct = $("cta");
        let m = -1;
        for (const c of C) if (S.slotUser[c.c] && S.pos[c.c] > m) m = S.pos[c.c];
        const live = !S.over && S.go;
        if (ct) {
          ct.classList.toggle("near", m >= 80 && live); /* regalo central y potenciadores pulsan */
          ct.classList.toggle("near2", m >= 92 && live); /* últimos metros: más rápido y más fuerte */

      }, 400);
      /* Tensión final: la primera vez por ronda que el líder pasa el 88 % suena un aviso y destella la pantalla. */
      function checkNearEnd() {
        if (S.nearEnd) return;
        let m = -1,
          lc = null;
        for (const c of C)
          if (S.slotUser[c.c] && S.pos[c.c] > m) {
            m = S.pos[c.c];

      /* Mantiene la bandera del país dentro del caparazón; el dueño no tapa la bandera con su avatar. */
      function setSlotAvatar(code, p) {
        const t = T[code],
          nn = NATIONS[C.findIndex((x) => x.c === code)];
        t.tur.classList.toggle("owned", !!p);
        if (nn && t.fg) t.fg.setAttribute("href", nn.u);
      }
      /* Las acciones no colocan avatares en el caparazón. */
      function setMain(code, p) {
        if (!T[code] || !p) return;
        setSlotAvatar(code, p);
      }
      /* Los participantes reales pueden ocupar carriles libres o reemplazar al de menor puntaje. */
      function claimSlot(p) {
        let code,
          lo = null;
        const preferred = S.pick.get(p.key),
          generated = !p.isBot && C.find((c) => {
            const occupant = slotPlayer(c.c);
            return occupant && occupant.isReplay;
          }),
          free =
            C.find((c) => c.c === preferred && !S.slotUser[c.c]) ||
            (!p.isBot && C.find((c) => !S.slotUser[c.c]));
        if (generated) {
          lo = { c: generated, o: slotPlayer(generated.c) };
          code = generated.c;
        } else if (free) code = free.c;
        else {
          if (p.isBot) return null;
          const bot = C.find((c) => {
            const occupant = slotPlayer(c.c);
            return occupant && occupant.isBot;
          });
          if (bot) {
            lo = { c: bot, o: slotPlayer(bot.c) };
            code = bot.c;
          } else {
            for (const c of C) {
              const o = slotPlayer(c.c);
              if (o && !o.tortubot && c.c !== S.winner && (!lo || o.points < lo.o.points))
                lo = { c, o };
            }
            if (!lo || p.points <= lo.o.points) return null;
            code = lo.c.c;
          }
        }
        if (lo) {
          S.slotOf.delete(lo.o.key);
          if (lo.o.isBot) {
            contestants.delete(lo.o.key);
            if (window.botKicked) window.botKicked(lo.o.key); /* se da de baja el bot y se detienen sus eventos */
          } else if (lo.o.isReplay) {
            contestants.delete(lo.o.key);
          }
        }
        if (lo) {
          T[code].pend = 0;
          T[code].ve = 0;
          T[code].cr = 0;
          T[code].vs = 0;
        }
        S.slotUser[code] = p.key;
        S.slotOf.set(p.key, code);
        setMain(code, p);
        const el = T[code].tur;
        restartAnim(el, "swap");
        if (!p.isBot) SFX.join();
        return code;
      }
      /* Burbuja de evento SOBRE la tortuga (sigue a la tortuga mientras sube y se desvanece). Los likes se agrupan cada 0.45 s. */
      function evBadge(code, ty, entry) {
        const t = T[code];
        if (!t) return;
        t.lastEv = performance.now(); /* hubo interacción: deja de estar agotada */
        const show = (cls, icon) => {
          const old = t.trk.querySelectorAll(".evb");
          if (old.length >= 5) old[0].remove();
          const e = document.createElement("div");
          e.className = "evb disp " + cls;
          e.textContent = icon;
          e.style.setProperty("--o", (t.evo = ((t.evo || 0) + 1) % 3));
          e.style.setProperty(
            "--p",
            ((S.pos[code] / CFG.win) * 100).toFixed(2),
          );
          t.trk.append(e);
          setTimeout(() => e.remove(), 2300);
        };
        if (ty === "like") {
          t.lk = t.lk || { h: 0 };
          if (!t.lk.h)
            t.lk.h = setTimeout(() => {
              t.lk = { h: 0 };
              show("e-lk", "👍");
            }, 450);
          return;
        }
        if (ty === "gift") show("e-gf", "🎁");
        else if (ty === "chat") show("e-ch", "💬");
        else if (ty === "share") show("e-sh", "🔁");
        else if (ty === "follow") show("e-fo", "❤️");
        else if (ty === "join") show("e-jn", "👋");
        else if (ty === "support") show("e-ch", "💬");
      }
      /* Al llegar un regalo aparece un 🎁 delante de la tortuga y ella corre a recogerlo. */
      function putGiftAhead(code, entry) {
        const t = T[code],
          available = Math.max(0, CFG.win - 1 - S.pos[code]);
        if (!t || available <= 0) return;
        const distance = Math.min(
          available,
          Math.min(9, Math.max(3, t.pend * 0.6)),
        );
        if (distance <= 0) return;
        if (t.giftEl) t.giftEl.remove();
        t.giftTarget = S.pos[code] + distance;
        t.pend = Math.max(t.pend, distance + 0.8);
        const gift = document.createElement("span");
        gift.className = "gift-bait";
        gift.textContent = "🎁";
        gift.title = tr("Regalo para recoger", "Gift to pick up") + (entry.content ? ": " + entry.content : "");
        gift.setAttribute("aria-label", gift.title);
        gift.style.setProperty(
          "--p",
          ((t.giftTarget / CFG.win) * 100).toFixed(2),
        );
        t.trk.append(gift);
        t.giftEl = gift;
      }
      /* Un evento de un espectador (p) vale `points`: la tortuga camina hasta (puntos del dueño / CFG.target) * CFG.win.
         Si el espectador no tiene carril, su energía va a la tortuga del país que apoya. Añade efectos visuales y sonido. */
      const LEVELS = [10, 25, 50, 100, 200, 400];
      const INTERACTIONS_TO_WIN = 50;
      /* Cada acción de usuario deja el avatar anclado; los bots no generan avatares en la pista. */
      const ANCHOR_MAX = 120; /* tope de seguridad por carril: los avatares NO se borran hasta que termina la ronda */
      function avatarPop(code, p, mult) {
        const t = T[code];
        if (!t || !p || p.isBot || p.tortubot) return;
        const all = t.trk.querySelectorAll(".anchav");
        if (all.length >= ANCHOR_MAX) all[0].remove();
        const nn = NATIONS[C.findIndex((x) => x.c === code)],
          e = document.createElement("div"),
          ai = document.createElement("span");
        e.className = "anchav";
        e.dataset.u = p.key;
        e.style.setProperty("--nc", nn ? nn.c : "#0d3a41");
        e.style.setProperty("--ap", Math.min(100, S.pos[code]).toFixed(2));
        e.style.top = ((t.rtPx || 0) + GEO.th / 2).toFixed(1) + "px";
        ai.className = "ai";
        ai.textContent = p.isBot ? "🤖" : (p.username || "?").trim().charAt(0).toUpperCase() || "?";
        if (p.avatar) {

          im.referrerPolicy = "no-referrer";

          ai.append(im);
        }
        e.append(ai);
        if (mult > 1) {
          const m = document.createElement("small");
          m.textContent = "×" + mult;
          e.append(m);
        }
        t.trk.append(e);
      }
      /* Cada interacción acelera la tortuga de su usuario: ×2, ×5, ×10 o ×20 durante unos segundos (gana el mayor multiplicador activo). */
      function addBoost(code, ty, entry, p) {
        const t = T[code],
          b = EV_BOOST[ty] || [2, 2];
        let sec = b[1],
          m = b[0];
        if (ty === "gift") m = giftMult(entry.diamondCount);
        if (Date.now() < HY.until) m = +(m * 1.5).toFixed(1); /* FIEBRE: ×1.5 para todos */
        /* Los bots de prueba (los que dan el ejemplo) valen 4-6 veces menos que un usuario normal: su empuje extra se divide entre 4 y 6. */
        if (p && p.isBot) m = Math.max(1, +(1 + (m - 1) / (4 + Math.random() * 2)).toFixed(1));
        if (ty === "gift")
          sec += Math.min(6, (Math.max(1, Number(entry.diamondCount) || 1) * Math.max(1, Number(entry.activityCount) || 1)) / 50);
        t.boosts.push({ m, until: tNow + sec });
        t.lastM = m;
        if (t.boosts.length > 40) t.boosts.splice(0, t.boosts.length - 40);
        return { m, sec };

      /* ===== v67: FIEBRE ===== */
      const HYPE_GAIN = { chat: 4, join: 2, follow: 12, share: 10 };
      function hypePaint() {
        const box = $("hype");
        if (!box) return;
        const now = Date.now(),
          fev = now < HY.until,
          pct = Math.max(0, Math.min(100, Math.round(HY.v)));

        box.classList.toggle("hot", !fev && HY.v >= 75);
        const f = $("hypeF");
        f.style.width = (fev ? 100 : HY.v) + "%";
        /* el degradado verde ➔ dorado ➔ rosa abarca TODA la barra: el relleno solo lo descubre (en FIEBRE lo anima el CSS) */
        f.style.backgroundSize = fev ? "" : (HY.v > 1 ? (10000 / HY.v).toFixed(1) : 10000) + "% 100%";
        $("hypeT").textContent = fev
          ? "🔥 ¡FIEBRE! 100% · ×1.5 · " + Math.ceil((HY.until - now) / 1000) + "s"
          : "🔥 FIEBRE " + pct + "%" + (pct < 15 ? " · ¡comenta y da like!" : "");
      }
      function hypeAdd(entry, points, isBot) {
        if (!HY.on || S.over || !S.go || Date.now() < HY.until) return;
        let g = HYPE_GAIN[entry.type];
        if (entry.type === "like") g = Math.min(6, 0.6 * Math.max(1, Number(entry.activityCount) || 1));
        else if (entry.type === "gift") g = Math.min(45, 10 + points * 0.4);
        if (!g) return;
        HY.v = Math.min(100, HY.v + g * (isBot ? 0.25 : 1)); /* los bots de prueba cuentan 4 veces menos */
        if (HY.v >= 100) {
          HY.v = 0;
          HY.until = Date.now() + 10000;
          castMood("excited", 6000);
          screenFx(true);
          SFX.goal();
          burst(60, true);
        }
        hypePaint();
      }
      setInterval(() => {
        if (!HY.on) return;

        hypePaint();
      }, 500);
      /* Pista "escribe tu país": banderas de los carriles libres; se oculta cuando no quedan o termina la ronda. */
      let hintKey = "";
      function hintPaint() {
        const el = $("hint");
        if (!el) return;
        const free = [];
        C.forEach((c, i) => { if (NATIONS[i]) free.push(NATIONS[i]); }); /* todos los países de la ronda */
        const on = !S.over && free.length > 0;

          if (S.go && !S.over && S.slotUser[k])
            for (const m of [25, 50, 75])
              if (!S.cp[m] && S.pos[k] >= m) {
                S.cp[m] = k;
                t.tur.classList.add("turbo");
                setTimeout(() => t.tur.classList.remove("turbo"), 1500);
                SFX.cp();
              }
          /* animación */
          const sp = Math.min(t.vs, VMAX),
            speedRatio = Math.max(0, sp / VMAX);
          /* cara: lento = triste, rápido = feliz, turbo (o ganadora) = súper feliz */
          /* quien va primero lleva corona y cara de líder, sin importar la velocidad */
          const tired = S.go && !S.over && !isW && !isBotT && performance.now() - (t.lastEv || 0) > TIRED_MS; /* sin interacción: agotada */
          const mood = tired
            ? "tired"
            : k === firstK
              ? "lead"
              : isW || t.tur.classList.contains("turbo") || t.mult >= 5
                ? "turbo"
                : t.mult >= 2 || isBotT
                  ? "happy"
                  : "sad";
          t.tur.classList.toggle("first", k === firstK);
          /* El cambio de cara no es inmediato: la nueva expresión debe mantenerse MOOD_STABLE s seguidos y la actual
             debe llevar al menos MOOD_HOLD s puesta; después se funde con la anterior (ver CSS .mo). */
          t.moodAge = (t.moodAge || 0) + dt;
          if (mood !== t.cand) { t.cand = mood; t.candT = 0; } else t.candT = (t.candT || 0) + dt;
          if (t.mood !== mood && (!t.mood || (t.moodAge >= MOOD_HOLD && t.candT >= MOOD_STABLE))) {
            t.mood = mood;
            t.moodAge = 0;
            t.tur.classList.remove("mood-sad", "mood-happy", "mood-turbo", "mood-lead", "mood-tired");
            t.tur.classList.add("mood-" + mood);
          }
          /* ===== MARCHA CON FÍSICA REAL =====
             1) Se mide cuánto avanzó de verdad el caparazón (t.va, u/s) y se pasa a unidades del SVG por segundo (vb).
             2) Una pata apoyada está fija al suelo: respecto al cuerpo se mueve hacia atrás justo a velocidad vb (no patina).
                Por eso el ritmo del paso sale de vb: fq = vb · duty / (2 · amplitud). Si no avanza, las patas quedan plantadas.
             3) Dos pares diagonales (trote) alternan; con duty > 0.5 siempre hay al menos un par en el suelo.
             4) El caparazón NO sube ni baja: se inclina sobre las patas (skewX con pivote en el suelo = sin altura),
                con inercia al acelerar y un vaivén en cada paso. Zigzaguea de lado a lado y gira hacia donde va. */
          const dp = S.pos[k] - p0;
          t.va += (dp / dt - t.va) * Math.min(1, dt * 10);
          const vb = Math.max(0, t.va) * GEO.ppu * GEO.u;
          const mv = Math.min(1, Math.max(0, (t.va - 0.01) / 0.05));
          const duty = 0.62 - 0.1 * Math.min(1, vb / 8);
          let fq = 0.2 + 0.06 * vb,
            A = (vb * duty) / (2 * fq);
          if (A > 6.5) {
            A = 6.5;
            fq = (vb * duty) / 13;
          } else if (A < 1) A = 1;
          t.fa += (fq * mv - t.fa) * Math.min(1, dt * 6);
          t.am += (A - t.am) * Math.min(1, dt * 4);
          t.ph += dt * Math.PI * 2 * t.fa;
          const step = Math.floor(t.ph / Math.PI); /* un apoyo de pata cada media vuelta */
          if (S.go && S.slotUser[k] && step !== t.step) {
            t.step = step;
            SFX.step(speedRatio);
          }
          t.hl += (0 - t.hl) * Math.min(1, dt * 4);
          const phi = (t.ph / (Math.PI * 2)) % 1,
            a = t.am,
            E = t.e;
          const foot = (o) => {
            const u = (phi + o) % 1;
            let x, y;
            if (u < duty) {
              x = a * (1 - (2 * u) / duty); /* apoyada: va hacia atrás con el suelo */
              y = 0;
            } else {
              const w = (u - duty) / (1 - duty);
              /* en el aire vuelve adelante con curva Hermite: sale y aterriza moviéndose hacia atrás a la velocidad del suelo (sin patinar ni dar tirones) */
              const mT = (-2 * a / duty) * (1 - duty) * 0.6,
                w2 = w * w, w3 = w2 * w;
              x = (2 * w3 - 3 * w2 + 1) * -a + (w3 - 2 * w2 + w) * mT + (-2 * w3 + 3 * w2) * a + (w3 - w2) * mT;
              y = -(1.8 + 0.3 * a) * Math.sin(Math.PI * w);
            }
            return "translate(" + x.toFixed(2) + " " + y.toFixed(2) + ")";
          };
          let fA = foot(0),
            fB = foot(0.5);
          let legS = 1;
          const lg = (f, cx, cy) => (legS < 1 ? f + " translate(" + cx + " " + cy + ") scale(" + legS.toFixed(2) + ") translate(" + -cx + " " + -cy + ")" : f);
          E.lnB.setAttribute("transform", lg(fA, 18, 39));
          E.lfF.setAttribute("transform", lg(fA, 44, 38));
          E.lnF.setAttribute("transform", lg(fB, 47, 39));
          E.lfB.setAttribute("transform", lg(fB, 26, 38));
          /* inclinación: inercia (acelerar = el caparazón se queda atrás) + vaivén de cada paso */
          const acl = (t.va - t.vaPrev) / dt;
          t.vaPrev = t.va;
          const leanT =
            Math.max(-2, Math.min(2, acl * 0.9)) +
            0.9 * Math.sin(4 * Math.PI * phi) * Math.min(1, t.am / 2.5) * mv;
          t.lean += (leanT - t.lean) * Math.min(1, dt * 10);
          /* llora mientras esté entre los últimos 3; si sube de puesto, sigue llorando 3 s más (sin cambios bruscos) */
          if (lastSet.has(k)) t.cryT = 3;
          else if (t.cryT > 0) t.cryT = Math.max(0, t.cryT - dt);
          t.tur.classList.toggle("cry", t.cryT > 0);
          t.tur.classList.toggle("charge", !!t.sprint && !(S.over || S.winner));
          const lean = Math.max(-9, Math.min(9, t.lean + t.jl)),
            roll = 1.2 * Math.sin(2 * Math.PI * phi) * Math.min(1, t.am / 2.5) * mv, /* leve balanceo al apoyar cada par de patas */
            sk = " translate(0 43) skewX(" + lean.toFixed(2) + ") translate(0 -43)",
            skB = " rotate(" + roll.toFixed(2) + " 32 40)" + sk,
            skH = " rotate(" + roll.toFixed(2) + " 34 38)" + sk;
          E.bd.setAttribute("transform", skB);
          E.hd.setAttribute(
            "transform",
            "translate(" +
              (
                sp * 0.25 +
                Math.sin(2 * Math.PI * phi - 0.6) * 0.9 * Math.min(1, t.am / 2.5) * mv + /* el cuello acompaña el paso */
                Math.sin(tNow * 0.8 + t.w) * 1.2 * t.hl
              ).toFixed(2) +
              " " +
              (-2.8 * t.hl + sp * 0.12 + Math.sin(tNow * 1.5 + t.w) * 0.25 + Math.sin(4 * Math.PI * phi) * 0.3 * Math.min(1, t.am / 2.5) * mv).toFixed(2) + /* respiración + leve vaivén */
              ")" +
              skH,
          );
          E.tl.setAttribute(
            "transform",
            "rotate(" +
              (Math.sin(t.ph + 1) * 10 * Math.min(1, a / 2) * mv).toFixed(2) +
              " 10 28)",
          );
          /* Solo la tortuga que va última zigzaguea dentro de su carril; las demás vuelven al centro. */
          {
            const li = C.indexOf(c),
              bh = GEO.k ? GEO.H / C.length : 0,
              rng = Math.min(bh * 0.2, Math.max(0, (bh - GEO.th) / 2)),
              lo = li === 0 ? 0 : -rng,
              hi = li === C.length - 1 ? 0 : rng,
              erratic = S.go && !S.over && k === lastK,
              vxp = Math.max(t.va * GEO.ppu, 6);
            if (erratic) {
              t.zTimer -= dt;
              if (t.zTimer <= 0) {
                t.zTimer = 2 + Math.random() * 4;
                t.zT = lo + Math.random() * Math.max(0, hi - lo);
              }
            } else {
              t.zT = 0;
            }
            t.zT = Math.max(lo, Math.min(hi, t.zT));
            const zt = t.zy + (t.zT - t.zy) * Math.min(1, dt * (erratic ? 1 : 3));
            t.zvy += ((zt - t.zy) * 3 - t.zvy * 4) * dt;
            const vyMax = (3 + 0.45 * vxp) * (0.3 + 0.7 * mv);
            t.zvy = Math.max(-vyMax, Math.min(vyMax, t.zvy));
            t.zy += t.zvy * dt;
            if (t.zy < lo) { t.zy = lo; t.zvy = Math.max(0, t.zvy); }
            if (t.zy > hi) { t.zy = hi; t.zvy = Math.min(0, t.zvy); }
            const psiT = (Math.max(-0.18, Math.min(0.18, Math.atan2(t.zvy, vxp))) * 180) / Math.PI * mv;
            t.psi += (psiT - t.psi) * Math.min(1, dt * 3);
          }
          if (t.vs > 1.3 / TIME_X) {
            t.du -= dt;
            if (t.du <= 0) {
              t.du = Math.max(0.06, 0.2 - sp * 0.015);
              puff(k, R);
            }
          }
          t.tur.classList.toggle("burn", k === firstK && S.go && !S.over && t.vs > 0.05); /* llama fija detrás de la líder */
          if (k === firstK) leaderFx(k, t, dt);
          {
            const _pv = Math.min(100, S.pos[k]).toFixed(2);
            t.tur.style.setProperty("--p", _pv);
            t.trk.style.setProperty("--p", _pv);
          }
        }
        physics(); /* rumbo por carril + transform final */
        if (!S.over && S.winner) finish(S.winner);
        acc += dt;
        if (acc > 0.25) {
          acc = 0;
          render();
          photo();
          /* el tempo sube de 0,8× a 1,25× conforme avanza la tortuga puntera */
          MUS.bpm = MUS.theme.bpm * musicSpeed(Math.max(...C.map((c) => S.pos[c.c])));
        }
      }

      /* ===== Conexión al servidor Node =====
   El servidor integrado entrega eventos normalizados por SSE. Si se especifica "ws", se conserva
   compatibilidad con el contrato WebSocket documentado en la sección 3 de esta guía. */
      /* Último apoyo por usuario: un comentario/like/etc. solo suma un hincha cada 8 s (evita repetir la misma acción). */
      const lastSupportAt = {};
      /* Registra al espectador como hincha del país que menciona (o del que ya apoyaba) y le da +1 punto cada 8 s. */
      function registerSupport(entry, isBot) {
        if (
          entry &&
          !S.over &&
          ["chat", "gift", "like", "follow", "share", "join"].includes(
            entry.type,
          )
        ) {
          const _n = (x) =>
            String(x || "")
              .toLowerCase()
              .normalize("NFD")
              .replace(/[\u0300-\u036f]/g, "")
              .trim();
          const _t = _n(entry.content || entry.text),
            _raw = String(entry.content || entry.text || "");
          const _fl = (i) =>
            CODES[i].length === 2
              ? String.fromCodePoint(
                  ...[...CODES[i]].map((ch) => 127397 + ch.charCodeAt(0)),
                )
              : "";
          const _i =
            entry.type === "chat"
              ? C.findIndex(
                  (c, i) =>
                    i < HUMAN_N &&
                    (_t.includes(_n(NATIONS[i].es)) ||
                      _t.includes(_n(NATIONS[i].en)) ||
                      _t === CODES[i].toLowerCase() ||
                      (_fl(i) && _raw.includes(_fl(i)))),
                )
              : -1;
          const _u = String(entry.username || "")
            .trim()
            .toLocaleLowerCase();
          if (_u) {
            const _code =
              (_i >= 0 && C[_i].c) ||
              S.pick.get(_u) ||
              S.slotOf.get(_u) ||
              rnd(C.slice(0, HUMAN_N)).c;
            if (_i >= 0) switchPlayerCountry(_u, _code);
            registerPick(_u, _code);
            if (Date.now() - (lastSupportAt[_u] || 0) > 8000) {
              lastSupportAt[_u] = Date.now();
              const _o = _i >= 0 ? slotPlayer(_code) : null;
              if (_o) {
                _o.points += 1;
                raceAdd(_o, { type: "support" }, 1);
              }
            }
            render();
          }
        }
      }
      /* Punto de entrada de todo evento (SSE, WebSocket o bots de prueba). */
      function handleTikTokEntry(entry, isBot = false) {
        registerSupport(entry, isBot);
        if (entry && ["member", "enter", "joined"].includes(entry.type))
          entry = { ...entry, type: "join" };
        if (!isBot) rosterTouch(entry);
        scoreContestant(entry, isBot);
      }
      /* PRESENTES: conserva los últimos cuatro usuarios reales para reutilizarlos entre rondas y sesiones. */
      const ROSTER_KEY = "tortugasRecentUsers",
        ROSTER_LIMIT = 4;
      const ROSTER = (() => {
        try {
          const saved = JSON.parse(localStorage.getItem(ROSTER_KEY) || "[]"),
            roster = new Map();
          if (Array.isArray(saved))
            for (const item of saved) {
              if (!item || typeof item.username !== "string") continue;
              const username = item.username.trim(),
                key = username.toLocaleLowerCase();
              if (!username || key === "alguien") continue;
              roster.delete(key);
              roster.set(key, {
                username,
                avatar: typeof item.avatar === "string" ? item.avatar : "",
                t: Number(item.t) || 0,
              });
            }
          while (roster.size > ROSTER_LIMIT)
            roster.delete(roster.keys().next().value);
          return roster;
        } catch {
          return new Map();
        }
      })();
      let rosterLastSaved = "",
        rosterSyncTimer = null,
        rosterSyncQueue = Promise.resolve();
      function rosterSnapshot() {
        return [...ROSTER.values()].slice(-ROSTER_LIMIT);
      }
      function saveRosterLocally() {
        try {
          localStorage.setItem(ROSTER_KEY, JSON.stringify(rosterSnapshot()));
        } catch {}
      }
      function scheduleRosterSync() {
        if (location.protocol === "file:") return;
        clearTimeout(rosterSyncTimer);
        rosterSyncTimer = setTimeout(() => {
          const users = rosterSnapshot(),
            payload = JSON.stringify(users);
          rosterSyncQueue = rosterSyncQueue
            .then(async () => {
              if (payload === rosterLastSaved) return;
              const response = await fetch("/api/recent-users", {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ users }),
              });
              if (!response.ok)
                throw new Error(`HTTP ${response.status}`);
              const saved = await response.json();
              if (!Array.isArray(saved.users))
                throw new Error("Respuesta inválida del servidor.");
              rosterLastSaved = JSON.stringify(saved.users);
            })
            .catch((error) =>
              console.error("No se pudieron guardar los usuarios recientes.", error),
            );
        }, 250);
      }
      function mergeRecentUsers(users) {
        for (const item of users) {
          if (!item || typeof item.username !== "string") continue;
          const username = item.username.trim(),
            key = username.toLocaleLowerCase();
          if (!username || key === "alguien") continue;
          const t = Number.isSafeInteger(item.t) && item.t >= 0 ? item.t : 0,
            previous = ROSTER.get(key);
          if (previous && previous.t > t) continue;
          ROSTER.delete(key);
          ROSTER.set(key, {
            username,
            avatar: typeof item.avatar === "string" && /^https?:\/\//i.test(item.avatar)
              ? item.avatar
              : "",
            t,
          });
        }
        const latest = [...ROSTER.entries()]
          .sort((a, b) => a[1].t - b[1].t)
          .slice(-ROSTER_LIMIT);
        ROSTER.clear();
        latest.forEach(([key, user]) => ROSTER.set(key, user));
        saveRosterLocally();
      }
      async function loadRecentUsers() {
        if (location.protocol === "file:") return;
        const controller = new AbortController(),
          timeout = setTimeout(() => controller.abort(), 1500);
        try {
          const response = await fetch("/api/recent-users", {
            cache: "no-store",
            signal: controller.signal,
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const saved = await response.json();
          if (!Array.isArray(saved.users))
            throw new Error("Respuesta inválida del servidor.");
          mergeRecentUsers(saved.users);
          rosterLastSaved = JSON.stringify(saved.users);
          if (JSON.stringify(rosterSnapshot()) !== rosterLastSaved)
            scheduleRosterSync();
        } catch (error) {
          console.error("No se pudieron cargar los usuarios recientes.", error);
        } finally {
          clearTimeout(timeout);
        }
      }
      function seedRecentUsers() {
        rosterSnapshot().forEach((user, index) => {
          const lane = C[index];
          if (!lane) return;
          const key = user.username.toLocaleLowerCase(),
            player = {
              key,
              username: user.username,
              avatar: user.avatar,
              points: 0,
              interactions: 0,
              sequence: contestantSequence++,
              isBot: false,
              isReplay: true,
            };
          contestants.set(key, player);
          S.pick.set(key, lane.c);
          S.slotUser[lane.c] = key;
          S.slotOf.set(key, lane.c);
          setMain(lane.c, player);
        });
      }
      function rosterTouch(e) {
        const name = e && String(e.username || "").trim();
        if (!name || name.toLocaleLowerCase() === "alguien") return;
        const key = name.toLocaleLowerCase(),
          r = ROSTER.get(key) || { username: name, avatar: "" };
        r.t = Date.now();
        if (typeof e.avatar === "string" && /^https?:\/\//i.test(e.avatar))
          r.avatar = e.avatar;
        ROSTER.delete(key);
        ROSTER.set(key, r);
        while (ROSTER.size > ROSTER_LIMIT)
          ROSTER.delete(ROSTER.keys().next().value);
        saveRosterLocally();
        scheduleRosterSync();
      }
      function connect() {
        const statusButton = document.getElementById("connectorStatus");
        if (Q.has("ws")) {
          statusButton.hidden = true;
          let ws;
          try {
            ws = new WebSocket(CFG.ws);
          } catch {
            return setTimeout(connect, 3000);
          }
          ws.onclose = () => setTimeout(connect, 2000);
          ws.onmessage = (e) => {
            try {
              const m = JSON.parse(e.data);
              if (
                [
                  "chat",
                  "gift",
                  "like",
                  "follow",
                  "share",
                  "join",
                  "member",
                  "enter",
                ].includes(m.type)
              ) {
                const entry = {
                  ...m,
                  username: m.username || m.user || "Alguien",
                  content: m.content || m.text || m.gift || "",
                  diamondCount: m.diamondCount || m.diamonds,
                  activityCount: m.activityCount || m.count,
                  time: m.time || new Date().toISOString(),
                };
                handleTikTokEntry(entry);
              } else if (m.type === "reset") resetContestants();
            } catch {}
          };
          return;
        }
        const source = new EventSource("/api/events");
        let connectorState = { connected: false, username: "", status: "idle" };
        const renderConnectorStatus = (next) => {
          connectorState = { ...connectorState, ...next };
          const username = String(connectorState.username || "").trim();
          const shortUsername = username.slice(0, 10);
          const connected = Boolean(connectorState.connected || connectorState.isConnected);
          statusButton.classList.toggle("connected", connected);
          statusButton.classList.toggle("disconnected", !connected);
          const label = connected
            ? `CONECTADO${shortUsername ? " · @" + shortUsername : ""}`
            : username
              ? `Sin conexión · @${shortUsername}`
              : "Configura TikTok en /backend";
          const dot = document.createElement("i"),
            txt = document.createElement("span");
          dot.className = "cdot"; /* punto pulsante (solo late en verde: .connected) */
          txt.textContent = label;
          statusButton.textContent = "";
          statusButton.append(dot, txt);
          statusButton.title = connected
            ? `Conectado a @${username}.`
            : connectorState.status === "failed"
              ? `Se agotaron los reintentos para @${username}. Haz clic para intentarlo de nuevo.`
              : username
                ? `Conectando a @${username}; se reintenta cada 5 segundos durante 5 minutos.`
                : "Configura TikTok en /backend.";
        };
        const requestConnection = async () => {
          try {
            const response = await fetch("/api/reconnect", { method: "POST" });
            const result = await response.json();
            if (!response.ok && response.status !== 409) {
              throw new Error(result.message || "No se pudo iniciar la conexión.");
            }
            if (result.username) connectorState.username = result.username;
            if (result.message) statusButton.title = result.message;
          } catch (error) {
            statusButton.title = `No se pudo iniciar la conexión: ${error.message}`;
          }
        };
        statusButton.addEventListener("click", requestConnection);
        source.addEventListener("status", (e) => {
          try {
            renderConnectorStatus(JSON.parse(e.data));
          } catch {}
        });
        source.addEventListener("update", (e) => {
          try {
            const entry = JSON.parse(e.data).entry;
            handleTikTokEntry(entry);
          } catch {}
        });
        requestConnection();
      }

      /* ===== Bots de prueba: simulan eventos de TikTok llamando a los MISMOS manejadores que el WebSocket =====
   (handleTikTokEntry), así que sirven para probar el juego sin servidor. Nunca envían nada a la red.
   Pruebas manuales desde el panel con P o ?panel=1. Además hay una cadena automática de bots (ver más abajo). */
      const NAMES = [
        "Lucía",
        "Mateo",
        "Ana_PY",
        "Carlos",
        "Sofi",
        "Diego",
        "Valen",
        "Rocío",
        "Nico",
        "Cami",
        "Tomás",
        "Fran",
      ];
      const GIFTS = {
        rose: ["Rose", 1],
        heart: ["Finger Heart", 5],
        donut: ["Doughnut", 30],
        galaxy: ["Galaxy", 1000],
      };
      const botEvent = (type, username, details = {}) => {
        const entry = {
          type,
          username,
          content: details.content || "",
          avatar: "",
          time: new Date().toISOString(),
          ...details,
        };
        handleTikTokEntry(entry, true);
      };
      const botGift = (t = "rose", u = rnd(NAMES)) =>
        botEvent("gift", u, {
          content: GIFTS[t][0],
          diamondCount: GIFTS[t][1],
          activityCount: 1,
        });
      const botJoin = () =>
        botEvent("join", rnd(NAMES) + ((Math.random() * 90) | 0));
      const botLike = () =>
        botEvent("like", rnd(NAMES), {
          activityCount: 1 + ((Math.random() * 8) | 0),
        });
      async function botFlood(n = 20) {
        const u = rnd(NAMES);
        for (let i = 0; i < n; i++) {
          botGift(
            Math.random() < 0.7 ? "rose" : "donut",
            Math.random() < 0.5 ? u : rnd(NAMES),
          );
          await new Promise((r) => setTimeout(r, 150));
        }
      }
      let autoT = null;
      function toggleAuto() {
        const btn = document.querySelector("[data-a=auto]");
        if (autoT) {
          clearTimeout(autoT);
          autoT = null;
          btn.classList.remove("act");
          return;
        }
        btn.classList.add("act");
        const loop = () => {
          const r = Math.random();
          if (r < 0.15) botJoin();
          else if (r < 0.22) botEvent("follow", rnd(NAMES));
          else if (r < 0.45) botLike();
          else {
            const g = (r - 0.45) / 0.55;
            botGift(
              g < 0.6
                ? "rose"
                : g < 0.85
                  ? "heart"
                  : g < 0.97
                    ? "donut"
                    : "galaxy",
            );
          }
          autoT = setTimeout(
            loop,
            (700 + Math.random() * 1500) / (+$("rate").value || 1),
          );
        };
        loop();
      }
      const ACT = {
        rose: () => botGift("rose"),
        donut: () => botGift("donut"),
        galaxy: () => botGift("galaxy"),
        join: botJoin,
        like: botLike,
        flood: botFlood,
        follow: () => botEvent("follow", rnd(NAMES)),
        auto: toggleAuto,
        boost: () => setBoost(60),
        sound: toggleSound,
        music: toggleMusic,
        reset: resetContestants,
      };
      document
        .querySelectorAll("#bots button")
        .forEach((b) => (b.onclick = () => ACT[b.dataset.a]()));
      const KEYS = {
        1: "rose",
        2: "donut",
        3: "galaxy",
        j: "join",
        l: "like",
        f: "flood",
        a: "auto",
        b: "boost",
        m: "sound",
        n: "music",
        r: "reset",
      };
      addEventListener("keydown", (e) => {
        const k = e.key.toLowerCase();
        if (k === "p") $("bots").classList.toggle("on");
        else if (KEYS[k]) ACT[KEYS[k]]();
      });
      if (Q.get("panel")) $("bots").classList.add("on");
      if (SND) document.querySelector("[data-a=sound]").classList.add("act");
      if (SND && MUSIC)
        document.querySelector("[data-a=music]").classList.add("act");

      /* ===== GAMIFICACIÓN: efectos (solo visuales; no tocan puntos ni posiciones) =====
   emojis flotantes por evento · anillo en la tortuga · cartel grande por nivel de aporte (TURBO/MEGA/LEYENDA)
   · temblor y destello de pantalla · niveles por jugador · adelantamientos · CAMPEÓN con confeti */
      const EMO = {
        gift: ["🎁", "💎", "✨"],
        like: ["❤️", "💖", "💕"],
        follow: ["⭐", "💛", "🌟"],
        share: ["🔁", "🚀", "📣"],
        chat: ["💬", "🐢", "👏"],
        join: ["👋", "🐢", "✨"],
        hit: ["💥", "💫", "⭐"],
      };
      /* Confeti que sale de un punto (x, y) de la pantalla */
      function burstAt(x, y, n, gold) {
        spawnConfetti(n, gold, { x: () => x, y: () => y, vx: 14, vy: 13, vy0: 3, r: 6, r0: 4 });
      }
      function turPos(code) {
        const r = T[code].tur.getBoundingClientRect();
        return [r.left + r.width * 0.5, r.top + r.height * 0.4];
      }
      function emojiFx(code, type, n) {
        const t = T[code];
        for (let i = 0; i < n; i++)
          setTimeout(() => {
            const e = document.createElement("i");
            e.className = "emo";
            e.textContent = rnd(EMO[type] || EMO.chat);
            e.style.setProperty("--p", Math.min(100, S.pos[code]));
            e.style.setProperty(
              "--dx",
              ((Math.random() - 0.5) * 3.2).toFixed(1) + "rem",
            );
            e.style.setProperty(
              "--rt",
              (((Math.random() - 0.5) * 40) | 0) + "deg",
            );
            t.trk.append(e);
            setTimeout(() => e.remove(), 1700);
          }, i * 110);
      }
      function ringFx(code, mega) {
        const r = document.createElement("i");
        r.className = "ring" + (mega ? " mega" : "");
        T[code].tur.append(r);
        setTimeout(() => r.remove(), 950);
      }
      function screenFx(shake) {
        const v = $("vig");
        v.className = "";
        void v.offsetWidth;
        v.className = "on";
        if (shake) {
          const a = $("app");
          restartAnim(a, "shake");
        }
      }
      /* ===== BOTS DE PRUEBA =====
         Bots: el sistema agrega uno como máximo y solo en el último país; simula likes, comentarios,
         comparte, sigue y a veces regala, con ritmo irregular. Sus eventos pasan por los MISMOS manejadores que los reales
         (registerSupport + scoreContestant) pero no se guardan en el ROSTER. */
      (() => {
        const humanEv = []; /* marcas de tiempo de eventos de personas reales */
        const baseHandle = handleTikTokEntry;
        handleTikTokEntry = function (entry, isBot) {
          const simulated = !!isBot || !!(entry && entry.sim),
            wasMuted = botEventMuted;
          if (entry && !simulated) humanEv.push(Date.now());
          if (simulated) botEventMuted = true;
          try {
            if (entry && entry.sim) {
              (window.SIMK = window.SIMK || new Set()).add(String(entry.username).trim().toLocaleLowerCase());
              registerSupport(entry, true);
              scoreContestant(entry, true);
              render();
              return;
            }
            return baseHandle(entry, isBot);
          } finally {
            botEventMuted = wasMuted;
          }
        };

        /* ---- bots ---- */
        const MAXB = 1, /* un solo bot de prueba activo a la vez (el encadenado de más bots era legado) */
          bots = [];
        const GENERIC = ["jajaja", "qué carrera", "🐢🐢🐢", "vamos vamos", "uff", "quién gana?", "🔥🔥"],
          GENERIC_EN = ["lol", "what a race", "🐢🐢🐢", "let's go", "wow", "who wins?", "🔥🔥"];
        const send = (type, name, d = {}) =>
          handleTikTokEntry({
            type, username: name, content: "", avatar: "", sim: true,
            time: new Date().toISOString(), ...d,
          });
        function botStep(b) {
          if (!b.on) return;
          const bk = b.name.toLocaleLowerCase();
          if (b.joined && !S.slotOf.has(bk)) return window.botKicked(bk); /* perdió su tortuga: se da de baja */
          let i = NATIONS.findIndex((n) => n.code === b.fav);
          if (i < NATIONS.length - 1 || (!b.joined && S.slotUser[C[i] && C[i].c])) {
            b.fav = pickFav();
            if (!b.fav) return window.botKicked(bk);
            i = NATIONS.findIndex((n) => n.code === b.fav);
            send("chat", b.name, { content: NATIONS[i].n });
          }
          const nm = NATIONS[i].n,
            r = Math.random();
          if (!b.joined) {
            registerPick(bk, C[i].c);
            b.joined = true;
            send("join", b.name);
            b.t = setTimeout(() => {
              send("chat", b.name, { content: nm });
              b.t = setTimeout(() => botStep(b), 1200 + Math.random() * 2500);
            }, 600 + Math.random() * 1200);
            return;
          }
          if (r < 0.4) send("like", b.name, { activityCount: 1 + ((Math.random() * 12) | 0) });
          else if (r < 0.62)
            send("chat", b.name, {
              content: Math.random() < 0.7
                ? rnd(tr([nm, "vamos " + nm, "¡" + nm + "!", nm + " campeón", "dale " + nm], [nm, "go " + nm, nm + "!", nm + " champion", "come on " + nm]))
                : rnd(tr(GENERIC, GENERIC_EN)),
            });
          else if (r < 0.76) {
            const g = Math.random(),
              k = g < 0.6 ? "rose" : g < 0.85 ? "heart" : g < 0.98 ? "donut" : "galaxy";
            send("gift", b.name, { content: GIFTS[k][0], diamondCount: GIFTS[k][1], activityCount: 1 });
          } else if (r < 0.83) send("share", b.name);
          else if (r < 0.87 && !b.followed) {
            b.followed = true;
            send("follow", b.name);
          } else send("like", b.name, { activityCount: 1 + ((Math.random() * 6) | 0) });
          b.t = setTimeout(() => botStep(b), 1200 + Math.random() * 4800);
        }
        const count = () => {
          document.documentElement.classList.toggle("hasbots", bots.length > 0); /* líneas de carril solo con bots */
        };
        window.__botCount = count;
        /* El bot reserva el último carril, después de los cuatro usuarios recuperados. */
        function pickFav() {
          const use = (code) => bots.filter((x) => x.fav === code).length;
          const pool = NATIONS.slice(-1).filter((n) => {
            const lane = C[NATIONS.indexOf(n)];
            return lane && !S.slotUser[lane.c];
          });
          if (!pool.length) return null;
          const min = Math.min(...pool.map((n) => use(n.code)));
          return rnd(pool.filter((n) => use(n.code) === min)).code;
        }
        function addBot() {
          if (bots.length >= MAXB) return; /* máximo 1 bot; mantener pulsado 🤖 los detiene */
          const fav = pickFav();
          if (!fav) return;
          const b = {
            name: rnd(NAMES) + ((100 + Math.random() * 900) | 0),
            fav,
            p0: 0,
            slot: null,
            on: true,
            joined: false,
            followed: false,
            t: null,
          };
          bots.push(b);
          count();
          b.t = setTimeout(() => botStep(b), 200 + Math.random() * 600);
        }
        function stopBots(manual) {
          if (manual === true) autoOn = false;
          for (const b of bots) {
            b.on = false;
            clearTimeout(b.t);
          }
          bots.length = 0;
          count();
        }
        /* Baja de un bot (una persona real tomó su tortuga, o no consiguió una). */
        window.botKicked = (key) => {
          const i = bots.findIndex((x) => x.name.toLocaleLowerCase() === key);
          if (i < 0) return;
          bots[i].on = false;
          clearTimeout(bots[i].t);
          bots.splice(i, 1);
          count();
        };
        window.addBot = addBot;
        window.stopBots = stopBots;

        /* ---- bot automático ----
           Al empezar cada ronda entra un bot si está libre el último carril.
           Mantener pulsado 🤖 lo detiene hasta la próxima ronda. ?autobots=0 lo desactiva. */
        let autoOn = Q.get("autobots") !== "0";
        const baseNewRound = newRound;
        newRound = function () {
          baseNewRound();
          stopBots();
          autoOn = Q.get("autobots") !== "0";
          asleep = false;
          calmSince = 0;
          humanEv.length = 0;
          if (autoOn) addBot();
        };
        /* DORMIR: si la actividad humana es alta (≥ SLEEP_HI eventos en 10 s) los bots de prueba se duermen y sueltan su tortuga
           para que la tome una persona; despiertan cuando baja a ≤ SLEEP_LO durante 8 s. */
        const SLEEP_HI = 6, SLEEP_LO = 2;
        let asleep = false, calmSince = 0;
        const humanLevel = () => {
          const now = Date.now();
          while (humanEv.length && now - humanEv[0] > 10000) humanEv.shift();
          return humanEv.length;
        };
        function releaseBotLane(key) {
          const code = S.slotOf.get(key);
          if (!code) return;
          S.slotOf.delete(key);
          delete S.slotUser[code];
          contestants.delete(key);
          setSlotAvatar(code, null);
          T[code].tur.classList.remove("owned");
        }
        setInterval(() => {
          const lvl = humanLevel();
          if (!asleep && lvl >= SLEEP_HI && bots.length) {
            asleep = true;
            for (const b of [...bots]) { const k = b.name.toLocaleLowerCase(); window.botKicked(k); releaseBotLane(k); }
            render();
          } else if (asleep) {
            if (lvl <= SLEEP_LO) { if (!calmSince) calmSince = Date.now(); else if (Date.now() - calmSince > 8000) { asleep = false; calmSince = 0; } }
            else calmSince = 0;
          }
        }, 500);
        setInterval(() => {
          if (!autoOn || asleep || !S.go || S.over) return;
          if (!bots.length) addBot();
        }, 300);
      })();

      /* Aplica el idioma activo a todo lo estático (título, botones, panel de pruebas, nombres de país). */
      function applyLang() {
        document.documentElement.lang = LANG;
        document.title = tr("Carrera de países", "Countries Race");
        const set = (sel, es, en) => {
          const e = document.querySelector(sel);
          if (e) e.textContent = tr(es, en);
        };
        set("#winner .wttl", "🏆 PODIO DE INTERACCIONES", "🏆 INTERACTION PODIUM");
        set("#snd", "🔇 Toca la pantalla para activar el sonido", "🔇 Tap the screen to enable sound");
        set("#botsTitle", "Pruebas de interacción (P)", "Interaction tests (P)");
        const tt = (id, es, en) => {
          const e = $(id);
          if (!e) return;
          e.title = tr(es, en);
          e.setAttribute("aria-label", tr(es, en));
        };
        const PANEL = {
          rose: ["1 Rosa", "1 Rose"], donut: ["2 Dona", "2 Doughnut"], galaxy: ["3 Galaxia", "3 Galaxy"], join: ["J Se une", "J Joins"],
          like: ["L Likes", "L Likes"], flood: ["F Avalancha", "F Flood"], follow: ["Seguidor", "Follower"], auto: ["A Auto", "A Auto"],
          boost: ["B Doble", "B Double"], sound: ["M Sonido", "M Sound"], music: ["N Música", "N Music"], reset: ["R Reiniciar", "R Reset"],
        };
        document.querySelectorAll("#bots button[data-a]").forEach((b) => {
          const v = PANEL[b.dataset.a];
          if (v) b.textContent = tr(v[0], v[1]);
        });
        const lab = document.querySelector("#bots label");
        if (lab && lab.firstChild) lab.firstChild.nodeValue = tr("Ritmo del auto ", "Auto rate ");
        C.forEach((c, i) => {
          const im = $("rk-" + c.c) && $("rk-" + c.c).querySelector("img");
          if (im && NATIONS[i]) im.alt = NATIONS[i].n;
        });
        const wc = $("wCt"), wn = $("winner");
        if (wc && wn && wn.classList.contains("show") && S.winner) {
          const wi = C.findIndex((x) => x.c === S.winner);
          if (wi >= 0) wc.textContent = NATIONS[wi].n;
          const wt = document.querySelector("#winner .wttl");
          if (wt) wt.textContent = tr("🏆 PODIO DE INTERACCIONES", "🏆 INTERACTION PODIUM");
        }
        if (window.__botCount) window.__botCount();
      }
      applyLang();
      requestAnimationFrame(frame);
      loadRecentUsers().then(() => {
        newRound();
        connect();
      });
    </script>
  </body>
</html>
