<!doctype html>
<!--
  ═══════════════════════════════════════════════════════════════════════════
  CARRERA DE TORTUGAS · OVERLAY PARA TIKTOK LIVE
  ═══════════════════════════════════════════════════════════════════════════

  DINÁMICA DEL JUEGO (cómo funciona hoy)
    • 5 tortugas, cada una con su propio carril y país. El bot de prueba solo se activa en el último país.
      Cada tortuga pasea de arriba a abajo dentro de su carril.
    • El bot de prueba marca el ritmo: avanza de 0 a 100 en CFG.botSec (120 s por defecto). Las tortugas avanzan con el apoyo
      de cada país: hacen falta 50 eventos válidos para que el equipo llegue a la meta.
    • Cada evento válido desbloquea 1/50 del recorrido; likes y regalos agrupados cuentan como un evento, no como sus unidades.
      La tortuga no puede avanzar más allá del progreso desbloqueado. Los efectos de velocidad (EV_BOOST, addBoost) solo afectan
      cuánto tarda en recorrer ese tramo:
      like ×5 · entrar ×2 · comentario ×5 · compartir / seguir ×10 · regalo ×20 (rosa) a ×30 (galaxia) según su valor (GIFT_TIERS). Gana quien llega primero a CFG.win (100).
    • El avatar de cada acción queda fijo en el lugar de la pista donde ocurrió; no sigue ni rodea al caparazón.
    • Sin copas al final de los carriles (se quitaron).
    • Guía de uso eliminada (el espacio queda en blanco). Abajo: 3 llamadas de acción (#cta): 🌹 al centro alternan los regalos (Rosita ×20 · Dona ×25 · Galaxia ×30), ❤️ Dale like a la derecha (fija), izquierda alterna ➕ Seguir / ↪️ Compartir (?cta=0 las oculta). Las llamadas van FUERA de la pista (franja --cta-h bajo los carriles). Cada botón lleva una insignia ⚡×N con el multiplicador de velocidad que da esa acción (sale de EV_BOOST).
    • Mientras haya bots activos (🤖), cada carril se delimita con líneas sólidas (html.hasbots, #laneLines; ?lines=1 las muestra siempre).
    • Un espectador elige o cambia de país escribiendo su nombre, sigla o bandera en el chat.
    • La primera tortuga en pasar el 25 %, 50 % y 75 % recibe un efecto de lechuga (S.cp); foto finish si llegan casi empatadas.
    • Al llegar a la meta, tras CFG.restartMs (2,5 s) empieza otra ronda con nuevos países, sin podio ni cuenta regresiva.
    • Pista #hint compacta, con banderas en una sola fila para no tapar la carrera.
    • v67 (UX + gamificación): barra FIEBRE (#hype): cada evento la llena, se vacía sola; al llegar a 100 % hay 10 s de FIEBRE (×1.5 al empuje de todos). ?hype=0 la oculta · ?hypetop=12 (% desde arriba). Pista #hint "Escribe tu país" con las banderas de los carriles libres.
    • v4 (zona segura TikTok Live 9:16): pista entre el 22 % superior y el 27 % inferior (--top/--bot), FIEBRE bajo la zona del creador (--hype-top), narradora SOBRE la esquina superior izquierda de la pista (siempre visible, z-index 60), CTA a todo el ancho, estado de conexión y versión en una franja fina sobre el chat. Un solo bloque CSS final ("v4 · ZONA SEGURA") manda sobre las reglas antiguas. ?top=22 ?bottom=27 ?hypetop=13.5.
    • v3 (pulido visual): bandera física al inicio de cada carril (#lanes .fl, antes de la línea de salida) · la líder escupe fuego y destellos (leaderFx) · barra FIEBRE neón con % exacto y chispas en modo FIEBRE · letrero a cuadros ¡META! (#metaBanner) · botón de conexión verde brillante con punto pulsante · con la líder cerca de la meta (≥80 %, ≥92 %) pulsan los CTA y el letrero (#cta.near / .near2, html.lead-near).

  PARÁMETROS DE URL: ?target=40  ?win=100  ?panel=1 (panel de pruebas, también tecla P)  ?sound=0 (efectos/música)  ?voice=0 (sin voz)
                     ?music=0  ?theme=1  ?vol=0.9  ?join=0.5  ?ws=URL (WebSocket en lugar de SSE)  ?safe=1  ?autobots=0 (sin bots automáticos)  ?escena=1-4 (fuerza un escenario)  ?lang=en|es (idioma)  ?top=30 (dónde empieza la pista, en % desde arriba; más alto = más cielo)
  ESCENARIOS DEL FONDO: cada ronda usa uno, en orden: 1 madrugada (va amaneciendo) · 2 mañana (hacia el mediodía) ·
    3 mediodía (hacia la tarde) · 4 tarde (va oscureciendo). El cielo avanza con el progreso del líder de la carrera.
  BACKEND: SSE en /api/events. Un solo archivo, sin dependencias de build.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07262B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Country Race</title><!-- el título cambia con el idioma (applyLang) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      if ("serviceWorker" in navigator)
        window.addEventListener("load", () =>
          navigator.serviceWorker
            .register("/sw.js")
            .catch((error) =>
              console.error(
                "No se pudo registrar tortu como aplicación:",
                error,
              ),
            ),
        );
    </script>
    <style>
      :root{
        --ink: #07262b;
        --ink2: #0d3a41;
        --flag-size: 2.3rem;
        --sun: #ffc93c;
        --pink: #ff3d7f;
        --cream: #fff6e0;
        --mint: #5cf2c0;
        --sand: #f3dfa2;
        --sand2: #e8ce8c;
        --grass: #5fb35a;
        --grass2: #4a9a4c;
        --padr: 3%;
        --overlay-lift: 5vh;
        --cta-fs: min(1.7vh, 2.4vw); /* tamaño de las llamadas de acción */
        --cta-h: calc(var(--cta-fs) * 5.2); /* franja que se reserva bajo la pista para ellas (0 con ?cta=0) */
      }
      *{
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html{
        font-size: min(3.8vw, 2.1vh);
      }
      html, body{
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        color: var(--cream);
        font-family: "Nunito", system-ui, sans-serif;
        font-weight: 800;
      }
      .disp{
        font-family: "Bowlby One", "Arial Black", sans-serif;
        font-weight: 400;
      }
      #fx{
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9;
      }

      /* Todo fluye en una sola columna: nada se encima, en cualquier pantalla */
      #app{
        position: absolute;
        top: var(--top, 30%);
        bottom: var(--bot, 14%);
        left: 3%;
        right: var(--padr);
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      /* Cabecera */

      /* Pista: 5 carriles fijos (uno por tortuga). Etiqueta izquierda = solo el puesto; el nombre va en .tag sobre la tortuga.
   Los anchos de .tur / .mk / .sl / .pl usan el mismo desplazamiento (.8rem de margen + pista de 100% - 7rem) para que
   la nariz de la tortuga coincida con las líneas de 25/50/75 % y con la meta. Si cambias el tamaño de .tur, ajusta los cuatro. */
      #lanes{
        flex: 1.5 1 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        --tw: min(13rem, 16vh);
        --n: 9;
        --lane-step: calc((100% - var(--th)) / var(--n));
        --fan-size: var(--flag-size);
        --g: 0rem;
      }
      .lane{
        flex: 1 1 0;
        min-height: 4.4rem;
        max-height: 5.8rem;
        display: flex;
        align-items: stretch;
        border-radius: 0.9rem;
        overflow: hidden;
        box-shadow: 0 0.25rem 0 rgba(0, 0, 0, 0.28);
      }
      .lane:nth-child(odd){
        background: rgba(243, 223, 162, 0.95);
      }
      .lane:nth-child(even){
        background: rgba(232, 206, 140, 0.95);
      }
      .lab{
        position: relative;
        z-index: 3;
        width: 2.8rem;
        justify-content: center;
        flex: none;
        background: var(--ink);
        display: flex;
        align-items: center;
        gap: 0.3rem;
        padding: 0 0.4rem;
      }
      .rk{
        flex: none;
        width: 1.6rem;
        height: 1.6rem;
        border-radius: 50%;
        background: var(--ink2);
        color: var(--cream);
        font-size: 0.95rem;
        display: grid;
        place-items: center;
      }
      .rk.r1{
        background: var(--ink);
        color: #fff;
      }
      .rk.r2{
        background: #d9e2e5;
        color: var(--ink);
      }
      .rk.r3{
        background: #e3a46b;
        color: var(--ink);
      }
      
      .nm{
        display: flex;
        flex-direction: column;
        line-height: 1.05;
        min-width: 0;
      }
      
      .nm b{
        font-family: "Bowlby One", sans-serif;
        font-weight: 400;
        color: var(--sun);
        font-size: 0.8rem;
        max-width: 5.6rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .nm small{
        font-size: 0.75rem;
        opacity: 0.85;
      }
      .lab em{
        margin-left: auto;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        line-height: 1.05;
        font-style: normal;
        color: var(--mint);
      }
      .lab em span{
        font-size: 1.05rem;
      }
      .lab em small{
        font-size: 0.75rem;
        color: var(--sun);
      }
      .lane.lead .lab{
        box-shadow: inset 0.25rem 0 0 var(--sun);
      }
      .trk{
        position: relative;
        flex: 1;
        border-top: 0.2rem solid var(--grass);
        border-bottom: 0.2rem solid var(--grass2);
        background-image:
          radial-gradient(rgba(120, 85, 30, 0.25) 0.07rem, transparent 0.1rem),
          radial-gradient(
            rgba(255, 255, 255, 0.28) 0.06rem,
            transparent 0.09rem
          );
        background-size:
          1.1rem 1rem,
          1.7rem 1.3rem;
        background-position:
          0 0,
          0.5rem 0.4rem;
      }
      .mk{
        position: absolute;
        top: 0;
        bottom: 0;
        width: 0;
        border-left: 0.12rem dashed rgba(7, 38, 43, 0.18);
      }
      .sl{
        position: absolute;
        top: 0;
        bottom: 0;
        left: 6.2rem;
        width: 0.18rem;
        background: rgba(255, 255, 255, 0.75);
      }
      .fin{
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: 0.8rem;
        background: repeating-conic-gradient(var(--ink) 0 25%, #fff 0 50%) 0
          0/0.4rem 0.4rem;
      }
      .tur{
        position: absolute;
        top: 62%;
        width: 5.4rem;
        height: 3.5rem;
        margin-top: -1.75rem;
        left: calc(0.8rem + (100% - 7rem) * var(--p, 0) / 100);
        z-index: 2;
      }
      .tur svg{
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .tur.turbo{
        filter: drop-shadow(0 0 0.5rem var(--pink))
          drop-shadow(0 0 0.9rem var(--sun));
      }
      .tur.turbo::before{
        content: "";
        position: absolute;
        right: 100%;
        top: 30%;
        width: 2.5rem;
        height: 40%;
        background: linear-gradient(90deg, transparent, var(--sun));
        border-radius: 999px;
      }
      
      .dust{
        position: absolute;
        top: calc(50% + 0.6rem);
        width: 0.6rem;
        height: 0.6rem;
        margin-left: -0.2rem;
        border-radius: 50%;
        background: rgba(255, 246, 224, 0.8);
        z-index: 1;
        pointer-events: none;
        animation: dust 0.8s ease-out forwards;
      }
      @keyframes dust{
        to {
          transform: translate(-1.8rem, -0.6rem) scale(2.4);
          opacity: 0;
        }
      }

      @keyframes pop{
        from {
          transform: scale(0.4);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }

      .empty{
        font-size: 0.62rem;
        opacity: 0.85;
      }

      #snd{
        position: fixed;
        left: 1.8rem;
        bottom: calc(0.3rem + var(--overlay-lift));
        z-index: 30;
        font-size: 0.8rem;
        background: rgba(0, 0, 0, 0.65);
        padding: 0.1rem 0.6rem;
        border-radius: 999px;
        display: none;
      }
      @media (orientation: portrait){
        html{
          font-size: clamp(12px, min(3.2vw, 1.8vh), 32px);
          --padr: 12%;
        }
        #app{
          top: 3%;
          bottom: 3%;
          left: 3%;
          right: var(--padr);
          gap: 0.2rem;
        }
        .lab{
          width: 2.6rem;
          gap: 0.2rem;
          padding: 0 0.25rem;
        }

        #snd{
          display: none;
        }
        
      }
      /* Panel de pruebas */

      #bots{
        position: fixed;
        right: 8px;
        top: 8px;
        z-index: 40;
        width: 176px;
        background: rgba(0, 0, 0, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 10px;
        padding: 8px;
        font:
          12px/1.2 system-ui,
          sans-serif;
        display: none;
        gap: 4px;
        flex-wrap: wrap;
      }
      #bots.on{
        display: flex;
      }
      #bots b{
        width: 100%;
        font-size: 11px;
        opacity: 0.8;
      }
      #bots button{
        flex: 1 1 45%;
        padding: 7px 4px;
        border: 0;
        border-radius: 6px;
        background: #1d4f57;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      #bots button.act{
        background: var(--pink);
      }
      #bots label{
        width: 100%;
        font-size: 11px;
        margin-top: 4px;
      }
      #bots input{
        width: 100%;
      }
      /* Avatar redondo, carril vacío atenuado, ganador resaltado,
   animación al cambiar de dueño (.swap) y etiqueta .tag con @usuario + puntos que viaja con la tortuga. */
      .lane.empty .tur{
        opacity: 0.45;
        filter: grayscale(0.7);
      }
      .lane.win{
        outline: 0.2rem solid var(--sun);
        box-shadow: 0 0 1rem var(--sun);
      }
      .tur.swap svg{
        animation: pop 0.6s cubic-bezier(0.2, 1.6, 0.4, 1) both;
      }
      /* FIJA: esquina superior izquierda de la pista (al inicio); */
      .tag{
        position: absolute;
        left: 0.6rem;
        top: 0.15rem;
        margin: 0;
        max-width: min(calc(100% - 1.4rem), 36vw);
        display: flex;
        align-items: baseline;
        gap: clamp(3px, 0.4vw, 6px);
        padding: 0;
        height: clamp(18px, 3.8vw, 26px);
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        z-index: 5;
        pointer-events: none;
      }
      .tag b{
        flex: 0 1 auto;
        min-width: 0;
        max-width: min(30vw, 10rem);
        overflow: hidden;
        text-overflow: ellipsis;
        font-family: "Bowlby One", "Arial Black", sans-serif;
        font-weight: 400;
        font-size: clamp(10px, 1.4vw, 16px);
        letter-spacing: 0.02em;
        color: #07262b;
        -webkit-text-stroke: 0.08em #fff6e0;
        paint-order: stroke fill;
        text-shadow: none;
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }
      .tag small{
        flex: none;
        font-size: clamp(8px, 1vw, 12px);
        color: #0d3a41;
        font-weight: 800;
        -webkit-text-stroke: 0.08em #fff6e0;
        paint-order: stroke fill;
      }
      .lane.empty .tag{
        display: none;
      }
      /* Pantalla horizontal: se reduce el rem para que quepan los 5 carriles grandes sin tapar el panel inferior */
      @media (orientation: landscape){
        html{
          font-size: min(3.8vw, 1.45vh);
        }
      }
      /* Diseño: arriba la carrera + barra de mensajes */
              /* La carrera tiene PRIORIDAD de altura: cada carril mide fijo 4.4rem y la tabla de abajo cede (flex) si falta espacio.
   Así los carriles nunca se desbordan por debajo de la barra de mensajes ni la tapan. */
      #lanes{
        flex: 0 0 auto;
      }
      .lane{
        flex: 0 0 4.4rem;
        min-height: 4.4rem;
        max-height: none;
      }

       /* barra de mensajes SIEMPRE visible */

      /* ===== GAMIFICACIÓN: efectos ===== */
      .emo{
        position: absolute;
        top: 30%;
        font-size: 1.5rem;
        line-height: 1;
        z-index: 6;
        pointer-events: none;
        left: calc(0.8rem + (100% - 7rem) * var(--p, 0) / 100 + 2.2rem);
        animation: emo 1.6s ease-out forwards;
      }
      @keyframes emo{
        0% {
          transform: translate(0, 0.6rem) scale(0.4);
          opacity: 0;
        }
        15% {
          opacity: 1;
          transform: translate(0, 0) scale(1.2);
        }
        100% {
          transform: translate(var(--dx, 0), -2.6rem) scale(0.9)
            rotate(var(--rt, 0deg));
          opacity: 0;
        }
      }
      .ring{
        position: absolute;
        left: 1.6rem;
        top: 30%;
        width: 2.6rem;
        height: 2.6rem;
        margin: -1.3rem 0 0 -1.3rem;
        border-radius: 50%;
        border: 0.28rem solid var(--sun);
        box-shadow: 0 0 1rem var(--sun);
        pointer-events: none;
        animation: ring 0.9s ease-out forwards;
        z-index: 4;
      }
      .ring.mega{
        border-color: var(--pink);
        box-shadow:
          0 0 1.4rem var(--pink),
          0 0 2.4rem var(--sun);
      }
      @keyframes ring{
        to {
          transform: scale(4.2);
          opacity: 0;
        }
      }
      .lane.lead{
        box-shadow:
          0 0 0.9rem rgba(255, 201, 60, 0.9),
          0 0.25rem 0 rgba(0, 0, 0, 0.28);
      }
      .lane.lead::after{
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          100deg,
          transparent 35%,
          rgba(255, 255, 255, 0.55) 50%,
          transparent 65%
        );
        transform: translateX(-120%);
        animation: shine 3.2s ease-in-out infinite;
        pointer-events: none;
        z-index: 4;
      }
      @keyframes shine{
        60%,
        100% {
          transform: translateX(120%);
        }
      }
      .lane{
        position: relative;
      }
      .lane.flash{
        animation: flash 0.9s ease-out;
      }
      @keyframes flash{
        0% {
          outline: 0.25rem solid var(--pink);
          filter: brightness(1.5);
        }
        100% {
          outline: 0.25rem solid transparent;
          filter: none;
        }
      }

      #app.shake{
        animation: shake 0.9s ease-out;
      }
      @keyframes shake{
        20% {
          transform: translate(-0.12rem, 0.07rem);
        }
        45% {
          transform: translate(0.1rem, -0.06rem);
        }
        70% {
          transform: translate(-0.05rem, 0.03rem);
        }
      }
      #vig{
        position: fixed;
        inset: 0;
        z-index: 8;
        pointer-events: none;
        opacity: 0;
        box-shadow: inset 0 0 6rem 1.5rem var(--sun);
      }
      #vig.on{
        animation: vig 1s ease-out;
      }
      @keyframes vig{
        0% {
          opacity: 0.9;
        }
        100% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce){
        .lane.lead::after{
          animation: none;
        }
      }

      /* La carrera queda arriba; la mitad inferior aparece solo durante los festejos. */
      #app{
        top: 0;
        bottom: 50%;
        left: 3%;
        right: var(--padr);
        gap: 0.2rem;
      }
      #lanes{
        flex: 1 1 0;
        min-height: 0;
      }
      .lane{
        flex: 1 1 0;
        min-height: 0;
        height: auto;
      }
      .tur{
        top: 50%;
        width: auto;
        height: 100%;
        aspect-ratio: 70 / 46;
        margin-top: 0;
        transform: translateY(-50%);
      }


      /* ===== ANUNCIO EMERGENTE DEL GANADOR (3 s) sobre las rutas ===== */
      #fx{
        z-index: 45;
      }

      #app.finished .lane:not(.win){
        filter: saturate(0.4);
        transition:
          opacity 0.4s,
          filter 0.4s;
        opacity: 0.5;
      }
      
      /* ===== PARTICIPACIÓN CLARA Y MEDIBLE ===== */

      /* ===== pista libre: sin bandera a la izquierda, sin nombre de país (solo copas) ===== */
      .lab{
        display: none !important;
      }
      .tag b{
        display: inline-block;
      }
      .tag b:empty{
        display: none;
      }
      .lane.empty .tag{
        display: flex !important;
      }
      .tag b{
        font-size: clamp(14px, 2.2vw, 24px) !important;
        max-width: none !important;
      }
      /* ===== cabecera mínima + banderas ===== */

      .lab{
        width: 3.3rem;
      }
      .rk{
        position: relative;
        width: var(--flag-size);
        height: var(--flag-size);
        padding: 0;
        overflow: hidden;
        border: 0.16rem solid var(--cream);
        box-shadow: 0 0.12rem 0.35rem rgba(0, 0, 0, 0.55);
      }
      .rk img{
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .rk::after{
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        pointer-events: none;
        background:
          radial-gradient(
            circle at 30% 24%,
            rgba(255, 255, 255, 0.6),
            transparent 42%
          ),
          radial-gradient(
            circle at 50% 55%,
            transparent 55%,
            rgba(0, 0, 0, 0.3) 100%
          );
      }
      .rk.r1{
        border-color: var(--sun);
        box-shadow:
          0 0 0.55rem var(--sun),
          0 0.12rem 0.35rem rgba(0, 0, 0, 0.55);
      }
      .rk.r2{
        border-color: #d9e2e5;
      }
      .rk.r3{
        border-color: #e3a46b;
      }
      @media (orientation: portrait){

        .lab{
          width: 2.9rem;
        }
        :root{
          --flag-size: 2rem;
        }
      }
      /* ===== llamadas de acción grandes y vistosas ===== */

            /* ===== UNA SOLA PISTA para todas las tortugas (grandes), copas mini, mensajes en el pie ===== */
      #lanes{
        --tw: min(11rem, 28vh);
        --th: calc(var(--tw) * 46/70);
        --g: 3rem;
        position: relative;
        display: block;
        background-color: var(--sand);
        background-image:
          radial-gradient(rgba(120, 85, 30, 0.25) 0.07rem, transparent 0.1rem),
          radial-gradient(
            rgba(255, 255, 255, 0.28) 0.06rem,
            transparent 0.09rem
          );
        background-size:
          1.1rem 1rem,
          1.7rem 1.3rem;
        border-top: 0.25rem solid var(--grass);
        border-bottom: 0.25rem solid var(--grass2);
        border-radius: 0.9rem;
        box-shadow: 0 0.25rem 0 rgba(0, 0, 0, 0.28);
      }
      #lanes .lane{
        position: absolute !important;
        inset: 0;
        flex: none;
        height: auto;
        min-height: 0;
        max-height: none;
        overflow: visible;
        border-radius: 0;
        background: none !important;
        box-shadow: none !important;
        outline: none !important;
        animation: none !important;
        pointer-events: none;
      }
      #lanes .lane::after{
        display: none !important;
      }
      #lanes .trk{
        position: absolute;
        inset: 0;
        border: 0;
        background: none;
        z-index: 1;
        --rt: calc((100% - var(--th)) * var(--i)/var(--n));
        clip-path: inset(-100vh -100vw -100vh 0);
      }
      #lanes::after{
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        background-image: radial-gradient(
          circle,
          rgba(7, 38, 43, 0.58) 1px,
          transparent 1.5px
        );
        background-size: 7px var(--lane-step);
        background-position: 0 calc(var(--lane-step) - 1px);
        pointer-events: none;
      }
      #lanes .trk .tur{
        top: var(--rt);
        width: var(--tw);
        height: var(--th);
        aspect-ratio: auto;
        margin: 0;
        transform: none;
        left: calc(
          var(--tw) * 0 + (100% - var(--tw) * 1 - 0.8rem) * var(--p, 0) / 100
        );
      }
      #lanes .sl{
        left: calc(var(--g) + var(--tw));
      }
      
      #lanes .emo{
        top: calc(var(--rt) + var(--th) * 0.2);
        left: calc(
          var(--tw) * 0 + (100% - var(--tw) * 1 - 0.8rem) * var(--p, 0) / 100 + var(--tw) * 0.45
        );
      }
      #lanes .dust{
        top: calc(var(--rt) + var(--th) - 0.9rem);
      }
      #lanes .tag{
        left: 0.3rem;
        top: calc(var(--rt) + var(--th) / 2 - 11px);
        max-width: calc(var(--g) - 0.3rem);
      }
      #lanes .tag b{
        font-size: clamp(7px, 1.1vw, 12px) !important;
      }
      #lanes .lane.empty .tag{
        display: flex !important;
      }
      
      /* mensajes: pie de pantalla, texto que va pasando */

      /* ===== pantalla completa, 10 países, sin versión ===== */

      #app{
        top: var(--top, 30%); /* pista bajada para dejar más cielo (antes 17 %); ?top=17 vuelve al valor anterior */
        bottom: var(--bot, 7%);
      }

      /* ===== etiqueta de 2 líneas: iniciales + copas / hinchas ===== */
      
      #lanes .tag{
        height: auto;
        overflow: visible;
        top: calc(var(--rt) + var(--th) / 2 - 1.1em);
        max-width: calc(var(--g) - 0.2rem);
      }
      #lanes .tag b{
        display: block;
        white-space: pre;
        line-height: 1.2;
        max-width: none;
      }
      /* ===== hinchas grandes y vivos, líder con resplandor ===== */
      
      #lanes .tag b i{
        font-style: normal;
      }
      
      #lanes .tag{
        top: calc(var(--rt) + var(--th) / 2 - 1.6em);
      }
      #lanes .lane.lead .trk .tur{
        filter: drop-shadow(0 0 0.45rem #ffc93c) drop-shadow(0 0 1.1rem #ffc93c);
      }
      #lanes .lane.lead .trk .tur.turbo{
        filter: drop-shadow(0 0 0.5rem var(--pink))
          drop-shadow(0 0 1.1rem #ffc93c);
      }

      /* ===== eventos sobre la tortuga ===== */
      #lanes .evb{
        position: absolute;
        z-index: 12;
        white-space: nowrap;
        pointer-events: none;
        padding: 0.16em 0.7em 0.2em;
        border-radius: 999px;
        border: 0.16rem solid #fff;
        color: #fff;
        font-size: calc(var(--th) * 0.24);
        line-height: 1.15;
        text-shadow: 0 0.08em 0 rgba(7, 38, 43, 0.7);
        box-shadow: 0 0.2rem 0.5rem rgba(0, 0, 0, 0.6);
        top: calc(var(--rt) - var(--th) * 0.15 - var(--o, 0) * var(--th) * 0.12);
        left: calc(
          var(--tw) * 0 + (100% - var(--tw) * 1 - 0.8rem) * var(--p, 0) / 100 + var(--tw) * 0.5
        );
        animation: evup 2.2s ease-out forwards;
      }
      @keyframes evup{
        0% {
          transform: translate(-50%, 0.8rem) scale(0.4);
          opacity: 0;
        }
        14% {
          transform: translate(-50%, 0) scale(1.15);
          opacity: 1;
        }
        28% {
          transform: translate(-50%, 0) scale(1);
        }
        80% {
          opacity: 1;
        }
        100% {
          transform: translate(-50%, -1.8rem) scale(1);
          opacity: 0;
        }
      }
      #lanes .evb.e-lk{
        background: #ff3d7f;
      }
      #lanes .evb.e-ch{
        background: #1fb58a;
      }
      #lanes .evb.e-gf{
        background: linear-gradient(90deg, #ff9f1c, #ffc93c);
        color: #07262b;
        text-shadow: none;
      }
      #lanes .evb.e-sh{
        background: #2e7bff;
      }
      #lanes .evb.e-fo{
        background: #e5254b;
      }
      #lanes .evb.e-jn{
        background: #7b4dff;
      }
      #lanes .evb.e-ch{
        max-width: min(72vw, 22rem);
        overflow: hidden;
        text-overflow: ellipsis;
        background: #fff;
        color: #07262b;
        text-shadow: none;
        white-space: nowrap;
      }
      #lanes .evb.e-ch::after{
        content: "";
        position: absolute;
        left: 50%;
        bottom: -0.34em;
        border-top: 0.4em solid #fff;
        border-right: 0.35em solid transparent;
        border-left: 0.35em solid transparent;
        transform: translateX(-50%);
      }
      #lanes .gift-bait{
        position: absolute;
        z-index: 4;
        top: calc(var(--rt) + var(--th) * 0.13);
        left: calc(
          var(--tw) * 0 + (100% - var(--tw) * 1 - 0.8rem) * var(--p, 0) / 100 + var(--tw) * 0.5
        );
        display: grid;
        width: calc(var(--th) * 0.42);
        height: calc(var(--th) * 0.42);
        place-items: center;
        border: 0.12rem solid #fff;
        border-radius: 0.9rem;
        background: linear-gradient(145deg, #fff4bd, #ffae21);
        box-shadow: 0 0 0.6rem rgba(255, 201, 60, 0.9), 0 0.15rem 0.3rem rgba(0, 0, 0, 0.45);
        font-size: calc(var(--th) * 0.3);
        line-height: 1;
        transform: translateX(-50%);
        animation: giftbait 0.55s ease-in-out infinite alternate;
        pointer-events: none;
      }
      #lanes .gift-bait.caught{
        animation: giftcaught 0.24s ease-out forwards;
      }
      @keyframes giftbait{
        from { margin-top: 0; filter: drop-shadow(0 0 0.15rem #fff); }
        to { margin-top: -0.5rem; filter: drop-shadow(0 0 0.4rem #ffec98); }
      }
      @keyframes giftcaught{
        to { opacity: 0; transform: translateX(-50%) scale(1.8) rotate(12deg); }
      }
      /* ===== ajustes ===== */
      .lane.empty .tur{
        opacity: 1;
        filter: none;
      }

      /* ===== tortugas al 100 % de opacidad (también tras terminar la carrera) ===== */
      #lanes .tur,
      #lanes .lane.empty .tur,
      #app.finished .lane:not(.win),
      #app.finished .lane:not(.win) .tur{
        opacity: 1 !important;
      }
      #app.finished .lane:not(.win){
        filter: none !important;
      }
      #lanes .lane.empty .tur{
        filter: none !important;
      }
    
      /* ===== sin hinchas ni copas · la tortuga sale del borde izquierdo · caras ===== */

      #lanes .lane .tag,
      #lanes .lane.empty .tag {
        display: none !important;
      }
      /* CAMBIO DE EXPRESIÓN GRADUAL: las caras no saltan; se funden unas en otras (FACE_FADE) */
      .tur .mo{
        display: inline;
        opacity: 0;
        transition: opacity 1.1s ease-in-out;
      }
      .tur .eyes{
        transition: opacity 1.1s ease-in-out;
      }
      /* parpadeo natural cada ~4 s */
      .tur .eyes .blk{
        transform-box: fill-box;
        transform-origin: center;
        animation: blink 4.2s infinite;
      }
      @keyframes blink{
        0%, 94%, 100%{ transform: scaleY(1); }
        97%{ transform: scaleY(0.1); }
      }
      .tur.mood-sad .mo-sad,
      .tur.mood-happy .mo-happy,
      .tur.mood-turbo .mo-turbo,
      .tur.mood-tired .mo-tired{
        opacity: 1;
      }
      .tur.mood-turbo .eyes,
      .tur.mood-tired .eyes{
        opacity: 0;
      }
      /* cara de AGOTADO: las gotas de sudor resbalan despacio */
      .tur .mo-tired .sw{
        animation: tiredDrip 1.8s ease-in infinite;
      }
      .tur .mo-tired .sw2{
        animation-delay: 0.9s;
      }
      @keyframes tiredDrip{
        0%{ transform: translateY(-1px); opacity: 0; }
        25%{ opacity: 1; }
        100%{ transform: translateY(4px); opacity: 0; }
      }
    
      /* ===== física de marcha: la tortuga gira sobre sus patas y los choques muestran 💥 ===== */
      #lanes .trk .tur{
        transform-origin: 35% 90%;
        will-change: transform;
      }
      #lanes::after{
        display: none !important;
      }

      /* cartel "recibió regalo" sobre la tortuga mientras dura la protección */
      #lanes .pbadge{
        position: absolute;
        z-index: 13;
        white-space: nowrap;
        pointer-events: none;
        padding: 0.12em 0.7em 0.16em;
        border-radius: 999px;
        border: 0.16rem solid #fff;
        background: linear-gradient(90deg, #1ea7ff, #38d6ff);
        color: #fff;
        font-size: calc(var(--th) * 0.22);
        line-height: 1.15;
        text-shadow: 0 0.08em 0 rgba(7, 38, 43, 0.7);
        box-shadow: 0 0.2rem 0.5rem rgba(0, 0, 0, 0.6);
        top: calc(var(--rt) - var(--th) * 0.42);
        left: calc((100% - var(--tw) - 0.8rem) * var(--p, 0) / 100 + var(--tw) * 0.5);
        transform: translateX(-50%);
      }
      /* PROTECCIÓN POR REGALO: aura celeste mientras dura el anti-choque */
      #lanes .trk .tur.shield svg{
        filter: drop-shadow(0 0 0.35rem #7fe3ff) drop-shadow(0 0 0.9rem #38b6ff);
      }
      /* SÚPER ENERGÍA: brillo rojo-dorado mientras la agresora corre a atacar */
      #lanes .trk .tur.charge svg{
        filter: drop-shadow(0 0 0.5rem #ff3d2e) drop-shadow(0 0 1.1rem #ffc93c);
      }

      /* ===== el primero lleva corona y cara de líder ===== */
      .tur .crw{
        display: none;
      }
      .tur.first .crw{
        display: inline;
      }
      .tur.mood-lead .mo-lead{
        opacity: 1;
      }
      .tur.mood-lead .eyes{
        opacity: 0;
      }
      /* CABEZA ROJA HIRVIENDO: se pone más roja a medida que se acerca el choque (--rg 0.3 → 1) y late como si hirviera */
      .tur .rage{
        opacity: 0;
        transition: opacity 1s ease-in-out;
        pointer-events: none;
      }
      .tur.angry .rage{
        opacity: var(--rg, 0.4);
      }
      .tur .rage .rg2{
        animation: boilPulse 0.55s ease-in-out infinite;
      }
      @keyframes boilPulse{
        0%, 100%{ opacity: 0.72; }
        50%{ opacity: 1; }
      }
      .tur .rage .stm{
        opacity: 0;
        animation: steamUp 0.9s ease-out infinite;
      }
      .tur .rage .stm2{
        animation-delay: 0.45s;
      }
      @keyframes steamUp{
        0%{ transform: translateY(2px); opacity: 0; }
        30%{ opacity: 0.9; }
        100%{ transform: translateY(-5px); opacity: 0; }
      }
      /* cara de LLORANDO: los últimos 3 puestos cuando la líder está a 15 % de la meta */
      .tur.cry .mo,
      .tur.cry .eyes{
        opacity: 0 !important;
        transition-duration: 0.8s;
      }
      .tur.cry .mo-cry{
        opacity: 1 !important;
      }
      .tur .mo-cry .tear{
        animation: tearFall 1.1s ease-in infinite;
      }
      .tur .mo-cry .tear2{
        animation-delay: 0.35s;
      }
      .tur .mo-cry .tear3{
        animation-delay: 0.7s;
      }
      .tur .mo-cry .tear4{
        animation-delay: 0.15s;
      }
      @keyframes tearFall{
        0%{ transform: translateY(-1px); opacity: 0; }
        20%{ opacity: 1; }
        100%{ transform: translateY(9px); opacity: 0; }
      }
      .tur .mo-cry .wail{
        transform-box: fill-box;
        transform-origin: center;
        animation: wail 0.45s ease-in-out infinite;
      }
      @keyframes wail{
        0%, 100%{ transform: scaleY(1); }
        50%{ transform: scaleY(1.35); }
      }
      /* cara de ENOJADO: la tortuga ya decidió chocar y va a embestir; se funde en ~0,5 s */
      .tur.angry .mo,
      .tur.angry .eyes{
        opacity: 0 !important;
        transition-duration: 0.5s;
      }
      .tur.angry .mo-angry{
        opacity: 1 !important;
      }
      /* cara de GOLPE: ojos > <, boca abierta, chichón y estrellas durante todo el retroceso (~12 s) y 1 s más tras cada choque */
      .tur.ouch .mo,
      .tur.ouch .eyes{
        opacity: 0 !important;
        transition-duration: 0.35s; /* el golpe sí entra rápido; al salir de él vuelve a fundirse despacio */
      }
      .tur.ouch .mo-ouch{
        opacity: 1 !important;
      }

      /* ===== cuenta regresiva emergente 3 · 2 · 1 · ¡YA! ===== */
      #cd{
        position: fixed;
        inset: 0;
        z-index: 65;
        display: none;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      #cd.show{
        display: flex;
      }
      #cd .cdn{
        font: min(34vw, 40vh)/1 "Bowlby One", "Arial Black", sans-serif;
        color: var(--sun, #ffc93c);
        -webkit-text-stroke: 0.05em #07262b;
        paint-order: stroke fill;
        text-shadow: 0 0.06em 0 #07262b, 0 0 0.35em rgba(255, 61, 127, 0.85), 0 0 0.7em rgba(255, 201, 60, 0.7);
        animation: cdpop 0.9s cubic-bezier(0.2, 1.5, 0.4, 1) both;
      }
      #cd .cdn.go{
        font-size: min(26vw, 30vh);
        color: var(--mint, #5cf2c0);
        text-shadow: 0 0.06em 0 #07262b, 0 0 0.35em rgba(92, 242, 192, 0.9), 0 0 0.8em rgba(255, 201, 60, 0.7);
      }
      @keyframes cdpop{
        0%{ transform: scale(2.6); opacity: 0; }
        25%{ transform: scale(1); opacity: 1; }
        75%{ transform: scale(1); opacity: 1; }
        100%{ transform: scale(0.6); opacity: 0; }
      }

      /* Tarjeta de resultado conservada en el HTML, pero desactivada: la ronda se reinicia automáticamente. */
      #winner{
        position: fixed;
        inset: 0;
        z-index: 60;
        display: none;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      #winner.show{
        display: flex;
      }
      #winner .wbox{
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.6rem;
        box-sizing: border-box;
        width: min(94vw, 42rem);
        padding: 1.1rem 1.8rem 1.2rem;
        border: 0.22rem solid var(--sun, #ffc93c);
        border-radius: 1.4rem;
        background: linear-gradient(160deg, rgba(13, 58, 65, 0.96), rgba(20, 91, 80, 0.96));
        box-shadow: 0 0 2.6rem rgba(255, 201, 60, 0.55), 0 0.5rem 1.4rem rgba(0, 0, 0, 0.55);
        text-align: center;
        max-width: 94vw;
        max-height: 92vh;
        overflow-y: auto;
        animation: winpop 0.5s cubic-bezier(0.2, 1.4, 0.4, 1) both;
      }
      #winner.out .wbox{
        animation: winout 0.35s ease-in forwards;
      }
      #winner.podiumOnly .wav,
      #winner.podiumOnly .wnm,
      #winner.podiumOnly .wfl,
      #winner.podiumOnly .wxtra{display:none}
      #winner .wttl{
        font: 1.7rem/1.1 "Bowlby One", "Arial Black", sans-serif;
        color: var(--sun, #ffc93c);
        text-shadow: 0 0.14rem 0 var(--ink, #07262b);
      }
      #winner .wav{
        position: relative;
        width: min(34vmin, 19rem);
        height: min(34vmin, 19rem);
        border-radius: 50%;
        border: 0.4rem solid var(--sun, #ffc93c);
        background: #0d3a41;
        box-shadow: 0 0 1.6rem rgba(255, 201, 60, 0.8);
        overflow: hidden;
      }
      #winner .wav img{
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      #winner .wav b{
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        font: 6rem/1 "Bowlby One", "Arial Black", sans-serif;
        color: #fff;
      }
      #winner .wav.noimg img{
        display: none;
      }
      #winner .wav.noimg b{
        display: flex;
      }
      #winner .wnm{
        font: 1.5rem/1.15 "Bowlby One", "Arial Black", sans-serif;
        color: #fff;
        text-shadow: 0 0.12rem 0 var(--ink, #07262b);
        max-width: 80vw;
        overflow-wrap: anywhere;
      }
      #winner .wfl{
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 1.05rem;
        color: #fff;
      }
      #winner .wfl img{
        display: none; /* la bandera ya es la foto grande */
        height: 1.5rem;
        border-radius: 0.2rem;
        border: 0.08rem solid var(--ink, #07262b);
      }
      @keyframes winpop{
        from{ transform: scale(0.4); opacity: 0; }
        to{ transform: scale(1); opacity: 1; }
      }
      @keyframes winout{
        to{ transform: scale(0.85); opacity: 0; }
      }

      /* ===== MODO VERTICAL (TikTok Live 9:16) =====
         Zonas que TikTok tapa con su propia interfaz (aprox.): arriba ~12 % (perfil, espectadores), abajo ~25 % (chat, comentar, regalos),
         derecha ~12 % (botones). La pista queda en el centro y el resto se rellena con césped; ?top=NN y ?bottom=NN ajustan los márgenes. */
      @media (orientation: portrait){
        #app{
          top: var(--top, 31%); /* un poco más de cielo para el 1.er puesto grande */
          bottom: var(--bot, 27%);
        }
      }

      /* ===== 5 carriles propios, avatares anclados y pista sin cartel de podio ===== */
      #lanes{
        --lane-step: calc(100% / (var(--n) + 1));
      }
      html body #app{
        top: calc(var(--top, 24%) - var(--overlay-lift));
        bottom: calc(var(--bot, 7%) + var(--cta-h) + var(--overlay-lift)); /* eleva la pista para despejar los controles de TikTok Live */
      }
      @media (orientation: portrait){
        html body #app{
          top: calc(var(--top, 22%) - var(--overlay-lift));
          bottom: calc(var(--bot, 27%) + var(--cta-h) + var(--overlay-lift));
        }
      }
      #lanes .anchav{
        position: absolute;
        z-index: 13;
        pointer-events: none;
        left: calc((100% - var(--tw) - 0.8rem) * var(--ap, 0) / 100 + var(--tw) * 0.41);
        width: calc(var(--th) * 0.85);
        height: calc(var(--th) * 0.85);
        transform: translate(-50%, -50%);
        animation: anchIn 0.7s cubic-bezier(0.2, 1.5, 0.4, 1) both;
      }
      #lanes .anchav .ai{
        position: absolute;
        inset: 0;
        border-radius: 50%;
        overflow: hidden;
        background: var(--nc, #0d3a41);
        border: 0.1rem solid #fff;
        color: #fff;
        display: grid;
        place-items: center;
        font: calc(var(--th) * 0.42) / 1 "Bowlby One", "Arial Black", sans-serif;
        box-shadow: 0 0 0.6rem rgba(255, 201, 60, 0.9), 0 0.2rem 0.45rem rgba(0, 0, 0, 0.55);
      }
      #lanes .anchav .ai img{
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #lanes .anchav small{
        position: absolute;
        left: 50%;
        bottom: -0.45em;
        transform: translateX(-50%);
        padding: 0.1em 0.45em;
        border-radius: 999px;
        background: #ffc93c;
        color: #07262b;
        border: 0.08rem solid #07262b;
        font: 800 max(9px, calc(var(--th) * 0.15)) / 1.1 system-ui, sans-serif;
        white-space: nowrap;
      }
      /* ===== LLAMADAS DE ACCIÓN (#cta): 3 casillas distribuidas por el ancho. Centro = 🌹 Rosita (principal, fija);
         derecha = ❤️ Dale like (fija); izquierda alterna EN SU MISMO LUGAR (giro) entre ➕ Seguir · ↪️ Compartir.
         ?cta=0 la oculta. ===== */
      #cta{
        position: fixed;
        left: 0;
        right: 0;
        width: 100%;
        bottom: calc(var(--bot, 7%) + var(--overlay-lift)); /* elevado para dejar despejados los textos de TikTok Live */
        box-sizing: border-box;
        padding: 0 2vw;
        font-size: var(--cta-fs);
        z-index: 45;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: clamp(0.25rem, 1.2vw, 0.6em);
        line-height: 1;
        pointer-events: none;
      }
      @media (orientation: portrait){
        #cta{ bottom: calc(var(--bot, 27%) + var(--overlay-lift)); }
      }
      #cta .cs{
        position: relative;
        flex: 1 1 0;
        min-width: 0;
        max-width: 9.4em;
        height: 3.2em;
        perspective: 40em;
      }
      #cta .cs.main{
        font-size: 1.25em;
        max-width: 9em;
      }
      #cta .cb{
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.3em;
        border-radius: 999px;
        border: 0.14em solid #fff;
        background: #07262b;
        color: #fff;
        font: 1em/1 "Bowlby One", "Arial Black", sans-serif;
        white-space: nowrap;
        box-shadow: 0 0.2em 0.5em rgba(0, 0, 0, 0.55);
        backface-visibility: hidden;
        opacity: 1;
      }
      #cta .cb i{ font-style: normal; font-size: 1.4em; }
      /* insignia de velocidad: cada acción multiplica la velocidad de la tortuga (valores salen de EV_BOOST) */
      #cta .cb .x{
        position: absolute;
        top: -0.85em;
        right: -0.35em;
        padding: 0.28em 0.55em 0.2em;
        border-radius: 999px;
        background: #07262b;
        color: var(--sun);
        font: 0.85em/1 "Bowlby One", "Arial Black", sans-serif;
        letter-spacing: 0.02em;
        border: 0.14em solid var(--sun);
        box-shadow: 0 0.15em 0.4em rgba(0, 0, 0, 0.75), 0 0 0.35em rgba(255, 201, 60, 0.8);
        animation: ctaX 0.9s ease-in-out infinite;
      }
      @keyframes ctaX{
        0%, 100%{ transform: scale(1) rotate(-4deg); }
        50%{ transform: scale(1.14) rotate(4deg); }
      }
      #cta .cb.k-lk{ border-color: #ff3d7f; box-shadow: 0 0 0.9em rgba(255, 61, 127, 0.7); }
      #cta .cb.k-fo{ border-color: #7b4dff; box-shadow: 0 0 0.9em rgba(123, 77, 255, 0.7); }
      #cta .cb.k-sh{ border-color: #2e7bff; box-shadow: 0 0 0.9em rgba(46, 123, 255, 0.7); }
      #cta .cb.k-gf{ border-color: #ff5fae; box-shadow: 0 0 0.9em rgba(255, 95, 174, 0.75); }
      #cta .main .cb{
        background: linear-gradient(180deg, #8a1f55, #3b1259);
        animation: ctaBeat 1.1s ease-in-out infinite;
      }
      @keyframes ctaBeat{
        0%, 100%{ transform: scale(1); box-shadow: 0 0 0.8em rgba(255, 95, 174, 0.7); }
        50%{ transform: scale(1.06); box-shadow: 0 0 1.6em rgba(255, 95, 174, 1), 0 0 0.5em #fff; }
      }
      /* cambio en su sitio: el viejo gira hacia dentro y el nuevo gira hacia fuera, sin mover nada alrededor */
      #cta .cs:not(.main) .cb.out{ animation: ctaFlipOut 0.28s ease-in forwards; }
      #cta .cs:not(.main) .cb.in{ animation: ctaFlipIn 0.28s ease-out 0.26s both; }
      @keyframes ctaFlipOut{
        from{ transform: rotateX(0deg); opacity: 1; }
        to{ transform: rotateX(90deg); opacity: 0; }
      }
      @keyframes ctaFlipIn{
        from{ transform: rotateX(-90deg); opacity: 0; }
        to{ transform: rotateX(0deg); opacity: 1; }
      }
      /* la casilla central (regalos) también gira al cambiar de regalo y retoma el latido */
      #cta .cs.main .cb.out{ animation: ctaFlipOut 0.28s ease-in forwards; }
      #cta .cs.main .cb.in{ animation: ctaFlipIn 0.28s ease-out 0.26s both, ctaBeat 1.1s ease-in-out 0.54s infinite; }
      /* Líneas que delimitan cada carril: SOLO visibles mientras hay bots activos (html.hasbots). */
      #laneLines{
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        display: none;
      }
      html.hasbots #laneLines,
      html.forcelines #laneLines{
        display: block;
      }
      #laneLines i{
        position: absolute;
        left: 0;
        right: 0;
        height: 0.3rem;
        margin-top: -0.15rem;
        /* líneas de carril como en una pista de atletismo de arcilla: rayas blancas/crema de bloques duros, bien visibles */
        background: repeating-linear-gradient(90deg, #b8893f 0 1.2rem, transparent 1.2rem 2rem);
        opacity: 0.95;
        top: calc((100% - var(--th)) * (var(--k) - 0.5) / var(--n) + var(--th) / 2);
      }
      @keyframes anchIn{
        0%{ transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
        45%{ transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
        100%{ transform: translate(-50%, -50%) scale(1); opacity: 1; }
      }

      /* ===== ESCENA v5: pista de arena con carriles alternados, bordes de césped, salida y meta a cuadros ===== */
      #lanes{
        background-color: var(--sand);
        background-image:
          linear-gradient(to bottom, transparent 50%, rgba(232, 206, 140, 0.95) 50%),
          radial-gradient(rgba(120, 85, 30, 0.25) 0.07rem, transparent 0.1rem),
          radial-gradient(rgba(255, 255, 255, 0.28) 0.06rem, transparent 0.09rem);
        background-size:
          100% calc(200% / (var(--n) + 1)),
          1.1rem 1rem,
          1.7rem 1.3rem;
        background-position: 0 0, 0 0, 0.5rem 0.4rem;
      }
      /* ===== v67: FIEBRE (meta colectiva), pista de "escribe tu país" y extras de la tarjeta ganadora ===== */
      #hype{position:fixed;left:7%;right:7%;top:var(--hype-top,6%);z-index:44;pointer-events:none}
      #hype .hb{position:relative;height:2.6rem;border-radius:1rem;background:rgba(7,38,43,.78);border:.14rem solid var(--cream);overflow:hidden;box-shadow:0 .2rem .6rem rgba(0,0,0,.45)}
      #hype u{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--mint),var(--sun),var(--pink));transition:width .35s ease-out;text-decoration:none}
      #hype b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.35rem;line-height:1;color:#fff;text-shadow:0 .1rem 0 var(--ink);white-space:nowrap}
      #hype.hot .hb{animation:hypeHot .6s ease-in-out infinite alternate}
      #hype.fever .hb{border-color:var(--sun);animation:hypeHot .3s ease-in-out infinite alternate}
      #hype.fever u{width:100%!important;background:linear-gradient(90deg,#ff3d7f,#ffc93c,#5cf2c0,#ffc93c,#ff3d7f);background-size:200% 100%;animation:hypeFlow 1s linear infinite}
      html.nohype #hype{display:none}
      @keyframes hypeHot{to{transform:scale(1.04);box-shadow:0 0 1.2rem rgba(255,201,60,.9)}}
      @keyframes hypeFlow{to{background-position:-200% 0}}
      #hint{position:fixed;left:0;right:0;top:calc(var(--hype-top,6%) + 3.2rem);z-index:44;display:none;justify-content:center;pointer-events:none}
      #hint.show{display:flex}
      /* Pista compacta: título pequeño y banderas en una fila para no tapar la carrera. */
      #hint .hc{display:flex;flex-direction:column;align-items:center;gap:.1rem;max-width:94vw;padding:.3rem .8rem .4rem;border-radius:1rem;background:rgba(7,38,43,.82);border:.12rem solid var(--mint);font-size:1.1rem;line-height:1.15;animation:hintBob 1.4s ease-in-out infinite alternate}
      #hint .ht{font-size:.8em;opacity:.9;white-space:nowrap}
      #hint .hr{display:flex;align-items:center;justify-content:center;gap:.7em;flex-wrap:nowrap;white-space:nowrap}
      #hint img{height:1.3em;border-radius:.15em;border:.06rem solid var(--ink)}
      #hint span{display:inline-flex;align-items:center;gap:.3em}
      @keyframes hintBob{to{transform:translateY(.25rem)}}
      #winner .wxtra{display:flex;flex-wrap:wrap;justify-content:center;gap:.4rem;max-width:80vw}
      #winner .wxtra span{padding:.2rem .65rem;border-radius:1rem;background:rgba(255,201,60,.16);border:.1rem solid var(--sun);font-size:.95rem;color:#fff}
      #winner .wtop{display:flex;flex-direction:column;align-items:center;gap:.5rem;width:100%;color:#fff}
      #winner .wtop[hidden]{display:none!important}
      #winner .wtop-title{font:1rem/1 "Bowlby One","Arial Black",sans-serif;color:var(--sun)}
      #winner .wtop-first{display:flex;justify-content:center;width:100%}
      #winner .wtop-pair{display:flex;justify-content:center;align-items:stretch;gap:.75rem;width:100%}
      #winner .wtop-card{display:flex;flex:0 1 43%;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;min-width:0;max-width:none;padding:.45rem .35rem;border:.1rem solid rgba(217,226,229,.6);border-radius:.8rem;background:rgba(7,38,43,.55);font:700 .85rem/1.15 system-ui,sans-serif}
      #winner .wtop-card.first{flex-basis:68%;padding:.55rem;border-color:var(--sun);background:rgba(255,201,60,.13);font-size:1rem}
      #winner .wtop-avatar{position:relative;display:grid;place-items:center;width:min(9vmin,4.5rem);height:min(9vmin,4.5rem);overflow:hidden;border:.16rem solid #d9e2e5;border-radius:50%;background:#0d3a41;box-shadow:0 0 .45rem rgba(255,255,255,.35)}
      #winner .wtop-card.first .wtop-avatar{width:min(14vmin,6.5rem);height:min(14vmin,6.5rem);border:.22rem solid var(--sun);box-shadow:0 0 .8rem rgba(255,201,60,.8)}
      #winner .wtop-avatar img{width:100%;height:100%;object-fit:cover}
      #winner .wtop-avatar b{display:none;color:#fff;font:1.3rem/1 "Bowlby One","Arial Black",sans-serif}
      #winner .wtop-avatar.noimg img{display:none}
      #winner .wtop-avatar.noimg b{display:block}
      #winner .wtop-place{padding:.2em .5em;border-radius:999px;background:var(--sun);color:var(--ink);font:1rem/1.1 "Bowlby One","Arial Black",sans-serif}
      #winner .wtop-name{max-width:100%;overflow-wrap:anywhere}
      #connectorStatus{
        position:fixed;
        right:.75rem;
        bottom:calc(.75rem + var(--overlay-lift));
        z-index:9999;
        max-width:min(70vw,16rem);
        min-height:1.7rem;
        padding:.35rem .65rem;
        overflow:hidden;
        border:.12rem solid rgba(255,255,255,.8);
        border-radius:999px;
        color:#fff;
        font:800 .65rem/1.2 system-ui,sans-serif;
        text-overflow:ellipsis;
        white-space:nowrap;
        box-shadow:0 .15rem .5rem rgba(0,0,0,.5);
        cursor:pointer;
        pointer-events:auto;
      }
      #connectorStatus.connected{background:#168a50}
      #connectorStatus.disconnected{background:#c6283d}
      #versionBadge{
        position:fixed;
        left:.75rem;
        bottom:calc(.75rem + var(--overlay-lift));
        z-index:9999;
        padding:.3rem .5rem;
        border:.1rem solid rgba(255,255,255,.55);
        border-radius:999px;
        background:rgba(7,38,43,.78);
        color:#fff;
        font:800 .6rem/1 system-ui,sans-serif;
        box-shadow:0 .15rem .5rem rgba(0,0,0,.4);
        pointer-events:none;
      }

      /* ===== FIX UX: respetar la zona inferior de TikTok Live (chat, caja de comentarios, regalos) =====
         Todo lo propio queda POR ENCIMA de la zona de TikTok (--bot, 27 % por defecto en vertical; ?bottom=NN la ajusta).
         El estado de conexión y la versión ya no viven dentro de esa zona: van en la franja libre bajo las llamadas de acción. */
      @media (orientation: portrait){
        #cta{
          bottom: calc(var(--bot, 27%) + var(--overlay-lift) + env(safe-area-inset-bottom, 0px));
        }
        html body #app{
          bottom: calc(var(--bot, 27%) + var(--cta-h) + var(--overlay-lift) + env(safe-area-inset-bottom, 0px));
        }
        #connectorStatus,
        #versionBadge{
          bottom: calc(var(--bot, 27%) + var(--overlay-lift) + env(safe-area-inset-bottom, 0px) - 2.3rem);
        }
        #connectorStatus{
          min-height: 1.3rem;
          padding: 0.2rem 0.55rem;
          font-size: 0.55rem;
          right: 0.5rem;
        }
        #versionBadge{
          padding: 0.2rem 0.4rem;
          font-size: 0.5rem;
          left: 0.5rem;
          opacity: 0.6;
        }
        /* conectado: se atenúa a los 5 s para no distraer; desconectado: se queda a plena opacidad */
        #connectorStatus.connected{
          animation: csFade 0.6s ease 5s forwards;
        }
      }
      @keyframes csFade{ to{ opacity: 0.8; } }
      #cd{ display: none !important; } /* cuenta regresiva desactivada */

      /* ===== Narradora (avatar que "habla" cuando suena la voz): franja entre la pista y las llamadas de acción.
         ?cast=0 la oculta. Sigue por encima de la zona inferior de TikTok. ===== */
      :root{ --cast-h: 3.3rem; }
      html body #app{
        bottom: calc(var(--bot, 7%) + var(--cta-h) + var(--overlay-lift) + var(--cast-h));
      }
      @media (orientation: portrait){
        html body #app{
          bottom: calc(var(--bot, 27%) + var(--cta-h) + var(--overlay-lift) + var(--cast-h) + env(safe-area-inset-bottom, 0px));
        }
      }
      #cast{
        position: fixed;
        left: 3%;
        right: var(--padr, 3%);
        height: var(--cast-h);
        bottom: calc(var(--bot, 7%) + var(--overlay-lift));
        z-index: 43;
        display: flex;
        align-items: center;
        gap: 0.6rem;
        pointer-events: none;
      }
      @media (orientation: portrait){
        #cast{ bottom: calc(var(--bot, 27%) + var(--overlay-lift) + env(safe-area-inset-bottom, 0px)); }
      }
      #cast .cav{
        flex: 0 0 auto;
        width: calc(var(--cast-h) - 0.3rem);
        height: calc(var(--cast-h) - 0.3rem);
        border-radius: 50%;
        border: 0.14rem solid var(--sun);
        background: var(--ink2);
        box-shadow: 0 0.15rem 0.5rem rgba(0, 0, 0, 0.5);
        overflow: hidden;
        animation: castIdle 3s ease-in-out infinite;
      }
      #cast.talk .cav{
        animation: castTalk 0.45s ease-in-out infinite alternate;
        box-shadow: 0 0 0.9rem rgba(255, 201, 60, 0.95), 0 0.15rem 0.5rem rgba(0, 0, 0, 0.5);
      }
      #cast svg{ display: block; width: 100%; height: 100%; }
      #cast .eye{ transform-box: fill-box; transform-origin: center; animation: castBlink 4s infinite; }
      #cast .mouth{ transform-box: fill-box; transform-origin: center; }
      #cast.talk .mouth{ animation: castMouth 0.22s ease-in-out infinite alternate; }
      #cast .bub{
        position: relative;
        max-width: 100%;
        padding: 0.2rem 0.55rem;
        border-radius: 0.8rem;
        background: var(--cream);
        color: var(--ink);
        border: 0.12rem solid var(--ink);
        font: 800 0.8rem/1.2 "Nunito", system-ui, sans-serif;
        box-shadow: 0 0.15rem 0.5rem rgba(0, 0, 0, 0.45);
        opacity: 0;
        transform: translateX(-0.4rem) scale(0.95);
        transform-origin: left center;
        transition: opacity 0.2s ease, transform 0.2s ease;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      #cast .bub::before{
        content: "";
        position: absolute;
        left: -0.42rem;
        top: 50%;
        width: 0.7rem;
        height: 0.7rem;
        background: var(--cream);
        border-left: 0.12rem solid var(--ink);
        border-bottom: 0.12rem solid var(--ink);
        transform: translateY(-50%) rotate(45deg);
      }
      #cast.say .bub{ opacity: 1; transform: none; }
      @keyframes castIdle{ 50%{ transform: translateY(-0.12rem); } }
      @keyframes castTalk{ to{ transform: translateY(-0.2rem) scale(1.05); } }
      @keyframes castBlink{ 0%, 94%, 100%{ transform: scaleY(1); } 97%{ transform: scaleY(0.1); } }
      @keyframes castMouth{ from{ transform: scaleY(0.4); } to{ transform: scaleY(2.6) scaleX(0.9); } }
      /* La narradora va DEBAJO de las llamadas de acción: las CTA suben el alto de la franja de la narradora. */
      html body #cta{
        bottom: calc(var(--bot, 7%) + var(--overlay-lift) + var(--cast-h));
      }
      @media (orientation: portrait){
        html body #cta{
          bottom: calc(var(--bot, 27%) + var(--overlay-lift) + var(--cast-h) + env(safe-area-inset-bottom, 0px));
        }
      }

      /* ===== Narradora interactiva: expresiones según el evento (data-mood = idle · happy · excited · surprised · love · sad) ===== */
      :root{ --cast-h: 9.8rem; }
      #cast .e-happy, #cast .e-wide, #cast .e-heart,
      #cast .mo-grin, #cast .mo-o, #cast .mo-frown, #cast .mo-talk,
      #cast .spark, #cast .sweat{ display: none; }
      #cast .blush{ opacity: 0.45; transition: opacity 0.2s; }
      #cast .brow{ transform-box: fill-box; transform-origin: center; transition: transform 0.2s ease; }
      /* happy */
      #cast[data-mood="happy"] .e-norm, #cast[data-mood="happy"] .mo-smile{ display: none; }
      #cast[data-mood="happy"] .e-happy, #cast[data-mood="happy"] .mo-grin{ display: inline; }
      #cast[data-mood="happy"] .blush{ opacity: 0.8; }
      /* excited */
      #cast[data-mood="excited"] .e-norm, #cast[data-mood="excited"] .mo-smile{ display: none; }
      #cast[data-mood="excited"] .e-wide, #cast[data-mood="excited"] .mo-grin, #cast[data-mood="excited"] .spark{ display: inline; }
      #cast[data-mood="excited"] .brow{ transform: translateY(-3px); }
      #cast[data-mood="excited"] .blush{ opacity: 0.85; }
      /* surprised */
      #cast[data-mood="surprised"] .e-norm, #cast[data-mood="surprised"] .mo-smile{ display: none; }
      #cast[data-mood="surprised"] .e-wide, #cast[data-mood="surprised"] .mo-o{ display: inline; }
      #cast[data-mood="surprised"] .brow{ transform: translateY(-4px); }
      /* love */
      #cast[data-mood="love"] .e-norm{ display: none; }
      #cast[data-mood="love"] .e-heart{ display: inline; }
      #cast[data-mood="love"] .blush{ opacity: 0.9; }
      /* sad / ouch */
      #cast[data-mood="sad"] .mo-smile{ display: none; }
      #cast[data-mood="sad"] .mo-frown, #cast[data-mood="sad"] .sweat{ display: inline; }
      #cast[data-mood="sad"] .brow.bl{ transform: rotate(-16deg) translateY(-1px); }
      #cast[data-mood="sad"] .brow.br{ transform: rotate(16deg) translateY(-1px); }
      /* hablando: la boca se mueve (salvo con cara de sorpresa) */
      #cast.talk:not([data-mood="surprised"]) .mo-smile,
      #cast.talk:not([data-mood="surprised"]) .mo-grin,
      #cast.talk:not([data-mood="surprised"]) .mo-frown{ display: none; }
      #cast.talk:not([data-mood="surprised"]) .mo-talk{ display: inline; }
      #cast .spark{ transform-box: fill-box; transform-origin: center; animation: castTwinkle 0.5s ease-in-out infinite alternate; }
      #cast .spark.s2{ animation-delay: 0.2s; }
      #cast[data-mood="excited"] .cav{ animation: castHype 0.3s ease-in-out infinite alternate; box-shadow: 0 0 1rem rgba(255, 61, 127, 0.95), 0 0.15rem 0.5rem rgba(0, 0, 0, 0.5); }
      #cast[data-mood="surprised"] .cav{ animation: castHype 0.5s ease-in-out infinite alternate; }
      @keyframes castTwinkle{ from{ transform: scale(0.5) rotate(0deg); opacity: 0.6; } to{ transform: scale(1.15) rotate(20deg); opacity: 1; } }
      @keyframes castHype{ from{ transform: translateY(0) rotate(-3deg); } to{ transform: translateY(-0.3rem) scale(1.07) rotate(3deg); } }

      /* Narradora a la DERECHA: avatar pegado al borde derecho (dentro del margen de botones de TikTok) y el globo a su izquierda. */
      #cast{ flex-direction: row-reverse; }
      #cast .bub{
        transform-origin: right center;
        transform: translateX(0.4rem) scale(0.95);
        margin-left: auto;
      }
      #cast.say .bub{ transform: none; }
      #cast .bub::before{
        left: auto;
        right: -0.42rem;
        border-left: 0;
        border-bottom: 0;
        border-right: 0.12rem solid var(--ink);
        border-top: 0.12rem solid var(--ink);
      }

      /* Narradora pegada al suelo (esquina inferior derecha) y más grande. Ya no reserva espacio en la columna:
         la pista y los botones recuperan su lugar. Tamaño: --cast-sz. */
      :root{ --cast-h: 0px; --cast-sz: 12rem; }
      #cast{
        bottom: env(safe-area-inset-bottom, 0px);
        height: var(--cast-sz);
        right: 0.5rem;
        left: 0.5rem;
      }
      @media (orientation: portrait){
        #cast{ bottom: env(safe-area-inset-bottom, 0px); }
      }
      #cast .cav{
        width: var(--cast-sz);
        height: var(--cast-sz);
        border-bottom-left-radius: 50%;
      }
      #cast .bub{ font-size: 0.85rem; }
      /* Etiqueta de versión y botón de conexión: uno junto al otro, a la izquierda; el botón de conexión, más grande. */
      #versionBadge{
        left: 0.5rem;
        min-height: 2rem;
        display: flex;
        align-items: center;
        padding: 0.2rem 0.55rem;
        font-size: 0.65rem;
        opacity: 0.85;
      }
      #connectorStatus{
        left: 3.9rem;
        right: auto;
        min-height: 2rem;
        padding: 0.4rem 0.95rem;
        font-size: 0.82rem;
        max-width: calc(100vw - 3.9rem - var(--cast-sz) - 1.4rem);
        display: flex;
        align-items: center;
      }
      @media (orientation: portrait){
        #connectorStatus,
        #versionBadge{
          bottom: calc(var(--bot, 27%) + var(--overlay-lift) + env(safe-area-inset-bottom, 0px) - 2.7rem);
        }
      }

      /* ===== Narradora en VIDEO (opcional): clips en la carpeta avatar/ (idle, talk, happy, excited, surprised, love, sad).
         Si no hay clips, se queda el avatar dibujado. ?castdir=ruta · ?chroma=1 (fondo verde) · ?castframe=0 (sin marco/círculo). ===== */
      #cast .cav{ position: relative; }
      #cast .cvid{ position: absolute; inset: 0; display: none; }
      #cast.vid .cvid{ display: block; }
      #cast.vid svg{ display: none; }
      #cast .cvid video,
      #cast .cvid canvas{
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 0.15s ease;
      }
      #cast .cvid video.on{ opacity: 1; }
      #cast.chroma .cvid video{ opacity: 0 !important; }
      #cast.chroma .cvid canvas{ opacity: 1; }
      #cast.vid .cav,
      #cast.vid[data-mood] .cav{ animation: none !important; box-shadow: 0 0.15rem 0.5rem rgba(0, 0, 0, 0.5); }
      #cast.noframe .cav{ border: 0; background: none; box-shadow: none !important; border-radius: 0; overflow: visible; }
      #cast.noframe .cvid video,
      #cast.noframe .cvid canvas{ object-fit: contain; object-position: center bottom; }

      /* (el pulso de los botones CTA con la líder cerca de la meta está en el bloque v3 al final de esta hoja de estilos) */
      /* El avatar nunca sube más arriba de los botones: su alto máximo es la franja libre bajo ellos. */
      :root{ --cast-sz: min(12rem, 27vh); }
      @media (orientation: landscape){ :root{ --cast-sz: min(12rem, 10vh); } }

      /* ═══════════════ v3 ═══════════════ */

      /* 1) Bandera física al inicio de cada carril: clavada en la arena ANTES de la línea de salida (la tortuga pasa por delante) */
      #lanes .fl{
        position: absolute;
        z-index: 1;
        pointer-events: none;
        left: calc(var(--tw) + 0.4rem);
        top: calc(var(--fy, var(--rt)) + var(--th) * 0.88 - var(--fh, 2.6rem));
        height: var(--fh, 2.6rem);
        width: calc(var(--g) - 1rem);
      }
      #lanes .fl .pole{
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0.18rem;
        border-radius: 0.1rem;
        background: linear-gradient(90deg, #fff6e0, #b9a574);
        box-shadow: 0 0 0 0.05rem var(--ink);
      }
      #lanes .fl .pole::before{
        content: "";
        position: absolute;
        left: 50%;
        top: -0.24rem;
        width: 0.42rem;
        height: 0.42rem;
        margin-left: -0.21rem;
        border-radius: 50%;
        background: var(--sun);
        border: 0.07rem solid var(--ink);
      }
      #lanes .fl .cloth{
        position: absolute;
        left: 0.18rem;
        top: 0.08rem;
        width: calc(100% - 0.18rem);
        height: 58%;
        overflow: hidden;
        border: 0.1rem solid var(--ink);
        border-left: 0;
        border-radius: 0 0.25rem 0.25rem 0;
        box-shadow: 0 0.12rem 0.3rem rgba(0, 0, 0, 0.45);
        transform-origin: left center;
        animation: flWave 1.5s ease-in-out infinite alternate;
      }
      #lanes .fl .cloth img{
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #lanes .fl .cloth::after{
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(100deg, rgba(255, 255, 255, 0.3), transparent 40%, rgba(0, 0, 0, 0.22));
      }
      #lanes .fl .base{
        position: absolute;
        left: -0.3rem;
        bottom: -0.14rem;
        width: 0.8rem;
        height: 0.3rem;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.35);
      }
      @keyframes flWave{
        from{ transform: skewY(-4deg) scaleX(1); }
        to{ transform: skewY(4deg) scaleX(0.92); }
      }

      /* 2) Fuego y destellos de la líder (partículas que genera leaderFx(); van detrás de la tortuga) */
      #lanes .trk .tur.burn::after{
        content: "";
        position: absolute;
        z-index: -1;
        right: 88%;
        top: 46%;
        width: calc(var(--th) * 0.85);
        height: 30%;
        border-radius: 999px 0 0 999px / 50%;
        background: linear-gradient(90deg, rgba(255, 61, 31, 0), rgba(255, 122, 31, 0.8) 55%, rgba(255, 236, 130, 0.95));
        filter: blur(1.5px);
        transform-origin: right center;
        animation: burnFlick 0.14s ease-in-out infinite alternate;
        pointer-events: none;
      }
      @keyframes burnFlick{
        from{ transform: scaleX(0.8) scaleY(0.9); opacity: 0.85; }
        to{ transform: scaleX(1.1) scaleY(1.1); opacity: 1; }
      }
      #lanes .fx{
        position: absolute;
        z-index: 1;
        pointer-events: none;
      }
      #lanes .fx-fire{
        border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
        background: radial-gradient(circle at 50% 62%, #fff8b0 0, #ffd23c 32%, #ff7a1f 62%, rgba(255, 61, 31, 0) 100%);
        box-shadow: 0 0 0.6rem rgba(255, 122, 31, 0.9);
        animation: fxFire 0.7s ease-out forwards;
      }
      @keyframes fxFire{
        from{ transform: translate(-50%, -50%) scale(1); opacity: 0.95; }
        to{ transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.15); opacity: 0; }
      }
      #lanes .fx-spd{
        height: 0.16rem;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, #fff 55%, #ffe27a);
        box-shadow: 0 0 0.35rem #ffc93c;
        transform-origin: right center;
        animation: fxSpd 0.52s ease-out forwards;
      }
      @keyframes fxSpd{
        from{ transform: translate(0, -50%) scaleX(0.15); opacity: 0; }
        25%{ opacity: 1; }
        to{ transform: translate(var(--dx), -50%) scaleX(1); opacity: 0; }
      }
      #lanes .fx-spk{
        font-style: normal;
        line-height: 1;
        color: #fff;
        text-shadow: 0 0 0.35rem #ffc93c, 0 0 0.8rem #ff7a1f;
        animation: fxSpk 0.8s ease-out forwards;
      }
      @keyframes fxSpk{
        from{ transform: translate(-50%, -50%) scale(0.3) rotate(0deg); opacity: 1; }
        to{ transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3) rotate(180deg); opacity: 0; }
      }

      /* 3) Barra FIEBRE neón: el degradado verde ➔ dorado ➔ rosa cubre toda la barra y el relleno lo descubre */
      #hype .hb{
        border-color: #c9fff0;
        box-shadow: 0 0 0.8rem rgba(92, 242, 192, 0.6), inset 0 0 0.7rem rgba(0, 0, 0, 0.65), 0 0.2rem 0.6rem rgba(0, 0, 0, 0.45);
      }
      #hype u{
        background: linear-gradient(90deg, #39ff88 0%, #ffd23c 55%, #ff3d9a 100%);
        background-repeat: no-repeat;
        box-shadow: 0 0 1rem rgba(255, 210, 60, 0.85), 0 0 0.35rem #fff inset;
      }
      #hype u::before{
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.26) 0 0.5rem, transparent 0.5rem 1rem);
        animation: hypeStripes 1.1s linear infinite;
      }
      #hype u::after{
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 0.7rem;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.95));
        filter: blur(0.5px);
      }
      #hype b{
        z-index: 1;
        letter-spacing: 0.03em;
        text-shadow: 0 0.1rem 0 var(--ink), 0 0 0.6rem rgba(0, 0, 0, 0.8);
      }
      @keyframes hypeStripes{ to{ background-position: 2rem 0; } }
      #hype .hs{
        position: absolute;
        top: 50%;
        display: none;
        z-index: 0;
        font-style: normal;
        font-size: 1.2rem;
        line-height: 1;
        color: #fff;
        text-shadow: 0 0 0.5rem #ffc93c, 0 0 1rem #ff3d9a;
        pointer-events: none;
      }
      #hype.fever .hs{ display: block; animation: hsTw 0.7s ease-in-out infinite; }
      #hype .hs1{ left: 6%; animation-delay: 0s !important; }
      #hype .hs2{ left: 27%; animation-delay: 0.18s !important; }
      #hype .hs3{ left: 49%; animation-delay: 0.36s !important; }
      #hype .hs4{ left: 71%; animation-delay: 0.12s !important; }
      #hype .hs5{ left: 92%; animation-delay: 0.3s !important; }
      @keyframes hsTw{
        0%, 100%{ transform: translateY(-50%) scale(0.3) rotate(0deg); opacity: 0; }
        50%{ transform: translateY(-50%) scale(1.25) rotate(90deg); opacity: 1; }
      }
      #hype.fever .hb{
        box-shadow: 0 0 1.4rem rgba(255, 61, 154, 0.95), 0 0 2.4rem rgba(255, 210, 60, 0.7), inset 0 0 0.7rem rgba(0, 0, 0, 0.4);
      }

      /* 4) Letrero a cuadros ¡META! sobre la línea de llegada (extremo derecho de la pista, arriba del todo).
         z-index 0: las tortugas (.trk, z-index 1) pasan POR DELANTE del letrero al llegar. */
      #metaBanner{
        position: absolute;
        z-index: 0;
        right: -0.1rem;
        top: -0.4rem;
        padding: 0.24rem;
        border: 0.14rem solid var(--ink);
        border-radius: 0.55rem;
        background: repeating-conic-gradient(var(--ink) 0 25%, #fff 0 50%) 0 0 / 0.46rem 0.46rem;
        box-shadow: 0 0.2rem 0.5rem rgba(0, 0, 0, 0.55), 0 0 0.7rem rgba(255, 255, 255, 0.35);
        transform-origin: 100% 50%;
        pointer-events: none;
        animation: metaSway 2.4s ease-in-out infinite alternate;
      }
      #metaBanner span{
        display: block;
        padding: 0.14rem 0.65rem 0.18rem;
        border-radius: 0.35rem;
        background: linear-gradient(180deg, #ff3d7f, #c1175a);
        font: 1.05rem/1 "Bowlby One", "Arial Black", sans-serif;
        letter-spacing: 0.04em;
        color: #fff;
        text-shadow: 0 0.1rem 0 var(--ink);
        white-space: nowrap;
      }
      @keyframes metaSway{
        from{ transform: rotate(-1.4deg); }
        to{ transform: rotate(1.4deg); }
      }
      html.lead-near #metaBanner{ animation: metaHot 0.45s ease-in-out infinite alternate; }
      @keyframes metaHot{
        from{ transform: scale(1); box-shadow: 0 0.2rem 0.5rem rgba(0, 0, 0, 0.55), 0 0 0.7rem rgba(255, 201, 60, 0.6); }
        to{ transform: scale(1.14); box-shadow: 0 0.2rem 0.5rem rgba(0, 0, 0, 0.55), 0 0 1.6rem rgba(255, 201, 60, 1), 0 0 0.6rem #fff; }
      }

      /* 5) Estado de conexión: verde brillante con punto pulsante */
      #connectorStatus span{
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #connectorStatus .cdot{
        flex: none;
        width: 0.7em;
        height: 0.7em;
        margin-right: 0.55em;
        border-radius: 50%;
        background: #ffd3d9;
        border: 0.1em solid rgba(0, 0, 0, 0.35);
      }
      #connectorStatus.connected{
        background: linear-gradient(180deg, #34f08a, #10c25e);
        border-color: #d6ffe6;
        color: #02260f;
        letter-spacing: 0.04em;
        text-shadow: 0 0.05em 0 rgba(255, 255, 255, 0.35);
        box-shadow: 0 0 0.9rem rgba(52, 240, 138, 0.95), 0 0.15rem 0.5rem rgba(0, 0, 0, 0.5);
      }
      #connectorStatus.connected .cdot{
        background: #fff;
        border-color: #05381b;
        animation: cdotPulse 1.1s ease-out infinite;
      }
      @keyframes cdotPulse{
        0%{ transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.95), 0 0 0.45em #fff; }
        60%{ transform: scale(1.15); box-shadow: 0 0 0 0.7em rgba(255, 255, 255, 0), 0 0 0.45em #fff; }
        100%{ transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 255, 255, 0), 0 0 0.45em #fff; }
      }

      /* 6) CTA: con la líder cerca de la meta (≥80 %) el regalo central y los potenciadores pulsan; a partir del 92 % más fuerte y rápido */
      #cta.near .cs{ animation: ctaNear 0.55s ease-in-out infinite alternate; }
      #cta.near .cs.s0{ animation-delay: 0.1s; }
      #cta.near .cs.s1{ animation-delay: 0.2s; }
      #cta.near .cs.main{ animation: ctaNearMain 0.4s ease-in-out infinite alternate; }
      #cta.near .cb .x{ animation: ctaXHot 0.35s ease-in-out infinite; }
      #cta.near2 .cs{ animation-duration: 0.32s; }
      #cta.near2 .cs.main{ animation-duration: 0.22s; }
      #cta.near2 .cb .x{ animation-duration: 0.22s; }
      @keyframes ctaNear{
        from{ transform: scale(1); filter: drop-shadow(0 0 0.25em rgba(255, 61, 127, 0.55)); }
        to{ transform: scale(1.1); filter: drop-shadow(0 0 0.8em rgba(255, 201, 60, 1)); }
      }
      @keyframes ctaNearMain{
        from{ transform: scale(1); filter: drop-shadow(0 0 0.3em rgba(255, 61, 127, 0.7)); }
        to{ transform: scale(1.2); filter: drop-shadow(0 0 1.1em rgba(255, 201, 60, 1)) drop-shadow(0 0 0.4em #fff); }
      }
      @keyframes ctaXHot{
        0%, 100%{ transform: scale(1) rotate(-6deg); }
        50%{ transform: scale(1.3) rotate(6deg); }
      }

      /* ═══════════════ v4 · ZONA SEGURA TIKTOK LIVE (9:16) ═══════════════
         Este bloque va AL FINAL y manda sobre todas las reglas de posición anteriores (que se pisaban entre sí).
         De arriba abajo, en vertical (% del alto de pantalla):
            0 – 13 %   zona de TikTok: foto del creador, espectadores, ranking → vacío
           13 – 21 %   barra FIEBRE (#hype) + pista "escribe tu país" (#hint)
           22 – ~64 %  PISTA de carrera (#app / #lanes)  ← --top
           ~64 – 73 %  llamadas de acción (#cta) a todo el ancho
           22 %+  narradora (#cast) superpuesta en la esquina superior izquierda de la pista
           franja fina estado de conexión (#connectorStatus) + versión (#versionBadge)
           73 – 100 %  zona de TikTok: chat flotante, caja de comentarios, regalos → vacío  ← --bot
         Ajustes por URL: ?top=22  ?bottom=27  ?hypetop=13.5  ?safe=1 (más margen derecho) */
      @media (orientation: portrait){
        :root{
          --top: 22%;
          --bot: 27%;
          --padr: 5%;
          --padl: 4%;
          --overlay-lift: 0px;
          --hype-top: 13.5%;
          --strip-h: 1.9rem;
          --safe-b: env(safe-area-inset-bottom, 0px);
          --cast-sz: 5.2rem;
        }
        html body #app{
          top: var(--top);
          bottom: calc(var(--bot) + var(--safe-b) + var(--strip-h) + var(--cta-h) + 0.4rem);
          left: var(--padl);
          right: var(--padr);
        }
        /* Barra FIEBRE justo debajo de la zona de TikTok; la pista "escribe tu país" cuelga de ella */
        html body #hype{ top: var(--hype-top); left: 6%; right: 6%; }
        html body #hype .hb{ height: 2.3rem; }
        html body #hype b{ font-size: 1.15rem; }
        html body #hint{ top: calc(var(--hype-top) + 2.3rem + 0.35rem); left: 0; right: 0; }
        html body #hint .hc{ font-size: 0.85rem; padding: 0.2rem 0.7rem 0.25rem; }
        /* CTA: bajo la pista, a la izquierda; dejan libre la columna de la narradora */
        html body #cta{
          left: 0;
          width: auto;
          right: var(--padr);
          bottom: calc(var(--bot) + var(--safe-b) + var(--strip-h));
          padding: 0 0 0 var(--padl);
        }
        /* Narradora: esquina inferior derecha de la zona libre (encima de la caja de regalos, nunca encima) */
        html body #cast{
          left: calc(var(--padl) + 0.4rem);
          right: auto;
          top: calc(var(--top) + 0.5rem);
          bottom: auto;
          z-index: 60;
          width: var(--cast-sz);
          height: var(--cast-sz);
          flex-direction: row;
        }
        html body #cast .cav{ width: 100%; height: 100%; border-radius: 50%; }
        html body #cast .bub{
          position: absolute;
          left: calc(100% + 0.5rem);
          right: auto;
          top: 50%;
          bottom: auto;
          margin: 0;
          width: max-content;
          max-width: min(15rem, 64vw);
          transform-origin: left center;
          transform: translate(-0.3rem, -50%) scale(0.95);
        }
        html body #cast.say .bub{ transform: translateY(-50%); }
        html body #cast .bub::before{ display: none; }
