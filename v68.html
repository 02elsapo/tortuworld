                ? "turbo"
                : t.mult >= 2 || isBotT
                  ? "happy"
                  : "sad";
          t.tur.classList.toggle("first", k === firstK);
          /* El cambio de cara no es inmediato: la nueva expresión debe mantenerse MOOD_STABLE s seguidos y la actual
             debe llevar al menos MOOD_HOLD s puesta; después se funde con la anterior (ver CSS .mo). */
          t.moodAge = (t.moodAge || 0) + dt;
          if (mood !== t.cand) { t.cand = mood; t.candT = 0; } else t.candT = (t.candT || 0) + dt;
          if (t.mood !== mood && (!t.mood || (t.moodAge >= MOOD_HOLD && t.candT >= MOOD_STABLE))) {
            t.mood = mood;
            t.moodAge = 0;
            t.tur.classList.remove("mood-sad", "mood-happy", "mood-turbo", "mood-lead", "mood-tired");
            t.tur.classList.add("mood-" + mood);
          }
          /* ===== MARCHA CON FÍSICA REAL =====
             1) Se mide cuánto avanzó de verdad el caparazón (t.va, u/s) y se pasa a unidades del SVG por segundo (vb).
             2) Una pata apoyada está fija al suelo: respecto al cuerpo se mueve hacia atrás justo a velocidad vb (no patina).
                Por eso el ritmo del paso sale de vb: fq = vb · duty / (2 · amplitud). Si no avanza, las patas quedan plantadas.
             3) Dos pares diagonales (trote) alternan; con duty > 0.5 siempre hay al menos un par en el suelo.
             4) El caparazón NO sube ni baja: se inclina sobre las patas (skewX con pivote en el suelo = sin altura),
                con inercia al acelerar y un vaivén en cada paso. Zigzaguea de lado a lado y gira hacia donde va. */
          const dp = S.pos[k] - p0;
          t.va += (dp / dt - t.va) * Math.min(1, dt * 10);
          const vb = Math.max(0, t.va) * GEO.ppu * GEO.u;
          const mv = Math.min(1, Math.max(0, (t.va - 0.01) / 0.05));
          const duty = 0.62 - 0.1 * Math.min(1, vb / 8);
          let fq = 0.2 + 0.06 * vb,
            A = (vb * duty) / (2 * fq);
          if (A > 6.5) {
            A = 6.5;
            fq = (vb * duty) / 13;
          } else if (A < 1) A = 1;
          t.fa += (fq * mv - t.fa) * Math.min(1, dt * 6);
          t.am += (A - t.am) * Math.min(1, dt * 4);
          t.ph += dt * Math.PI * 2 * t.fa;
          const step = Math.floor(t.ph / Math.PI); /* un apoyo de pata cada media vuelta */
          if (S.go && S.slotUser[k] && step !== t.step) {
            t.step = step;
            SFX.step(speedRatio);
          }
          t.hl += (0 - t.hl) * Math.min(1, dt * 4);
          const phi = (t.ph / (Math.PI * 2)) % 1,
            a = t.am,
            E = t.e;
          const foot = (o) => {
            const u = (phi + o) % 1;
            let x, y;
            if (u < duty) {
              x = a * (1 - (2 * u) / duty); /* apoyada: va hacia atrás con el suelo */
              y = 0;
            } else {
              const w = (u - duty) / (1 - duty);
              /* en el aire vuelve adelante con curva Hermite: sale y aterriza moviéndose hacia atrás a la velocidad del suelo (sin patinar ni dar tirones) */
              const mT = (-2 * a / duty) * (1 - duty) * 0.6,
                w2 = w * w, w3 = w2 * w;
              x = (2 * w3 - 3 * w2 + 1) * -a + (w3 - 2 * w2 + w) * mT + (-2 * w3 + 3 * w2) * a + (w3 - w2) * mT;
              y = -(1.8 + 0.3 * a) * Math.sin(Math.PI * w);
            }
            return "translate(" + x.toFixed(2) + " " + y.toFixed(2) + ")";
          };
          let fA = foot(0),
            fB = foot(0.5);
          let legS = 1;
          const lg = (f, cx, cy) => (legS < 1 ? f + " translate(" + cx + " " + cy + ") scale(" + legS.toFixed(2) + ") translate(" + -cx + " " + -cy + ")" : f);
          E.lnB.setAttribute("transform", lg(fA, 18, 39));
          E.lfF.setAttribute("transform", lg(fA, 44, 38));
          E.lnF.setAttribute("transform", lg(fB, 47, 39));
          E.lfB.setAttribute("transform", lg(fB, 26, 38));
          /* inclinación: inercia (acelerar = el caparazón se queda atrás) + vaivén de cada paso */
          const acl = (t.va - t.vaPrev) / dt;
          t.vaPrev = t.va;
          const leanT =
            Math.max(-2, Math.min(2, acl * 0.9)) +
            0.9 * Math.sin(4 * Math.PI * phi) * Math.min(1, t.am / 2.5) * mv;
          t.lean += (leanT - t.lean) * Math.min(1, dt * 10);
          /* llora mientras esté entre los últimos 3; si sube de puesto, sigue llorando 3 s más (sin cambios bruscos) */
          if (lastSet.has(k)) t.cryT = 3;
          else if (t.cryT > 0) t.cryT = Math.max(0, t.cryT - dt);
          t.tur.classList.toggle("cry", t.cryT > 0);
          t.tur.classList.toggle("charge", !!t.sprint && !(S.over || S.winner));
          const lean = Math.max(-9, Math.min(9, t.lean + t.jl)),
            roll = 1.2 * Math.sin(2 * Math.PI * phi) * Math.min(1, t.am / 2.5) * mv, /* leve balanceo al apoyar cada par de patas */
            sk = " translate(0 43) skewX(" + lean.toFixed(2) + ") translate(0 -43)",
            skB = " rotate(" + roll.toFixed(2) + " 32 40)" + sk,
            skH = " rotate(" + roll.toFixed(2) + " 34 38)" + sk;
          E.bd.setAttribute("transform", skB);
          E.hd.setAttribute(
            "transform",
            "translate(" +
              (
                sp * 0.25 +
                Math.sin(2 * Math.PI * phi - 0.6) * 0.9 * Math.min(1, t.am / 2.5) * mv + /* el cuello acompaña el paso */
                Math.sin(tNow * 0.8 + t.w) * 1.2 * t.hl
              ).toFixed(2) +
              " " +
              (-2.8 * t.hl + sp * 0.12 + Math.sin(tNow * 1.5 + t.w) * 0.25 + Math.sin(4 * Math.PI * phi) * 0.3 * Math.min(1, t.am / 2.5) * mv).toFixed(2) + /* respiración + leve vaivén */
              ")" +
              skH,
          );
          E.tl.setAttribute(
            "transform",
            "rotate(" +
              (Math.sin(t.ph + 1) * 10 * Math.min(1, a / 2) * mv).toFixed(2) +
              " 10 28)",
          );
          /* CARRIL PROPIO: cada tortuga pasea al azar de arriba a abajo SOLO dentro de su carril (±20 % del alto del carril).
             Cada 2-6 s elige una altura nueva y se desplaza suave hacia ella mientras camina; gira hacia donde va. */
          {
            const li = C.indexOf(c),
              bh = GEO.k ? GEO.H / C.length : 0,
              over = Math.max(0, (GEO.th - bh) / 2), /* cuánto sobresale la tortuga de su carril por arriba y por abajo */
              fight = inFight(t),
              rng = bh * (fight ? 0.7 : 0.2), /* al embestir o esquivar puede salirse del carril */
              lo = li === 0 ? over : -rng, /* la 1.ª y la última no se salen de la pista */
              hi = li === C.length - 1 ? -over : rng,
              vxp = Math.max(t.va * GEO.ppu, 6);
            t.zTimer -= dt;
            if (t.zTimer <= 0) {
              t.zTimer = 2 + Math.random() * 4;
              t.zT = lo + Math.random() * Math.max(0, hi - lo);
            }
            if (t.dodgeT > 0) t.zT = t.dodgeDir * rng; /* tras el impacto: una sale hacia arriba y la otra hacia abajo */
            t.zT = Math.max(lo, Math.min(hi, t.zT));
            const zt = t.zy + (t.zT - t.zy) * (fight ? 1 : mv);
            t.zvy += ((zt - t.zy) * 3 - t.zvy * 4) * dt;
            const vyMax = (3 + 0.45 * vxp) * (fight ? 8 : 0.3 + 0.7 * mv); /* en embestida/esquive se mueve rápido aunque esté frenada */
            t.zvy = Math.max(-vyMax, Math.min(vyMax, t.zvy));
            t.zy += t.zvy * dt;
            if (t.zy < lo) { t.zy = lo; t.zvy = Math.max(0, t.zvy); }
            if (t.zy > hi) { t.zy = hi; t.zvy = Math.min(0, t.zvy); }
            const psiT = (Math.max(-0.18, Math.min(0.18, Math.atan2(t.zvy, vxp))) * 180) / Math.PI * mv;
            t.psi += (psiT - t.psi) * Math.min(1, dt * 3);
          }
          if (t.vs > 1.3 / TIME_X) {
            t.du -= dt;
            if (t.du <= 0) {
              t.du = Math.max(0.06, 0.2 - sp * 0.015);
              puff(k, R);
            }
          }
          {
            const _pv = Math.min(100, S.pos[k]).toFixed(2);
            t.tur.style.setProperty("--p", _pv);
            t.trk.style.setProperty("--p", _pv);
          }
        }
        physics(dt); /* choques entre tortugas + transform final */
        if (!S.over && S.winner) finish(S.winner);
        acc += dt;
        if (acc > 0.25) {
          acc = 0;
          render();
          photo();
          /* el tempo sube de 0,8× a 1,25× conforme avanza la tortuga puntera */
          MUS.bpm = MUS.theme.bpm * musicSpeed(Math.max(...C.map((c) => S.pos[c.c])));
        }
      }

      /* ===== Conexión al servidor Node =====
   El servidor integrado entrega eventos normalizados por SSE. Si se especifica "ws", se conserva
   compatibilidad con el contrato WebSocket documentado en la sección 3 de esta guía. */
      /* Último apoyo por usuario: un comentario/like/etc. solo suma un hincha cada 8 s (evita repetir la misma acción). */
      const lastSupportAt = {};
      /* Registra al espectador como hincha del país que menciona (o del que ya apoyaba) y le da +1 punto cada 8 s. */
      function registerSupport(entry, isBot) {
        if (
          entry &&
          !S.over &&
          ["chat", "gift", "like", "follow", "share", "join"].includes(
            entry.type,
          )
        ) {
          const _n = (x) =>
            String(x || "")
              .toLowerCase()
              .normalize("NFD")
              .replace(/[\u0300-\u036f]/g, "")
              .trim();
          const _t = _n(entry.content || entry.text),
            _raw = String(entry.content || entry.text || "");
          const _fl = (i) =>
            CODES[i].length === 2
              ? String.fromCodePoint(
                  ...[...CODES[i]].map((ch) => 127397 + ch.charCodeAt(0)),
                )
              : "";
          const _i =
            entry.type === "chat"
              ? C.findIndex(
                  (c, i) =>
                    i < HUMAN_N &&
                    (_t.includes(_n(NATIONS[i].es)) ||
                      _t.includes(_n(NATIONS[i].en)) ||
                      _t === CODES[i].toLowerCase() ||
                      (_fl(i) && _raw.includes(_fl(i)))),
                )
              : -1;
          const _u = String(entry.username || "")
            .trim()
            .toLocaleLowerCase();
          if (_u) {
            const _code =
              (_i >= 0 && C[_i].c) ||
              S.pick.get(_u) ||
              S.slotOf.get(_u) ||
              rnd(C.slice(0, HUMAN_N)).c;
            registerPick(_u, _code);
            if (Date.now() - (lastSupportAt[_u] || 0) > 8000) {
              lastSupportAt[_u] = Date.now();
              const _o = _i >= 0 ? slotPlayer(_code) : null;
              if (_o) {
                _o.points += 1;
                raceAdd(_o, { type: "support" }, 1);
              }
            }
            render();
          }
        }
      }
      /* Punto de entrada de todo evento (SSE, WebSocket o bots de prueba). */
      function handleTikTokEntry(entry, isBot = false) {
        registerSupport(entry, isBot);
        if (entry && ["member", "enter", "joined"].includes(entry.type))
          entry = { ...entry, type: "join" };
        if (!isBot) rosterTouch(entry);
        scoreContestant(entry, isBot);
      }
      /* PRESENTES: conserva los últimos cuatro usuarios reales para reutilizarlos entre rondas y sesiones. */
      const ROSTER_KEY = "tortugasRecentUsers",
        ROSTER_LIMIT = 4;
      const ROSTER = (() => {
        try {
          const saved = JSON.parse(localStorage.getItem(ROSTER_KEY) || "[]"),
            roster = new Map();
          if (Array.isArray(saved))
            for (const item of saved) {
              if (!item || typeof item.username !== "string") continue;
              const username = item.username.trim(),
                key = username.toLocaleLowerCase();
              if (!username || key === "alguien") continue;
              roster.delete(key);
              roster.set(key, {
                username,
                avatar: typeof item.avatar === "string" ? item.avatar : "",
                t: Number(item.t) || 0,
              });
            }
          while (roster.size > ROSTER_LIMIT)
            roster.delete(roster.keys().next().value);
          return roster;
        } catch {
          return new Map();
        }
      })();
      let rosterLastSaved = "",
        rosterSyncTimer = null,
        rosterSyncQueue = Promise.resolve();
      function rosterSnapshot() {
        return [...ROSTER.values()].slice(-ROSTER_LIMIT);
      }
      function saveRosterLocally() {
        try {
          localStorage.setItem(ROSTER_KEY, JSON.stringify(rosterSnapshot()));
        } catch {}
      }
      function scheduleRosterSync() {
        if (location.protocol === "file:") return;
        clearTimeout(rosterSyncTimer);
        rosterSyncTimer = setTimeout(() => {
          const users = rosterSnapshot(),
            payload = JSON.stringify(users);
          rosterSyncQueue = rosterSyncQueue
            .then(async () => {
              if (payload === rosterLastSaved) return;
              const response = await fetch("/api/recent-users", {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ users }),
              });
              if (!response.ok)
                throw new Error(`HTTP ${response.status}`);
              const saved = await response.json();
              if (!Array.isArray(saved.users))
                throw new Error("Respuesta inválida del servidor.");
              rosterLastSaved = JSON.stringify(saved.users);
            })
            .catch((error) =>
              console.error("No se pudieron guardar los usuarios recientes.", error),
            );
        }, 250);
      }
      function mergeRecentUsers(users) {
        for (const item of users) {
          if (!item || typeof item.username !== "string") continue;
          const username = item.username.trim(),
            key = username.toLocaleLowerCase();
          if (!username || key === "alguien") continue;
          const t = Number.isSafeInteger(item.t) && item.t >= 0 ? item.t : 0,
            previous = ROSTER.get(key);
          if (previous && previous.t > t) continue;
          ROSTER.delete(key);
          ROSTER.set(key, {
            username,
            avatar: typeof item.avatar === "string" && /^https?:\/\//i.test(item.avatar)
              ? item.avatar
              : "",
            t,
          });
        }
        const latest = [...ROSTER.entries()]
          .sort((a, b) => a[1].t - b[1].t)
          .slice(-ROSTER_LIMIT);
        ROSTER.clear();
        latest.forEach(([key, user]) => ROSTER.set(key, user));
        saveRosterLocally();
      }
      async function loadRecentUsers() {
        if (location.protocol === "file:") return;
        const controller = new AbortController(),
          timeout = setTimeout(() => controller.abort(), 1500);
        try {
          const response = await fetch("/api/recent-users", {
            cache: "no-store",
            signal: controller.signal,
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const saved = await response.json();
          if (!Array.isArray(saved.users))
            throw new Error("Respuesta inválida del servidor.");
          mergeRecentUsers(saved.users);
          rosterLastSaved = JSON.stringify(saved.users);
          if (JSON.stringify(rosterSnapshot()) !== rosterLastSaved)
            scheduleRosterSync();
        } catch (error) {
          console.error("No se pudieron cargar los usuarios recientes.", error);
        } finally {
          clearTimeout(timeout);
        }
      }
      function seedRecentUsers() {
        rosterSnapshot().forEach((user, index) => {
          const lane = C[index];
          if (!lane) return;
          const key = user.username.toLocaleLowerCase(),
            player = {
              key,
              username: user.username,
              avatar: user.avatar,
              points: 0,
              interactions: 0,
              sequence: contestantSequence++,
              isBot: false,
            };
          contestants.set(key, player);
          S.pick.set(key, lane.c);
          S.slotUser[lane.c] = key;
          S.slotOf.set(key, lane.c);
          setMain(lane.c, player);
        });
      }
      function rosterTouch(e) {
        const name = e && String(e.username || "").trim();
        if (!name || name.toLocaleLowerCase() === "alguien") return;
        const key = name.toLocaleLowerCase(),
          r = ROSTER.get(key) || { username: name, avatar: "" };
        r.t = Date.now();
        if (typeof e.avatar === "string" && /^https?:\/\//i.test(e.avatar))
          r.avatar = e.avatar;
        ROSTER.delete(key);
        ROSTER.set(key, r);
        while (ROSTER.size > ROSTER_LIMIT)
          ROSTER.delete(ROSTER.keys().next().value);
        saveRosterLocally();
        scheduleRosterSync();
      }
      function connect() {
        const statusButton = document.getElementById("connectorStatus");
        if (Q.has("ws")) {
          statusButton.hidden = true;
          let ws;
          try {
            ws = new WebSocket(CFG.ws);
          } catch {
            return setTimeout(connect, 3000);
          }
          ws.onclose = () => setTimeout(connect, 2000);
          ws.onmessage = (e) => {
            try {
              const m = JSON.parse(e.data);
              if (
                [
                  "chat",
                  "gift",
                  "like",
                  "follow",
                  "share",
                  "join",
                  "member",
                  "enter",
                ].includes(m.type)
              ) {
                const entry = {
                  ...m,
                  username: m.username || m.user || "Alguien",
                  content: m.content || m.text || m.gift || "",
                  diamondCount: m.diamondCount || m.diamonds,
                  activityCount: m.activityCount || m.count,
                  time: m.time || new Date().toISOString(),
                };
                handleTikTokEntry(entry);
              } else if (m.type === "reset") resetContestants();
            } catch {}
          };
          return;
        }
        const source = new EventSource("/api/events");
        let connectorState = { connected: false, username: "", status: "idle" };
        const renderConnectorStatus = (next) => {
          connectorState = { ...connectorState, ...next };
          const username = String(connectorState.username || "").trim();
          const shortUsername = username.slice(0, 10);
          const connected = Boolean(connectorState.connected || connectorState.isConnected);
          statusButton.classList.toggle("connected", connected);
          statusButton.classList.toggle("disconnected", !connected);
          statusButton.textContent = connected
            ? `Conectado · @${shortUsername}`
            : username
              ? `Sin conexión · @${shortUsername}`
              : "Configura TikTok en /backend";
          statusButton.title = connected
            ? `Conectado a @${username}.`
            : connectorState.status === "failed"
              ? `Se agotaron los reintentos para @${username}. Haz clic para intentarlo de nuevo.`
              : username
                ? `Conectando a @${username}; se reintenta cada 5 segundos durante 5 minutos.`
                : "Configura TikTok en /backend.";
        };
        const requestConnection = async () => {
          try {
            const response = await fetch("/api/reconnect", { method: "POST" });
            const result = await response.json();
            if (!response.ok && response.status !== 409) {
              throw new Error(result.message || "No se pudo iniciar la conexión.");
            }
            if (result.username) connectorState.username = result.username;
            if (result.message) statusButton.title = result.message;
          } catch (error) {
            statusButton.title = `No se pudo iniciar la conexión: ${error.message}`;
          }
        };
        statusButton.addEventListener("click", requestConnection);
        source.addEventListener("status", (e) => {
          try {
            renderConnectorStatus(JSON.parse(e.data));
          } catch {}
        });
        source.addEventListener("update", (e) => {
          try {
            const entry = JSON.parse(e.data).entry;
            handleTikTokEntry(entry);
          } catch {}
        });
        requestConnection();
      }

      /* ===== Bots de prueba: simulan eventos de TikTok llamando a los MISMOS manejadores que el WebSocket =====
   (handleTikTokEntry), así que sirven para probar el juego sin servidor. Nunca envían nada a la red.
   Pruebas manuales desde el panel con P o ?panel=1. Además hay una cadena automática de bots (ver más abajo). */
      const NAMES = [
        "Lucía",
        "Mateo",
        "Ana_PY",
        "Carlos",
        "Sofi",
        "Diego",
        "Valen",
        "Rocío",
        "Nico",
        "Cami",
        "Tomás",
        "Fran",
      ];
      const GIFTS = {
        rose: ["Rose", 1],
        heart: ["Finger Heart", 5],
        donut: ["Doughnut", 30],
        galaxy: ["Galaxy", 1000],
      };
      const botEvent = (type, username, details = {}) => {
        const entry = {
          type,
          username,
          content: details.content || "",
          avatar: "",
          time: new Date().toISOString(),
          ...details,
        };
        handleTikTokEntry(entry, true);
      };
      const botGift = (t = "rose", u = rnd(NAMES)) =>
        botEvent("gift", u, {
          content: GIFTS[t][0],
          diamondCount: GIFTS[t][1],
          activityCount: 1,
        });
      const botJoin = () =>
        botEvent("join", rnd(NAMES) + ((Math.random() * 90) | 0));
      const botLike = () =>
        botEvent("like", rnd(NAMES), {
          activityCount: 1 + ((Math.random() * 8) | 0),
        });
      async function botFlood(n = 20) {
        const u = rnd(NAMES);
        for (let i = 0; i < n; i++) {
          botGift(
            Math.random() < 0.7 ? "rose" : "donut",
            Math.random() < 0.5 ? u : rnd(NAMES),
          );
          await new Promise((r) => setTimeout(r, 150));
        }
      }
      let autoT = null;
      function toggleAuto() {
        const btn = document.querySelector("[data-a=auto]");
        if (autoT) {
          clearTimeout(autoT);
          autoT = null;
          btn.classList.remove("act");
          return;
        }
        btn.classList.add("act");
        const loop = () => {
          const r = Math.random();
          if (r < 0.15) botJoin();
          else if (r < 0.22) botEvent("follow", rnd(NAMES));
          else if (r < 0.45) botLike();
          else {
            const g = (r - 0.45) / 0.55;
            botGift(
              g < 0.6
                ? "rose"
                : g < 0.85
                  ? "heart"
                  : g < 0.97
                    ? "donut"
                    : "galaxy",
            );
          }
          autoT = setTimeout(
            loop,
            (700 + Math.random() * 1500) / (+$("rate").value || 1),
          );
        };
        loop();
      }
      const ACT = {
        rose: () => botGift("rose"),
        donut: () => botGift("donut"),
        galaxy: () => botGift("galaxy"),
        join: botJoin,
        like: botLike,
        flood: botFlood,
        follow: () => botEvent("follow", rnd(NAMES)),
        auto: toggleAuto,
        boost: () => setBoost(60),
        sound: toggleSound,
        music: toggleMusic,
        reset: resetContestants,
      };
      document
        .querySelectorAll("#bots button")
        .forEach((b) => (b.onclick = () => ACT[b.dataset.a]()));
      const KEYS = {
        1: "rose",
        2: "donut",
        3: "galaxy",
        j: "join",
        l: "like",
        f: "flood",
        a: "auto",
        b: "boost",
        m: "sound",
        n: "music",
        r: "reset",
      };
      addEventListener("keydown", (e) => {
        const k = e.key.toLowerCase();
        if (k === "p") $("bots").classList.toggle("on");
        else if (KEYS[k]) ACT[KEYS[k]]();
      });
      if (Q.get("panel")) $("bots").classList.add("on");
      if (SND) document.querySelector("[data-a=sound]").classList.add("act");
      if (SND && MUSIC)
        document.querySelector("[data-a=music]").classList.add("act");

      /* ===== GAMIFICACIÓN: efectos (solo visuales; no tocan puntos ni posiciones) =====
   emojis flotantes por evento · anillo en la tortuga · cartel grande por nivel de aporte (TURBO/MEGA/LEYENDA)
   · temblor y destello de pantalla · niveles por jugador · adelantamientos · CAMPEÓN con confeti */
      const EMO = {
        gift: ["🎁", "💎", "✨"],
        like: ["❤️", "💖", "💕"],
        follow: ["⭐", "💛", "🌟"],
        share: ["🔁", "🚀", "📣"],
        chat: ["💬", "🐢", "👏"],
        join: ["👋", "🐢", "✨"],
        hit: ["💥", "💫", "⭐"],
      };
      /* Confeti que sale de un punto (x, y) de la pantalla */
      function burstAt(x, y, n, gold) {
        spawnConfetti(n, gold, { x: () => x, y: () => y, vx: 14, vy: 13, vy0: 3, r: 6, r0: 4 });
      }
      function turPos(code) {
        const r = T[code].tur.getBoundingClientRect();
        return [r.left + r.width * 0.5, r.top + r.height * 0.4];
      }
      function emojiFx(code, type, n) {
        const t = T[code];
        for (let i = 0; i < n; i++)
          setTimeout(() => {
            const e = document.createElement("i");
            e.className = "emo";
            e.textContent = rnd(EMO[type] || EMO.chat);
            e.style.setProperty("--p", Math.min(100, S.pos[code]));
            e.style.setProperty(
              "--dx",
              ((Math.random() - 0.5) * 3.2).toFixed(1) + "rem",
            );
            e.style.setProperty(
              "--rt",
              (((Math.random() - 0.5) * 40) | 0) + "deg",
            );
            t.trk.append(e);
            setTimeout(() => e.remove(), 1700);
          }, i * 110);
      }
      function ringFx(code, mega) {
        const r = document.createElement("i");
        r.className = "ring" + (mega ? " mega" : "");
        T[code].tur.append(r);
        setTimeout(() => r.remove(), 950);
      }
      function screenFx(shake) {
        const v = $("vig");
        v.className = "";
        void v.offsetWidth;
        v.className = "on";
        if (shake) {
          const a = $("app");
          restartAnim(a, "shake");
        }
      }
      /* ===== BOTS DE PRUEBA =====
         Bots: el sistema agrega uno como máximo y solo en el último país; simula likes, comentarios,
         comparte, sigue y a veces regala, con ritmo irregular. Sus eventos pasan por los MISMOS manejadores que los reales
         (registerSupport + scoreContestant) pero no se guardan en el ROSTER. */
      (() => {
        const humanEv = []; /* marcas de tiempo de eventos de personas reales */
        const baseHandle = handleTikTokEntry;
        handleTikTokEntry = function (entry, isBot) {
          if (entry && !entry.sim) humanEv.push(Date.now());
          if (entry && entry.sim) {
            (window.SIMK = window.SIMK || new Set()).add(String(entry.username).trim().toLocaleLowerCase());
            registerSupport(entry, true);
            scoreContestant(entry, true);
            render();
            return;
          }
          return baseHandle(entry, isBot);
        };

        /* ---- bots ---- */
        const MAXB = 1, /* un solo bot de prueba activo a la vez (el encadenado de más bots era legado) */
          bots = [];
        const GENERIC = ["jajaja", "qué carrera", "🐢🐢🐢", "vamos vamos", "uff", "quién gana?", "🔥🔥"],
          GENERIC_EN = ["lol", "what a race", "🐢🐢🐢", "let's go", "wow", "who wins?", "🔥🔥"];
        const send = (type, name, d = {}) =>
          handleTikTokEntry({
            type, username: name, content: "", avatar: "", sim: true,
            time: new Date().toISOString(), ...d,
          });
        function botStep(b) {
          if (!b.on) return;
          const bk = b.name.toLocaleLowerCase();
          if (b.joined && !S.slotOf.has(bk)) return window.botKicked(bk); /* perdió su tortuga: se da de baja */
          let i = NATIONS.findIndex((n) => n.code === b.fav);
          if (i < NATIONS.length - 1 || (!b.joined && S.slotUser[C[i] && C[i].c])) {
            b.fav = pickFav();
            if (!b.fav) return window.botKicked(bk);
            i = NATIONS.findIndex((n) => n.code === b.fav);
            send("chat", b.name, { content: NATIONS[i].n });
          }
          const nm = NATIONS[i].n,
            r = Math.random();
          if (!b.joined) {
            registerPick(bk, C[i].c);
            b.joined = true;
            send("join", b.name);
            b.t = setTimeout(() => {
              send("chat", b.name, { content: nm });
              b.t = setTimeout(() => botStep(b), 1200 + Math.random() * 2500);
            }, 600 + Math.random() * 1200);
            return;
          }
          if (r < 0.4) send("like", b.name, { activityCount: 1 + ((Math.random() * 12) | 0) });
          else if (r < 0.62)
            send("chat", b.name, {
              content: Math.random() < 0.7
                ? rnd(tr([nm, "vamos " + nm, "¡" + nm + "!", nm + " campeón", "dale " + nm], [nm, "go " + nm, nm + "!", nm + " champion", "come on " + nm]))
                : rnd(tr(GENERIC, GENERIC_EN)),
            });
          else if (r < 0.76) {
            const g = Math.random(),
              k = g < 0.6 ? "rose" : g < 0.85 ? "heart" : g < 0.98 ? "donut" : "galaxy";
            send("gift", b.name, { content: GIFTS[k][0], diamondCount: GIFTS[k][1], activityCount: 1 });
          } else if (r < 0.83) send("share", b.name);
          else if (r < 0.87 && !b.followed) {
            b.followed = true;
            send("follow", b.name);
          } else send("like", b.name, { activityCount: 1 + ((Math.random() * 6) | 0) });
          b.t = setTimeout(() => botStep(b), 1200 + Math.random() * 4800);
        }
        const count = () => {
          document.documentElement.classList.toggle("hasbots", bots.length > 0); /* líneas de carril solo con bots */
        };
        window.__botCount = count;
        /* El bot reserva el último carril, después de los cuatro usuarios recuperados. */
        function pickFav() {
          const use = (code) => bots.filter((x) => x.fav === code).length;
          const pool = NATIONS.slice(-1).filter((n) => {
            const lane = C[NATIONS.indexOf(n)];
            return lane && !S.slotUser[lane.c];
          });
          if (!pool.length) return null;
          const min = Math.min(...pool.map((n) => use(n.code)));
          return rnd(pool.filter((n) => use(n.code) === min)).code;
        }
        function addBot() {
          if (bots.length >= MAXB) return; /* máximo 1 bot; mantener pulsado 🤖 los detiene */
          const fav = pickFav();
          if (!fav) return;
          const b = {
            name: rnd(NAMES) + ((100 + Math.random() * 900) | 0),
            fav,
            p0: 0,
            slot: null,
            on: true,
            joined: false,
            followed: false,
            t: null,
          };
          bots.push(b);
          count();
          b.t = setTimeout(() => botStep(b), 200 + Math.random() * 600);
        }
        function stopBots(manual) {
          if (manual === true) autoOn = false;
          for (const b of bots) {
            b.on = false;
            clearTimeout(b.t);
          }
          bots.length = 0;
          count();
        }
        /* Baja de un bot (una persona real tomó su tortuga, o no consiguió una). */
        window.botKicked = (key) => {
          const i = bots.findIndex((x) => x.name.toLocaleLowerCase() === key);
          if (i < 0) return;
          bots[i].on = false;
          clearTimeout(bots[i].t);
          bots.splice(i, 1);
          count();
        };
        window.addBot = addBot;
        window.stopBots = stopBots;

        /* ---- bot automático ----
           Al empezar cada ronda entra un bot si está libre el último carril.
           Mantener pulsado 🤖 lo detiene hasta la próxima ronda. ?autobots=0 lo desactiva. */
        let autoOn = Q.get("autobots") !== "0";
        const baseNewRound = newRound;
        newRound = function () {
          baseNewRound();
          stopBots();
          autoOn = Q.get("autobots") !== "0";
          asleep = false;
          calmSince = 0;
          humanEv.length = 0;
          if (autoOn) addBot();
        };
        /* DORMIR: si la actividad humana es alta (≥ SLEEP_HI eventos en 10 s) los bots de prueba se duermen y sueltan su tortuga
           para que la tome una persona; despiertan cuando baja a ≤ SLEEP_LO durante 8 s. */
        const SLEEP_HI = 6, SLEEP_LO = 2;
        let asleep = false, calmSince = 0;
        const humanLevel = () => {
          const now = Date.now();
          while (humanEv.length && now - humanEv[0] > 10000) humanEv.shift();
          return humanEv.length;
        };
        function releaseBotLane(key) {
          const code = S.slotOf.get(key);
          if (!code) return;
          S.slotOf.delete(key);
          delete S.slotUser[code];
          contestants.delete(key);
          clearCrew(code);
          setSlotAvatar(code, null);
          T[code].tur.classList.remove("owned");
        }
        setInterval(() => {
          const lvl = humanLevel();
          if (!asleep && lvl >= SLEEP_HI && bots.length) {
            asleep = true;
            for (const b of [...bots]) { const k = b.name.toLocaleLowerCase(); window.botKicked(k); releaseBotLane(k); }
            render();
          } else if (asleep) {
            if (lvl <= SLEEP_LO) { if (!calmSince) calmSince = Date.now(); else if (Date.now() - calmSince > 8000) { asleep = false; calmSince = 0; } }
            else calmSince = 0;
          }
        }, 500);
        setInterval(() => {
          if (!autoOn || asleep || !S.go || S.over) return;
          if (!bots.length) addBot();
        }, 300);
      })();

      /* Aplica el idioma activo a todo lo estático (título, botones, panel de pruebas, nombres de país). */
      function applyLang() {
        document.documentElement.lang = LANG;
        document.title = tr("Carrera de países", "Countries Race");
        const set = (sel, es, en) => {
          const e = document.querySelector(sel);
          if (e) e.textContent = tr(es, en);
        };
        set("#winner .wttl", "🏆 PODIO DE INTERACCIONES", "🏆 INTERACTION PODIUM");
        set("#snd", "🔇 Toca la pantalla para activar el sonido", "🔇 Tap the screen to enable sound");
        set("#botsTitle", "Pruebas de interacción (P)", "Interaction tests (P)");
        const tt = (id, es, en) => {
          const e = $(id);
          if (!e) return;
          e.title = tr(es, en);
          e.setAttribute("aria-label", tr(es, en));
        };
        const PANEL = {
          rose: ["1 Rosa", "1 Rose"], donut: ["2 Dona", "2 Doughnut"], galaxy: ["3 Galaxia", "3 Galaxy"], join: ["J Se une", "J Joins"],
          like: ["L Likes", "L Likes"], flood: ["F Avalancha", "F Flood"], follow: ["Seguidor", "Follower"], auto: ["A Auto", "A Auto"],
          boost: ["B Doble", "B Double"], sound: ["M Sonido", "M Sound"], music: ["N Música", "N Music"], reset: ["R Reiniciar", "R Reset"],
        };
        document.querySelectorAll("#bots button[data-a]").forEach((b) => {
          const v = PANEL[b.dataset.a];
          if (v) b.textContent = tr(v[0], v[1]);
        });
        const lab = document.querySelector("#bots label");
        if (lab && lab.firstChild) lab.firstChild.nodeValue = tr("Ritmo del auto ", "Auto rate ");
        C.forEach((c, i) => {
          const im = $("rk-" + c.c) && $("rk-" + c.c).querySelector("img");
          if (im && NATIONS[i]) im.alt = NATIONS[i].n;
        });
        const wc = $("wCt"), wn = $("winner");
        if (wc && wn && wn.classList.contains("show") && S.winner) {
          const wi = C.findIndex((x) => x.c === S.winner);
          if (wi >= 0) wc.textContent = NATIONS[wi].n;
          const wt = document.querySelector("#winner .wttl");
          if (wt) wt.textContent = tr("🏆 PODIO DE INTERACCIONES", "🏆 INTERACTION PODIUM");
        }
        if (window.__botCount) window.__botCount();
      }
      applyLang();
      requestAnimationFrame(frame);
      loadRecentUsers().then(() => {
        newRound();
        connect();
      });
    </script>
  </body>
</html>
