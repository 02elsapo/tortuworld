<!doctype html>
<!--
  ═══════════════════════════════════════════════════════════════════════════
  CARRERA DE TORTUGAS · OVERLAY PARA TIKTOK LIVE
  ═══════════════════════════════════════════════════════════════════════════

  DINÁMICA DEL JUEGO (cómo funciona hoy)
    • 5 tortugas, cada una con su propio carril y país. El bot de prueba solo se activa en el último país.
      Cada tortuga pasea de arriba a abajo dentro de su carril.
    • El bot de prueba marca el ritmo: avanza de 0 a 100 en CFG.botSec (120 s por defecto). Las tortugas de usuarios avanzan
      con sus acciones y pueden llegar a la meta en un máximo de 10 interacciones.
    • Cada interacción válida suma progreso: en 10 acciones del usuario su tortuga llega a la meta; likes y regalos agrupados cuentan sus unidades.
      Los efectos de velocidad (EV_BOOST, addBoost) se mantienen:
      like ×5 · entrar ×2 · comentario ×5 · compartir / seguir ×10 · regalo ×20 (rosa) a ×30 (galaxia) según su valor (GIFT_TIERS). Gana quien llega primero a CFG.win (100).
    • El avatar de cada acción queda fijo en el lugar de la pista donde ocurrió; no sigue ni rodea al caparazón.
    • Sin copas al final de los carriles (se quitaron).
    • Guía de uso eliminada (el espacio queda en blanco). Abajo: 3 llamadas de acción (#cta): 🌹 al centro alternan los regalos (Rosita ×20 · Dona ×25 · Galaxia ×30), ❤️ Dale like a la derecha (fija), izquierda alterna ➕ Seguir / ↪️ Compartir (?cta=0 las oculta). Las llamadas van FUERA de la pista (franja --cta-h bajo los carriles). Cada botón lleva una insignia ⚡×N con el multiplicador de velocidad que da esa acción (sale de EV_BOOST).
    • Mientras haya bots activos (🤖), cada carril se delimita con líneas sólidas (html.hasbots, #laneLines; ?lines=1 las muestra siempre).
    • Un espectador elige país escribiendo su nombre, sigla o bandera en el chat (S.pick); claimSlot le asigna carril.
    • La primera tortuga en pasar el 25 %, 50 % y 75 % recibe un efecto de lechuga (S.cp); foto finish si llegan casi empatadas.
    • Tras CFG.restartMs (7 s) empieza otra ronda con nuevos países. La música alegre de carrera acelera con la líder.
    • Pista #hint compacta, con banderas en una sola fila para no tapar la carrera.
    • v67 (UX + gamificación): barra FIEBRE (#hype): cada evento la llena, se vacía sola; al llegar a 100 % hay 10 s de FIEBRE (×1.5 al empuje de todos). ?hype=0 la oculta · ?hypetop=12 (% desde arriba). Pista #hint "Escribe tu país" con las banderas de los carriles libres. El resultado muestra solo el podio de los tres usuarios reales con más interacciones.

  PARÁMETROS DE URL: ?target=40  ?win=100  ?panel=1 (panel de pruebas, también tecla P)  ?sound=0
                     ?music=0  ?theme=1  ?vol=0.9  ?join=0.5  ?ws=URL (WebSocket en lugar de SSE)  ?safe=1  ?autobots=0 (sin bots automáticos)  ?escena=1-4 (fuerza un escenario)  ?lang=en|es (idioma)  ?top=30 (dónde empieza la pista, en % desde arriba; más alto = más cielo)
  ESCENARIOS DEL FONDO: cada ronda usa uno, en orden: 1 madrugada (va amaneciendo) · 2 mañana (hacia el mediodía) ·
    3 mediodía (hacia la tarde) · 4 tarde (va oscureciendo). El cielo avanza con el progreso del líder de la carrera.
  BACKEND: SSE en /api/events. Un solo archivo, sin dependencias de build.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07262B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Country Race</title><!-- el título cambia con el idioma (applyLang) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      if ("serviceWorker" in navigator)
        window.addEventListener("load", () =>
          navigator.serviceWorker
            .register("/sw.js")
            .catch((error) =>
              console.error(
                "No se pudo registrar tortu como aplicación:",
                error,
              ),
            ),
        );
    </script>
    <style>
      :root{
        --ink: #07262b;
        --ink2: #0d3a41;
        --flag-size: 2.3rem;
        --sun: #ffc93c;
        --pink: #ff3d7f;
        --cream: #fff6e0;
        --mint: #5cf2c0;
        --sand: #f3dfa2;
        --sand2: #e8ce8c;
        --grass: #5fb35a;
        --grass2: #4a9a4c;
        --padr: 3%;
        --cta-fs: min(2.2vh, 3vw); /* tamaño de las llamadas de acción */
        --cta-h: calc(var(--cta-fs) * 5.2); /* franja que se reserva bajo la pista para ellas (0 con ?cta=0) */
      }
      *{
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html{
        font-size: min(3.8vw, 2.1vh);
      }
      html, body{
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        color: var(--cream);
        font-family: "Nunito", system-ui, sans-serif;
        font-weight: 800;
      }
      .disp{
        font-family: "Bowlby One", "Arial Black", sans-serif;
        font-weight: 400;
      }
      #fx{
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9;
      }

      /* Todo fluye en una sola columna: nada se encima, en cualquier pantalla */
      #app{
        position: absolute;
        top: var(--top, 30%);
        bottom: var(--bot, 14%);
        left: 3%;
        right: var(--padr);
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      /* Cabecera */

      /* Pista: 5 carriles fijos (uno por tortuga). Etiqueta izquierda = solo el puesto; el nombre va en .tag sobre la tortuga.
   Los anchos de .tur / .mk / .sl / .pl usan el mismo desplazamiento (.8rem de margen + pista de 100% - 7rem) para que
   la nariz de la tortuga coincida con las líneas de 25/50/75 % y con la meta. Si cambias el tamaño de .tur, ajusta los cuatro. */
      #lanes{
        flex: 1.5 1 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        --tw: min(13rem, 16vh);
        --n: 9;
        --lane-step: calc((100% - var(--th)) / var(--n));
        --fan-size: var(--flag-size);
        --g: 0rem;
      }
      .lane{
        flex: 1 1 0;
        min-height: 4.4rem;
        max-height: 5.8rem;
        display: flex;
        align-items: stretch;
        border-radius: 0.9rem;
        overflow: hidden;
        box-shadow: 0 0.25rem 0 rgba(0, 0, 0, 0.28);
      }
      .lane:nth-child(odd){
        background: rgba(243, 223, 162, 0.95);
      }
      .lane:nth-child(even){
        background: rgba(232, 206, 140, 0.95);
      }
      .lab{
        position: relative;
        z-index: 3;
        width: 2.8rem;
        justify-content: center;
        flex: none;
        background: var(--ink);
        display: flex;
        align-items: center;
        gap: 0.3rem;
        padding: 0 0.4rem;
      }
      .rk{
        flex: none;
        width: 1.6rem;
        height: 1.6rem;
        border-radius: 50%;
        background: var(--ink2);
        color: var(--cream);
        font-size: 0.95rem;
        display: grid;
        place-items: center;
      }
      .rk.r1{
        background: var(--ink);
        color: #fff;
      }
      .rk.r2{
        background: #d9e2e5;
        color: var(--ink);
      }
      .rk.r3{
        background: #e3a46b;
        color: var(--ink);
      }
      
      .nm{
        display: flex;
        flex-direction: column;
        line-height: 1.05;
        min-width: 0;
      }
      
      .nm b{
        font-family: "Bowlby One", sans-serif;
        font-weight: 400;
        color: var(--sun);
        font-size: 0.8rem;
        max-width: 5.6rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .nm small{
        font-size: 0.75rem;
        opacity: 0.85;
      }
      .lab em{
        margin-left: auto;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        line-height: 1.05;
        font-style: normal;
        color: var(--mint);
      }
      .lab em span{
        font-size: 1.05rem;
      }
      .lab em small{
        font-size: 0.75rem;
        color: var(--sun);
      }
      .lane.lead .lab{
        box-shadow: inset 0.25rem 0 0 var(--sun);
      }
      .trk{
        position: relative;
        flex: 1;
        border-top: 0.2rem solid var(--grass);
        border-bottom: 0.2rem solid var(--grass2);
        background-image:
          radial-gradient(rgba(120, 85, 30, 0.25) 0.07rem, transparent 0.1rem),
          radial-gradient(
            rgba(255, 255, 255, 0.28) 0.06rem,
            transparent 0.09rem
          );
        background-size:
          1.1rem 1rem,
          1.7rem 1.3rem;
        background-position:
          0 0,
          0.5rem 0.4rem;
      }
      .mk{
        position: absolute;
        top: 0;
        bottom: 0;
        width: 0;
        border-left: 0.12rem dashed rgba(7, 38, 43, 0.18);
      }
      .sl{
        position: absolute;
        top: 0;
        bottom: 0;
        left: 6.2rem;
        width: 0.18rem;
        background: rgba(255, 255, 255, 0.75);
      }
      .fin{
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: 0.8rem;
        background: repeating-conic-gradient(var(--ink) 0 25%, #fff 0 50%) 0
          0/0.4rem 0.4rem;
      }
      .tur{
        position: absolute;
        top: 62%;
        width: 5.4rem;
        height: 3.5rem;
        margin-top: -1.75rem;
        left: calc(0.8rem + (100% - 7rem) * var(--p, 0) / 100);
        z-index: 2;
      }
      .tur svg{
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .tur.turbo{
        filter: drop-shadow(0 0 0.5rem var(--pink))
          drop-shadow(0 0 0.9rem var(--sun));
      }
      .tur.turbo::before{
        content: "";
        position: absolute;
        right: 100%;
        top: 30%;
        width: 2.5rem;
        height: 40%;
        background: linear-gradient(90deg, transparent, var(--sun));
        border-radius: 999px;
      }
      
      .dust{
        position: absolute;
        top: calc(50% + 0.6rem);
        width: 0.6rem;
        height: 0.6rem;
        margin-left: -0.2rem;
        border-radius: 50%;
        background: rgba(255, 246, 224, 0.8);
        z-index: 1;
        pointer-events: none;
        animation: dust 0.8s ease-out forwards;
      }
      @keyframes dust{
        to {
          transform: translate(-1.8rem, -0.6rem) scale(2.4);
          opacity: 0;
        }
      }

      @keyframes pop{
        from {
          transform: scale(0.4);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }

      .empty{
        font-size: 0.62rem;
        opacity: 0.85;
      }

      #snd{
        position: fixed;
        left: 1.8rem;
        bottom: 0.3rem;
        z-index: 30;
        font-size: 0.8rem;
        background: rgba(0, 0, 0, 0.65);
        padding: 0.1rem 0.6rem;
        border-radius: 999px;
        display: none;
      }
      @media (orientation: portrait){
        html{
          font-size: clamp(12px, min(3.2vw, 1.8vh), 32px);
          --padr: 12%;
        }
        #app{
          top: 3%;
          bottom: 3%;
          left: 3%;
          right: var(--padr);
          gap: 0.2rem;
        }
        .lab{
          width: 2.6rem;
          gap: 0.2rem;
          padding: 0 0.25rem;
        }

        #snd{
          display: none;
        }
        
      }
      /* Panel de pruebas */

      #bots{
        position: fixed;
        right: 8px;
        top: 8px;
        z-index: 40;
        width: 176px;
        background: rgba(0, 0, 0, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 10px;
        padding: 8px;
        font:
          12px/1.2 system-ui,
          sans-serif;
        display: none;
        gap: 4px;
        flex-wrap: wrap;
      }
      #bots.on{
        display: flex;
      }
      #bots b{
        width: 100%;
        font-size: 11px;
        opacity: 0.8;
      }
      #bots button{
        flex: 1 1 45%;
        padding: 7px 4px;
        border: 0;
        border-radius: 6px;
        background: #1d4f57;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      #bots button.act{
        background: var(--pink);
      }
      #bots label{
        width: 100%;
        font-size: 11px;
        margin-top: 4px;
      }
      #bots input{
        width: 100%;
      }
      /* Avatar redondo, carril vacío atenuado, ganador resaltado,
   animación al cambiar de dueño (.swap) y etiqueta .tag con @usuario + puntos que viaja con la tortuga. */
      .av{
        flex: none;
        width: 1.9rem;
        height: 1.9rem;
        border-radius: 50%;
        display: grid;
        place-items: center;
        overflow: hidden;
        border: 0.12rem solid var(--sun);
        background: var(--ink2);
        color: #fff;
        font-size: 0.9rem;
      }
      .av img{
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .lane.empty .tur{
        opacity: 0.45;
        filter: grayscale(0.7);
      }
      .lane.win{
        outline: 0.2rem solid var(--sun);
        box-shadow: 0 0 1rem var(--sun);
      }
      .tur.swap svg{
        animation: pop 0.6s cubic-bezier(0.2, 1.6, 0.4, 1) both;
      }
      /* FIJA: esquina superior izquierda de la pista (al inicio); */
      .tag{
        position: absolute;
        left: 0.6rem;
        top: 0.15rem;
        margin: 0;
        max-width: min(calc(100% - 1.4rem), 36vw);
        display: flex;
        align-items: baseline;
        gap: clamp(3px, 0.4vw, 6px);
        padding: 0;
        height: clamp(18px, 3.8vw, 26px);
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        z-index: 5;
        pointer-events: none;
      }
      .tag b{
        flex: 0 1 auto;
        min-width: 0;
        max-width: min(30vw, 10rem);
        overflow: hidden;
        text-overflow: ellipsis;
        font-family: "Bowlby One", "Arial Black", sans-serif;
        font-weight: 400;
        font-size: clamp(10px, 1.4vw, 16px);
        letter-spacing: 0.02em;
        color: #07262b;
        -webkit-text-stroke: 0.08em #fff6e0;
        paint-order: stroke fill;
        text-shadow: none;
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }
      .tag small{
        flex: none;
        font-size: clamp(8px, 1vw, 12px);
        color: #0d3a41;
        font-weight: 800;
        -webkit-text-stroke: 0.08em #fff6e0;
        paint-order: stroke fill;
      }
      .lane.empty .tag{
        display: none;
      }
      /* Pantalla horizontal: se reduce el rem para que quepan los 5 carriles grandes sin tapar el panel inferior */
      @media (orientation: landscape){
        html{
          font-size: min(3.8vw, 1.45vh);
        }
      }
      /* Diseño: arriba la carrera + barra de mensajes */
              /* La carrera tiene PRIORIDAD de altura: cada carril mide fijo 4.4rem y la tabla de abajo cede (flex) si falta espacio.
   Así los carriles nunca se desbordan por debajo de la barra de mensajes ni la tapan. */
      #lanes{
        flex: 0 0 auto;
      }
      .lane{
        flex: 0 0 4.4rem;
        min-height: 4.4rem;
        max-height: none;
      }

       /* barra de mensajes SIEMPRE visible */

      /* ===== GAMIFICACIÓN: efectos ===== */
      .emo{
        position: absolute;
        top: 30%;
        font-size: 1.5rem;
        line-height: 1;
        z-index: 6;
        pointer-events: none;
        left: calc(0.8rem + (100% - 7rem) * var(--p, 0) / 100 + 2.2rem);
        animation: emo 1.6s ease-out forwards;
      }
      @keyframes emo{
        0% {
          transform: translate(0, 0.6rem) scale(0.4);
          opacity: 0;
        }
        15% {
          opacity: 1;
          transform: translate(0, 0) scale(1.2);
        }
        100% {
          transform: translate(var(--dx, 0), -2.6rem) scale(0.9)
            rotate(var(--rt, 0deg));
          opacity: 0;
        }
      }
      .ring{
        position: absolute;
        left: 1.6rem;
        top: 30%;
        width: 2.6rem;
        height: 2.6rem;
        margin: -1.3rem 0 0 -1.3rem;
        border-radius: 50%;
        border: 0.28rem solid var(--sun);
        box-shadow: 0 0 1rem var(--sun);
        pointer-events: none;
        animation: ring 0.9s ease-out forwards;
        z-index: 4;
      }
      .ring.mega{
        border-color: var(--pink);
        box-shadow:
          0 0 1.4rem var(--pink),
          0 0 2.4rem var(--sun);
      }
      @keyframes ring{
        to {
          transform: scale(4.2);
          opacity: 0;
        }
      }
      .lane.lead{
        box-shadow:
          0 0 0.9rem rgba(255, 201, 60, 0.9),
          0 0.25rem 0 rgba(0, 0, 0, 0.28);
      }
      .lane.lead::after{
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          100deg,
          transparent 35%,
          rgba(255, 255, 255, 0.55) 50%,
          transparent 65%
        );
        transform: translateX(-120%);
        animation: shine 3.2s ease-in-out infinite;
        pointer-events: none;
        z-index: 4;
      }
      @keyframes shine{
        60%,
        100% {
          transform: translateX(120%);
        }
      }
      .lane{
        position: relative;
      }
      .lane.flash{
        animation: flash 0.9s ease-out;
      }
      @keyframes flash{
        0% {
          outline: 0.25rem solid var(--pink);
          filter: brightness(1.5);
        }
        100% {
          outline: 0.25rem solid transparent;
          filter: none;
        }
      }

      #app.shake{
        animation: shake 0.9s ease-out;
      }
      @keyframes shake{
        20% {
          transform: translate(-0.12rem, 0.07rem);
        }
        45% {
          transform: translate(0.1rem, -0.06rem);
        }
        70% {
          transform: translate(-0.05rem, 0.03rem);
        }
      }
      #vig{
        position: fixed;
        inset: 0;
        z-index: 8;
        pointer-events: none;
        opacity: 0;
        box-shadow: inset 0 0 6rem 1.5rem var(--sun);
      }
      #vig.on{
        animation: vig 1s ease-out;
      }
      @keyframes vig{
        0% {
          opacity: 0.9;
        }
        100% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce){
        .lane.lead::after{
          animation: none;
        }
      }

      /* La carrera queda arriba; la mitad inferior aparece solo durante los festejos. */
      #app{
        top: 0;
        bottom: 50%;
        left: 3%;
        right: var(--padr);
        gap: 0.2rem;
      }
      #lanes{
        flex: 1 1 0;
        min-height: 0;
      }
      .lane{
        flex: 1 1 0;
        min-height: 0;
        height: auto;
      }
      .tur{
        top: 50%;
        width: auto;
        height: 100%;
        aspect-ratio: 70 / 46;
        margin-top: 0;
        transform: translateY(-50%);
      }


      /* ===== ANUNCIO EMERGENTE DEL GANADOR (3 s) sobre las rutas ===== */
      #fx{
        z-index: 45;
      }

      #app.finished .lane:not(.win){
        filter: saturate(0.4);
        transition:
          opacity 0.4s,
          filter 0.4s;
        opacity: 0.5;
      }
      
      /* ===== PARTICIPACIÓN CLARA Y MEDIBLE ===== */

      /* ===== pista libre: sin bandera a la izquierda, sin nombre de país (solo copas) ===== */
      .lab{
        display: none !important;
      }
      .tag b{
        display: inline-block;
      }
      .tag b:empty{
        display: none;
      }
      .lane.empty .tag{
        display: flex !important;
      }
      .tag b{
        font-size: clamp(14px, 2.2vw, 24px) !important;
        max-width: none !important;
      }
      /* ===== cabecera mínima + banderas ===== */

      .lab{
        width: 3.3rem;
      }
      .rk{
        position: relative;
        width: var(--flag-size);
        height: var(--flag-size);
        padding: 0;
        overflow: hidden;
        border: 0.16rem solid var(--cream);
        box-shadow: 0 0.12rem 0.35rem rgba(0, 0, 0, 0.55);
      }
      .rk img{
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .rk::after{
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        pointer-events: none;
        background:
          radial-gradient(
            circle at 30% 24%,
            rgba(255, 255, 255, 0.6),
            transparent 42%
          ),
          radial-gradient(
            circle at 50% 55%,
            transparent 55%,
            rgba(0, 0, 0, 0.3) 100%
          );
      }
      .rk.r1{
        border-color: var(--sun);
        box-shadow:
          0 0 0.55rem var(--sun),
          0 0.12rem 0.35rem rgba(0, 0, 0, 0.55);
      }
      .rk.r2{
        border-color: #d9e2e5;
      }
      .rk.r3{
        border-color: #e3a46b;
      }
      @media (orientation: portrait){

        .lab{
          width: 2.9rem;
        }
        :root{
          --flag-size: 2rem;
        }
      }
      /* ===== llamadas de acción grandes y vistosas ===== */

            /* ===== UNA SOLA PISTA para todas las tortugas (grandes), copas mini, mensajes en el pie ===== */
      #lanes{
        --tw: min(11rem, 28vh);
        --th: calc(var(--tw) * 46/70);
        --g: 3rem;
        position: relative;
        display: block;
        background-color: var(--sand);
        background-image:
          radial-gradient(rgba(120, 85, 30, 0.25) 0.07rem, transparent 0.1rem),
          radial-gradient(
            rgba(255, 255, 255, 0.28) 0.06rem,
            transparent 0.09rem
          );
        background-size:
          1.1rem 1rem,
          1.7rem 1.3rem;
        border-top: 0.25rem solid var(--grass);
        border-bottom: 0.25rem solid var(--grass2);
        border-radius: 0.9rem;
        box-shadow: 0 0.25rem 0 rgba(0, 0, 0, 0.28);
      }
      #lanes .lane{
        position: absolute !important;
        inset: 0;
        flex: none;
        height: auto;
        min-height: 0;
        max-height: none;
        overflow: visible;
        border-radius: 0;
        background: none !important;
        box-shadow: none !important;
        outline: none !important;
        animation: none !important;
        pointer-events: none;
      }
      #lanes .lane::after{
        display: none !important;
      }
      #lanes .trk{
        position: absolute;
        inset: 0;
        border: 0;
        background: none;
        z-index: 1;
        --rt: calc((100% - var(--th)) * var(--i)/var(--n));
        clip-path: inset(-100vh -100vw -100vh 0);
      }
      #lanes::after{
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        background-image: radial-gradient(
          circle,
          rgba(7, 38, 43, 0.58) 1px,
          transparent 1.5px
        );
        background-size: 7px var(--lane-step);
        background-position: 0 calc(var(--lane-step) - 1px);
        pointer-events: none;
      }
      #lanes .trk .tur{
        top: var(--rt);
        width: var(--tw);
        height: var(--th);
        aspect-ratio: auto;
        margin: 0;
        transform: none;
        left: calc(
          var(--tw) * 0 + (100% - var(--tw) * 1 - 0.8rem) * var(--p, 0) / 100
        );
      }
      #lanes .sl{
        left: calc(var(--g) + var(--tw));
      }
      
      #lanes .emo{
        top: calc(var(--rt) + var(--th) * 0.2);
        left: calc(
          var(--tw) * 0 + (100% - var(--tw) * 1 - 0.8rem) * var(--p, 0) / 100 + var(--tw) * 0.45
        );
      }
      #lanes .dust{
        top: calc(var(--rt) + var(--th) - 0.9rem);
      }
      #lanes .tag{
        left: 0.3rem;
        top: calc(var(--rt) + var(--th) / 2 - 11px);
        max-width: calc(var(--g) - 0.3rem);
      }
      #lanes .tag b{
        font-size: clamp(7px, 1.1vw, 12px) !important;
      }
      #lanes .lane.empty .tag{
        display: flex !important;
      }
      
      /* mensajes: pie de pantalla, texto que va pasando */

      /* ===== pantalla completa, 10 países, sin versión ===== */

      #app{
        top: var(--top, 30%); /* pista bajada para dejar más cielo (antes 17 %); ?top=17 vuelve al valor anterior */
        bottom: var(--bot, 7%);
      }

      /* ===== etiqueta de 2 líneas: iniciales + copas / hinchas ===== */
      
      #lanes .tag{
        height: auto;
        overflow: visible;
        top: calc(var(--rt) + var(--th) / 2 - 1.1em);
        max-width: calc(var(--g) - 0.2rem);
      }
      #lanes .tag b{
        display: block;
        white-space: pre;
        line-height: 1.2;
        max-width: none;
      }
      /* ===== hinchas grandes y vivos, líder con resplandor ===== */
      
      #lanes .tag b i{
        font-style: normal;
      }
      
      #lanes .tag{
        top: calc(var(--rt) + var(--th) / 2 - 1.6em);
      }
      #lanes .lane.lead .trk .tur{
        filter: drop-shadow(0 0 0.45rem #ffc93c) drop-shadow(0 0 1.1rem #ffc93c);
      }
      #lanes .lane.lead .trk .tur.turbo{
        filter: drop-shadow(0 0 0.5rem var(--pink))
          drop-shadow(0 0 1.1rem #ffc93c);
      }

      /* ===== eventos sobre la tortuga ===== */
      #lanes .evb{
        position: absolute;
        z-index: 12;
        white-space: nowrap;
        pointer-events: none;
        padding: 0.16em 0.7em 0.2em;
        border-radius: 999px;
        border: 0.16rem solid #fff;
        color: #fff;
        font-size: calc(var(--th) * 0.24);
        line-height: 1.15;
        text-shadow: 0 0.08em 0 rgba(7, 38, 43, 0.7);
        box-shadow: 0 0.2rem 0.5rem rgba(0, 0, 0, 0.6);
        top: calc(var(--rt) - var(--th) * 0.15 - var(--o, 0) * var(--th) * 0.12);
        left: calc(
          var(--tw) * 0 + (100% - var(--tw) * 1 - 0.8rem) * var(--p, 0) / 100 + var(--tw) * 0.5
        );
        animation: evup 2.2s ease-out forwards;
      }
      @keyframes evup{
        0% {
          transform: translate(-50%, 0.8rem) scale(0.4);
          opacity: 0;
        }
        14% {
          transform: translate(-50%, 0) scale(1.15);
          opacity: 1;
        }
        28% {
          transform: translate(-50%, 0) scale(1);
        }
        80% {
          opacity: 1;
        }
        100% {
          transform: translate(-50%, -1.8rem) scale(1);
          opacity: 0;
        }
      }
      #lanes .evb.e-lk{
        background: #ff3d7f;
      }
      #lanes .evb.e-ch{
        background: #1fb58a;
      }
      #lanes .evb.e-gf{
        background: linear-gradient(90deg, #ff9f1c, #ffc93c);
        color: #07262b;
        text-shadow: none;
      }
      #lanes .evb.e-sh{
        background: #2e7bff;
      }
      #lanes .evb.e-fo{
        background: #e5254b;
      }
      #lanes .evb.e-jn{
        background: #7b4dff;
      }
      #lanes .evb.e-ch{
        max-width: min(72vw, 22rem);
        overflow: hidden;
        text-overflow: ellipsis;
        background: #fff;
        color: #07262b;
        text-shadow: none;
        white-space: nowrap;
      }
      #lanes .evb.e-ch::after{
        content: "";
        position: absolute;
        left: 50%;
        bottom: -0.34em;
        border-top: 0.4em solid #fff;
        border-right: 0.35em solid transparent;
        border-left: 0.35em solid transparent;
        transform: translateX(-50%);
      }
      #lanes .gift-bait{
        position: absolute;
        z-index: 4;
        top: calc(var(--rt) + var(--th) * 0.13);
        left: calc(
          var(--tw) * 0 + (100% - var(--tw) * 1 - 0.8rem) * var(--p, 0) / 100 + var(--tw) * 0.5
        );
        display: grid;
        width: calc(var(--th) * 0.42);
        height: calc(var(--th) * 0.42);
        place-items: center;
        border: 0.12rem solid #fff;
        border-radius: 0.9rem;
        background: linear-gradient(145deg, #fff4bd, #ffae21);
        box-shadow: 0 0 0.6rem rgba(255, 201, 60, 0.9), 0 0.15rem 0.3rem rgba(0, 0, 0, 0.45);
        font-size: calc(var(--th) * 0.3);
        line-height: 1;
        transform: translateX(-50%);
        animation: giftbait 0.55s ease-in-out infinite alternate;
        pointer-events: none;
      }
      #lanes .gift-bait.caught{
        animation: giftcaught 0.24s ease-out forwards;
      }
      @keyframes giftbait{
        from { margin-top: 0; filter: drop-shadow(0 0 0.15rem #fff); }
        to { margin-top: -0.5rem; filter: drop-shadow(0 0 0.4rem #ffec98); }
      }
      @keyframes giftcaught{
        to { opacity: 0; transform: translateX(-50%) scale(1.8) rotate(12deg); }
      }
      /* ===== ajustes ===== */
      .lane.empty .tur{
        opacity: 1;
        filter: none;
      }

      /* ===== tortugas al 100 % de opacidad (también tras terminar la carrera) ===== */
      #lanes .tur,
      #lanes .lane.empty .tur,
      #app.finished .lane:not(.win),
      #app.finished .lane:not(.win) .tur{
        opacity: 1 !important;
      }
      #app.finished .lane:not(.win){
        filter: none !important;
      }
      #lanes .lane.empty .tur{
        filter: none !important;
      }
    
      /* ===== sin hinchas ni copas · la tortuga sale del borde izquierdo · caras ===== */

      #lanes .lane .tag,
      #lanes .lane.empty .tag {
        display: none !important;
      }
      .tur .fgf{
        display: none;
      }
      .tur.owned .fgf{
        display: inline;
      }
      /* CAMBIO DE EXPRESIÓN GRADUAL: las caras no saltan; se funden unas en otras (FACE_FADE) */
      .tur .mo{
        display: inline;
        opacity: 0;
        transition: opacity 1.1s ease-in-out;
      }
      .tur .eyes{
        transition: opacity 1.1s ease-in-out;
      }
      /* parpadeo natural cada ~4 s */
      .tur .eyes .blk{
        transform-box: fill-box;
        transform-origin: center;
        animation: blink 4.2s infinite;
      }
      @keyframes blink{
        0%, 94%, 100%{ transform: scaleY(1); }
        97%{ transform: scaleY(0.1); }
      }
      .tur.mood-sad .mo-sad,
      .tur.mood-happy .mo-happy,
      .tur.mood-turbo .mo-turbo,
      .tur.mood-tired .mo-tired{
        opacity: 1;
      }
      .tur.mood-turbo .eyes,
      .tur.mood-tired .eyes{
        opacity: 0;
      }
      /* cara de AGOTADO: las gotas de sudor resbalan despacio */
      .tur .mo-tired .sw{
        animation: tiredDrip 1.8s ease-in infinite;
      }
      .tur .mo-tired .sw2{
        animation-delay: 0.9s;
      }
      @keyframes tiredDrip{
        0%{ transform: translateY(-1px); opacity: 0; }
        25%{ opacity: 1; }
        100%{ transform: translateY(4px); opacity: 0; }
      }
    
      /* ===== física de marcha: la tortuga gira sobre sus patas y los choques muestran 💥 ===== */
      #lanes .trk .tur{
        transform-origin: 35% 90%;
        will-change: transform;
      }
      #lanes::after{
        display: none !important;
      }

      /* cartel "recibió regalo" sobre la tortuga mientras dura la protección */
      #lanes .pbadge{
        position: absolute;
        z-index: 13;
        white-space: nowrap;
        pointer-events: none;
        padding: 0.12em 0.7em 0.16em;
        border-radius: 999px;
        border: 0.16rem solid #fff;
        background: linear-gradient(90deg, #1ea7ff, #38d6ff);
        color: #fff;
        font-size: calc(var(--th) * 0.22);
        line-height: 1.15;
        text-shadow: 0 0.08em 0 rgba(7, 38, 43, 0.7);
        box-shadow: 0 0.2rem 0.5rem rgba(0, 0, 0, 0.6);
        top: calc(var(--rt) - var(--th) * 0.42);
        left: calc((100% - var(--tw) - 0.8rem) * var(--p, 0) / 100 + var(--tw) * 0.5);
        transform: translateX(-50%);
      }
      /* PROTECCIÓN POR REGALO: aura celeste mientras dura el anti-choque */
      #lanes .trk .tur.shield svg{
        filter: drop-shadow(0 0 0.35rem #7fe3ff) drop-shadow(0 0 0.9rem #38b6ff);
      }
      /* SÚPER ENERGÍA: brillo rojo-dorado mientras la agresora corre a atacar */
      #lanes .trk .tur.charge svg{
        filter: drop-shadow(0 0 0.5rem #ff3d2e) drop-shadow(0 0 1.1rem #ffc93c);
      }

      /* ===== el primero lleva corona y cara de líder ===== */
      .tur .crw{
        display: none;
      }
      .tur.first .crw{
        display: inline;
      }
      .tur.mood-lead .mo-lead{
        opacity: 1;
      }
      .tur.mood-lead .eyes{
        opacity: 0;
      }
      /* CABEZA ROJA HIRVIENDO: se pone más roja a medida que se acerca el choque (--rg 0.3 → 1) y late como si hirviera */
      .tur .rage{
        opacity: 0;
        transition: opacity 1s ease-in-out;
        pointer-events: none;
      }
      .tur.angry .rage{
        opacity: var(--rg, 0.4);
      }
      .tur .rage .rg2{
        animation: boilPulse 0.55s ease-in-out infinite;
      }
      @keyframes boilPulse{
        0%, 100%{ opacity: 0.72; }
        50%{ opacity: 1; }
      }
      .tur .rage .stm{
        opacity: 0;
        animation: steamUp 0.9s ease-out infinite;
      }
      .tur .rage .stm2{
        animation-delay: 0.45s;
      }
      @keyframes steamUp{
        0%{ transform: translateY(2px); opacity: 0; }
        30%{ opacity: 0.9; }
        100%{ transform: translateY(-5px); opacity: 0; }
      }
      /* cara de LLORANDO: los últimos 3 puestos cuando la líder está a 15 % de la meta */
      .tur.cry .mo,
      .tur.cry .eyes{
        opacity: 0 !important;
        transition-duration: 0.8s;
      }
      .tur.cry .mo-cry{
        opacity: 1 !important;
      }
      .tur .mo-cry .tear{
        animation: tearFall 1.1s ease-in infinite;
      }
      .tur .mo-cry .tear2{
        animation-delay: 0.35s;
      }
      .tur .mo-cry .tear3{
        animation-delay: 0.7s;
      }
      .tur .mo-cry .tear4{
        animation-delay: 0.15s;
      }
      @keyframes tearFall{
        0%{ transform: translateY(-1px); opacity: 0; }
        20%{ opacity: 1; }
        100%{ transform: translateY(9px); opacity: 0; }
      }
      .tur .mo-cry .wail{
        transform-box: fill-box;
        transform-origin: center;
        animation: wail 0.45s ease-in-out infinite;
      }
      @keyframes wail{
        0%, 100%{ transform: scaleY(1); }
        50%{ transform: scaleY(1.35); }
      }
      /* cara de ENOJADO: la tortuga ya decidió chocar y va a embestir; se funde en ~0,5 s */
      .tur.angry .mo,
      .tur.angry .eyes{
        opacity: 0 !important;
        transition-duration: 0.5s;
      }
      .tur.angry .mo-angry{
        opacity: 1 !important;
      }
      /* cara de GOLPE: ojos > <, boca abierta, chichón y estrellas durante todo el retroceso (~12 s) y 1 s más tras cada choque */
      .tur.ouch .mo,
      .tur.ouch .eyes{
        opacity: 0 !important;
        transition-duration: 0.35s; /* el golpe sí entra rápido; al salir de él vuelve a fundirse despacio */
      }
      .tur.ouch .mo-ouch{
        opacity: 1 !important;
      }

      /* ===== cuenta regresiva emergente 3 · 2 · 1 · ¡YA! ===== */
      #cd{
        position: fixed;
        inset: 0;
        z-index: 65;
        display: none;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      #cd.show{
        display: flex;
      }
      #cd .cdn{
        font: min(34vw, 40vh)/1 "Bowlby One", "Arial Black", sans-serif;
        color: var(--sun, #ffc93c);
        -webkit-text-stroke: 0.05em #07262b;
        paint-order: stroke fill;
        text-shadow: 0 0.06em 0 #07262b, 0 0 0.35em rgba(255, 61, 127, 0.85), 0 0 0.7em rgba(255, 201, 60, 0.7);
        animation: cdpop 0.9s cubic-bezier(0.2, 1.5, 0.4, 1) both;
      }
      #cd .cdn.go{
        font-size: min(26vw, 30vh);
        color: var(--mint, #5cf2c0);
        text-shadow: 0 0.06em 0 #07262b, 0 0 0.35em rgba(92, 242, 192, 0.9), 0 0 0.8em rgba(255, 201, 60, 0.7);
      }
      @keyframes cdpop{
        0%{ transform: scale(2.6); opacity: 0; }
        25%{ transform: scale(1); opacity: 1; }
        75%{ transform: scale(1); opacity: 1; }
        100%{ transform: scale(0.6); opacity: 0; }
      }

      /* ===== al terminar la carrera se muestra el podio de los 3 usuarios con más interacciones ===== */
      #winner{
        position: fixed;
        inset: 0;
        z-index: 60;
        display: none;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      #winner.show{
        display: flex;
      }
      #winner .wbox{
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.6rem;
        box-sizing: border-box;
        width: min(94vw, 42rem);
        padding: 1.1rem 1.8rem 1.2rem;
        border: 0.22rem solid var(--sun, #ffc93c);
        border-radius: 1.4rem;
        background: linear-gradient(160deg, rgba(13, 58, 65, 0.96), rgba(20, 91, 80, 0.96));
        box-shadow: 0 0 2.6rem rgba(255, 201, 60, 0.55), 0 0.5rem 1.4rem rgba(0, 0, 0, 0.55);
        text-align: center;
        max-width: 94vw;
        max-height: 92vh;
        overflow-y: auto;
        animation: winpop 0.5s cubic-bezier(0.2, 1.4, 0.4, 1) both;
      }
      #winner.out .wbox{
        animation: winout 0.35s ease-in forwards;
      }
      #winner.podiumOnly .wav,
      #winner.podiumOnly .wnm,
      #winner.podiumOnly .wfl,
      #winner.podiumOnly .wxtra{display:none}
      #winner .wttl{
        font: 1.7rem/1.1 "Bowlby One", "Arial Black", sans-serif;
        color: var(--sun, #ffc93c);
        text-shadow: 0 0.14rem 0 var(--ink, #07262b);
      }
      #winner .wav{
        position: relative;
        width: min(34vmin, 19rem);
        height: min(34vmin, 19rem);
        border-radius: 50%;
        border: 0.4rem solid var(--sun, #ffc93c);
        background: #0d3a41;
        box-shadow: 0 0 1.6rem rgba(255, 201, 60, 0.8);
        overflow: hidden;
      }
      #winner .wav img{
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      #winner .wav b{
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        font: 6rem/1 "Bowlby One", "Arial Black", sans-serif;
        color: #fff;
      }
      #winner .wav.noimg img{
        display: none;
      }
      #winner .wav.noimg b{
        display: flex;
      }
      #winner .wnm{
        font: 1.5rem/1.15 "Bowlby One", "Arial Black", sans-serif;
        color: #fff;
        text-shadow: 0 0.12rem 0 var(--ink, #07262b);
        max-width: 80vw;
        overflow-wrap: anywhere;
      }
      #winner .wfl{
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 1.05rem;
        color: #fff;
      }
      #winner .wfl img{
        display: none; /* la bandera ya es la foto grande */
        height: 1.5rem;
        border-radius: 0.2rem;
        border: 0.08rem solid var(--ink, #07262b);
      }
      @keyframes winpop{
        from{ transform: scale(0.4); opacity: 0; }
        to{ transform: scale(1); opacity: 1; }
      }
      @keyframes winout{
        to{ transform: scale(0.85); opacity: 0; }
      }

      /* ===== MODO VERTICAL (TikTok Live 9:16) =====
         Zonas que TikTok tapa con su propia interfaz (aprox.): arriba ~12 % (perfil, espectadores), abajo ~25 % (chat, comentar, regalos),
         derecha ~12 % (botones). La pista queda en el centro y el resto se rellena con césped; ?top=NN y ?bottom=NN ajustan los márgenes. */
      @media (orientation: portrait){
        #app{
          top: var(--top, 31%); /* un poco más de cielo para el 1.er puesto grande */
          bottom: var(--bot, 27%);
        }
      }

      /* ===== 5 carriles propios, avatares anclados y pista sin cartel de podio ===== */
      #lanes{
        --lane-step: calc(100% / (var(--n) + 1));
      }
      html body #app{
        top: var(--top, 24%);
        bottom: calc(var(--bot, 7%) + var(--cta-h)); /* deja libre la franja de las llamadas de acción */
      }
      @media (orientation: portrait){
        html body #app{
          top: var(--top, 22%);
          bottom: calc(var(--bot, 27%) + var(--cta-h));
        }
      }
      #lanes .anchav{
        position: absolute;
        z-index: 13;
        pointer-events: none;
        left: calc((100% - var(--tw) - 0.8rem) * var(--ap, 0) / 100 + var(--tw) * 0.41);
        width: calc(var(--th) * 0.5);
        height: calc(var(--th) * 0.5);
        transform: translate(-50%, -50%);
        animation: anchIn 0.7s cubic-bezier(0.2, 1.5, 0.4, 1) both;
      }
      #lanes .anchav .ai{
        position: absolute;
        inset: 0;
        border-radius: 50%;
        overflow: hidden;
        background: var(--nc, #0d3a41);
        border: 0.1rem solid #fff;
        color: #fff;
        display: grid;
        place-items: center;
        font: calc(var(--th) * 0.26) / 1 "Bowlby One", "Arial Black", sans-serif;
        box-shadow: 0 0 0.6rem rgba(255, 201, 60, 0.9), 0 0.2rem 0.45rem rgba(0, 0, 0, 0.55);
      }
      #lanes .anchav .ai img{
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #lanes .anchav small{
        position: absolute;
        left: 50%;
        bottom: -0.45em;
        transform: translateX(-50%);
        padding: 0.1em 0.45em;
        border-radius: 999px;
        background: #ffc93c;
        color: #07262b;
        border: 0.08rem solid #07262b;
        font: 800 max(9px, calc(var(--th) * 0.15)) / 1.1 system-ui, sans-serif;
        white-space: nowrap;
      }
      /* ===== LLAMADAS DE ACCIÓN (#cta): 3 casillas distribuidas por el ancho. Centro = 🌹 Rosita (principal, fija);
         derecha = ❤️ Dale like (fija); izquierda alterna EN SU MISMO LUGAR (giro) entre ➕ Seguir · ↪️ Compartir.
         ?cta=0 la oculta. ===== */
      #cta{
        position: fixed;
        left: 0;
        right: 0;
        width: 100%;
        bottom: var(--bot, 7%); /* debajo de la pista: la pista termina var(--cta-h) más arriba */
        box-sizing: border-box;

      }
      @media (orientation: portrait){

      #cta .cs{
        position: relative;

      #cta .cb{
        position: absolute;

        gap: 0.3em;

      }
      #cta .cb i{ font-style: normal; font-size: 1.4em; }
      /* insignia de velocidad: cada acción multiplica la velocidad de la tortuga (valores salen de EV_BOOST) */
      #cta .cb .x{
        position: absolute;
        top: -0.85em;

      }
      @keyframes ctaX{
        0%, 100%{ transform: scale(1) rotate(-4deg); }
        50%{ transform: scale(1.14) rotate(4deg); }
      }
      #cta .cb.k-lk{ border-color: #ff3d7f; box-shadow: 0 0 0.9em rgba(255, 61, 127, 0.7); }
      #cta .cb.k-fo{ border-color: #7b4dff; box-shadow: 0 0 0.9em rgba(123, 77, 255, 0.7); }
      #cta .cb.k-sh{ border-color: #2e7bff; box-shadow: 0 0 0.9em rgba(46, 123, 255, 0.7); }
      #cta .cb.k-gf{ border-color: #ff5fae; box-shadow: 0 0 0.9em rgba(255, 95, 174, 0.75); }
      #cta .main .cb{
        background: linear-gradient(180deg, #8a1f55, #3b1259);
        animation: ctaBeat 1.1s ease-in-out infinite;
      }
      @keyframes ctaBeat{
        0%, 100%{ transform: scale(1); box-shadow: 0 0 0.8em rgba(255, 95, 174, 0.7); }
        50%{ transform: scale(1.06); box-shadow: 0 0 1.6em rgba(255, 95, 174, 1), 0 0 0.5em #fff; }
      }
      /* cambio en su sitio: el viejo gira hacia dentro y el nuevo gira hacia fuera, sin mover nada alrededor */
      #cta .cs:not(.main) .cb.out{ animation: ctaFlipOut 0.28s ease-in forwards; }
      #cta .cs:not(.main) .cb.in{ animation: ctaFlipIn 0.28s ease-out 0.26s both; }
      @keyframes ctaFlipOut{
        from{ transform: rotateX(0deg); opacity: 1; }
        to{ transform: rotateX(90deg); opacity: 0; }
      }
      @keyframes ctaFlipIn{
        from{ transform: rotateX(-90deg); opacity: 0; }
        to{ transform: rotateX(0deg); opacity: 1; }
      }
      /* la casilla central (regalos) también gira al cambiar de regalo y retoma el latido */
      #cta .cs.main .cb.out{ animation: ctaFlipOut 0.28s ease-in forwards; }
      #cta .cs.main .cb.in{ animation: ctaFlipIn 0.28s ease-out 0.26s both, ctaBeat 1.1s ease-in-out 0.54s infinite; }
      /* Líneas que delimitan cada carril: SOLO visibles mientras hay bots activos (html.hasbots). */
      #laneLines{
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        display: none;
      }
      html.hasbots #laneLines,
      html.forcelines #laneLines{
        display: block;
      }
      #laneLines i{
        position: absolute;
        left: 0;
        right: 0;
        height: 0.3rem;
        margin-top: -0.15rem;
        /* líneas de carril como en una pista de atletismo de arcilla: rayas blancas/crema de bloques duros, bien visibles */
        background: repeating-linear-gradient(90deg, #fff6d6 0 1.2rem, transparent 1.2rem 2rem);
        opacity: 0.95;
        top: calc((100% - var(--th)) * (var(--k) - 0.5) / var(--n) + var(--th) / 2);
      }
      @keyframes anchIn{
        0%{ transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
        45%{ transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
        100%{ transform: translate(-50%, -50%) scale(1); opacity: 1; }
      }

      /* ===== ESCENA v5: pista de arena con carriles alternados, bordes de césped, salida y meta a cuadros ===== */
      #lanes{
        background-color: var(--sand);
        background-image:
          linear-gradient(to bottom, transparent 50%, rgba(232, 206, 140, 0.95) 50%),
          radial-gradient(rgba(120, 85, 30, 0.25) 0.07rem, transparent 0.1rem),
          radial-gradient(rgba(255, 255, 255, 0.28) 0.06rem, transparent 0.09rem);
        background-size:
          100% calc(200% / (var(--n) + 1)),
          1.1rem 1rem,
          1.7rem 1.3rem;
        background-position: 0 0, 0 0, 0.5rem 0.4rem;
      }
      /* ===== v67: FIEBRE (meta colectiva), pista de "escribe tu país" y extras de la tarjeta ganadora ===== */

      #hype .hb{position:relative;height:2.6rem;border-radius:1rem;background:rgba(7,38,43,.78);border:.14rem solid var(--cream);overflow:hidden;box-shadow:0 .2rem .6rem rgba(0,0,0,.45)}
      #hype u{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--mint),var(--sun),var(--pink));transition:width .35s ease-out;text-decoration:none}
      #hype b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.35rem;line-height:1;color:#fff;text-shadow:0 .1rem 0 var(--ink);white-space:nowrap}
      #hype.hot .hb{animation:hypeHot .6s ease-in-out infinite alternate}
      #hype.fever .hb{border-color:var(--sun);animation:hypeHot .3s ease-in-out infinite alternate}
      #hype.fever u{width:100%!important;background:linear-gradient(90deg,#ff3d7f,#ffc93c,#5cf2c0,#ffc93c,#ff3d7f);background-size:200% 100%;animation:hypeFlow 1s linear infinite}
      html.nohype #hype{display:none}
      @keyframes hypeHot{to{transform:scale(1.04);box-shadow:0 0 1.2rem rgba(255,201,60,.9)}}
      @keyframes hypeFlow{to{background-position:-200% 0}}
      #hint{position:fixed;left:0;right:0;top:calc(var(--hype-top,12%) + 3.2rem);z-index:44;display:none;justify-content:center;pointer-events:none}
      #hint.show{display:flex}
      /* Pista compacta: título pequeño y banderas en una fila para no tapar la carrera. */
      #hint .hc{display:flex;flex-direction:column;align-items:center;gap:.1rem;max-width:94vw;padding:.3rem .8rem .4rem;border-radius:1rem;background:rgba(7,38,43,.82);border:.12rem solid var(--mint);font-size:1.1rem;line-height:1.15;animation:hintBob 1.4s ease-in-out infinite alternate}
      #hint .ht{font-size:.8em;opacity:.9;white-space:nowrap}

      #winner .wtop-card{display:flex;flex:0 1 43%;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;min-width:0;max-width:none;padding:.45rem .35rem;border:.1rem solid rgba(217,226,229,.6);border-radius:.8rem;background:rgba(7,38,43,.55);font:700 .85rem/1.15 system-ui,sans-serif}
      #winner .wtop-card.first{flex-basis:68%;padding:.55rem;border-color:var(--sun);background:rgba(255,201,60,.13);font-size:1rem}
      #winner .wtop-avatar{position:relative;display:grid;place-items:center;width:min(9vmin,4.5rem);height:min(9vmin,4.5rem);overflow:hidden;border:.16rem solid #d9e2e5;border-radius:50%;background:#0d3a41;box-shadow:0 0 .45rem rgba(255,255,255,.35)}
      #winner .wtop-card.first .wtop-avatar{width:min(14vmin,6.5rem);height:min(14vmin,6.5rem);border:.22rem solid var(--sun);box-shadow:0 0 .8rem rgba(255,201,60,.8)}
      #winner .wtop-avatar img{width:100%;height:100%;object-fit:cover}
      #winner .wtop-avatar b{display:none;color:#fff;font:1.3rem/1 "Bowlby One","Arial Black",sans-serif}

      #winner .wtop-place{padding:.2em .5em;border-radius:999px;background:var(--sun);color:var(--ink);font:1rem/1.1 "Bowlby One","Arial Black",sans-serif}

      #connectorStatus{

        font:800 .6rem/1 system-ui,sans-serif;
        box-shadow:0 .15rem .5rem rgba(0,0,0,.4);
        pointer-events:none;

  <body>
    <canvas id="fx"></canvas>

    <div id="app">

      ><button data-a="donut">2 Dona</button>

      ><button data-a="join">J Se une</button>
      <button data-a="like">L Likes</button
      ><button data-a="flood">F Avalancha</button>

        >Ritmo del auto

    <script>
      /*
       * CONTRATO DE EVENTOS
       * TikTok LIVE -> tiktok-live-connector -> server.js -> SSE /api/events -> overlay.
       * El backend normaliza username, avatar, contadores y etiquetas.
       *
       * chat: el texto selecciona un país y suma puntos, con límite por usuario.
       * gift: suma diamondCount x activityCount; groupId evita contar dos veces un combo.
       * like, follow y share: apoyan el país que el usuario ya seleccionó.
       * join: participante automático; ?join=0 lo desactiva.
       *
       * Contrato: type, username, content, avatar, activityCount, diamondCount.
       * Tipos admitidos: chat, gift, like, follow, share y join. No enviar roomUser:
       * los cambios de audiencia no son eventos de juego.
       *
       * El overlay consume SSE por defecto. Un WebSocket externo es opcional con ?ws=URL.
       * ?target=40 define la meta individual.
       * Las tortugas avanzan lentamente si ningún espectador elige un país.
       * No se generan eventos de audiencia ni interacciones automáticas.
       * El panel de pruebas manual se abre con P o ?panel=1.
       */

      const Q = new URLSearchParams(location.search);
      /* ===== IDIOMA: inglés por defecto. Ya no hay botón de idioma: se elige con ?lang=es o ?lang=en.
         ?lang=es lo abre en español. tr(es, en) devuelve el texto del idioma activo. ===== */
      let LANG = "en";
      try {
        const sv = Q.get("lang"); /* siempre inicia en inglés; solo ?lang=es lo abre en español (no se recuerda el idioma anterior) */
        if (sv === "en" || sv === "es") LANG = sv;
      } catch {}
      const tr = (es, en) => (LANG === "en" ? en : es);
      const shownName = (u) => (String(u || "").trim().toLowerCase() === "alguien" ? tr("Alguien", "Someone") : u);
      /* Parámetros del juego y configuración de la pista. */
      /* DURACIÓN DEL JUEGO: TIME_X = 2 → la carrera dura el DOBLE. Todas las velocidades se dividen por TIME_X y cada evento
         avanza TIME_X veces menos pista (hacen falta el doble de eventos). ?time=1 vuelve a la duración anterior; ?time=3 la triplica. */
      const TIME_X = Math.max(0.5, +Q.get("time") || 2);
      const CFG = {
        ws: Q.get("ws") || "ws://localhost:8080",
        win: +Q.get("win") || 100,
        target: +Q.get("target") || 40,
        crawl: 0.15 / TIME_X,
        restartMs: 7000,
        botSec: Math.max(20, +Q.get("bot") || 120) /* ritmo constante del bot de prueba (2 min por defecto) */,
        join: Q.has("join") ? +Q.get("join") : 0.5,
        countries: [0, 1, 2, 3, 4].map((i) => ({
          c: "s" + i,
          n: "",
          f: "",
          b: [],
        })),
      };
      /* VELOCIDADES (unidades de pista por segundo). El bot de prueba va a BOT_V constante y solo ocupa el último país.
         Las demás caminan a BASE_V y cada interacción las multiplica ×2 / ×5 / ×10 / ×20+ un rato (EV_BOOST = [multiplicador, segundos]). */
      const BOT_V = CFG.win / CFG.botSec,
        BASE_V = BOT_V * (Q.has("base") ? +Q.get("base") : 0.4);
      const EV_BOOST = {
        join: [2, 3],
        like: [5, 3],
        support: [2, 2],
        chat: [5, 4],
        share: [10, 5],
        follow: [10, 5],
        gift: [20, 6],
      };
      /* Los regalos escalan con su valor en diamantes (por unidad): 🌹 rosa ×20 · 💗 ×22 (≥5) · 🍩 dona ×25 (≥30) · 🌌 galaxia ×30 (≥500). */
      const GIFT_TIERS = [[500, 30], [30, 25], [5, 22], [0, 20]];
      const giftMult = (diamonds) => {
        const d = Number(diamonds) || 0;
        for (const [min, m] of GIFT_TIERS) if (d >= min) return m;
        return EV_BOOST.gift[0];
      };
      const $ = (id) => document.getElementById(id);
      const rnd = (a) => a[(Math.random() * a.length) | 0];
      /* Helpers compartidos: tamaño del rem en px y reinicio de una animación CSS */
      const remPx = () => parseFloat(getComputedStyle(document.documentElement).fontSize);
      const restartAnim = (el, cls) => {
        el.classList.remove(cls);
        void el.offsetWidth;
        el.classList.add(cls);
      };
      const C = CFG.countries,
        byCode = Object.fromEntries(C.map((c) => [c.c, c]));
      const HUMAN_N = C.length;
      const contestants = new Map();
      let contestantSequence = 0;
      /* ===== PAÍSES en lugar de usuarios =====
   Los cuatro primeros países son fijos; los seis restantes se sortean al comenzar cada ronda.
   El sorteo combina campeones del Mundial masculino y selecciones populares, sin clubes. */
      const NATIONS = (() => {
        const sv = (b) =>
          "data:image/svg+xml;utf8," +
          encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40">' +
              b +
              "</svg>",
          );
        const H3 = (a, b, c, x = "") =>
          '<rect width="60" height="40" fill="' +
          b +
          '"/><rect width="60" height="13.4" fill="' +
          a +
          '"/><rect y="26.6" width="60" height="13.4" fill="' +
          c +
          '"/>' +
          x;
        const V3 = (a, b, c) =>
          '<rect width="60" height="40" fill="' +
          b +
          '"/><rect width="20" height="40" fill="' +
          a +
          '"/><rect x="40" width="20" height="40" fill="' +
          c +
          '"/>';
        const uy =
          '<rect width="60" height="40" fill="#fff"/>' +
          [4.44, 13.33, 22.22, 31.11]
            .map(
              (y) =>
                '<rect y="' + y + '" width="60" height="4.44" fill="#0038A8"/>',
            )
            .join("") +
          '<rect width="24" height="22.2" fill="#fff"/><circle cx="12" cy="11.1" r="5" fill="#FCD116"/>';
        return [
          {
            n: "Brasil",
            code: "BR",
            c: "#009C3B",
            u: sv(
              '<rect width="60" height="40" fill="#009C3B"/><path d="M30 4 56 20 30 36 4 20Z" fill="#FFDF00"/><circle cx="30" cy="20" r="8.5" fill="#002776"/><path d="M22 18.5Q30 15.5 38 22" stroke="#fff" stroke-width="1.6" fill="none"/>',
            ),
          },
          {
            n: "Paraguay",
            code: "PY",
            c: "#D52B1E",
            u: sv(
              H3(
                "#D52B1E",
                "#fff",
                "#0038A8",
                '<circle cx="30" cy="20" r="4.5" fill="none" stroke="#2E7D32" stroke-width="1.2"/>',
              ),
            ),
          },
          {
            n: "Argentina",
            code: "AR",
            c: "#74ACDF",
            u: sv(
              H3(
                "#74ACDF",
                "#fff",
                "#74ACDF",
                '<circle cx="30" cy="20" r="3.6" fill="#F6B40E"/>',
              ),
            ),
          },
          {
            n: "Alemania",
            code: "DE",
            c: "#DD0000",
            u: sv(H3("#000", "#DD0000", "#FFCE00")),
          },
          {
            n: "Francia",
            code: "FR",
            c: "#0055A4",
            u: sv(V3("#0055A4", "#fff", "#EF4135")),
          },
          {
            n: "Italia",
            code: "IT",
            c: "#008C45",
            u: sv(V3("#008C45", "#fff", "#CD212A")),
          },
          { n: "Uruguay", code: "UY", c: "#0038A8", u: sv(uy) },
          {
            n: "España",
            code: "ES",
            c: "#AA151B",
            u: sv(
              '<rect width="60" height="40" fill="#AA151B"/><rect y="10" width="60" height="20" fill="#F1BF00"/>',
            ),
          },
          {
            n: "Inglaterra",
            code: "ENG",
            c: "#CE1124",
            u: sv(
              '<rect width="60" height="40" fill="#fff"/><rect x="26" width="8" height="40" fill="#CE1124"/><rect y="16" width="60" height="8" fill="#CE1124"/>',
            ),
          },
          {
            n: "Portugal",
            code: "PT",
            c: "#046A38",
            u: sv(
              '<rect width="24" height="40" fill="#046A38"/><rect x="24" width="36" height="40" fill="#DA291C"/><circle cx="24" cy="20" r="6" fill="#FFCD00"/>',
            ),
          },
          {
            n: "Países Bajos",
            code: "NL",
            c: "#AE1C28",
            u: sv(H3("#AE1C28", "#fff", "#21468B")),
          },
          {
            n: "México",
            code: "MX",
            c: "#006847",
            u: sv(V3("#006847", "#fff", "#CE1126")),
          },
          {
            n: "Colombia",
            code: "CO",

      }
      const lanes = $("lanes");
      lanes.style.setProperty("--n", C.length - 1);
      C.forEach((c, li) => {
        const l = document.createElement("div");
        l.className = "lane empty";
        l.id = "ln-" + c.c;
        l.innerHTML = `<div class="lab"><div class="rk disp" id="rk-${c.c}"><img alt="${NATIONS[li].n}" src="${NATIONS[li].u}"></div></div>
  <div class="trk" id="tk-${c.c}" style="--i:${li}">${[25, 50, 75].map((m) => `<i class="mk" style="left:calc(var(--tw) * 1 + (100% - var(--tw) * 1 - .8rem)*${m / 100})"></i>`).join("")}<i class="sl"></i><div class="fin"></div><div class="tag"><b id="nm-${c.c}"></b><small id="tt-${c.c}"></small></div><div class="tur mood-sad" id="tu-${c.c}" style="--p:0">${turtle(c)}</div></div>`;
        lanes.append(l);
      });

      /* Líneas divisorias entre carriles (n-1 líneas para n carriles); solo se muestran con bots activos. */
      {
        const ll = document.createElement("div");
        ll.id = "laneLines";
        for (let k = 1; k < C.length; k++) {
          const i = document.createElement("i");
          i.style.setProperty("--k", k);
          ll.append(i);
        }
        lanes.append(ll);
        if (Q.get("lines") === "1") document.documentElement.classList.add("forcelines"); /* ?lines=1: siempre visibles, sin bots */
      }

      /* ===== LLAMADAS DE ACCIÓN: siempre 3 casillas fijas, siempre en español. Centro 🌹 Rosita (fija), derecha ❤️ Dale like (fija),
         izquierda alterna en su mismo lugar (giro) entre ➕ Seguir y ↪️ Compartir. ?cta=0 la oculta. ===== */
      {
        const ct = $("cta");
        if (Q.get("cta") === "0") {
          ct.remove();
          document.documentElement.style.setProperty("--cta-h", "0px"); /* sin llamadas no se reserva espacio */
        }
        else {
          const ALT = [
            { c: "k-fo", e: "➕", t: "Seguir", x: EV_BOOST.follow[0] },
            { c: "k-sh", e: "↪️", t: "Compartir", x: EV_BOOST.share[0] },
          ];
          const mk = (d) => {
            const b = document.createElement("div");
            b.className = "cb " + d.c;
            b.innerHTML = "<i>" + d.e + "</i><span>" + d.t + "</span>" + (d.x ? '<b class="x">⚡×' + d.x + "</b>" : "");
            return b;
          };
          const slot = (cls) => {
            const el = document.createElement("div");
            el.className = "cs " + cls;
            ct.append(el);
            return el;
          };
          const left = slot("s0"),
            mid = slot("main"),
            right = slot("s1");
          /* el centro alterna entre regalos, cada uno con su multiplicador (valores en diamantes: rosa 1 · dona 30 · galaxia 1000) */
          const GIFT_ALT = [
            { c: "k-gf", e: "🌹", t: "Rosita", x: giftMult(1) },
            { c: "k-gf", e: "🍩", t: "Dona", x: giftMult(30) },
            { c: "k-gf", e: "🌌", t: "Galaxia", x: giftMult(1000) },
          ];
          mid.append(mk(GIFT_ALT[0]));
          right.append(mk({ c: "k-lk", e: "❤️", t: "Dale like", x: EV_BOOST.like[0] }));
          left.append(mk(ALT[0]));
          let n = 1;
          /* cada 3,5 s la casilla izquierda gira y muestra el otro botón */
          setInterval(() => {
            const old = left.querySelector(".cb:not(.out)");
            const nb = mk(ALT[n % ALT.length]);
            nb.classList.add("in");
            if (old) {
              old.classList.add("out");
              setTimeout(() => old.remove(), 300);
            }
            left.append(nb);
            n++;
          }, 3500);
          /* los regalos giran a su propio ritmo, desfasados de la casilla izquierda para que no cambien a la vez */
          let g = 1;
          setTimeout(() => setInterval(() => {
            const old = mid.querySelector(".cb:not(.out)");
            const nb = mk(GIFT_ALT[g % GIFT_ALT.length]);
            nb.classList.add("in");
            if (old) {
              old.classList.add("out");
              setTimeout(() => old.remove(), 300);
            }
            mid.append(nb);
            g++;
          }, 3500), 1750);
        }
      }

      /* La tortuga ocupa aproximadamente el alto de su carril y nunca más del 34 % del ancho. */
      function fitTurtles() {
        const H = lanes.clientHeight,
          W = lanes.clientWidth;
        if (!H || !W) return;
        const bh = H / C.length,
          th = bh,
          tw = Math.min((th * 70) / 46, W * 0.34, 24 * remPx());
        lanes.style.setProperty("--tw", tw.toFixed(1) + "px");
      }
      addEventListener("resize", fitTurtles);
      if (window.ResizeObserver) new ResizeObserver(fitTurtles).observe(lanes);
      fitTurtles();
      setTimeout(fitTurtles, 300);
      setTimeout(fitTurtles, 1500);

      /* ===== Confeti ===== */
      const cv = $("fx"),
        cx = cv.getContext("2d");
      let ps = [],
        run = false;
      function size() {
        cv.width = innerWidth;
        cv.height = innerHeight;
      }
      addEventListener("resize", size);
      size();
      /* Generador común de confeti. o = {x, y (funciones), vx, vy, vy0, r, r0}: dispersión y tamaño de las partículas */
      function spawnConfetti(n, gold, o) {
        const cols = gold
          ? ["#FFC93C", "#FFE27A", "#FFF6E0"]
          : ["#FF3D7F", "#5CF2C0", "#FFC93C", "#FFF6E0"];
        for (let i = 0; i < n; i++)
          ps.push({
            x: o.x(),
            y: o.y(),
            vx: (Math.random() - 0.5) * o.vx,
            vy: -Math.random() * o.vy - o.vy0,
            r: Math.random() * o.r + o.r0,
            c: cols[i % cols.length],
            a: Math.random() * 6,
            va: (Math.random() - 0.5) * 0.4,
            l: 1,
          });
        if (!run) {
          run = true;
          requestAnimationFrame(tick);
        }
      }
      /* Confeti de pantalla completa (festejo) */
      function burst(n, gold) {
        spawnConfetti(Math.min(n, 300), gold, {
          x: () => innerWidth * (0.2 + Math.random() * 0.6),
          y: () => innerHeight * 0.72,
          vx: 16, vy: 16, vy0: 4, r: 7, r0: 5,
        });
      }
      function tick() {
        cx.clearRect(0, 0, cv.width, cv.height);
        ps = ps.filter((p) => p.l > 0 && p.y < innerHeight + 30);
        for (const p of ps) {
          p.vy += 0.4;
          p.x += p.vx;
          p.y += p.vy;
          p.a += p.va;
          p.l -= 0.004;
          cx.save();
          cx.globalAlpha = Math.min(1, p.l * 2);
          cx.translate(p.x, p.y);
          cx.rotate(p.a);
          cx.fillStyle = p.c;
          cx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
          cx.restore();
        }
        if (ps.length) requestAnimationFrame(tick);
        else {
          run = false;
          cx.clearRect(0, 0, cv.width, cv.height);
        }
      }

      /* ===== Pantalla ===== */
      /* Jugador dueño de una tortuga (slot 's0'..'s4'), o null si el carril está libre */
      function slotPlayer(code) {
        const k = S.slotUser[code];
        return k ? contestants.get(k) : null;
      }
      /* Redibuja puesto, nombre, puntos, corona y estados (libre / ganador) de los 5 carriles. Se llama ~4 veces/seg. */
      /* El espectador elige un país (nombre, sigla o bandera en el chat); sin carril propio, su energía va a esa tortuga. */
      function registerPick(user, code) {
        S.pick.set(user, code);
      }
      function render() {
        const ord = [...C].sort((a, b) => S.pos[b.c] - S.pos[a.c]);
        ord.forEach((c, i) => {
          const r = $("rk-" + c.c);
          r.className = "rk disp r" + (i + 1);
        });
        C.forEach((c) => {
          const p = slotPlayer(c.c);
          $("nm-" + c.c).textContent = "";
          const tg = T[c.c].tag || (T[c.c].tag = $("nm-" + c.c).parentNode);
          $("tt-" + c.c).textContent = "";
          T[c.c].tw = p
            ? tg.offsetWidth
            : 0; /* ancho de la etiqueta, para centrarla sin salirse de la pista */
          const l = $("ln-" + c.c);
          l.classList.toggle(
            "lead",
            !!p && S.pos[ord[0].c] > 1 && c.c === ord[0].c,
          );
          l.classList.toggle("empty", !p);
          l.classList.toggle("win", c.c === S.winner);
        });
        hintPaint();
        if (S.go && !S.over) {
          highlightOvertakes(ord);
          checkNearEnd();
        }
      }
      /* Adelantamientos: el carril que sube de puesto parpadea; si pasa al 1.º lugar suena el aviso y estalla confeti. */
      let lastRank = {};
      function highlightOvertakes(ord) {
        ord.forEach((c, i) => {
          const prev = lastRank[c.c];
          lastRank[c.c] = i;
          if (
            prev !== undefined &&
            i < prev &&
            slotPlayer(c.c) &&
            S.pos[c.c] > 3 &&
            Math.abs(S.pos[c.c] - S.pos[ord[i + 1] ? ord[i + 1].c : c.c]) > 0.3
          ) {
            const l = $("ln-" + c.c);
            restartAnim(l, "flash");
            emojiFx(c.c, "follow", 3);
            if (i === 0) {
              burstAt(...turPos(c.c), 45, true);
              SFX.cp();
            }
          }
        });
      }
      /* Tensión final: la primera vez por ronda que el líder pasa el 88 % suena un aviso y destella la pantalla. */
      function checkNearEnd() {
        if (S.nearEnd) return;
        let m = -1,
          lc = null;
        for (const c of C)
          if (S.slotUser[c.c] && S.pos[c.c] > m) {
            m = S.pos[c.c];
            lc = c.c;
          }
        if (lc && m >= 88) {
          S.nearEnd = true;
          SFX.cp();
          screenFx(false);

              ? "lead"
