<!doctype html>
<!--
  ═══════════════════════════════════════════════════════════════════════════
  CARRERA DE TORTUGAS · OVERLAY PARA TIKTOK LIVE
  ═══════════════════════════════════════════════════════════════════════════

  REGLAS DE CONTENIDO (obligatorias; valen para cualquier texto, aviso, sonido o animación que se agregue)
    1. NO PEDIR REGALOS. Ningún texto, cartel, mensaje ni animación puede pedir, sugerir o premiar con
       promesas la compra de regalos. Los regalos solo se REPORTAN cuando llegan (el 🎁 que aparece delante
       de la tortuga) y empujan a su país como cualquier otro evento.
    2. NO HACER PROMESAS VACÍAS. Solo se anuncia lo que el código realmente cumple (por ejemplo, una ayuda
       que describa algo que frame() realmente hace). Nada de "pronto…", "vas a ganar…",
       ni premios o beneficios que el juego no entregue.
    3. NO INSISTIR CON ACCIONES REPETIDAS. No hay mensajes rotativos, contadores de presión, pulsos
       permanentes ni pedidos que se repitan ("dale like", "comparte", "sigue"). Los textos de ayuda son
       fijos y se muestran una sola vez; la actividad de los espectadores solo se refleja, no se exige.

  DINÁMICA DEL JUEGO (cómo funciona hoy)
    • son 5 tortugas (más grandes), una por país. Brasil, Paraguay y Argentina son fijos y su ORDEN cambia en cada partida:
      los dos con más copas ocupan el 1.º y 2.º carril y el tercero queda en el 3.º. El 4.º carril es para el
      país "en ascenso" (el de más copas que no sea BR/PY/AR) y los dos últimos se sortean entre campeones
      del mundo y selecciones populares (chooseRoundTeams).
    • Las tortugas avanzan siempre despacio (CFG.crawl), incluso sin espectadores. La carrera dura el doble (TIME_X = 2; ?time=1 la deja como antes).
    • Un espectador elige país escribiendo su nombre, sigla o bandera en el chat. Esa elección (S.pick)
      dirige su energía a esa tortuga si no tiene carril. Un espectador solo suma un punto de apoyo cada 8 s (lastSupportAt). Si alguien da like o regalo sin haber elegido país,
      se le asigna uno al azar (registerSupport).
    • Puntos por evento (scoreContestant): comentario 1 · like 0.1 c/u · compartir 3 · seguir 5 ·
      entrar 0.5 (CFG.join) · regalo = diamantes × cantidad × combo (hasta ×2 si el mismo usuario envía
      regalos seguidos en menos de 6 s). El empuje doble (tecla B del panel) multiplica ×2.
    • Los puntos se convierten en ENERGÍA (T[país].pend) que la tortuga gasta caminando; nunca se teletransporta.
      La posición objetivo de un espectador con carril es puntos / CFG.target × CFG.win (raceAdd).
      Un regalo además deja un 🎁 delante de la tortuga, que corre a recogerlo (putGiftAhead).
    • Cada espectador ocupa el carril de su país si está libre, o el primero libre (claimSlot); si no hay
      carriles libres, quien tenga más puntos desplaza al que tenga menos.
    • La primera tortuga en pasar el 25 %, 50 % y 75 % recibe un efecto de lechuga (S.cp); al 88 % del líder
      hay un destello de tensión; si dos tortugas llegan casi empatadas a la zona final suena el foto finish (photo).
    • Gana quien llega primero a CFG.win (100). La racha del ganador se actualiza, hay festejo, y tras CFG.restartMs (7 s) empieza otra ronda con nuevos países.
    • La música cambia de tema en cada ronda: 5 temas originales (THEMES) que se turnan en orden.
    • Los espectadores recientes se recuerdan en el navegador (ROSTER) y las victorias en localStorage.

  PARÁMETROS DE URL: ?target=40  ?win=100  ?panel=1 (panel de pruebas, también tecla P)  ?sound=0
                     ?music=0  ?theme=1-5  ?vol=0.9  ?join=0.5  ?ws=URL (WebSocket en lugar de SSE)  ?safe=1  ?demo=0 (sin alertas de demostración)  ?autobots=0 (sin bots automáticos)  ?escena=1-4 (fuerza un escenario)  ?lang=en|es (idioma; el botón ES/EN lo cambia)  ?top=30 (dónde empieza la pista, en % desde arriba; más alto = más cielo)
  ESCENARIOS DEL FONDO: cada ronda usa uno, en orden: 1 madrugada (va amaneciendo) · 2 mañana (hacia el mediodía) ·
    3 mediodía (hacia la tarde) · 4 tarde (va oscureciendo). El cielo avanza con el progreso del líder de la carrera.
  BACKEND: SSE en /api/events. Un solo archivo, sin dependencias de build.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07262B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Country Race</title><!-- el título cambia con el idioma (applyLang) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      if ("serviceWorker" in navigator)
        window.addEventListener("load", () =>
          navigator.serviceWorker
            .register("/sw.js")
            .catch((error) =>
              console.error(
                "No se pudo registrar tortu como aplicación:",
                error,
              ),
            ),
        );
    </script>
    <style>
      :root{
        --ink: #07262b;
        --ink2: #0d3a41;
        --flag-size: 2.3rem;
        --sun: #ffc93c;
        --pink: #ff3d7f;
        --cream: #fff6e0;
        --mint: #5cf2c0;
        --sand: #f3dfa2;
        --sand2: #e8ce8c;
        --grass: #5fb35a;
        --grass2: #4a9a4c;
        --padr: 3%;
      }
      *{
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html{
        font-size: min(3.8vw, 2.1vh);
      }
      html, body{
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        color: var(--cream);
        font-family: "Nunito", system-ui, sans-serif;
        font-weight: 800;
      }
      .disp{
        font-family: "Bowlby One", "Arial Black", sans-serif;
        font-weight: 400;
      }
      #fx{
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 9;
      }

      /* Todo fluye en una sola columna: nada se encima, en cualquier pantalla */
      #app{
        position: absolute;
        top: var(--top, 30%);
        bottom: var(--bot, 14%);
        left: 3%;
        right: var(--padr);
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      /* Cabecera */

      /* Pista: 5 carriles fijos (uno por tortuga). Etiqueta izquierda = solo el puesto; el nombre va en .tag sobre la tortuga.
   Los anchos de .tur / .mk / .sl / .pl usan el mismo desplazamiento (.8rem de margen + pista de 100% - 7rem) para que
   la nariz de la tortuga coincida con las líneas de 25/50/75 % y con la meta. Si cambias el tamaño de .tur, ajusta los cuatro. */
      #lanes{
        flex: 1.5 1 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 0.3rem;
        --tw: min(13rem, 16vh);
        --n: 9;
        --lane-step: calc((100% - var(--th)) / var(--n));
        --fan-size: var(--flag-size);
        --g: 0rem;
      }
      .lane{
        flex: 1 1 0;
        min-height: 4.4rem;
        max-height: 5.8rem;
        display: flex;
        align-items: stretch;
        border-radius: 0.9rem;
        overflow: hidden;
        box-shadow: 0 0.25rem 0 rgba(0, 0, 0, 0.28);
      }
      .lane:nth-child(odd){
        background: rgba(243, 223, 162, 0.95);
      }
      .lane:nth-child(even){
        background: rgba(232, 206, 140, 0.95);
      }
      .lab{
        position: relative;
        z-index: 3;
        width: 2.8rem;
        justify-content: center;
        flex: none;
        background: var(--ink);
        display: flex;
        align-items: center;
        gap: 0.3rem;
        padding: 0 0.4rem;
      }
      .rk{
        flex: none;
        width: 1.6rem;
        height: 1.6rem;
        border-radius: 50%;
        background: var(--ink2);
        color: var(--cream);
        font-size: 0.95rem;
        display: grid;
        place-items: center;
      }
      .rk.r1{
        background: var(--sun);
        color: var(--ink);
      }
      .rk.r2{
        background: #d9e2e5;
        color: var(--ink);
      }
      .rk.r3{
        background: #e3a46b;
        color: var(--ink);
      }

      .nm{
        display: flex;
        flex-direction: column;
        line-height: 1.05;
        min-width: 0;
      }

      .nm b{
        font-family: "Bowlby One", sans-serif;
        font-weight: 400;
        color: var(--sun);
        font-size: 0.8rem;
        max-width: 5.6rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .nm small{
        font-size: 0.75rem;
        opacity: 0.85;
      }
      .lab em{
        margin-left: auto;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        line-height: 1.05;
        font-style: normal;
        color: var(--mint);
      }
      .lab em span{
        font-size: 1.05rem;
      }
      .lab em small{
        font-size: 0.75rem;
        color: var(--sun);
      }
      .lane.lead .lab{
        box-shadow: inset 0.25rem 0 0 var(--sun);
      }
      .trk{
        position: relative;
        flex: 1;
        border-top: 0.2rem solid var(--grass);
        border-bottom: 0.2rem solid var(--grass2);
        background-image:
          radial-gradient(rgba(120, 85, 30, 0.25) 0.07rem, transparent 0.1rem),
          radial-gradient(
            rgba(255, 255, 255, 0.28) 0.06rem,
            transparent 0.09rem
          );
        background-size:
          1.1rem 1rem,
          1.7rem 1.3rem;
        background-position:
          0 0,
          0.5rem 0.4rem;
      }
      .mk{
        position: absolute;
        top: 0;
        bottom: 0;
        width: 0;
        border-left: 0.12rem dashed rgba(7, 38, 43, 0.18);
      }
      .sl{
        position: absolute;
        top: 0;
        bottom: 0;
        left: 6.2rem;
        width: 0.18rem;
        background: rgba(255, 255, 255, 0.75);
      }
      .fin{
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: 0.8rem;
        background: repeating-conic-gradient(var(--ink) 0 25%, #fff 0 50%) 0
          0/0.4rem 0.4rem;
      }
      .tur{
        position: absolute;
        top: 62%;
        width: 5.4rem;
        height: 3.5rem;
        margin-top: -1.75rem;
        left: calc(0.8rem + (100% - 7rem) * var(--p, 0) / 100);
        z-index: 2;
      }
      .tur svg{
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .tur.turbo{
        filter: drop-shadow(0 0 0.5rem var(--pink))
          drop-shadow(0 0 0.9rem var(--sun));
      }
      .tur.turbo::before{
        content: "";
        position: absolute;
        right: 100%;
        top: 30%;
        width: 2.5rem;
        height: 40%;
        background: linear-gradient(90deg, transparent, var(--sun));
        border-radius: 999px;
      }

      .dust{
        position: absolute;
        top: calc(50% + 0.6rem);
        width: 0.6rem;
        height: 0.6rem;
        margin-left: -0.2rem;
        border-radius: 50%;
        background: rgba(255, 246, 224, 0.8);
        z-index: 1;
        pointer-events: none;
        animation: dust 0.8s ease-out forwards;
      }
      @keyframes dust{
        to {
          transform: translate(-1.8rem, -0.6rem) scale(2.4);
          opacity: 0;
        }
      }

      @keyframes pop{
        from {
          transform: scale(0.4);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }

      .empty{
        font-size: 0.62rem;
        opacity: 0.85;
      }

      #snd{
        position: fixed;
        left: 1.8rem;
        bottom: 0.3rem;
        z-index: 30;
        font-size: 0.8rem;
        background: rgba(0, 0, 0, 0.65);
        padding: 0.1rem 0.6rem;
        border-radius: 999px;
        display: none;
      }
      @media (orientation: portrait){
        html{
          font-size: clamp(12px, min(3.2vw, 1.8vh), 32px);
          --padr: 12%;
        }
        #app{
          top: 3%;
          bottom: 3%;
          left: 3%;
          right: var(--padr);
          gap: 0.2rem;
        }
        .lab{
          width: 2.6rem;
          gap: 0.2rem;
          padding: 0 0.25rem;
        }

        #snd{
          display: none;
        }

      }
      /* Panel de pruebas */

      #bots{
        position: fixed;
        right: 8px;
        top: 8px;
        z-index: 40;
        width: 176px;
        background: rgba(0, 0, 0, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 10px;
        padding: 8px;
        font:
          12px/1.2 system-ui,
          sans-serif;
        display: none;
        gap: 4px;
        flex-wrap: wrap;
      }
      #bots.on{
        display: flex;
      }
      #bots b{
        width: 100%;
        font-size: 11px;
        opacity: 0.8;
      }
      #bots button{
        flex: 1 1 45%;
        padding: 7px 4px;
        border: 0;
        border-radius: 6px;
        background: #1d4f57;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      #bots button.act{
        background: var(--pink);
      }
      #bots label{
        width: 100%;
        font-size: 11px;
        margin-top: 4px;
      }
      #bots input{
        width: 100%;
      }
      /* Avatar redondo, carril vacío atenuado, ganador resaltado,
   animación al cambiar de dueño (.swap) y etiqueta .tag con @usuario + puntos que viaja con la tortuga. */
      .av{
        flex: none;
        width: 1.9rem;
        height: 1.9rem;
        border-radius: 50%;
        display: grid;
        place-items: center;
        overflow: hidden;
        border: 0.12rem solid var(--sun);
        background: var(--ink2);
        color: #fff;
        font-size: 0.9rem;
      }
      .av img{
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .lane.empty .tur{
        opacity: 0.45;
        filter: grayscale(0.7);
      }
      .lane.win{
        outline: 0.2rem solid var(--sun);
        box-shadow: 0 0 1rem var(--sun);
      }
      .tur.swap svg{
        animation: pop 0.6s cubic-bezier(0.2, 1.6, 0.4, 1) both;
      }
      /* FIJA: esquina superior izquierda de la pista (al inicio); */
      .tag{
        position: absolute;
        left: 0.6rem;
        top: 0.15rem;
        margin: 0;
        max-width: min(calc(100% - 1.4rem), 36vw);
        display: flex;
        align-items: baseline;
        gap: clamp(3px, 0.4vw, 6px);
        padding: 0;
        height: clamp(18px, 3.8vw, 26px);
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        z-index: 5;
        pointer-events: none;
      }
      .tag b{
        flex: 0 1 auto;
        min-width: 0;
        max-width: min(30vw, 10rem);
        overflow: hidden;
        text-overflow: ellipsis;
        font-family: "Bowlby One", "Arial Black", sans-serif;
        font-weight: 400;
        font-size: clamp(10px, 1.4vw, 16px);
        letter-spacing: 0.02em;
        color: #07262b;
        -webkit-text-stroke: 0.08em #fff6e0;
        paint-order: stroke fill;
        text-shadow: none;
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }
      .tag small{
        flex: none;
        font-size: clamp(8px, 1vw, 12px);
        color: #0d3a41;
        font-weight: 800;
        -webkit-text-stroke: 0.08em #fff6e0;
        paint-order: stroke fill;
      }
      .lane.empty .tag{
        display: none;
      }
      /* Pantalla horizontal: se reduce el rem para que quepan los 5 carriles grandes sin tapar el panel inferior */
      @media (orientation: landscape){
        html{
          font-size: min(3.8vw, 1.45vh);
        }
      }
      /* Diseño: arriba la carrera + barra de mensajes */
              /* La carrera tiene PRIORIDAD de altura: cada carril mide fijo 4.4rem y la tabla de abajo cede (flex) si falta espacio.
   Así los carriles nunca se desbordan por debajo de la barra de mensajes ni la tapan. */
      #lanes{
        flex: 0 0 auto;
      }
      .lane{
        flex: 0 0 4.4rem;
        min-height: 4.4rem;
        max-height: none;
      }

       /* barra de mensajes SIEMPRE visible */

      /* ===== GAMIFICACIÓN: efectos ===== */
      .emo{
        position: absolute;
        top: 30%;
        font-size: 1.5rem;
        line-height: 1;
        z-index: 6;
        pointer-events: none;
        left: calc(0.8rem + (100% - 7rem) * var(--p, 0) / 100 + 2.2rem);
        animation: emo 1.6s ease-out forwards;
      }
      @keyframes emo{
        0% {
          transform: translate(0, 0.6rem) scale(0.4);
          opacity: 0;
        }
        15% {
          opacity: 1;
          transform: translate(0, 0) scale(1.2);
        }
        100% {
          transform: translate(var(--dx, 0), -2.6rem) scale(0.9)
            rotate(var(--rt, 0deg));
          opacity: 0;
        }
      }
      .ring{
        position: absolute;
        left: 1.6rem;
        top: 30%;
        width: 2.6rem;
        height: 2.6rem;
        margin: -1.3rem 0 0 -1.3rem;
        border-radius: 50%;
        border: 0.28rem solid var(--sun);
        box-shadow: 0 0 1rem var(--sun);
        pointer-events: none;
        animation: ring 0.9s ease-out forwards;
        z-index: 4;
      }
      .ring.mega{
        border-color: var(--pink);
        box-shadow:
          0 0 1.4rem var(--pink),
          0 0 2.4rem var(--sun);
      }
      @keyframes ring{
        to {
          transform: scale(4.2);
          opacity: 0;
        }
      }
      .lane.lead{
        box-shadow:
          0 0 0.9rem rgba(255, 201, 60, 0.9),
          0 0.25rem 0 rgba(0, 0, 0, 0.28);
      }
      .lane.lead::after{
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          100deg,
          transparent 35%,
          rgba(255, 255, 255, 0.55) 50%,
          transparent 65%
        );
        transform: translateX(-120%);
        animation: shine 3.2s ease-in-out infinite;
        pointer-events: none;
        z-index: 4;
      }
      @keyframes shine{
        60%,
        100% {
          transform: translateX(120%);
        }
      }
      .lane{
        position: relative;
      }
      .lane.flash{
        animation: flash 0.9s ease-out;
      }
      @keyframes flash{
        0% {
          outline: 0.25rem solid var(--pink);
          filter: brightness(1.5);
        }
        100% {
          outline: 0.25rem solid transparent;
          filter: none;
        }
      }

      #app.shake{
        animation: shake 0.9s ease-out;
      }
      @keyframes shake{
        20% {
          transform: translate(-0.12rem, 0.07rem);
        }
        45% {
          transform: translate(0.1rem, -0.06rem);
        }
        70% {
          transform: translate(-0.05rem, 0.03rem);
        }
      }
      #vig{
        position: fixed;
        inset: 0;
        z-index: 8;
        pointer-events: none;
        opacity: 0;
        box-shadow: inset 0 0 6rem 1.5rem var(--sun);
      }
      #vig.on{
        animation: vig 1s ease-out;
      }
      @keyframes vig{
        0% {
          opacity: 0.9;
        }
        100% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce){
        .lane.lead::after{
          animation: none;
        }
      }

      /* La carrera queda arriba; la mitad inferior aparece solo durante los festejos. */
      #app{
        top: 0;
        bottom: 50%;
        left: 3%;
        right: var(--padr);
        gap: 0.2rem;
      }
      #lanes{
        flex: 1 1 0;
        min-height: 0;
      }
      .lane{
        flex: 1 1 0;
        min-height: 0;
        height: auto;
      }
      .tur{
        top: 50%;
        width: auto;
        height: 100%;
        aspect-ratio: 66 / 46;
        margin-top: 0;
        transform: translateY(-50%);
      }


      /* ===== ANUNCIO EMERGENTE DEL GANADOR (3 s) sobre las rutas ===== */
      #fx{
        z-index: 45;
      }

      #app.finished .lane:not(.win){
        filter: saturate(0.4);
        transition:
          opacity 0.4s,
          filter 0.4s;
        opacity: 0.5;
      }

      /* ===== PARTICIPACIÓN CLARA Y MEDIBLE ===== */

      /* ===== pista libre: sin bandera a la izquierda, sin nombre de país (solo copas) ===== */
      .lab{
        display: none !important;
      }
      .tag b{
        display: inline-block;
      }
      .tag b:empty{
        display: none;
      }
      .lane.empty .tag{
        display: flex !important;
      }
      .tag b{
        font-size: clamp(14px, 2.2vw, 24px) !important;
        max-width: none !important;
      }
      /* ===== cabecera mínima + banderas ===== */

      .lab{
        width: 3.3rem;
      }
      .rk{
        position: relative;
        width: var(--flag-size);
        height: var(--flag-size);
        padding: 0;
        overflow: hidden;
        border: 0.16rem solid var(--cream);
        box-shadow: 0 0.12rem 0.35rem rgba(0, 0, 0, 0.55);
      }
      .rk img{
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .rk::after{
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        pointer-events: none;
        background:
          radial-gradient(
            circle at 30% 24%,
            rgba(255, 255, 255, 0.6),
            transparent 42%
          ),
          radial-gradient(
            circle at 50% 55%,
            transparent 55%,
            rgba(0, 0, 0, 0.3) 100%
          );
      }
      .rk.r1{
        border-color: var(--sun);
        box-shadow:
          0 0 0.55rem var(--sun),
          0 0.12rem 0.35rem rgba(0, 0, 0, 0.55);
      }
      .rk.r2{
        border-color: #d9e2e5;
      }
      .rk.r3{
        border-color: #e3a46b;
      }
      @media (orientation: portrait){

        .lab{
          width: 2.9rem;
        }
        :root{
          --flag-size: 2rem;
        }
      }
      /* ===== llamadas de acción grandes y vistosas ===== */

            /* ===== UNA SOLA PISTA para todas las tortugas (grandes), copas mini, mensajes en el pie ===== */
      #lanes{
        --tw: min(11rem, 28vh);
        --th: calc(var(--tw) * 46/66);
        --g: 3rem;
        position: relative;
        display: block;
        background-color: var(--sand);
        background-image:
          radial-gradient(rgba(120, 85, 30, 0.25) 0.07rem, transparent 0.1rem),
          radial-gradient(
            rgba(255, 255, 255, 0.28) 0.06rem,
            transparent 0.09rem
          );
        background-size:
          1.1rem 1rem,
          1.7rem 1.3rem;
        border-top: 0.25rem solid var(--grass);
        border-bottom: 0.25rem solid var(--grass2);
        border-radius: 0.9rem;
        box-shadow: 0 0.25rem 0 rgba(0, 0, 0, 0.28);
      }
      #lanes .lane{
        position: absolute !important;
        inset: 0;
        flex: none;
        height: auto;
        min-height: 0;
        max-height: none;
        overflow: visible;
        border-radius: 0;
        background: none !important;
        box-shadow: none !important;
        outline: none !important;
        animation: none !important;
        pointer-events: none;
      }
      #lanes .lane::after{
        display: none !important;
      }
      #lanes .trk{
        position: absolute;
        inset: 0;
        border: 0;
        background: none;
        z-index: 1;
        --rt: calc((100% - var(--th)) * var(--i)/var(--n));
        clip-path: inset(-100vh -100vw -100vh 0);
      }
      #lanes::after{
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        background-image: radial-gradient(
          circle,
          rgba(7, 38, 43, 0.58) 1px,
          transparent 1.5px
        );
        background-size: 7px var(--lane-step);
        background-position: 0 calc(var(--lane-step) - 1px);
        pointer-events: none;
      }
      #lanes .trk .tur{
        top: var(--rt);
        width: var(--tw);
        height: var(--th);
        aspect-ratio: auto;
        margin: 0;
        transform: none;
        left: calc(
          var(--tw) * 0 + (100% - var(--tw) * 1 - 0.8rem) * var(--p, 0) / 100
        );
      }
      #lanes .sl{
        left: calc(var(--g) + var(--tw));
      }

      #lanes .emo{
        top: calc(var(--rt) + var(--th) * 0.2);
        left: calc(
          var(--tw) * 0 + (100% - var(--tw) * 1 - 0.8rem) * var(--p, 0) / 100 + var(--tw) * 0.45
        );
      }
      #lanes .dust{
        top: calc(var(--rt) + var(--th) - 0.9rem);
      }
      #lanes .tag{
        left: 0.3rem;
        top: calc(var(--rt) + var(--th) / 2 - 11px);
        max-width: calc(var(--g) - 0.3rem);
      }
      #lanes .tag b{
        font-size: clamp(7px, 1.1vw, 12px) !important;
      }
      #lanes .lane.empty .tag{
        display: flex !important;
      }

      /* mensajes: pie de pantalla, texto que va pasando */

      /* ===== pantalla completa, 10 países, sin versión ===== */

      #app{
        top: var(--top, 30%); /* pista bajada para dejar más cielo (antes 17 %); ?top=17 vuelve al valor anterior */
        bottom: var(--bot, 7%);
      }

      /* ===== etiqueta de 2 líneas: iniciales + copas / hinchas ===== */

      #lanes .tag{
        height: auto;
        overflow: visible;
        top: calc(var(--rt) + var(--th) / 2 - 1.1em);
        max-width: calc(var(--g) - 0.2rem);
      }
      #lanes .tag b{
        display: block;
        white-space: pre;
        line-height: 1.2;
        max-width: none;
      }
      /* ===== hinchas grandes y vivos, líder con resplandor ===== */

      #lanes .tag b i{
        font-style: normal;
      }

      #lanes .tag{
        top: calc(var(--rt) + var(--th) / 2 - 1.6em);
      }
      #lanes .lane.lead .trk .tur{
        filter: drop-shadow(0 0 0.45rem #ffc93c) drop-shadow(0 0 1.1rem #ffc93c);
      }
      #lanes .lane.lead .trk .tur.turbo{
        filter: drop-shadow(0 0 0.5rem var(--pink))
          drop-shadow(0 0 1.1rem #ffc93c);
      }

      /* ===== eventos sobre la tortuga ===== */
      #lanes .evb{
        position: absolute;
        z-index: 12;
        white-space: nowrap;
        pointer-events: none;
        padding: 0.16em 0.7em 0.2em;
        border-radius: 999px;
        border: 0.16rem solid #fff;
        color: #fff;
        font-size: calc(var(--th) * 0.24);
        line-height: 1.15;
        text-shadow: 0 0.08em 0 rgba(7, 38, 43, 0.7);
        box-shadow: 0 0.2rem 0.5rem rgba(0, 0, 0, 0.6);
        top: calc(var(--rt) - var(--th) * 0.15 - var(--o, 0) * var(--th) * 0.12);
        left: calc(
          var(--tw) * 0 + (100% - var(--tw) * 1 - 0.8rem) * var(--p, 0) / 100 + var(--tw) * 0.5
        );
        animation: evup 2.2s ease-out forwards;
      }
      @keyframes evup{
        0% {
          transform: translate(-50%, 0.8rem) scale(0.4);
          opacity: 0;
        }
        14% {
          transform: translate(-50%, 0) scale(1.15);
          opacity: 1;
        }
        28% {
          transform: translate(-50%, 0) scale(1);
        }
        80% {
          opacity: 1;
        }
        100% {
          transform: translate(-50%, -1.8rem) scale(1);
          opacity: 0;
        }
      }
      #lanes .evb.e-lk{
        background: #ff3d7f;
      }
      #lanes .evb.e-ch{
        background: #1fb58a;
      }
      #lanes .evb.e-gf{
        background: linear-gradient(90deg, #ff9f1c, #ffc93c);
        color: #07262b;
        text-shadow: none;
      }
      #lanes .evb.e-sh{
        background: #2e7bff;
      }
      #lanes .evb.e-fo{
        background: #e5254b;
      }
      #lanes .evb.e-jn{
        background: #7b4dff;
      }
      #lanes .evb.e-ch{
        max-width: min(72vw, 22rem);
        overflow: hidden;
        text-overflow: ellipsis;
        background: #fff;
        color: #07262b;
        text-shadow: none;
        white-space: nowrap;
      }
      #lanes .evb.e-ch::after{
        content: "";
        position: absolute;
        left: 50%;
        bottom: -0.34em;
        border-top: 0.4em solid #fff;
        border-right: 0.35em solid transparent;
        border-left: 0.35em solid transparent;
        transform: translateX(-50%);
      }
      #lanes .gift-bait{
        position: absolute;
        z-index: 4;
        top: calc(var(--rt) + var(--th) * 0.13);
        left: calc(
          var(--tw) * 0 + (100% - var(--tw) * 1 - 0.8rem) * var(--p, 0) / 100 + var(--tw) * 0.5
        );
        display: grid;
        width: calc(var(--th) * 0.42);
        height: calc(var(--th) * 0.42);
        place-items: center;
        border: 0.12rem solid #fff;
        border-radius: 0.9rem;
        background: linear-gradient(145deg, #fff4bd, #ffae21);
        box-shadow: 0 0 0.6rem rgba(255, 201, 60, 0.9), 0 0.15rem 0.3rem rgba(0, 0, 0, 0.45);
        font-size: calc(var(--th) * 0.3);
        line-height: 1;
        transform: translateX(-50%);
        animation: giftbait 0.55s ease-in-out infinite alternate;
        pointer-events: none;
      }
      #lanes .gift-bait.caught{
        animation: giftcaught 0.24s ease-out forwards;
      }
      @keyframes giftbait{
        from { margin-top: 0; filter: drop-shadow(0 0 0.15rem #fff); }
        to { margin-top: -0.5rem; filter: drop-shadow(0 0 0.4rem #ffec98); }
      }
      @keyframes giftcaught{
        to { opacity: 0; transform: translateX(-50%) scale(1.8) rotate(12deg); }
      }
      /* ===== ajustes ===== */
      .lane.empty .tur{
        opacity: 1;
        filter: none;
      }

      /* ===== fondo de estadio pixel-art (canvas #bg) y pista transparente ===== */
      #bg{
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        pointer-events: none;
        image-rendering: crisp-edges;
        image-rendering: pixelated;
      }
      html:not(.pbg) #bg{
        display: none;
      }
      html.pbg #lanes{
        background: none !important;
        border: 0 !important;
        box-shadow: none !important;
        border-radius: 0 !important;
      }
      html.pbg #lanes::after,
      html.pbg #lanes .sl,
      html.pbg #lanes .fin{
        display: none !important;
      }

      /* ===== tortugas al 100 % de opacidad (también tras terminar la carrera) ===== */
      #lanes .tur,
      #lanes .lane.empty .tur,
      #app.finished .lane:not(.win),
      #app.finished .lane:not(.win) .tur{
        opacity: 1 !important;
      }
      #app.finished .lane:not(.win){
        filter: none !important;
      }
      #lanes .lane.empty .tur{
        filter: none !important;
      }

      /* ===== sin hinchas ni copas · la tortuga sale del borde izquierdo · caras ===== */

      #lanes .lane .tag,
      #lanes .lane.empty .tag {
        display: none !important;
      }
      .tur .fgf{
        display: none;
      }
      .tur.owned .fgf{
        display: inline;
      }
      /* CAMBIO DE EXPRESIÓN GRADUAL: las caras no saltan; se funden unas en otras (FACE_FADE) */
      .tur .mo{
        display: inline;
        opacity: 0;
        transition: opacity 1.1s ease-in-out;
      }
      .tur .eyes{
        transition: opacity 1.1s ease-in-out;
      }
      /* parpadeo natural cada ~4 s */
      .tur .eyes .blk{
        transform-box: fill-box;
        transform-origin: center;
        animation: blink 4.2s infinite;
      }
      @keyframes blink{
        0%, 94%, 100%{ transform: scaleY(1); }
        97%{ transform: scaleY(0.1); }
      }
      .tur.mood-sad .mo-sad,
      .tur.mood-happy .mo-happy,
      .tur.mood-turbo .mo-turbo,
      .tur.mood-tired .mo-tired{
        opacity: 1;
      }
      .tur.mood-turbo .eyes,
      .tur.mood-tired .eyes{
        opacity: 0;
      }
      /* cara de AGOTADO: las gotas de sudor resbalan despacio */
      .tur .mo-tired .sw{
        animation: tiredDrip 1.8s ease-in infinite;
      }
      .tur .mo-tired .sw2{
        animation-delay: 0.9s;
      }
      @keyframes tiredDrip{
        0%{ transform: translateY(-1px); opacity: 0; }
        25%{ opacity: 1; }
        100%{ transform: translateY(4px); opacity: 0; }
      }

      /* ===== botones pequeños (alertas / bot) y lista de alertas ===== */
      #qbar{
        position: fixed;
        left: 0.6rem;
        bottom: 0.5rem;
        z-index: 45;
        display: flex;
        gap: 0.4rem;
      }
      #connectorStatus{
        position: fixed;
        bottom: 0.6rem;
        right: 0.6rem;
        z-index: 46;
        max-width: min(72vw, 22rem);
        overflow: hidden;
        padding: 0.55rem 0.8rem;
        border: 0.12rem solid #ff9292;
        border-radius: 999px;
        background: rgba(160, 27, 42, 0.96);
        color: #fff;
        font: 800 0.72rem/1.1 Nunito, system-ui, sans-serif;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #connectorStatus.connected{
        border-color: #6ce8a1;
        background: rgba(23, 126, 69, 0.96);
      }
      #connectorStatus:disabled{
        opacity: 1;
      }
      #qbar button{
        position: relative;
        width: 2.2rem;
        height: 2.2rem;
        border: 0.1rem solid rgba(255, 255, 255, 0.4);
        border-radius: 50%;
        background: rgba(7, 38, 43, 0.72);
        color: #fff;
        font-size: 1rem;
        line-height: 1;
        cursor: pointer;
        opacity: 0.75;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      #qbar button:hover,
      #qbar button.act{
        opacity: 1;
      }
      #qbar button.act{
        background: var(--pink);
        border-color: #fff;
      }
      #qLang{
        font: 800 0.75rem/1 Nunito, system-ui, sans-serif !important;
        letter-spacing: 0.02em;
      }
      #qBot[data-n]:not([data-n="0"])::after{
        content: attr(data-n);
        position: absolute;
        right: -0.3rem;
        top: -0.3rem;
        min-width: 1.05rem;
        padding: 0 0.2rem;
        border-radius: 999px;
        background: var(--sun);
        color: var(--ink);
        font: 800 0.65rem/1.05rem Nunito, system-ui, sans-serif;
      }
      #botCount{
        align-self: center;
        padding: 0.3rem 0.8rem;
        border-radius: 999px;
        background: rgba(7, 38, 43, 0.85);
        border: 0.1rem solid rgba(255, 255, 255, 0.4);
        color: var(--sun);
        font: 800 1rem/1.2 Nunito, system-ui, sans-serif;
        white-space: nowrap;
      }
      #alerts{
        position: fixed;
        left: 0.6rem;
        bottom: 3.6rem;
        z-index: 44;
        display: flex;
        flex-direction: column-reverse;
        gap: 0.4rem;
        width: min(94vw, 30rem);
        pointer-events: none;
      }
      #alerts .al{
        overflow: hidden;
        padding: 0.4rem 0.8rem 0.45rem;
        border-left: 0.35rem solid var(--mint);
        border-radius: 0.7rem;
        background: rgba(7, 38, 43, 0.84);
        color: #fff;
        font: 800 1.2rem/1.3 Nunito, system-ui, sans-serif;
        white-space: nowrap;
        text-overflow: ellipsis;
        animation: alIn 0.25s ease-out, alOut 0.4s ease-in 3.6s forwards;
      }
      #alerts .al b{
        color: var(--sun);
      }
      #alerts .al .demo{
        margin-right: 0.45rem;
        padding: 0.05rem 0.4rem;
        border-radius: 0.25rem;
        background: rgba(255, 246, 224, 0.18);
        color: var(--cream);
        font-size: 0.8rem;
        font-style: normal;
        letter-spacing: 0.04em;
      }
      #alerts .al.e-lk{ border-left-color: #ff3d7f; }
      #alerts .al.e-gf{ border-left-color: #ffc93c; }
      #alerts .al.e-sh{ border-left-color: #2e7bff; }
      #alerts .al.e-fo{ border-left-color: #e5254b; }
      #alerts .al.e-jn{ border-left-color: #7b4dff; }
      @keyframes alIn{
        from{ opacity: 0; transform: translateX(-1rem); }
        to{ opacity: 1; transform: none; }
      }
      @keyframes alOut{
        to{ opacity: 0; transform: translateX(-0.6rem); }
      }

      /* ===== física de marcha: la tortuga gira sobre sus patas y los choques muestran 💥 ===== */
      #lanes .trk .tur{
        transform-origin: 35% 90%;
        will-change: transform;
      }
      #lanes::after{
        display: none !important;
      }
      #lanes .boom{
        position: absolute;
        z-index: 12;
        font-style: normal;
        line-height: 1;
        pointer-events: none;
        transform: translate(-50%, -50%);
        filter: drop-shadow(0 0 0.3rem #ffc93c);
        animation: boomPop 2.2s ease-out forwards;
      }
      @keyframes boomPop{
        0%{ opacity: 1; transform: translate(-50%, -50%) scale(0.3) rotate(-15deg); }
        35%{ opacity: 1; transform: translate(-50%, -50%) scale(1.25) rotate(8deg); }
        100%{ opacity: 0; transform: translate(-50%, -62%) scale(1.5) rotate(0deg); }
      }

      /* AVATAR EMERGENTE: cada interacción hace salir un círculo con el avatar del usuario sobre el caparazón.
         NO lleva --p propio: hereda el --p y --rt de la pista, que frame() actualiza en cada cuadro,
         así que viaja pegado a la tortuga en vez de quedarse anclado donde nació. */
      #lanes .avpop{
        position: absolute;
        z-index: 14;
        pointer-events: none;
        width: calc(var(--th) * 0.46);
        height: calc(var(--th) * 0.46);
        border-radius: 50%;
        border: 0.14rem solid #fff;
        background: var(--nc, #0d3a41);
        color: #fff;
        display: grid;
        place-items: center;
        overflow: hidden;
        font: calc(var(--th) * 0.24)/1 "Bowlby One", "Arial Black", sans-serif;
        box-shadow: 0 0 0.6rem rgba(255, 201, 60, 0.9), 0 0.2rem 0.45rem rgba(0, 0, 0, 0.55);
        top: calc(var(--rt) + var(--th) * 0.02);
        left: calc((100% - var(--tw) - 0.8rem) * var(--p, 0) / 100 + var(--tw) * 0.38);
        margin-left: calc(var(--th) * -0.23);
        animation: avpop 1.8s ease-out forwards;
      }
      #lanes .avpop img{
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      @keyframes avpop{
        0%{ transform: translateY(0.8rem) scale(0.3); opacity: 0; }
        15%{ transform: translateY(-0.4rem) scale(1.2); opacity: 1; }
        30%{ transform: translateY(-0.6rem) scale(1); opacity: 1; }
        80%{ transform: translateY(-1.4rem) scale(1); opacity: 1; }
        100%{ transform: translateY(-2.2rem) scale(0.9); opacity: 0; }
      }

      /* cartel "recibió regalo" sobre la tortuga mientras dura la protección */
      #lanes .pbadge{
        position: absolute;
        z-index: 13;
        white-space: nowrap;
        pointer-events: none;
        padding: 0.12em 0.7em 0.16em;
        border-radius: 999px;
        border: 0.16rem solid #fff;
        background: linear-gradient(90deg, #1ea7ff, #38d6ff);
        color: #fff;
        font-size: calc(var(--th) * 0.22);
        line-height: 1.15;
        text-shadow: 0 0.08em 0 rgba(7, 38, 43, 0.7);
        box-shadow: 0 0.2rem 0.5rem rgba(0, 0, 0, 0.6);
        top: calc(var(--rt) - var(--th) * 0.42);
        left: calc((100% - var(--tw) - 0.8rem) * var(--p, 0) / 100 + var(--tw) * 0.5);
        transform: translateX(-50%);
      }
      /* PROTECCIÓN POR REGALO: aura celeste mientras dura el anti-choque */
      #lanes .trk .tur.shield svg{
        filter: drop-shadow(0 0 0.35rem #7fe3ff) drop-shadow(0 0 0.9rem #38b6ff);
      }
      /* SÚPER ENERGÍA: brillo rojo-dorado mientras la agresora corre a atacar */
      #lanes .trk .tur.charge svg{
        filter: drop-shadow(0 0 0.5rem #ff3d2e) drop-shadow(0 0 1.1rem #ffc93c);
      }

      /* ===== el primero lleva corona y cara de líder ===== */
      .tur .crw{
        display: none;
      }
      .tur.first .crw{
        display: inline;
      }
      .tur.mood-lead .mo-lead{
        opacity: 1;
      }
      .tur.mood-lead .eyes{
        opacity: 0;
      }
      /* CABEZA ROJA HIRVIENDO: se pone más roja a medida que se acerca el choque (--rg 0.3 → 1) y late como si hirviera */
      .tur .rage{
        opacity: 0;
        transition: opacity 1s ease-in-out;
        pointer-events: none;
      }
      .tur.angry .rage{
        opacity: var(--rg, 0.4);
      }
      .tur .rage .rg2{
        animation: boilPulse 0.55s ease-in-out infinite;
      }
      @keyframes boilPulse{
        0%, 100%{ opacity: 0.72; }
        50%{ opacity: 1; }
      }
      .tur .rage .stm{
        opacity: 0;
        animation: steamUp 0.9s ease-out infinite;
      }
      .tur .rage .stm2{
        animation-delay: 0.45s;
      }
      @keyframes steamUp{
        0%{ transform: translateY(2px); opacity: 0; }
        30%{ opacity: 0.9; }
        100%{ transform: translateY(-5px); opacity: 0; }
      }
      /* cara de LLORANDO: los últimos 3 puestos cuando la líder está a 15 % de la meta */
      .tur.cry .mo,
      .tur.cry .eyes{
        opacity: 0 !important;
        transition-duration: 0.8s;
      }
      .tur.cry .mo-cry{
        opacity: 1 !important;
      }
      .tur .mo-cry .tear{
        animation: tearFall 1.1s ease-in infinite;
      }
      .tur .mo-cry .tear2{
        animation-delay: 0.35s;
      }
      .tur .mo-cry .tear3{
        animation-delay: 0.7s;
      }
      .tur .mo-cry .tear4{
        animation-delay: 0.15s;
      }
      @keyframes tearFall{
        0%{ transform: translateY(-1px); opacity: 0; }
        20%{ opacity: 1; }
        100%{ transform: translateY(9px); opacity: 0; }
      }
      .tur .mo-cry .wail{
        transform-box: fill-box;
        transform-origin: center;
        animation: wail 0.45s ease-in-out infinite;
      }
      @keyframes wail{
        0%, 100%{ transform: scaleY(1); }
        50%{ transform: scaleY(1.35); }
      }
      /* cara de ENOJADO: la tortuga ya decidió chocar y va a embestir; se funde en ~0,5 s */
      .tur.angry .mo,
      .tur.angry .eyes{
        opacity: 0 !important;
        transition-duration: 0.5s;
      }
      .tur.angry .mo-angry{
        opacity: 1 !important;
      }
      /* cara de GOLPE: ojos > <, boca abierta, chichón y estrellas durante todo el retroceso (~12 s) y 1 s más tras cada choque */
      .tur.ouch .mo,
      .tur.ouch .eyes{
        opacity: 0 !important;
        transition-duration: 0.35s; /* el golpe sí entra rápido; al salir de él vuelve a fundirse despacio */
      }
      .tur.ouch .mo-ouch{
        opacity: 1 !important;
      }

      /* ===== al llegar a la meta se muestra el avatar del ganador durante 5 s ===== */
      #winner{
        position: fixed;
        inset: 0;
        z-index: 60;
        display: none;

<g class="av"><circle class="avbg" cx="27" cy="20.5" r="11" fill="#0D3A41"/><text class="avtx" x="27" y="26" text-anchor="middle" font-size="15" font-family="Bowlby One,Arial Black,sans-serif" fill="#fff"></text><image class="avim" x="16.5" y="10" width="21" height="21" preserveAspectRatio="xMidYMid slice" clip-path="url(#ca${i})"/><circle cx="27" cy="20.5" r="11" fill="none" stroke="#FFC93C" stroke-width="1.8"/></g><g class="crew"></g><g class="fgf"><rect x="18" y="-8" width="18" height="12" rx="1.5" fill="#fff" stroke="#07262B" stroke-width="1.2"/><image class="fgi" x="18.8" y="-7.2" width="16.4" height="10.4" preserveAspectRatio="xMidYMid slice"/></g></g></svg>`;
      }
      const lanes = $("lanes");
      lanes.style.setProperty("--n", C.length - 1);
      C.forEach((c, li) => {
        const l = document.createElement("div");
        l.className = "lane empty";
        l.id = "ln-" + c.c;
        l.innerHTML = `<div class="lab"><div class="rk disp" id="rk-${c.c}"><img alt="${NATIONS[li].n}" src="${NATIONS[li].u}"></div></div>
  <div class="trk" id="tk-${c.c}" style="--i:${li}">${[25, 50, 75].map((m) => `<i class="mk" style="left:calc(var(--tw) * 1 + (100% - var(--tw) * 1 - .8rem)*${m / 100})"></i>`).join("")}<i class="sl"></i><div class="fin"></div><div class="tag"><b id="nm-${c.c}"></b><small id="tt-${c.c}"></small></div><div class="tur mood-sad" id="tu-${c.c}" style="--p:0">${turtle(c)}</div></div>`;
        lanes.append(l);
      });

      /* Tamaño de las tortugas según el alto real de la pista: como máximo 25 % de solape entre filas, y nunca más del 28 % del ancho. */
      function fitTurtles() {
        const H = lanes.clientHeight,
          W = lanes.clientWidth;
        if (!H || !W) return;
        const th = H / (1 + 0.75 * (C.length - 1)),
          tw = Math.min(
            (th * 66) / 46,
            W * 0.28,
            17 * remPx(),
          ) * 0.75; /* 5 tortugas, un poco más chicas */
        lanes.style.setProperty("--tw", tw.toFixed(1) + "px");
      }
      addEventListener("resize", fitTurtles);
      if (window.ResizeObserver) new ResizeObserver(fitTurtles).observe(lanes);
      fitTurtles();
      setTimeout(fitTurtles, 300);
      setTimeout(fitTurtles, 1500);

      /* ===== Confeti ===== */
      const cv = $("fx"),
        cx = cv.getContext("2d");
      let ps = [],
        run = false;
      function size() {
        cv.width = innerWidth;
        cv.height = innerHeight;
      }
      addEventListener("resize", size);
      size();
      /* Generador común de confeti. o = {x, y (funciones), vx, vy, vy0, r, r0}: dispersión y tamaño de las partículas */
      function spawnConfetti(n, gold, o) {
        const cols = gold
          ? ["#FFC93C", "#FFE27A", "#FFF6E0"]
          : ["#FF3D7F", "#5CF2C0", "#FFC93C", "#FFF6E0"];
        for (let i = 0; i < n; i++)
          ps.push({
            x: o.x(),
            y: o.y(),
            vx: (Math.random() - 0.5) * o.vx,
            vy: -Math.random() * o.vy - o.vy0,
            r: Math.random() * o.r + o.r0,
            c: cols[i % cols.length],
            a: Math.random() * 6,
            va: (Math.random() - 0.5) * 0.4,
            l: 1,
          });
        if (!run) {
          run = true;
          requestAnimationFrame(tick);
        }
      }
      /* Confeti de pantalla completa (festejo) */
      function burst(n, gold) {
        spawnConfetti(Math.min(n, 300), gold, {
          x: () => innerWidth * (0.2 + Math.random() * 0.6),
          y: () => innerHeight * 0.72,
          vx: 16, vy: 16, vy0: 4, r: 7, r0: 5,
        });
      }
      function tick() {
        cx.clearRect(0, 0, cv.width, cv.height);
        ps = ps.filter((p) => p.l > 0 && p.y < innerHeight + 30);
        for (const p of ps) {
          p.vy += 0.4;
          p.x += p.vx;
          p.y += p.vy;
          p.a += p.va;
          p.l -= 0.004;
          cx.save();
          cx.globalAlpha = Math.min(1, p.l * 2);
          cx.translate(p.x, p.y);
          cx.rotate(p.a);
          cx.fillStyle = p.c;
          cx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
          cx.restore();
        }
        if (ps.length) requestAnimationFrame(tick);
        else {
          run = false;
          cx.clearRect(0, 0, cv.width, cv.height);
        }
      }

      /* ===== Pantalla ===== */
      /* Jugador dueño de una tortuga (slot 's0'..'s4'), o null si el carril está libre */
      function slotPlayer(code) {
        const k = S.slotUser[code];
        return k ? contestants.get(k) : null;
      }
      /* Redibuja puesto, nombre, puntos, corona y estados (libre / ganador) de los 6 carriles. Se llama ~4 veces/seg. */
      /* El espectador elige un país (nombre, sigla o bandera en el chat); sin carril propio, su energía va a esa tortuga. */
      function registerPick(user, code) {
        S.pick.set(user, code);
      }
      function render() {
        const ord = [...C].sort((a, b) => S.pos[b.c] - S.pos[a.c]);
        ord.forEach((c, i) => {
          const r = $("rk-" + c.c);
          r.className = "rk disp r" + (i + 1);
        });
        C.forEach((c) => {
          const p = slotPlayer(c.c);
          $("nm-" + c.c).textContent = "";
          const tg = T[c.c].tag || (T[c.c].tag = $("nm-" + c.c).parentNode);
          $("tt-" + c.c).textContent = "";
          T[c.c].tw = p
            ? tg.offsetWidth
            : 0; /* ancho de la etiqueta, para centrarla sin salirse de la pista */
          const l = $("ln-" + c.c);
          l.classList.toggle(
            "lead",
            !!p && S.pos[ord[0].c] > 1 && c.c === ord[0].c,
          );
          l.classList.toggle("empty", !p);
          l.classList.toggle("win", c.c === S.winner);
        });
        if (S.go && !S.over) {
          highlightOvertakes(ord);
          checkNearEnd();
        }
      }
      /* Adelantamientos: el carril que sube de puesto parpadea; si pasa al 1.º lugar suena el aviso y estalla confeti. */
      let lastRank = {};
      function highlightOvertakes(ord) {
        ord.forEach((c, i) => {
          const prev = lastRank[c.c];
          lastRank[c.c] = i;
          if (
            prev !== undefined &&
            i < prev &&
            slotPlayer(c.c) &&
            S.pos[c.c] > 3 &&
            Math.abs(S.pos[c.c] - S.pos[ord[i + 1] ? ord[i + 1].c : c.c]) > 0.3
          ) {
            const l = $("ln-" + c.c);
            restartAnim(l, "flash");
            emojiFx(c.c, "follow", 3);
            if (i === 0) {
              burstAt(...turPos(c.c), 45, true);
              SFX.cp();
            }
          }
        });
      }
      /* Tensión final: la primera vez por ronda que el líder pasa el 88 % suena un aviso y destella la pantalla. */
      function checkNearEnd() {
        if (S.nearEnd) return;
        let m = -1,
          lc = null;
        for (const c of C)
          if (S.slotUser[c.c] && S.pos[c.c] > m) {
            m = S.pos[c.c];
            lc = c.c;
          }
        if (lc && m >= 88) {
          S.nearEnd = true;
          SFX.cp();
          screenFx(false);
        }
      }
      /* Pone (o quita) el avatar del dueño en el caparazón y en la etiqueta del carril. Sin foto: inicial con color propio. */
      function setSlotAvatar(code, p) {
        const t = T[code],
          a = t.av,
          key = p ? p.key + "|" + (p.avatar || "") + "|" + code + "|" + !!p.isBot : "-" + code;
        if (t.avKey === key) return;
        t.avKey = key;
        const nn = NATIONS[C.findIndex((x) => x.c === code)],

      /* ===== Avatares sobre el caparazón =====
         El avatar principal (círculo grande del caparazón) es el del usuario que generó el ÚLTIMO evento de esa tortuga.
         Cuando otro usuario genera un evento, el principal anterior pasa a un círculo pequeño alrededor del caparazón
         (máx. CREW_MAX, los más recientes primero). La bandera queda fija arriba. */
      const CREW_MAX = 5,
        CREW_ANG = [162, 142, 122, 58, 38] /* grados sobre el borde del caparazón; el hueco de arriba es de la bandera */,
        SVGNS = "http://www.w3.org/2000/svg";
      function renderCrew(code) {
        const t = T[code],
          g = t.ring,
          nn = NATIONS[C.findIndex((x) => x.c === code)];
        if (!g) return;
        g.textContent = "";
        const mk = (tag, at) => {
          const el = document.createElementNS(SVGNS, tag);
          for (const k in at) el.setAttribute(k, at[k]);
          return el;
        };
        t.crew.slice(0, CREW_MAX).forEach((p, k) => {
          const a = (CREW_ANG[k] * Math.PI) / 180,
            x = 27 + 25.5 * Math.cos(a),
            y = 34 - 29 * Math.sin(a),
            r = 5.2,
            item = mk("g", { transform: `translate(${x.toFixed(2)} ${y.toFixed(2)})` });
          item.append(mk("circle", { r, fill: nn ? nn.c : "#0D3A41" }));
          const tx = mk("text", { y: p.isBot ? 2.4 : 3, "text-anchor": "middle", "font-size": p.isBot ? 6.5 : 8.5, fill: "#fff", "font-family": "Bowlby One,Arial Black,sans-serif" });
          tx.textContent = p.isBot ? "🤖" : (p.username || "?").trim().charAt(0).toUpperCase() || "?";
          item.append(tx);
          if (p.avatar) {
            const im = mk("image", { x: -r, y: -r, width: r * 2, height: r * 2, preserveAspectRatio: "xMidYMid slice", "clip-path": `url(#cb${code})`, referrerpolicy: "no-referrer" });
            im.onerror = () => im.remove();
            im.setAttribute("href", p.avatar);
            item.append(im);
          }
          item.append(mk("circle", { r, fill: "none", stroke: "#fff", "stroke-width": 1.1 }));
          g.append(item);
        });
      }
      /* Pone al usuario del último evento como avatar principal y manda al anterior a los círculos del caparazón. */
      function setMain(code, p) {
        const t = T[code];
        if (!t || !p) return;
        if (t.mainP && t.mainKey !== p.key) {
          t.crew = t.crew.filter((x) => x.key !== t.mainP.key);
          t.crew.unshift(t.mainP);
        }
        t.crew = t.crew.filter((x) => x.key !== p.key).slice(0, CREW_MAX);
        t.mainKey = p.key;
        t.mainP = p;
        setSlotAvatar(code, p);
        renderCrew(code);
      }
      function clearCrew(code) {
        const t = T[code];
        t.crew = [];
        t.mainKey = null;
        t.mainP = null;
        renderCrew(code);

      /* Los participantes reales pueden ocupar carriles libres o reemplazar al de menor puntaje. */
      function claimSlot(p) {
        let code,
          lo = null;
        const preferred = S.pick.get(p.key),
          free =
            C.find((c) => c.c === preferred && !S.slotUser[c.c]) ||
            C.find((c) => !S.slotUser[c.c]);
        if (free) code = free.c;
        else {
          if (p.isBot) return null;
          const bot = C.find((c) => {
            const occupant = slotPlayer(c.c);
            return occupant && occupant.isBot;
          });
          if (bot) {
            lo = { c: bot, o: slotPlayer(bot.c) };
            code = bot.c;
          } else {
            for (const c of C) {
              const o = slotPlayer(c.c);
              if (o && c.c !== S.winner && (!lo || o.points < lo.o.points))
                lo = { c, o };
            }
            if (!lo || p.points <= lo.o.points) return null;
            code = lo.c.c;
          }
          S.slotOf.delete(lo.o.key);
          if (lo.o.isBot) {
            contestants.delete(lo.o.key);
            if (window.botKicked) window.botKicked(lo.o.key); /* se da de baja el bot y se detienen sus eventos */
            T[code].crew = T[code].crew.filter((x) => x.key !== lo.o.key);
            if (T[code].mainKey === lo.o.key) { T[code].mainKey = null; T[code].mainP = null; }
          }
        }
        if (lo) {
          T[code].pend = 0;
          T[code].ve = 0;
          T[code].cr = 0;
          T[code].vs = 0;
        }
        S.slotUser[code] = p.key;
        S.slotOf.set(p.key, code);
        setMain(code, p);
        const el = T[code].tur;
        restartAnim(el, "swap");
        SFX.join();

      }
      /* Burbuja de evento SOBRE la tortuga (sigue a la tortuga mientras sube y se desvanece). Los likes se agrupan cada 0.45 s. */
      function evBadge(code, ty, entry, points) {

        if (!t) return;

          const e = document.createElement("div");
          e.className = "evb disp " + cls;
          e.textContent = txt;
          e.style.setProperty("--o", (t.evo = ((t.evo || 0) + 1) % 3));
          e.style.setProperty(
            "--p",
            ((S.pos[code] / CFG.win) * 100).toFixed(2),
          );
          t.trk.append(e);
          setTimeout(() => e.remove(), 2300);
        };
        const pts =
          points < 10 ? String(+points.toFixed(1)) : String(Math.round(points));
        if (ty === "like") {

            1,

            }, 450);

        }
        if (ty === "gift") {

          show(

          );
        } else if (ty === "chat") {
          const comment = String(entry.content || "").replace(/\s+/g, " ").trim();
          const message = comment.length > 42 ? comment.slice(0, 41) + "…" : comment;
          show("e-ch", message ? "💬 “" + message + "”" : tr("💬 Comentó", "💬 Commented"));
        }
        else if (ty === "share") show("e-sh", tr("🔁 Compartió +", "🔁 Shared +") + pts);
        else if (ty === "follow") show("e-fo", tr("❤️ Siguió +", "❤️ Followed +") + pts);
        else if (ty === "join") show("e-jn", tr("👋 Se unió", "👋 Joined"));
        else if (ty === "support") show("e-ch", "💬 +1");
      }
      /* Al llegar un regalo aparece un 🎁 delante de la tortuga y ella corre a recogerlo. */
      function putGiftAhead(code, entry) {
        const t = T[code],
          available = Math.max(0, CFG.win - 1 - S.pos[code]);
        if (!t || available <= 0) return;
        const distance = Math.min(
          available,
          Math.min(9, Math.max(3, t.pend * 0.6)),
        );
        if (distance <= 0) return;
        if (t.giftEl) t.giftEl.remove();
        t.giftTarget = S.pos[code] + distance;
        t.pend = Math.max(t.pend, distance + 0.8);
        const gift = document.createElement("span");
        gift.className = "gift-bait";
        gift.textContent = "🎁";
        gift.title = tr("Regalo para recoger", "Gift to pick up") + (entry.content ? ": " + entry.content : "");
        gift.setAttribute("aria-label", gift.title);
        gift.style.setProperty(
          "--p",
          ((t.giftTarget / CFG.win) * 100).toFixed(2),
        );
        t.trk.append(gift);
        t.giftEl = gift;
      }
      /* Un evento de un espectador (p) vale `points`: la tortuga camina hasta (puntos del dueño / CFG.target) * CFG.win.
         Si el espectador no tiene carril, su energía va a la tortuga del país que apoya. Añade efectos visuales y sonido. */
      const LEVELS = [10, 25, 50, 100, 200, 400];
      /* Avatar redondo que sale sobre el caparazón en CADA interacción. Es hijo de la pista (.trk) y no define --p/--rt,
         por lo que sigue a la tortuga mientras camina. Máx. 4 a la vez y 1 por usuario cada 0.5 s (los likes llegan a ráfagas). */
      function avatarPop(code, p) {
        const t = T[code];
        if (!t || !p) return;
        const now = performance.now();
        if (now - (p.popAt || 0) < 500) return;
        p.popAt = now;
        const old = t.trk.querySelectorAll(".avpop");
        if (old.length >= 4) old[0].remove();
        const nn = NATIONS[C.findIndex((x) => x.c === code)],
          e = document.createElement("div");
        e.className = "avpop";
        e.style.setProperty("--nc", nn ? nn.c : "#0d3a41");
        e.style.marginTop = (((Math.random() - 0.5) * 0.5).toFixed(2)) + "rem";
        const initial = p.isBot ? "🤖" : (p.username || "?").trim().charAt(0).toUpperCase() || "?";
        e.textContent = initial;
        if (p.avatar) {
          const im = document.createElement("img");
          im.alt = "";
          im.referrerPolicy = "no-referrer";
          im.onerror = () => im.remove();
          im.src = p.avatar;
          e.append(im);
        }
        t.trk.append(e);
        setTimeout(() => e.remove(), 1900);
      }
      function raceAdd(p, entry, points) {
        if (S.over) return;
        let code = S.slotOf.get(p.key) || claimSlot(p);
        const ownsLane = Boolean(code);
        if (!code) code = S.pick.get(p.key);
        if (!code) return;
        const t = T[code],
          ty = entry.type;
        if (entry.type !== "support") setMain(code, p); /* el último evento manda: su avatar es el principal */
        avatarPop(code, p); /* círculo con el avatar que sale sobre el caparazón y viaja con la tortuga */
        /* cada evento suma EVENT_STEP (20 %) de pista a la tortuga, sin importar los puntos; camina esa energía (no se teletransporta) */
        t.pend = Math.min(
          Math.max(0, CFG.win - S.pos[code]),
          t.pend + Math.min(Math.max(0, CFG.win - S.pos[code]), EVENT_STEP),
        );
        if (ty === "gift") {
          putGiftAhead(code, entry);
          t.protT = GIFT_PROT_S; /* protección anti-choque 15 s desde el último regalo */
          if (!S.giftQ.includes(code) && S.giftQ.length < 3) S.giftQ.push(code);
        }

        if (points >= 15) {
          t.tur.classList.add("turbo");
          setTimeout(() => t.tur.classList.remove("turbo"), 1800);

      /* PUNTUACIÓN: único punto de entrada de TODOS los eventos (reales, de espera y de prueba).
   1) calcula puntos  2) aplica empuje doble y combo de regalos  3) limita comentarios a 1 cada 8 s por usuario
   4) suma al jugador  5) raceAdd() mueve su tortuga  6) avisa si entra/desplaza del Top 5 o toma el primer lugar.
   Se ignora todo mientras la ronda está terminada (S.over). */
      function scoreContestant(entry, isBot = false) {
        if (
          !entry ||
          typeof entry !== "object" ||
          typeof entry.type !== "string"
        )
          return;
        const username =
          String(entry.username || "Alguien").trim() || "Alguien";
        const rawCount =
          entry.activityCount === undefined ? 1 : Number(entry.activityCount);
        if (
          entry.type === "gift" &&
          (!Number.isFinite(rawCount) || rawCount <= 0)
        )
          return;
        const counts = Math.max(1, rawCount || 1);
        const diamonds = Math.max(1, Number(entry.diamondCount) || 1);
        let points =
          entry.type === "chat"
            ? 1
            : entry.type === "gift"
              ? diamonds * counts
              : entry.type === "like"
                ? counts * 0.1
                : entry.type === "follow"
                  ? 5
                  : entry.type === "share"
                    ? 3
                    : entry.type === "join"
                      ? CFG.join
                      : 0;
        if (!points || S.over) return;
        if (entry.type !== "join") points *= S.boost > Date.now() ? 2 : 1;

        let player = contestants.get(key);
        if (entry.type === "join" && player && !player.isBot)
          return; /* ya es participante: el segundo 'join' no suma */
        if (isBot && !S.slotOf.has(key) && !C.some((c) => !S.slotUser[c.c]))
          return;
        if (!player) {

            key,
            username,
            avatar: "",
            points: 0,

        } else if (!isBot) player.isBot = false;
        if (entry.type === "chat") {
          const n = Date.now();
          if (n - (player.lastChat || 0) < 8000) return;
          player.lastChat = n;

          typeof entry.avatar === "string" &&
          /^https?:\/\//i.test(entry.avatar)

          player.avatar = entry.avatar;

        raceAdd(player, entry, points);

      function resetContestants() {

      /* Empuje doble: durante `sec` segundos cada aporte vale x2 (solo se activa desde el panel de pruebas, tecla B). */
      function setBoost(sec) {
        S.boost = Date.now() + sec * 1000;
      }

      /* ===== Lógica de la carrera ===== */
      /* EVENTO "chat": asigna o cambia el país del usuario. Ignora comentarios sin país. */
      /* Equipo del usuario; si aún no tiene (regaló sin elegir), le toca uno al azar. */
      /* Ficha del usuario en el ranking de la ronda (la crea si no existe). pts = puntos, best = mejor combo. */
      /* Combo: regalos seguidos del mismo usuario (menos de 6 s) suben el multiplicador hasta x2 */
      function combo(user) {
        const now = Date.now(),
          c = S.combo.get(user) || { n: 0, t: 0 };
        c.n = now - c.t < 6000 ? c.n + 1 : 1;
        c.t = now;
        S.combo.set(user, c);
        return { n: c.n, mult: 1 + Math.min(c.n - 1, 4) * 0.25 };

      /* Fin de ronda: se llama desde frame() cuando la primera tortuga ocupada llega a CFG.win.

         lanza los efectos de festejo y programa la siguiente ronda (CFG.restartMs). */
      /* al llegar a la meta: avatar del ganador en pantalla durante WINNER_MS (5 s) */
      const WINNER_MS = 5000;

      function finish(code) {
        S.over = true;
        S.winner = code;
        musicSync();
        SFX.flag();
        const t = T[code],
          p = slotPlayer(code);
        S.pos[code] = CFG.win;
        t.pend = 0;
        t.ve = 0;
        for (const c of C) {
          const lane = T[c.c];
          if (lane.giftEl) lane.giftEl.remove();

      /* Nueva ronda: sortea los países (setRoundTeams), deja los carriles libres con la posición en cero,

      function newRound() {

        S.over = false;

        S.giftQ = [];

        contestantSequence = 0;
        S.slotUser = {};

      /* Cuenta regresiva 3-2-1-¡YA!: solo sonido; las tortugas esperan en la salida hasta S.go = true. */
      let cdT = [];
      function countdown() {

      }

      /* ===== Movimiento realista =====
   - Cada tortuga tiene su ritmo de arrastre, que cambia suavemente, y a veces se detiene a mirar.
   - Un regalo no teletransporta: es energía que se gasta caminando, con aceleración y frenado.
   - Las patas siguen un paso en diagonal; la velocidad cambia cadencia, balanceo y polvo. */
      /* Estado de FÍSICA y animación por tortuga (clave = código de país):
     pend  energía de regalos pendiente de gastar     ve  velocidad extra por regalos (u/s)
     cr    velocidad de avance base (u/s)              vs  velocidad total suavizada (anima patas y polvo)
     base  factor personal de velocidad de arrastre    pause  segundos que le quedan de pausa
     ph/am fase y amplitud del paso    hl  cuánto levanta la cabeza    w  semilla de ruido    du  temporizador de polvo */
      const T = {};
      C.forEach((c) => {
        const e = $("tu-" + c.c);
        T[c.c] = {
          tur: e,
          trk: $("tk-" + c.c),
          e: {
            lfB: e.querySelector(".lfB"),
            lfF: e.querySelector(".lfF"),

            lnF: e.querySelector(".lnF"),
            tl: e.querySelector(".tl"),
            hd: e.querySelector(".hd"),
            bd: e.querySelector(".bd"),

          av: {
            im: e.querySelector(".avim"),
            tx: e.querySelector(".avtx"),
            bg: e.querySelector(".avbg"),
          },
          fg: e.querySelector(".fgi"),
          ring: e.querySelector(".crew"),
          crew: [] /* otros usuarios que apoyan a esta tortuga: círculos alrededor del caparazón */,
          mainKey: null,
          mainP: null /* usuario del ÚLTIMO evento: su avatar es el principal */,
          ph: Math.random() * 6,
          step: 0,
          w: Math.random() * 10,
          vs: 0,
          ve: 0,
          cr: 0,
          pend: 0,
          giftTarget: null,
          giftEl: null,
          pause: 0,
          base: 1,
          am: 0,
          hl: 0,
