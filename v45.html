          if (_u) {
            const _code =
              (_i >= 0 && C[_i].c) ||
              S.pick.get(_u) ||
              S.slotOf.get(_u) ||
              rnd(C).c;
            registerPick(_u, _code);
            if (Date.now() - (lastSupportAt[_u] || 0) > 8000) {
              lastSupportAt[_u] = Date.now();
              const _o = _i >= 0 ? slotPlayer(_code) : null;
              if (_o) {
                _o.points += 1;
                raceAdd(_o, { type: "support" }, 1);
              }
            }
            render();
          }
        }
      }
      /* Punto de entrada de todo evento (SSE, WebSocket o bots de prueba). */
      function handleTikTokEntry(entry, isBot = false) {
        registerSupport(entry, isBot);
        if (entry && ["member", "enter", "joined"].includes(entry.type))
          entry = { ...entry, type: "join" };
        if (!isBot) rosterTouch(entry);
        scoreContestant(entry, isBot);
      }
      /* PRESENTES: guarda en el navegador los últimos cinco usuarios reales para reutilizarlos entre rondas y sesiones. */
      const ROSTER_KEY = "tortugasRecentUsers",
        ROSTER_LIMIT = 10;
      const ROSTER = (() => {
        try {
          const saved = JSON.parse(localStorage.getItem(ROSTER_KEY) || "[]"),
            roster = new Map();
          if (Array.isArray(saved))
            for (const item of saved) {
              if (!item || typeof item.username !== "string") continue;
              const username = item.username.trim(),
                key = username.toLocaleLowerCase();
              if (!username || key === "alguien") continue;
              roster.delete(key);
              roster.set(key, {
                username,
                avatar: typeof item.avatar === "string" ? item.avatar : "",
                t: Number(item.t) || 0,
              });
            }
          while (roster.size > ROSTER_LIMIT)
            roster.delete(roster.keys().next().value);
          return roster;
        } catch {
          return new Map();
        }
      })();
      function rosterTouch(e) {
        const name = e && String(e.username || "").trim();
        if (!name || name.toLocaleLowerCase() === "alguien") return;
        const key = name.toLocaleLowerCase(),
          r = ROSTER.get(key) || { username: name, avatar: "" };
        r.t = Date.now();
        if (typeof e.avatar === "string" && /^https?:\/\//i.test(e.avatar))
          r.avatar = e.avatar;
        ROSTER.delete(key);
        ROSTER.set(key, r);
        while (ROSTER.size > ROSTER_LIMIT)
          ROSTER.delete(ROSTER.keys().next().value);
        try {
          localStorage.setItem(
            ROSTER_KEY,
            JSON.stringify([...ROSTER.values()]),
          );
        } catch {}
      }
      function connect() {
        fetch("/api/status")
          .then((response) => {
            if (!response.ok) throw new Error("No se pudo consultar la conexión de TikTok.");
            return response.json();
          })
          .then(handleConnectorStatus)
          .catch((error) => {
            console.error("No se pudo consultar la conexión de TikTok:", error);
            handleConnectorStatus({
              connected: false,
              status: "failed",
              username: DEFAULT_CONNECTOR_USERNAME,
              error: error.message,
            });
          });
        if (Q.has("ws")) {
          let ws;
          try {
            ws = new WebSocket(CFG.ws);
          } catch {
            return setTimeout(connect, 3000);
          }
          ws.onclose = () => setTimeout(connect, 2000);
          ws.onmessage = (e) => {
            try {
              const m = JSON.parse(e.data);
              if (
                [
                  "chat",
                  "gift",
                  "like",
                  "follow",
                  "share",
                  "join",
                  "member",
                  "enter",
                ].includes(m.type)
              ) {
                const entry = {
                  ...m,
                  username: m.username || m.user || "Alguien",
                  content: m.content || m.text || m.gift || "",
                  diamondCount: m.diamondCount || m.diamonds,
                  activityCount: m.activityCount || m.count,
                  time: m.time || new Date().toISOString(),
                };
                handleTikTokEntry(entry);
              } else if (m.type === "reset") resetContestants();
            } catch {}
          };
          return;
        }
        const source = new EventSource("/api/events");
        source.addEventListener("status", (e) => {
          try {
            handleConnectorStatus(JSON.parse(e.data));
          } catch (error) {
            console.error("No se pudo leer el estado de TikTok:", error);
          }
        });
        source.addEventListener("update", (e) => {
          try {
            const entry = JSON.parse(e.data).entry;
            handleTikTokEntry(entry);
          } catch {}
        });
      }

      /* ===== Bots de prueba: simulan eventos de TikTok llamando a los MISMOS manejadores que el WebSocket =====
   (handleTikTokEntry), así que sirven para probar el juego sin servidor. Nunca envían nada a la red.
   Pruebas manuales desde el panel con P o ?panel=1. Además hay una cadena automática de bots (ver más abajo). */
      const NAMES = [
        "Lucía",
        "Mateo",
        "Ana_PY",
        "Carlos",
        "Sofi",
        "Diego",
        "Valen",
        "Rocío",
        "Nico",
        "Cami",
        "Tomás",
        "Fran",
      ];
      const GIFTS = {
        rose: ["Rose", 1],
        heart: ["Finger Heart", 5],
        donut: ["Doughnut", 30],
        galaxy: ["Galaxy", 1000],
      };
      const botEvent = (type, username, details = {}) => {
        const entry = {
          type,
          username,
          content: details.content || "",
          avatar: "",
          time: new Date().toISOString(),
          ...details,
        };
        handleTikTokEntry(entry, true);
      };
      const botGift = (t = "rose", u = rnd(NAMES)) =>
        botEvent("gift", u, {
          content: GIFTS[t][0],
          diamondCount: GIFTS[t][1],
          activityCount: 1,
        });
      const botJoin = () =>
        botEvent("join", rnd(NAMES) + ((Math.random() * 90) | 0));
      const botLike = () =>
        botEvent("like", rnd(NAMES), {
          activityCount: 1 + ((Math.random() * 8) | 0),
        });
      async function botFlood(n = 20) {
        const u = rnd(NAMES);
        for (let i = 0; i < n; i++) {
          botGift(
            Math.random() < 0.7 ? "rose" : "donut",
            Math.random() < 0.5 ? u : rnd(NAMES),
          );
          await new Promise((r) => setTimeout(r, 150));
        }
      }
      let autoT = null;
      function toggleAuto() {
        const btn = document.querySelector("[data-a=auto]");
        if (autoT) {
          clearTimeout(autoT);
          autoT = null;
          btn.classList.remove("act");
          return;
        }
        btn.classList.add("act");
        const loop = () => {
          const r = Math.random();
          if (r < 0.15) botJoin();
          else if (r < 0.22) botEvent("follow", rnd(NAMES));
          else if (r < 0.45) botLike();
          else {
            const g = (r - 0.45) / 0.55;
            botGift(
              g < 0.6
                ? "rose"
                : g < 0.85
                  ? "heart"
                  : g < 0.97
                    ? "donut"
                    : "galaxy",
            );
          }
          autoT = setTimeout(
            loop,
            (700 + Math.random() * 1500) / (+$("rate").value || 1),
          );
        };
        loop();
      }
      const ACT = {
        rose: () => botGift("rose"),
        donut: () => botGift("donut"),
        galaxy: () => botGift("galaxy"),
        join: botJoin,
        like: botLike,
        flood: botFlood,
        follow: () => botEvent("follow", rnd(NAMES)),
        auto: toggleAuto,
        boost: () => setBoost(60),
        sound: toggleSound,
        music: toggleMusic,
        reset: resetContestants,
      };
      document
        .querySelectorAll("#bots button")
        .forEach((b) => (b.onclick = () => ACT[b.dataset.a]()));
      const KEYS = {
        1: "rose",
        2: "donut",
        3: "galaxy",
        j: "join",
        l: "like",
        f: "flood",
        a: "auto",
        b: "boost",
        m: "sound",
        n: "music",
        r: "reset",
      };
      addEventListener("keydown", (e) => {
        const k = e.key.toLowerCase();
        if (k === "p") $("bots").classList.toggle("on");
        else if (KEYS[k]) ACT[KEYS[k]]();
      });
      if (Q.get("panel")) $("bots").classList.add("on");
      if (SND) document.querySelector("[data-a=sound]").classList.add("act");
      if (SND && MUSIC)
        document.querySelector("[data-a=music]").classList.add("act");

      /* ===== GAMIFICACIÓN: efectos (solo visuales; no tocan puntos ni posiciones) =====
   emojis flotantes por evento · anillo en la tortuga · cartel grande por nivel de aporte (TURBO/MEGA/LEYENDA)
   · temblor y destello de pantalla · niveles por jugador · adelantamientos · CAMPEÓN con confeti */
      const EMO = {
        gift: ["🎁", "💎", "✨"],
        like: ["❤️", "💖", "💕"],
        follow: ["⭐", "💛", "🌟"],
        share: ["🔁", "🚀", "📣"],
        chat: ["💬", "🐢", "👏"],
        join: ["👋", "🐢", "✨"],
      };
      /* Confeti que sale de un punto (x, y) de la pantalla */
      function burstAt(x, y, n, gold) {
        spawnConfetti(n, gold, { x: () => x, y: () => y, vx: 14, vy: 13, vy0: 3, r: 6, r0: 4 });
      }
      function turPos(code) {
        const r = T[code].tur.getBoundingClientRect();
        return [r.left + r.width * 0.5, r.top + r.height * 0.4];
      }
      function emojiFx(code, type, n) {
        const t = T[code];
        for (let i = 0; i < n; i++)
          setTimeout(() => {
            const e = document.createElement("i");
            e.className = "emo";
            e.textContent = rnd(EMO[type] || EMO.chat);
            e.style.setProperty("--p", Math.min(100, S.pos[code]));
            e.style.setProperty(
              "--dx",
              ((Math.random() - 0.5) * 3.2).toFixed(1) + "rem",
            );
            e.style.setProperty(
              "--rt",
              (((Math.random() - 0.5) * 40) | 0) + "deg",
            );
            t.trk.append(e);
            setTimeout(() => e.remove(), 1700);
          }, i * 110);
      }
      function ringFx(code, mega) {
        const r = document.createElement("i");
        r.className = "ring" + (mega ? " mega" : "");
        T[code].tur.append(r);
        setTimeout(() => r.remove(), 950);
      }
      function screenFx(shake) {
        const v = $("vig");
        v.className = "";
        void v.offsetWidth;
        v.className = "on";
        if (shake) {
          const a = $("app");
          restartAnim(a, "shake");
        }
      }
      /* ===== ALERTAS DE EVENTOS + BOTS DE PRUEBA =====
         Alertas: lista corta abajo a la izquierda que REPORTA lo que llega (like, comentario, regalo, seguir, compartir, entrar).
         Refleja la actividad que llega: no pide nada ni repite mensajes (reglas de contenido 1-3). Sin actividad muestra alertas de ejemplo marcadas DEMO.
         Bots: cada pulsación de 🤖 agrega un espectador simulado (hasta 2) que entra, escribe su país, da likes, comenta,
         comparte, sigue y a veces regala, con ritmo irregular. Sus eventos pasan por los MISMOS manejadores que los reales
         (registerSupport + scoreContestant) pero no se guardan en el ROSTER. Mantener pulsado 🤖 los detiene a todos. */
      (() => {
        const al = $("alerts"),
          bA = $("qAlert"),
          bB = $("qBot");
        let on = Q.get("alerts") !== "0";
        bA.classList.toggle("act", on);
        bA.onclick = () => {
          on = !on;
          bA.classList.toggle("act", on);
          if (!on) al.textContent = "";
        };
        let badge = "";
        const toast = (cls, icon, user, text) => {
          if (!on) return null;
          const e = document.createElement("div");
          e.className = "al " + cls;
          const b = document.createElement("b");
          b.textContent = user;
          if (badge) {
            const d = document.createElement("i");
            d.className = "demo";
            d.textContent = badge;
            e.append(d);
          }
          e.append(icon + " ", b, " " + text);
          while (al.children.length >= 4) al.firstChild.remove();
          al.append(e);
          setTimeout(() => e.remove(), 4000);
          return e;
        };
        const likeToast = {};
        function alertEvent(en) {
          if (!on || !en || typeof en.type !== "string") return;
          const u = shownName(String(en.username || "Alguien").trim().slice(0, 18) || "Alguien");
          let ty = en.type;
          if (["member", "enter", "joined"].includes(ty)) ty = "join";
          if (ty === "like") {
            const n = Math.max(1, Number(en.activityCount || en.count) || 1),
              k = u.toLowerCase(),
              L = likeToast[k];
            if (L && L.e.isConnected && Date.now() - L.t < 2500) {
              L.n += n;
              L.t = Date.now();
              L.e.lastChild.textContent = tr(" dio ", " gave ") + L.n + " likes";
            } else {
              const e = toast("e-lk", "👍", u, tr("dio ", "gave ") + (n === 1 ? tr("un like", "a like") : n + " likes"));
              if (e) likeToast[k] = { e, n, t: Date.now() };
            }
          } else if (ty === "chat") {
            const m = String(en.content || en.text || "").replace(/\s+/g, " ").trim();
            toast("e-ch", "💬", u + ":", m ? (m.length > 36 ? m.slice(0, 35) + "…" : m) : tr("comentó", "commented"));
          } else if (ty === "gift") {
            const c = Math.max(1, Number(en.activityCount) || 1);
            toast("e-gf", "🎁", u, tr("envió ", "sent ") + (en.content || tr("un regalo", "a gift")) + (c > 1 ? " ×" + c : ""));
          } else if (ty === "follow") toast("e-fo", "❤️", u, tr("empezó a seguir", "started following"));
          else if (ty === "share") toast("e-sh", "🔁", u, tr("compartió", "shared"));
          else if (ty === "join") toast("e-jn", "👋", u, tr("entró", "joined"));
        }
        const baseHandle = handleTikTokEntry;
        handleTikTokEntry = function (entry, isBot) {
          lastActivity = Date.now();
          badge = entry && entry.sim ? "BOT" : "";
          try { alertEvent(entry); } catch {}
          badge = "";
          if (entry && entry.sim) {
            (window.SIMK = window.SIMK || new Set()).add(String(entry.username).trim().toLocaleLowerCase());
            registerSupport(entry, true);
            scoreContestant(entry, true);
            render();
            return;
          }
          return baseHandle(entry, isBot);
        };

        /* ---- alertas de demostración ----
           Mientras no llega ninguna actividad (ni real ni de bots), se muestran alertas de ejemplo con la insignia DEMO.
           Son solo avisos visuales: NO suman puntos ni mueven las tortugas, no se guardan y se detienen en cuanto llega
           el primer evento. Si hay 8 s sin actividad, vuelven. La campanita 🔔 las activa o las apaga. ?demo=0 las desactiva. */
        let lastActivity = 0;
        const DEMO_IDLE_MS = 8000;
        if (Q.get("demo") !== "0") {
          const DEMO_USERS = ["Lucía", "Mateo", "Ana_PY", "Carlos", "Sofi", "Diego", "Valen", "Rocío"];
          const DEMO_CHAT_ES = ["vamos Paraguay", "qué carrera", "🐢🐢🐢", "dale Brasil", "uff"],
            DEMO_CHAT_EN = ["go Paraguay", "what a race", "🐢🐢🐢", "come on Brazil", "wow"];
          const DEMO_GIFT_ES = ["Rosa", "Corazón", "Dona"],
            DEMO_GIFT_EN = ["Rose", "Heart", "Doughnut"];
          const demoStep = () => {
            if (Date.now() - lastActivity >= DEMO_IDLE_MS) {
              const u = rnd(DEMO_USERS), r = Math.random();
              const en =
                r < 0.35 ? { type: "like", activityCount: 1 + ((Math.random() * 8) | 0) }
                : r < 0.55 ? { type: "chat", content: rnd(tr(DEMO_CHAT_ES, DEMO_CHAT_EN)) }
                : r < 0.7 ? { type: "join" }
                : r < 0.82 ? { type: "share" }
                : r < 0.92 ? { type: "follow" }
                : { type: "gift", content: rnd(tr(DEMO_GIFT_ES, DEMO_GIFT_EN)), activityCount: 1 };
              badge = "DEMO";
              try { alertEvent({ ...en, username: u }); } catch {}
              badge = "";
            }
            setTimeout(demoStep, 2500 + Math.random() * 3500);
          };
          setTimeout(demoStep, 2500);
        }

        /* ---- bots ---- */
        const MAXB = 2,
          bots = [];
        const GENERIC = ["jajaja", "qué carrera", "🐢🐢🐢", "vamos vamos", "uff", "quién gana?", "🔥🔥"],
          GENERIC_EN = ["lol", "what a race", "🐢🐢🐢", "let's go", "wow", "who wins?", "🔥🔥"];
        const send = (type, name, d = {}) =>
          handleTikTokEntry({
            type, username: name, content: "", avatar: "", sim: true,
            time: new Date().toISOString(), ...d,
          });
        function botStep(b) {
          if (!b.on) return;
          const bk = b.name.toLocaleLowerCase();
          if (b.joined && !S.slotOf.has(bk)) return window.botKicked(bk); /* perdió su tortuga: se da de baja */
          let i = NATIONS.findIndex((n) => n.code === b.fav);
          if (i < 0) {
            b.fav = rnd(NATIONS).code;
            i = NATIONS.findIndex((n) => n.code === b.fav);
            send("chat", b.name, { content: NATIONS[i].n });
          }
          const nm = NATIONS[i].n,
            r = Math.random();
          if (!b.joined) {
            b.joined = true;
            send("join", b.name);
            b.t = setTimeout(() => {
              send("chat", b.name, { content: nm });
              b.t = setTimeout(() => botStep(b), 1200 + Math.random() * 2500);
            }, 600 + Math.random() * 1200);
            return;
          }
          if (r < 0.4) send("like", b.name, { activityCount: 1 + ((Math.random() * 12) | 0) });
          else if (r < 0.62)
            send("chat", b.name, {
              content: Math.random() < 0.7
                ? rnd(tr([nm, "vamos " + nm, "¡" + nm + "!", nm + " campeón", "dale " + nm], [nm, "go " + nm, nm + "!", nm + " champion", "come on " + nm]))
                : rnd(tr(GENERIC, GENERIC_EN)),
            });
          else if (r < 0.76) {
            const g = Math.random(),
              k = g < 0.6 ? "rose" : g < 0.85 ? "heart" : g < 0.98 ? "donut" : "galaxy";
            send("gift", b.name, { content: GIFTS[k][0], diamondCount: GIFTS[k][1], activityCount: 1 });
          } else if (r < 0.83) send("share", b.name);
          else if (r < 0.87 && !b.followed) {
            b.followed = true;
            send("follow", b.name);
          } else send("like", b.name, { activityCount: 1 + ((Math.random() * 6) | 0) });
          b.t = setTimeout(() => botStep(b), 1200 + Math.random() * 4800);
        }
        const count = () => {
          bB.setAttribute("data-n", String(bots.length));
          $("botCount").textContent = tr("🤖 Bots activos: ", "🤖 Active bots: ") + bots.length;
        };
        window.__botCount = count;
        /* País de la ronda con menos bots (para repartirlos entre las tortugas). */
        function pickFav() {
          const use = (code) => bots.filter((x) => x.fav === code).length;
          const min = Math.min(...NATIONS.map((n) => use(n.code)));
          return rnd(NATIONS.filter((n) => use(n.code) === min)).code;
        }
        /* Avance (0..win) de la tortuga que el bot realmente empuja: la casilla que ocupa (S.slotOf), o null si aún no tiene.
           La primera vez que la tiene se anota su posición inicial (p0). */
        function botProgress(b) {
          if (!b.slot) {
            b.slot = S.slotOf.get(b.name.toLocaleLowerCase());
            if (!b.slot) return null;
            b.p0 = S.pos[b.slot] || 0;
          }
          return (S.pos[b.slot] || 0) - b.p0;
        }
        function addBot() {
          if (bots.length >= MAXB) return; /* máximo 2 bots; mantener pulsado 🤖 los detiene */
          if (!C.some((c) => !S.slotUser[c.c])) return; /* sin tortugas libres no entran más bots: son para las personas */
          const b = {
            name: rnd(NAMES) + ((100 + Math.random() * 900) | 0),
            fav: pickFav(),
            p0: 0,
            slot: null,
            on: true,
            joined: false,
            followed: false,
            t: null,
          };
          bots.push(b);
          bB.classList.add("act");
          count();
          b.t = setTimeout(() => botStep(b), 200 + Math.random() * 600);
        }
        function stopBots(manual) {
          if (manual === true) autoOn = false;
          for (const b of bots) {
            b.on = false;
            clearTimeout(b.t);
          }
          bots.length = 0;
          bB.classList.remove("act");
          count();
        }
        /* Baja de un bot (una persona real tomó su tortuga, o no consiguió una). */
        window.botKicked = (key) => {
          const i = bots.findIndex((x) => x.name.toLocaleLowerCase() === key);
          if (i < 0) return;
          bots[i].on = false;
          clearTimeout(bots[i].t);
          bots.splice(i, 1);
          if (!bots.length) bB.classList.remove("act");
          count();
        };
        window.addBot = addBot;
        window.stopBots = stopBots;

        /* ---- bots automáticos ----
           Al empezar cada ronda entra un bot; cuando la tortuga de su país avanza el 10 % del recorrido (desde que
           entró) se activa otro, y así sucesivamente hasta 2 (MAXB). El contador "Bots activos" muestra cuántos hay.
           Mantener pulsado 🤖 detiene todos y pausa la cadena hasta la próxima ronda. ?autobots=0 la desactiva. */
        let autoOn = Q.get("autobots") !== "0";
        const baseNewRound = newRound;
        newRound = function () {
          baseNewRound();
          stopBots();
          autoOn = Q.get("autobots") !== "0";
        };
        setInterval(() => {
          if (!autoOn || !S.go || S.over) return;
          if (!bots.length) return addBot();
          const last = bots[bots.length - 1];
          if (bots.length < MAXB && (botProgress(last) || 0) >= CFG.win * 0.1) addBot();
        }, 300);
        let hold = null,
          held = false;
        bB.addEventListener("pointerdown", () => {
          held = false;
          hold = setTimeout(() => {
            held = true;
            stopBots(true);
          }, 700);
        });
        const up = () => clearTimeout(hold);
        bB.addEventListener("pointerup", up);
        bB.addEventListener("pointerleave", up);
        bB.addEventListener("pointercancel", up);
        bB.addEventListener("click", () => {
          if (!held) addBot();
        });
        bB.addEventListener("contextmenu", (e) => e.preventDefault());
      })();

      /* Aplica el idioma activo a todo lo estático (título, botones, panel de pruebas, nombres de país). */
      function applyLang() {
        document.documentElement.lang = LANG;
        document.title = tr("Carrera de países", "Countries Race");
        const set = (sel, es, en) => {
          const e = document.querySelector(sel);
          if (e) e.textContent = tr(es, en);

          cx.fillRect(x0 - 4, signY + 7 * s + 2, wpx + 8, 1);
          cx.fillRect(x0 - 4, signY - 3, 1, 7 * s + 6);
          cx.fillRect(x0 + wpx + 3, signY - 3, 1, 7 * s + 6);
          const cells = (fn) =>
            [...word].forEach((ch, i) => {
              const g = GL[ch];
              for (let r = 0; r < 7; r++) for (let c = 0; c < 5; c++) if (g[r][c] === "X") fn(x0 + (i * 6 + c) * s, signY + r * s, i);
            });
          cx.fillStyle = shade;
          cells((px, py, i) => { if (i !== offI) cx.fillRect(px + 1, py + 1, s, s); });
          cells((px, py, i) => { cx.fillStyle = i === offI ? shade : col; cx.fillRect(px, py, s, s); });
        };

        const draw = () => {
          if (!G) return;
          const t = performance.now() / 1000;
          const h = sceneHour(), sc = sample(h);
          cx.globalAlpha = 1;
          drawSky(sc.sk);
          if (sc.n > 0.02) {
            cx.globalAlpha = sc.n;
            stars.forEach((q) => {
              const w = Math.sin(t * q.sp + q.ph);
              cx.fillStyle = w > 0.55 ? "#ffffff" : w > -0.35 ? q.c : "#4c4c8c";
              cx.fillRect(q.x, q.y, 1, 1);
              if (q.big && w > 0.55) { cx.fillRect(q.x - 1, q.y, 3, 1); cx.fillRect(q.x, q.y - 1, 1, 3); }
            });
            cx.globalAlpha = 1;
          }
          drawSun(h);
          drawMoon(h, sc.n);
          if (sc.n > 0.05) {
            cx.globalAlpha = sc.n;
            cx.fillStyle = "#4a4290";
            glow.forEach(([x, y]) => cx.fillRect(x, y, 1, 1));
            cx.globalAlpha = 1;
          }
          drawClouds(t, sc.cl, (1 - sc.n) * 0.92);
          cx.globalAlpha = 1;
          cx.drawImage(off, 0, 0);
          /* luz ambiente sobre fachada, gradas y muro (la pista y el césped quedan como estaban) */
          if (sc.gr[0] + sc.gr[1] + sc.gr[2] > 3) {
            cx.globalCompositeOperation = "screen";
            cx.fillStyle = rgb(sc.gr);
            cx.fillRect(0, G.facTop, G.W, G.wallTop + 2 - G.facTop);
            cx.globalCompositeOperation = "source-over";
          }
          if (fl.i >= 0 && t > fl.u) fl.i = -1;
          else if (fl.i < 0 && Math.random() < 0.03) fl = { i: (Math.random() * 6) | 0, u: t + 0.15 + Math.random() * 0.2 };
          /* dos letreros juntos y centrados: CARRERA + PAÍSES */
          const [a1, a2] = LANG === "en" ? ["COUNTRIES", "RACE"] : ["CARRERA", "PAÍSES"];
          const w1 = (a1.length * 6 - 1) * G.s + 8, w2 = (a2.length * 6 - 1) * G.s + 8, x1 = (G.W - (w1 + w2 + 2)) / 2;
          sign(a1, x1 + w1 / 2, "#ff5fae", "#8a1250", 1, -1);
          sign(a2, x1 + w1 + 2 + w2 / 2, "#3ff3ff", "#0a6b78", 1, fl.i < 0 ? -1 : fl.i % a2.length);
          people.forEach((p) => {
            const up = Math.sin(p.x * 0.11 - t * 3.2 + p.t * 0.6) > 0.6 || Math.sin(t * 5 + p.ph) > 0.97 ? 1 : 0, y = p.y - up;
            cx.fillStyle = p.sk;
            if (up) { cx.fillRect(p.x - 1, y - 1, 1, 2); cx.fillRect(p.x + 2, y - 1, 1, 2); }
            cx.fillRect(p.x, y + 1, 2, 1);
            cx.fillStyle = p.hr;
            cx.fillRect(p.x, y, 2, 1);
            cx.fillStyle = p.sh[0];
            cx.fillRect(p.x, y + 2, 2, 1);
            cx.fillStyle = p.sh[1];
            cx.fillRect(p.x, y + 3, 2, 1);
          });
        };

        let rt = 0;
        const rebuild = () => { clearTimeout(rt); rt = setTimeout(() => { build(); draw(); }, 150); };
        addEventListener("resize", rebuild);
        addEventListener("load", rebuild);
        if (window.ResizeObserver) new ResizeObserver(rebuild).observe(D.getElementById("lanes"));
        build();
        draw();
        setInterval(draw, 110);
      })();
    </script>

    <script>
      /* ===== PODIO EN VIVO: 1.º, 2.º y 3.º puesto justo DEBAJO del cartel. Se actualiza en cada cuadro (al instante) con el país
         que va en esa posición ahora mismo: bandera, nombre (según idioma) y % de pista. Al cambiar de ocupante la tarjeta "salta".
         Tocar una tarjeta hace brillar a esa tortuga. ?podium=0 lo oculta. ===== */
      (() => {
        if (new URLSearchParams(location.search).get("podium") === "0") return;
        const st = document.createElement("style");
        st.textContent = `
          #podium{position:fixed;left:50%;transform:translateX(-50%);top:3rem;z-index:6;display:flex;gap:.45rem;width:98vw;max-width:98vw;pointer-events:none;--ph:34px}
          #podium .pd{pointer-events:auto;cursor:pointer;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;flex:1 1 0;min-width:0;gap:.45rem;height:var(--ph);
            padding:0 .65rem 0 .3rem;border-radius:999px;background:rgba(7,4,26,.8);border:2px solid var(--c);color:#fff;--c:#FFD23A;
            font:800 clamp(14px,calc(var(--ph)*.46),44px)/1 system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.55),0 0 10px -2px var(--c);
            transition:transform .15s,box-shadow .3s;user-select:none;-webkit-tap-highlight-color:transparent}
          #podium .pd:hover{transform:translateY(-2px) scale(1.04)}
          #podium .pd.p2{--c:#D9E2E5}
          #podium .pd.p3{--c:#E3A46B}
          #podium .md{font-size:1.25em;line-height:1}
          #podium .fl{height:calc(var(--ph)*.62);width:calc(var(--ph)*.62);border-radius:50%;object-fit:cover;border:2px solid #fff;flex:none;background:#223}
          #podium .nm{min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          #podium .pc{opacity:.85;font-weight:700;font-size:.82em;min-width:2.4em;text-align:right}
          #podium .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.14)}
          #podium .bar u{display:block;height:100%;width:0;background:var(--c);transition:width .25s linear}
          #podium .pd.pop{animation:pdPop .55s cubic-bezier(.2,1.6,.4,1)}
          @keyframes pdPop{0%{transform:scale(1.35) rotate(-3deg);filter:brightness(2)}100%{transform:none;filter:none}}
          #podium .pd.tap{animation:pdPop .45s}
          /* solo el 1.er puesto: una sola tarjeta centrada con la bandera del país que va primero */
          #podium{justify-content:center}
          #podium .pd.p2,#podium .pd.p3{display:none}
          #podium .pd.p1{flex:0 1 auto;min-width:min(62%,22rem);padding:0 .9rem 0 .35rem}
          #podium .pd.p1 .fl{height:calc(var(--ph)*.78);width:calc(var(--ph)*.78)}
        `;
        document.head.append(st);
        const box = document.createElement("div");
        box.id = "podium";
        box.innerHTML = ["🥇", "🥈", "🥉"]
          .map((m, i) => `<div class="pd p${i + 1}"><b class="md">${m}</b><img class="fl" alt=""><span class="nm"></span><span class="pc"></span><i class="bar"><u></u></i></div>`)
          .join("");
        document.body.append(box);
        const cards = [...box.querySelectorAll(".pd")];
        const key = ["", "", ""], pcs = [-1, -1, -1], codes = ["", "", ""];
        let lastTop = -1, lastAv = -1;
        const retrigger = restartAnim;
        cards.forEach((card, i) =>
          card.addEventListener("click", () => {
            retrigger(card, "tap");
            const t = T[codes[i]];
            if (t) { t.tur.classList.add("turbo"); setTimeout(() => t.tur.classList.remove("turbo"), 1500); }
          }),
        );
        function tick() {
          requestAnimationFrame(tick);
          const g = window.__sign;
          if (g && (Math.round(g.bottom) !== lastTop || Math.round(g.avail) !== lastAv)) {
            lastTop = Math.round(g.bottom);
            lastAv = Math.round(g.avail);
            box.style.top = lastTop + 4 + "px";
            box.style.setProperty("--ph", Math.max(28, Math.min(96, lastAv - 6)) /* nunca más alto que la franja libre bajo el cartel: no tapa la pista ni las tortugas */ + "px");
          }
          /* VERTICAL (TikTok): el 1.er puesto va GRANDE en el cielo, justo debajo de la zona que tapa TikTok (~12 %) y encima del cartel */
          if (g && g.top && matchMedia("(orientation: portrait)").matches) {
            const tp = Math.round(innerHeight * 0.125);
            box.style.top = tp + "px";
            box.style.setProperty("--ph", Math.max(44, Math.min(innerHeight * 0.14, g.top - tp - 8)) + "px");
          }
          const ord = [...C].sort((a, b) => S.pos[b.c] - S.pos[a.c]).slice(0, 3);
          ord.forEach((c, i) => {
            const idx = C.indexOf(c), n = NATIONS[idx], card = cards[i];
            if (!n) return;
            const k = c.c + "|" + n.n;
            if (key[i] !== k) {
              const im = card.querySelector(".fl");
              const changed = codes[i] !== c.c || im.getAttribute("src") !== n.u; /* otra tortuga o país nuevo en este puesto */
              key[i] = k;
              codes[i] = c.c;
              card.querySelector(".nm").textContent = n.n;
              if (im.getAttribute("src") !== n.u) im.src = n.u;
              if (changed) retrigger(card, "pop");
            }
            const pc = Math.max(0, Math.min(100, Math.round(S.pos[c.c])));
            if (pcs[i] !== pc) {
              pcs[i] = pc;
              card.querySelector(".pc").textContent = pc + "%";
              card.querySelector(".bar u").style.width = pc + "%";
            }
          });
        }
        requestAnimationFrame(tick);
      })();
    </script>
  </body>
