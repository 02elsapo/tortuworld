<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07262B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tortu Live</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap">
<style>
:root{--page:#d9c3a0;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#1b120a}}
:root[data-theme="dark"]{--page:#1b120a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--page);font-family:Inter,system-ui,sans-serif;color:#fff}
#app{width:360px;height:640px;position:absolute;left:0;top:0;transform-origin:0 0;position:absolute;overflow:hidden;padding:14px 12px 16px;display:flex;flex-direction:column;gap:8px;
background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.4)),repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 6px),repeating-linear-gradient(90deg,#c39561 0 62px,#6f4a28 62px 64px)}
.title{height:44px;background:linear-gradient(#faf3e2,#e2d6bb);border:2px solid #6b6f78;border-radius:9px;box-shadow:0 3px 6px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;gap:6px;color:#2a2018;font-size:13px;font-weight:800}
.board{position:relative;display:flex;gap:8px;padding:6px;background:linear-gradient(#7a4e2a,#5a3a1e);border:3px solid #3f2713;border-radius:12px;box-shadow:inset 0 2px 5px rgba(0,0,0,.55),0 5px 10px rgba(0,0,0,.5)}
.lanes{display:flex;gap:6px;flex:1;min-width:0}
.lane{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;position:relative}
.hd{height:32px;position:relative;border:2px solid #3f2713;border-radius:7px;background:linear-gradient(#a8743f,#6e4524);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 3px rgba(0,0,0,.4);color:#fff;font:800 10px Inter,sans-serif;text-shadow:0 1px 1px #000;display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:0}
.hd.sel{outline:2px solid #ffd566;outline-offset:1px}
.hd i{position:absolute;left:12px;right:12px;bottom:2px;height:3px;border-radius:2px}
.hd .crown{position:absolute;top:-11px;right:-2px;display:none}
.lane.lead .crown{display:block}
.sv{position:relative}
.sv svg{width:100%;height:auto;display:block}
.tt{transition:transform .5s linear}
.in{transform-origin:50px 490px}
.lg{transform-box:fill-box}.lg.l{transform-origin:100% 50%}.lg.r{transform-origin:0 50%}
.sh{transform-origin:50px 490px}
.walk .lg{animation:step .45s ease-in-out infinite alternate}
.walk .lg.rv{animation-direction:alternate-reverse}
.walk .sh{animation:sway .9s ease-in-out infinite alternate}
@keyframes step{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
@keyframes sway{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.hop{animation:hop .35s}
@keyframes hop{40%{transform:translateY(-2px)}}
.fl{position:absolute;left:55%;font-size:16px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000,0 0 6px #000;pointer-events:none;animation:up .9s forwards}
@keyframes up{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-40px)}}
.side{width:25%;min-width:84px;display:flex;flex-direction:column;align-items:center;gap:8px}
.live{background:#e11d48;border-radius:6px;padding:5px 9px;font-size:11px;font-weight:800;box-shadow:0 0 8px #e11d48}
.live.connected{background:#16a34a;box-shadow:0 0 8px #16a34a}
.live.connecting{background:#d97706;box-shadow:0 0 8px #d97706}
.bub{position:relative;background:#f1e8d6;color:#2a2018;border-radius:10px;padding:6px 7px;font-size:10.5px;font-weight:800;text-align:center;line-height:1.25;box-shadow:0 2px 4px rgba(0,0,0,.4);width:100%;min-height:52px;display:flex;align-items:center;justify-content:center}
.bub:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-7px;border:7px solid transparent;border-top-color:#f1e8d6;border-bottom:0}
.plate{background:linear-gradient(#faf3e2,#e2d6bb);color:#2a2018;border:2px solid #6b6f78;border-radius:9px;box-shadow:0 2px 5px rgba(0,0,0,.4);font-weight:800}
.chips{display:flex;gap:8px}
.chip{flex:1;height:40px;background:linear-gradient(#5a3a1e,#3f2713);border:2px solid #2a190b;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.chip span{font-size:9px;font-weight:700;color:#f1e8d6}.chip b{font-size:15px}
.acts{display:flex;gap:8px}
.act{flex:1;height:54px;min-width:0;border:2px solid #3f2713;border-radius:11px;background:linear-gradient(#a8743f,#6e4524);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 3px 0 #3f2713;color:#fff;text-shadow:0 1px 1px #000;font:800 12px Inter,sans-serif;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;touch-action:manipulation}
.act:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.act:disabled{opacity:.5;cursor:default}
.rail{width:100%;display:flex;flex-direction:column;gap:10px}
.combo{width:100%;min-height:30px;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;font-size:11px;font-weight:800;text-align:center;opacity:0;transition:opacity .15s}
.combo.on{opacity:1}.combo span{color:#ffd566;text-shadow:0 1px 2px #000}
.combo i{display:block;height:4px;border-radius:2px;background:#ffd566;transform-origin:left;animation:drain 2s linear forwards}
@keyframes drain{to{transform:scaleX(0)}}
.cta{position:relative;width:100%;height:64px;border:2px solid #3f2713;border-radius:16px;background:linear-gradient(#a8743f,#6e4524);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 0 #3f2713;color:#fff;font:800 10px Inter,sans-serif;text-shadow:0 1px 1px #000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;touch-action:manipulation;padding:0;transition:transform .08s}
.cta:active{transform:translateY(4px) scale(.96);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.cta:focus-visible{outline:3px solid #ffd566;outline-offset:2px}
.cta .pt{position:absolute;top:-8px;right:-6px;min-width:28px;padding:1px 5px;border-radius:9px;background:#ffd566;color:#2a2018;border:2px solid #3f2713;font-size:10px;text-shadow:none}
.cta.gift{height:78px;background:linear-gradient(#e8444f,#a3122a);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 0 #3f2713,0 0 14px #ffd566}}
.cta.cool{pointer-events:none;animation:none}
.cta.cool:after{content:"";position:absolute;inset:0;border-radius:13px;background:rgba(20,10,4,.6);transform-origin:bottom;animation:cool var(--cdt) linear forwards}
@keyframes cool{to{transform:scaleY(0)}}
.cta:disabled{opacity:.5;cursor:default;animation:none}
@media (prefers-reduced-motion:reduce){.cta.gift,.combo i,.cta.cool:after{animation:none}}
.foot{margin-top:auto;display:flex;align-items:center;gap:8px}
.live{white-space:nowrap}
.bar{min-height:42px;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 10px;font-size:11px}
.sm{height:28px;border:2px solid #3f2713;border-radius:7px;background:linear-gradient(#a8743f,#6e4524);color:#fff;font:800 10px Inter,sans-serif;padding:0 8px;cursor:pointer}
.sm.on{background:linear-gradient(#3ddc5a,#1f8a38)}
.win{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(20,10,4,.72);border-radius:10px;z-index:5;text-align:center}
.win.show{display:flex}
.win h2{margin:0;font-size:26px;font-weight:800;text-shadow:0 2px 6px #000;line-height:1.1}
.cf{position:absolute;top:-10px;width:8px;height:12px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(520px) rotate(540deg);opacity:.8}}
@media (prefers-reduced-motion:reduce){.walk .lg,.walk .sh{animation:none}.tt{transition:none}.hop,.cf,.fl{animation:none}}

#toast{position:absolute;top:62px;left:50%;transform:translate(-50%,-12px);z-index:8;max-width:320px;padding:6px 12px;border-radius:14px;background:linear-gradient(#faf3e2,#e2d6bb);color:#2a2018;border:2px solid #6b6f78;font-size:11px;font-weight:800;box-shadow:0 3px 8px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.stats .chip{height:34px}.stats .chip b{font-size:11px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;padding:0 3px}
.lv{display:flex;flex-direction:column;gap:2px;padding:3px 8px;font-size:10px;min-width:66px;margin-left:auto}
.lv i{display:block;height:5px;border-radius:3px;background:#3f2713;overflow:hidden}
.lv u{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd566,#f0701a);transition:width .3s}
.foot .sm{width:34px;height:30px;padding:0;font-size:14px}
.sm.off{background:linear-gradient(#6b6f78,#43464d);filter:grayscale(1);opacity:.7}
.sm.hint{animation:hint .9s ease-in-out infinite alternate}
@keyframes hint{to{box-shadow:0 0 10px 2px #ffd566}}
#app.sprint .board{animation:spr .5s ease-in-out infinite alternate}
@keyframes spr{to{box-shadow:inset 0 2px 5px rgba(0,0,0,.55),0 0 16px #e11d48}}
.board.shake{animation:shk .5s}
@keyframes shk{20%{transform:translate(-3px,2px)}40%{transform:translate(3px,-2px)}60%{transform:translate(-2px,0)}}
@media (prefers-reduced-motion:reduce){#app.sprint .board,.sm.hint,.board.shake{animation:none}#toast{transition:none}}

.in{transform:scale(var(--s,1.3));transition:transform .3s}
@keyframes hop{40%{transform:translateY(-2px) scale(var(--s,1.3))}}
.avs{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;align-content:flex-start;height:44px;overflow:hidden}
.ua{position:relative;width:20px;height:20px;flex:none;border-radius:50%;border:2px solid var(--c);background:var(--b);color:#fff;font:800 9px/16px Inter,sans-serif;text-align:center;overflow:hidden;animation:pop .35s}
.ua img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@keyframes pop{from{transform:scale(0)}60%{transform:scale(1.3)}}
@media (prefers-reduced-motion:reduce){.ua{animation:none}.in{transition:none}}
.avs{position:absolute;left:9%;right:9%;bottom:2.5%;height:46px;gap:2px;align-content:center}
.ua{width:44px;height:44px;font-size:20px;line-height:40px}
.ua.ph{animation:none;opacity:1}
/* tipografía más grande */
.title{font-size:20px;letter-spacing:.5px}
.hd{font-size:11px;letter-spacing:-.3px}.hd>svg:first-child{display:none}
.bub{font-size:11.5px}
.cta{font-size:11.5px}.cta .pt{font-size:11px}
.act{font-size:13px}
.live{font-size:13px}
.combo{font-size:12.5px}
.chip span{font-size:10px}.chip b{font-size:16px}
.stats .chip b{font-size:12px}
.lv{font-size:11px;min-width:72px}
.plate{font-size:13px}
#toast{font-size:13px}
.win h2{font-size:30px}
.fl{font-size:18px}
/* pistas más grandes, botones más chicos */
.title{height:40px}
.board{padding:6px 4px}
.lanes{gap:4px}
.side{width:66px;min-width:66px;gap:6px}
.rail{gap:8px}
.cta{height:46px;border-radius:12px;font-size:10.5px;gap:2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 3px 0 #3f2713}
.cta.gift{height:58px}
.cta svg{width:18px;height:18px}.cta.gift svg{width:22px;height:22px}.cta[data-t=like] svg{width:22px;height:22px}
.cta .pt{top:-7px;right:-4px;min-width:24px;font-size:10px;padding:0 4px}
.bub{font-size:10.5px;padding:4px 2px;min-height:48px;word-break:break-word}
.combo{font-size:11px}
.side .plate{padding:3px 6px!important;font-size:11px!important}
.in{transform-origin:50px 520px}
.ev{position:absolute;left:50%;bottom:calc(2.5% + 52px);transform:translateX(-50%);z-index:3;background:#fff;color:#2a2018;border:2px solid var(--c,#3f2713);border-radius:12px;padding:1px 7px;font:800 12px/1.3 Inter,sans-serif;box-shadow:0 2px 5px rgba(0,0,0,.5);white-space:nowrap;pointer-events:none;animation:pop .3s}
.ev b{font-size:22px;vertical-align:middle;margin-right:2px}
.ev:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--c,#3f2713);border-bottom:0}
@media (prefers-reduced-motion:reduce){.ev{animation:none}}
/* rutas más anchas, CTAs más chicos */
.board{gap:4px;padding:6px 3px}
.lanes{gap:3px}
.sv>svg{height:420px}
.side{width:54px;min-width:54px;gap:5px}
.rail{gap:7px}
.cta{height:34px;border-radius:10px;font-size:8.5px;gap:1px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 0 #3f2713}
.cta.gift{height:44px}
.cta svg{width:14px;height:14px}.cta.gift svg{width:18px;height:18px}.cta[data-t=like] svg{width:16px;height:16px}
.cta .pt{top:-6px;right:-3px;min-width:20px;font-size:8.5px;padding:0 3px}
.bub{font-size:9px;padding:3px 1px;min-height:44px}
.side>svg{width:44px;height:44px}
.side .plate{padding:2px 4px!important;font-size:9px!important}
.combo{font-size:9.5px}
/* premios por acciones de espectadores */
#hype{position:absolute;left:50%;top:118px;transform:translateX(-50%);z-index:7;display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:14px;background:linear-gradient(#fff3c4,#ffd566);border:2px solid var(--c,#3f2713);color:#2a2018;font:800 11px/1.2 Inter,sans-serif;box-shadow:0 3px 8px rgba(0,0,0,.55);max-width:300px;pointer-events:none;white-space:nowrap;animation:hy 2s forwards}
#hype[hidden]{display:none}
#hype b{font-size:20px}#hype i{display:block;font-style:normal;color:#8a1020;font-size:12px}
@keyframes hy{0%{opacity:0;transform:translateX(-50%) scale(.6)}12%{opacity:1;transform:translateX(-50%) scale(1.1)}22%{transform:translateX(-50%) scale(1)}85%{opacity:1}100%{opacity:0}}
.ua.vip{box-shadow:0 0 0 2px #ffd566,0 0 8px #ffd566}
.lane.turbo .sv>svg{filter:drop-shadow(0 0 6px #ffd566) brightness(1.12)}
.lane.turbo .hd:after{content:"🔥";position:absolute;left:-4px;top:-10px;font-size:14px}
@media (prefers-reduced-motion:reduce){#hype{animation:none}}
.tf{display:none;transform-box:fill-box;transform-origin:50% 0}
.lane.turbo .tf{display:block;animation:fk .12s ease-in-out infinite alternate}
@keyframes fk{from{transform:scaleY(.75)}to{transform:scaleY(1.3)}}
.lane.turbo.walk .lg{animation-duration:.18s}
.lane.turbo.walk .sh{animation-duration:.35s}
@media (prefers-reduced-motion:reduce){.lane.turbo .tf{animation:none}}
/* estadísticas: copas por bandera + MVP doble de ancho */
.stats .chip{height:42px}
.chip.wins{flex:1;flex-direction:row;justify-content:space-around;gap:2px;padding:0 3px}
.chip.mvp{flex:2;min-width:0}
.chip.mvp b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px}
.cp{display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1}
.cp svg{border:1px solid #fff;border-radius:2px;display:block}
.stats .chip.wins .cp b{font-size:11px;color:#ffd566;white-space:nowrap}
/* Don Tortu habla */
.side>svg.talk{animation:bob .3s ease-in-out infinite alternate}
.side>svg.talk .mo{display:none}
.side>svg.talk .mo2{display:block;transform-box:fill-box;transform-origin:center;animation:mo .18s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-2px) rotate(-3deg)}}
@keyframes mo{from{transform:scaleY(.35)}to{transform:scaleY(1.25)}}
@media (prefers-reduced-motion:reduce){.side>svg.talk,.side>svg.talk .mo2{animation:none}}
/* columna de Don Tortu más ancha, avatar grande, nombre en una línea */
.side{width:68px;min-width:68px}
.rail{align-items:center}
.cta{width:58px}
.bub{font-size:10px;min-height:50px}
.side>svg{width:60px;height:60px}
.side .plate{white-space:nowrap!important;font-size:9px!important;padding:2px 3px!important;letter-spacing:0}
.avs{height:46px;gap:2px;justify-content:center;align-content:center}
.ua,.ua.ph{width:20px;height:20px;font-size:9px;line-height:16px}
</style>
</head>
<body>
<main id="app">
<div class="title"><span>TORTU LIVE</span>
<svg width="14" height="18" viewBox="0 0 14 18" aria-hidden="true"><path d="M7 1 C9 5 13 7 13 12 A6 6 0 0 1 1 12 C1 9 3 8 4 6 C5 8 6 7 7 1Z" fill="#f0701a"/><path d="M7 8 C8 10 10 11 10 13 A3 3 0 0 1 4 13 C4 11 6 10 7 8Z" fill="#ffd34d"/></svg></div>
<section class="board">
<div class="lanes" id="lanes"></div>
<div class="side">
<div class="combo" id="combo" aria-live="polite"><span id="cmt"></span><i id="cmb"></i></div>
<nav class="rail" aria-label="Acciones">
<button class="cta" data-t="follow" data-cd="2000"><b class="pt">+3</b><svg width="22" height="22" viewBox="0 0 24 24" fill="#5ec3f2" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="8" r="4"/><path d="M2 21 C2 15 18 15 18 21Z"/><path d="M20 8V14 M17 11H23" fill="none"/></svg>SEGUIR</button>
<button class="cta gift" data-t="gift" data-cd="4000"><b class="pt">+10</b><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="1" fill="#7a0f22"/><path d="M12 9 V21 M3 13 H21 M12 9 C9 9 7 7 8 5 C10 4 12 7 12 9 C12 7 14 4 16 5 C17 7 15 9 12 9Z"/></svg>REGALAR</button>
<button class="cta" data-t="like"><b class="pt">+1</b><svg width="22" height="22" viewBox="0 0 24 24" fill="#ff5a7a" stroke="#fff" stroke-width="2" aria-hidden="true"><path d="M12 21 C4 15 2 11 2 8 A5 5 0 0 1 12 6 A5 5 0 0 1 22 8 C22 11 20 15 12 21Z"/></svg>APOYAR</button>
</nav>
<div class="bub" id="bub" aria-live="polite">¡Y ARRANCAN LAS TORTUGAS!</div>
<svg width="64" height="64" viewBox="0 0 84 84" role="img" aria-label="Avatar de Don Tortu, el relator">
<defs><radialGradient id="sp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe9a8"/><stop offset="1" stop-color="#3f2713"/></radialGradient></defs>
<circle cx="42" cy="42" r="40" fill="url(#sp)" stroke="#f1e8d6" stroke-width="3"/>
<circle cx="42" cy="44" r="19" fill="#f2c39b"/>
<path d="M22 42 Q22 18 42 18 Q62 18 62 42 Q54 30 42 30 Q30 30 22 42Z" fill="#2a1d14"/>
<path d="M20 44 Q20 14 42 14 Q64 14 64 44" fill="none" stroke="#e11d48" stroke-width="4"/>
<rect x="15" y="40" width="8" height="14" rx="4" fill="#e11d48"/><rect x="61" y="40" width="8" height="14" rx="4" fill="#e11d48"/>
<path d="M19 54 Q22 66 36 66" fill="none" stroke="#e11d48" stroke-width="3"/><circle cx="36" cy="66" r="3" fill="#fff"/>
<circle cx="35" cy="44" r="2.4" fill="#2a1d14"/><circle cx="49" cy="44" r="2.4" fill="#2a1d14"/>
<circle cx="29" cy="50" r="3" fill="#f08a7a" opacity=".6"/><circle cx="55" cy="50" r="3" fill="#f08a7a" opacity=".6"/>
<path class="mo" d="M36 54 Q42 60 48 54" fill="none" stroke="#2a1d14" stroke-width="2.4" stroke-linecap="round"/><ellipse class="mo2" cx="42" cy="56" rx="6" ry="4" fill="#7a1f1f" stroke="#2a1d14" stroke-width="2" display="none"/>
</svg>
<span class="plate" style="padding:4px 10px;font-size:12px">DON TORTU</span>
</div>
<div class="win" id="win" role="alertdialog" aria-label="Ganador"></div>
</section>
<div class="chips stats" aria-label="Estadísticas">
<div class="chip wins" id="stW" role="group" aria-label="Copas ganadas por país"></div>

$('#lanes').innerHTML=T.map((t,i)=>`<div class="lane" id="ln${i}"><button class="hd" data-i="${i}" aria-pressed="false"><svg width="20" height="14" viewBox="0 0 20 14" aria-hidden="true" style="border:1px solid rgba(255,255,255,.6);border-radius:2px">${flag(t.id,0,0,20,14)}</svg><span>${t.n}</span><i style="background:${t.c};box-shadow:0 0 6px ${t.c}"></i><svg class="crown" width="20" height="16" viewBox="0 0 20 16" aria-hidden="true"><path d="M2 14 L3 3 L7 8 L10 1 L13 8 L17 3 L18 14Z" fill="#ffd34d" stroke="#8a6410" stroke-width="1.2"/></svg></button><div class="sv" id="sv${i}">${laneSVG(i,t)}</div></div>`).join('');
function say(m){$('#bub').textContent=m}
function update(){
 let best=-1,mx=0;
 S.forEach((s,i)=>{const p=Math.min(100,s.p),h=p*4;
  $('#tt'+i).style.transform=`translateY(${-p*4}px)`;
  $('#gf'+i).setAttribute('y',456-h);$('#gf'+i).setAttribute('height',h);$('#gk'+i).setAttribute('cy',456-h);
  if(s.p>mx){mx=s.p;best=i}
 });
 T.forEach((t,i)=>{$('#ln'+i).classList.toggle('lead',i===best);const b=document.querySelector(`.hd[data-i="${i}"]`);b.classList.toggle('sel',i===sel);b.setAttribute('aria-pressed',i===sel)});
 return best;
}
function float(i,txt){const el=document.createElement('b');el.className='fl';el.textContent=txt;el.style.top=((490-Math.min(100,S[i].p)*4)/630*100)+'%';$('#sv'+i).appendChild(el);setTimeout(()=>el.remove(),900)}
function walk(i){const l=$('#ln'+i);l.classList.add('walk');clearTimeout(wt[i]);wt[i]=setTimeout(()=>l.classList.remove('walk'),1000)}
function hop(i){const g=$('#in'+i);g.classList.remove('hop');void g.getBBox();g.classList.add('hop')}
function push(i,type,n=1,mult=1){
 if(over||i<0||!S[i])return;
 const pts={chat:1,like:1,follow:3,gift:10}[type]*n*mult,s=S[i];
 s.p+=pts;if(type==='like')s.l+=n;if(type==='gift')s.g+=n;
 const prev=lead;lead=update();float(i,'+'+pts);hop(i);walk(i);
 if(s.p>=100){return win(i)}
 if(type==='gift')say(`¡Regalo para ${T[i].n}! +${pts}`);
 else if(lead!==prev&&lead>=0)say(`¡${T[lead].n} toma la delantera!`);
 else if(!auto||Math.random()<.08)say(['¡Todo se decide en la recta!','¡Vamos, tortugas!','¡Qué carrera, gente!'][Math.floor(Math.random()*3)]);
}
function win(i){
 over=true;update();$('#cw'+i).setAttribute('display','');
 document.querySelectorAll('.act,.cta').forEach(b=>b.disabled=true);
 say(`¡${T[i].n} GANA LA CARRERA!`);
 const w=$('#win'),cols=['#ffd34d','#e11d48','#3ddc5a','#5ec3f2','#fff'];
 w.innerHTML=`<svg width="64" height="44" viewBox="0 0 20 14" aria-hidden="true" style="border:2px solid #fff;border-radius:3px">${flag(T[i].id,0,0,20,14)}</svg><h2>¡GANÓ<br>${T[i].n}!</h2><button class="act" style="flex:none;width:180px" id="again">NUEVA CARRERA</button>`+
 Array.from({length:28},()=>`<span class="cf" style="left:${Math.random()*100}%;background:${cols[Math.floor(Math.random()*5)]};animation-delay:${Math.random()*1.2}s"></span>`).join('');
 w.classList.add('show');$('#again').onclick=reset;$('#again').focus();
 rs=setTimeout(reset,9000);
}
function reset(){
 clearTimeout(rs);sel=0;over=false;lead=-1;S.forEach(s=>{s.p=0;s.g=0;s.l=0});
 picks.clear();lastChat.clear();newSpeeds();lastTick=performance.now();
 T.forEach((t,i)=>$('#cw'+i).setAttribute('display','none'));
 $('#win').classList.remove('show');document.querySelectorAll('.cta').forEach(b=>{b.disabled=false;b.classList.remove('cool')});streak=0;clearTimeout(cmbT);showCombo();
 update();say('¡Y ARRANCAN LAS TORTUGAS!');
}
$('#lanes').addEventListener('click',e=>{const b=e.target.closest('.hd');if(!b)return;sel=+b.dataset.i;update();say(`Tu equipo: ${T[sel].n}`)});
const mult=()=>streak>=10?3:streak>=5?2:1;
function showCombo(){const c=$('#combo'),m=mult();
 $('#cmt').textContent=m===3?'COMBO x3 · ¡MÁXIMO!':`RACHA ${streak} · x${m} (${streak}/${m===1?5:10})`;
 c.classList.remove('on');if(streak>=2){void c.offsetWidth;c.classList.add('on')}}
document.querySelectorAll('.cta').forEach(b=>b.addEventListener('click',()=>{
 if(over||b.classList.contains('cool'))return;
 const before=mult();streak++;clearTimeout(cmbT);cmbT=setTimeout(()=>{streak=0;showCombo()},2000);
 const m=mult();push(sel,b.dataset.t,1,m);showCombo();
 if(m>before&&!over)say(`¡COMBO x${m}!`);
 navigator.vibrate&&navigator.vibrate(m>before?[20,30,20]:10);
 const cd=+b.dataset.cd;if(cd){b.classList.add('cool');b.style.setProperty('--cdt',cd+'ms');setTimeout(()=>b.classList.remove('cool'),cd)}
}));
document.addEventListener('keydown',e=>{if(['1','2','3'].includes(e.key)){sel=+e.key-1;update();say(`Tu equipo: ${T[sel].n}`)}});
function findTeam(text){
 const raw=String(text||'');
 const normalized=raw.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();
 const names=[['BRASIL','BRAZIL','BR','🇧🇷'],['PARAGUAY','PARAGUAI','PY','🇵🇾'],['ARGENTINA','ARGENTINE','AR','🇦🇷']];
 return names.findIndex(aliases=>aliases.some(alias=>
  alias.length===2?new RegExp(`(^|[^A-Z0-9])${alias}([^A-Z0-9]|$)`).test(normalized):normalized.includes(alias)
 ));
}
function handleLiveEntry(entry){
 if(!entry||!['member','chat','gift','like','follow','share'].includes(entry.type))return;
 const user=String(entry.username||'').trim().toLowerCase();
 const key=user||`anonymous-${Math.random()}`;
 let team=entry.type==='chat'?findTeam(entry.content): -1;
 if(team>=0&&user)picks.set(key,team);
 if(team<0)team=picks.has(key)?picks.get(key):Math.floor(Math.random()*T.length);
 if(user&&!picks.has(key))picks.set(key,team);
 if(entry.type==='member')return;
 if(entry.type==='chat'){
  const now=Date.now();
  if(now-(lastChat.get(key)||0)<8000)return;
  lastChat.set(key,now);
 }
 const type=entry.type==='share'?'follow':entry.type;
 const rawCount=Number(entry.activityCount);
 const count=type==='gift'||type==='like'
  ?Number.isFinite(rawCount)&&rawCount>0?Math.floor(rawCount):1
  :1;
 push(team,type,count);
}
function setConnection(status){
 const el=$('#connection'),connected=Boolean(status.connected||status.isConnected);
 el.classList.toggle('connected',connected);
 el.classList.toggle('connecting',!connected&&['connecting','reconnecting'].includes(status.status));
 el.setAttribute('aria-label',`${USER}: ${connected?'en vivo':status.status==='failed'?'sin conexión':'conectando'}`);
}
const source=new EventSource('/api/events');
source.addEventListener('status',event=>setConnection(JSON.parse(event.data)));
source.addEventListener('update',event=>handleLiveEntry(JSON.parse(event.data).entry));
source.onerror=()=>setConnection({connected:false,status:'reconnecting'});
fetch('/api/reconnect',{method:'POST'}).then(async response=>{
 if(!response.ok&&response.status!==409){
  const result=await response.json();
  throw new Error(result.message||'No se pudo iniciar la conexión de TikTok.');
 }
}).catch(error=>{
 setConnection({connected:false,status:'failed'});
 console.error(error);
});
$('#connection').textContent=USER;
setInterval(()=>{
 const now=performance.now(),dt=Math.min(2,(now-lastTick)/1000);lastTick=now;
 if(over)return;
 S.forEach((s,i)=>{s.p+=100/RACE_SECONDS*sp[i]*dt;walk(i)});
 lead=update();
 let w=-1,mx=100;S.forEach((s,i)=>{if(s.p>=mx){mx=s.p;w=i}});
 if(w>=0)win(w);
},250);
window.tortugas={push:(team,type,n)=>push(typeof team==='number'?team:T.findIndex(t=>t.id===team),type,n),reset};
update();
</script>
<script>
(function(){
const P={mus:1,sfx:1,xp:0,wins:[0,0,0],best:0,races:0,ach:{}};
try{Object.assign(P,JSON.parse(localStorage.getItem('tortu.v1')||'{}'))}catch(e){}
let svT=0;const save=()=>{try{localStorage.setItem('tortu.v1',JSON.stringify(P))}catch(e){}};

/* ===== AUDIO (WebAudio sintetizado, sin archivos externos) ===== */
const A=(()=>{
 let c,mg,sg,nb,tm=null,nx=0,st=0,inten=0;
 const N=m=>440*Math.pow(2,(m-69)/12),run=()=>c&&c.state==='running';
 function vol(){const t=c.currentTime;[mg.gain,sg.gain].forEach(g=>g.cancelScheduledValues(t));mg.gain.setValueAtTime(P.mus?.2:0,t);sg.gain.setValueAtTime(P.sfx?.6:0,t)}
 function init(){
  if(c)return c;
  try{c=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}
  const lim=c.createDynamicsCompressor();mg=c.createGain();sg=c.createGain();
  mg.connect(lim);sg.connect(lim);lim.connect(c.destination);vol();
  nb=c.createBuffer(1,c.sampleRate,c.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  c.onstatechange=sync;sync();return c;
 }
 function sync(){
  if(run()){if(!tm){nx=c.currentTime+.1;tm=setInterval(sched,100)}}
  else if(tm){clearInterval(tm);tm=null}
  ui();
 }
 function ui(){
  const b1=$('#bMus'),b2=$('#bSfx');
  [[b1,P.mus],[b2,P.sfx]].forEach(([b,v])=>{b.classList.toggle('on',!!v);b.classList.toggle('off',!v);b.setAttribute('aria-pressed',!!v)});
  const need=(P.mus||P.sfx)&&!run();b1.classList.toggle('hint',need);b1.title=need?'Toca para activar el sonido':'Música';
 }
 function o(f,t,d,ty,v,dst,sl){const x=c.createOscillator(),g=c.createGain();x.type=ty||'sine';x.frequency.setValueAtTime(f,t);if(sl)x.frequency.exponentialRampToValueAtTime(sl,t+d);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);x.connect(g);g.connect(dst||sg);x.start(t);x.stop(t+d+.05)}
 function nz(t,d,v,hp,dst){const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=nb;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(dst||sg);s.start(t);s.stop(t+d+.05)}
 const CH=[[48,[0,4,7]],[55,[0,4,7]],[57,[0,3,7]],[53,[0,4,7]]];
 function play(s,t){
  const [r,iv]=CH[(s>>3)&3],k=s&7;
  if(k%4===0)o(150,t,.18,'sine',.9,mg,45);
  if(k%2)nz(t,.05,inten>.5?.22:.12,6000,mg);
  if(inten>.75&&(k===2||k===6))nz(t,.12,.25,1500,mg);
  if([0,3,4,7].includes(k))o(N(r-12+(k===3?12:0)),t,.22,'triangle',.55,mg);
  o(N(r+12+iv[(k*2)%3]+(k>3?12:0)),t,.18,'square',.06+.05*inten,mg);
  if(inten>.4&&k%2===0)o(N(r+24+iv[k%3]),t,.14,'sine',.16,mg);
 }
 function sched(){while(nx<c.currentTime+.3){play(st,nx);nx+=60/(112+inten*30)/2;st++}}
 const F={
  tap:(t,n)=>o(N(72+[0,2,4,7,9][n%5]+12*Math.min(2,Math.floor(n/5))),t,.12,'triangle',.45),
  like:t=>o(660,t,.1,'triangle',.35,sg,990),
  follow:t=>{o(660,t,.12,'sine',.4);o(990,t+.1,.22,'sine',.4)},
  gift:t=>[523,659,784,1047,1319].forEach((f,i)=>o(f,t+i*.06,.3,'triangle',.3)),

 {id:'gift',at:155,s:'¡Un regalo = turbo!',v:['Los regalos le dan turbo a tu tortuga. Si te animas a mandar uno, ¡gracias de corazón! Y si no, tu comentario y tus me gusta también suman.','Un regalo activa el turbo de tu equipo. Sin ninguna presión: si lo mandas, ¡muchas gracias! Y si no, seguimos disfrutando la carrera juntos.']}
];
const VF=['¡Recta final! Todo se decide ahora. ¡Vamos, tortugas!','¡Llegando a la meta! ¡Qué emoción, esto está parejísimo!'];
const VW=['¡Ganó {n}! Gracias por jugar y alentar. En unos segundos arranca otra ronda, ¡te esperamos!','¡Tenemos campeón: {n}! Gracias por estar. Ya viene una nueva carrera.'];
function voReset(){vT0=performance.now();vDone.clear();vRound++;vLast=-1e9;try{SS&&SS.cancel();A.duck(0)}catch(e){}}
function voWin(i){const n=T[i].n[0]+T[i].n.slice(1).toLowerCase();vDone.add('final');speak(P.wins[i]>=3?'¡Tenemos campeón del torneo! '+n+' se lleva las tres copas. ¡Felicitaciones y gracias por jugar!':VW[vRound%VW.length].replace('{n}',n),null,true)}
setInterval(()=>{
 if(over)return;const now=performance.now(),el=(now-vT0)/1000;
 if(sprint&&!vDone.has('final')){vDone.add('final');speak(VF[vRound%VF.length],'¡Recta final!',true);return}
 for(const l of VL){
  if(vDone.has(l.id)||el<l.at)continue;
  if(!P.vo||vDone.has('final')){vDone.add(l.id);continue}
  if(now-vLast<5000)break;
  if(speak(l.v[vRound%l.v.length],l.s,false))vDone.add(l.id);
  break;
 }
},500);
function voUi(){const b=$('#bVoz');b.classList.toggle('on',!!P.vo);b.classList.toggle('off',!P.vo);b.setAttribute('aria-pressed',!!P.vo)}
function voTog(){P.vo=P.vo?0:1;save();if(!P.vo){try{SS&&SS.cancel();A.duck(0)}catch(e){}}voUi();toast(P.vo?'Voz en off activada':'Voz en off apagada','🗣️')}
$('#bVoz').onclick=voTog;
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='v')voTog()});
let vPrimed=false;
['pointerdown','keydown','touchend'].forEach(ev=>addEventListener(ev,()=>{if(vPrimed||!SS)return;vPrimed=true;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;SS.speak(u)}catch(e){}},true));
voUi();
const _up=update;
update=function(){const r=_up();S.forEach((x,i)=>{const k=$('#gk'+i);if(k)k.setAttribute('fill','hsl('+((215-215*Math.min(100,x.p)/100)|0)+',95%,55%)')});return r};
A.init();hud();update();
})();
</script>
